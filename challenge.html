<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Challenge">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Challenge Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08090e;--card:#111318;--card2:#16181f;--card-el:#1c1f28;
  --border:#23262f;--border-hl:#3b3f4f;
  --text:#e8eaef;--sub:#8b8fa3;--dim:#53576a;
  --eng:#5b8cff;--eng-bg:rgba(91,140,255,.12);--eng-bd:rgba(91,140,255,.28);
  --fit:#3ddfa0;--fit-bg:rgba(61,223,160,.1);--fit-bd:rgba(61,223,160,.25);
  --warn:#f0a944;--danger:#ef5e5e;
  --r:12px;
}
body{
  min-height:100vh;color:var(--text);background:var(--bg);
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 40px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .35s ease both}

/* --- header --- */
.hd{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.hd-logo{font-size:15px;font-weight:800;letter-spacing:-.3px;cursor:pointer}
.hd-logo b{color:var(--fit)}
.hd-actions{display:flex;gap:6px}
.hd-btn{
  font-size:12px;font-weight:600;padding:7px 11px;border-radius:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--card);color:var(--sub);
  transition:border-color .15s;
}
.hd-btn:hover{border-color:var(--border-hl)}
.hd-name{
  font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;
  padding:4px 8px;border-radius:6px;border:1px solid transparent;
  transition:border-color .15s;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hd-name:hover{border-color:var(--border-hl)}
.hd-name-edit{
  font-size:12px;font-weight:600;color:var(--text);padding:4px 8px;
  border-radius:6px;border:1px solid var(--eng);background:var(--card2);
  outline:none;width:100px;
}

/* --- card --- */
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.cd-title{font-size:14px;font-weight:800;margin-bottom:2px}
.cd-sub{font-size:12px;color:var(--sub);line-height:1.5}

/* --- stats --- */
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.st{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px}
.st-k{font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.st-v{font-size:16px;font-weight:800;letter-spacing:-.3px}
.st-v.w{color:var(--warn)}.st-v.d{color:var(--danger)}

/* --- check-in --- */
.ci-week{
  display:inline-block;font-size:11px;font-weight:600;color:var(--sub);
  background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:5px 10px;margin-top:12px;
}
.ci-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ci-btn{
  position:relative;overflow:hidden;border:none;border-radius:10px;padding:13px 8px;
  font-size:13px;font-weight:800;cursor:pointer;color:#fff;
  transition:transform .1s,box-shadow .15s;
}
.ci-btn:active{transform:scale(.97)}
.ci-btn.eng{background:linear-gradient(135deg,#4a7aff,#6b9bff)}
.ci-btn.fit{background:linear-gradient(135deg,#28c07a,#3ddfa0)}
.ci-btn.eng:hover{box-shadow:0 4px 18px rgba(74,122,255,.35)}
.ci-btn.fit:hover{box-shadow:0 4px 18px rgba(61,223,160,.3)}
.ci-date-toggle{display:flex;gap:4px;margin-top:10px}
.ci-dt{
  flex:1;text-align:center;padding:6px 2px;border-radius:8px;font-size:11px;font-weight:700;
  border:1px solid var(--border);background:var(--card2);color:var(--sub);cursor:pointer;
  transition:all .15s;line-height:1.3;
}
.ci-dt.active{border-color:var(--eng);color:var(--eng);background:rgba(91,140,255,.08)}
.ci-dt.today{border-color:var(--fit-bd)}
.ci-dt.disabled{opacity:.25;cursor:default;pointer-events:none}
.ci-dt.locked{cursor:not-allowed;position:relative;color:rgba(255,255,255,.3);border-color:rgba(255,255,255,.1);user-select:none}
.ci-dt.locked::after{
  content:attr(data-tooltip);
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#2a2d3e;border:1px solid #444860;color:#ffffff;
  font-size:10px;font-weight:600;white-space:nowrap;
  padding:5px 10px;border-radius:6px;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s;
  z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.5);
}
.ci-dt.locked.tooltip-show::after{opacity:1;visibility:visible}
.ci-dt .ci-dt-day{font-size:9px;font-weight:400;color:var(--dim)}
.ci-hint{margin-top:6px;font-size:11px;color:var(--dim)}
.msg{margin-top:8px;border-radius:8px;padding:8px 10px;font-size:12px;display:none;font-weight:600}
.msg.err{color:#ffb0b0;border:1px solid rgba(239,94,94,.3);background:rgba(239,94,94,.08)}
.msg.ok{color:#9dffd3;border:1px solid rgba(61,223,160,.3);background:rgba(61,223,160,.06)}

/* --- calendar --- */
.cal-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.cal-month{font-size:14px;font-weight:800}
.cal-nav{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
  background:var(--card2);color:var(--sub);font-size:14px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:border-color .15s;
}
.cal-nav:hover{border-color:var(--border-hl)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-wd{text-align:center;font-size:10px;font-weight:600;color:var(--dim);padding:3px 0}
.cal-wd.sun{color:var(--danger)}.cal-wd.sat{color:var(--eng)}
.cal-c{
  aspect-ratio:1/1.15;border-radius:8px;padding:4px;cursor:pointer;
  border:1px solid transparent;background:var(--card2);
  display:flex;flex-direction:column;align-items:flex-start;
  transition:border-color .12s,background .12s;position:relative;
}
.cal-c:hover{border-color:var(--border-hl)}
.cal-c.empty{background:transparent;cursor:default;border:none}
.cal-c.today{border-color:var(--fit-bd)}
.cal-c.sel{border-color:var(--eng);background:rgba(91,140,255,.06)}
.cal-d{font-size:10px;font-weight:700;color:var(--sub);margin-bottom:auto}
.cal-c.sun .cal-d{color:var(--danger)}.cal-c.sat .cal-d{color:var(--eng)}
.cal-dots{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap;justify-content:center;width:100%}
.dot{width:6px;height:6px;border-radius:50%}
.dot.eng{background:var(--eng)}.dot.fit{background:var(--fit)}

/* --- day detail bottom sheet --- */
.dd{
  margin-top:8px;border:1px solid var(--border);border-radius:10px;
  background:var(--card2);overflow:hidden;
  animation:fadeUp .2s ease both;
}
.dd-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border)}
.dd-date{font-size:13px;font-weight:800}
.dd-close{
  width:24px;height:24px;border-radius:6px;border:1px solid var(--border);
  background:var(--card);color:var(--sub);font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.dd-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border)}
.dd-row:last-child{border-bottom:none}
.dd-name{font-size:12px;font-weight:600}
.dd-tag{
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;
}
.dd-tag.eng{color:var(--eng);background:var(--eng-bg);border:1px solid var(--eng-bd)}
.dd-tag.fit{color:var(--fit);background:var(--fit-bg);border:1px solid var(--fit-bd)}
.dd-empty{padding:14px 12px;text-align:center;font-size:12px;color:var(--dim)}

/* --- photo upload --- */
.proof-area{margin-top:10px}
.proof-label{
  display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px dashed var(--border-hl);border-radius:10px;padding:14px 10px;
  cursor:pointer;color:var(--sub);font-size:12px;font-weight:600;
  background:var(--card2);transition:border-color .15s;
}
.proof-label:hover{border-color:var(--eng)}
.proof-label svg{width:18px;height:18px;stroke:var(--sub)}
.proof-preview{
  margin-top:8px;position:relative;display:none;
  border-radius:10px;overflow:hidden;border:1px solid var(--border);
}
.proof-preview img{width:100%;max-height:200px;object-fit:cover;display:block}
.proof-remove{
  position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:6px;
  border:1px solid rgba(0,0,0,.3);background:rgba(0,0,0,.6);color:#fff;
  font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.proof-thumb{
  width:32px;height:32px;border-radius:6px;object-fit:cover;
  border:1px solid var(--border);cursor:pointer;
}
.dd-proof{
  width:100%;max-height:180px;object-fit:cover;border-radius:6px;
  margin-top:4px;border:1px solid var(--border);cursor:pointer;
}
/* --- lightbox --- */
.lb-overlay{
  position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.85);
  display:flex;align-items:center;justify-content:center;
  animation:fadeUp .15s ease both;cursor:pointer;
}
.lb-overlay img{max-width:92vw;max-height:88vh;border-radius:8px;object-fit:contain}

/* --- team summary --- */
.tm-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:9px;background:var(--card2);border:1px solid var(--border);
  font-size:12px;
}
.tm-name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-cnt{display:flex;align-items:center;gap:3px;font-weight:700;font-size:11px}
.tm-cnt.eng{color:var(--eng)}.tm-cnt.fit{color:var(--fit)}
.tm-dot{width:5px;height:5px;border-radius:50%}
.tm-dot.eng{background:var(--eng)}.tm-dot.fit{background:var(--fit)}
.tm-penalty{font-size:10px;font-weight:700;color:var(--danger);min-width:20px;text-align:right}
.tm-penalty.ok{color:var(--fit)}

/* --- progress bar --- */
.progress-wrap{margin-bottom:10px}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:4px;font-weight:600}
.progress-track{height:6px;background:var(--card-el);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease;background:linear-gradient(90deg,var(--eng),var(--fit))}

/* --- streak --- */
.streak-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(240,169,68,.1);border:1px solid rgba(240,169,68,.25);
  color:var(--warn);border-radius:6px;padding:3px 8px;
  font-size:10px;font-weight:800;margin-left:6px;vertical-align:middle;
}

/* --- attendance list --- */
.att-title{font-size:13px;font-weight:800;margin-bottom:8px}
.att-list{display:flex;flex-direction:column;gap:6px}
.att-row{
  display:flex;align-items:center;gap:8px;
  padding:9px 11px;border-radius:9px;background:var(--card2);border:1px solid var(--border);font-size:12px;
}
.att-row .att-info{flex:1;display:flex;align-items:center;gap:8px}
.att-date{color:var(--sub);font-weight:600}
.att-del{
  width:22px;height:22px;border-radius:6px;border:1px solid var(--border);
  background:var(--card);color:var(--dim);font-size:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .15s;
}
.att-del:hover{border-color:var(--danger);color:var(--danger)}
.att-edit{
  width:22px;height:22px;border-radius:6px;border:1px solid var(--border);
  background:var(--card);color:var(--dim);font-size:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .15s;
}
.att-edit:hover{border-color:var(--eng);color:var(--eng)}

/* --- modal --- */
.modal-overlay{
  position:fixed;inset:0;z-index:998;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;
  animation:fadeUp .12s ease both;
}
.modal-box{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:20px;width:min(320px,90vw);text-align:center;
}
.modal-msg{font-size:13px;font-weight:600;line-height:1.6;margin-bottom:16px}
.modal-btns{display:flex;gap:8px}
.modal-btn{
  flex:1;padding:10px;border-radius:9px;font-size:12px;font-weight:800;
  cursor:pointer;border:1px solid var(--border);transition:all .12s;
}
.modal-btn.cancel{background:var(--card2);color:var(--sub)}
.modal-btn.cancel:hover{border-color:var(--border-hl)}
.modal-btn.danger{background:rgba(239,94,94,.15);color:var(--danger);border-color:rgba(239,94,94,.3)}
.modal-btn.danger:hover{background:rgba(239,94,94,.25)}

/* --- login --- */
.login-card{max-width:380px;margin:60px auto 0}
.field{margin-top:10px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--dim);margin-bottom:4px}
.field input{
  width:100%;border-radius:9px;border:1px solid var(--border);
  padding:10px 11px;background:var(--bg);color:var(--text);font-size:13px;
  transition:border-color .15s;
}
.field input:focus{outline:none;border-color:var(--eng)}
.login-btn{
  width:100%;margin-top:14px;padding:11px;border:none;border-radius:9px;
  font-size:13px;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,#28c07a,#3ddfa0);color:#062e19;
}

@media(min-width:760px){
  .wrap{padding-top:24px}
  .st-grid{grid-template-columns:repeat(4,1fr)}
  .cal-c{aspect-ratio:1/1.05}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="hd-logo" onclick="location.href='challenge.html'">challenge<b>.</b>check</div>
    <div class="hd-actions">
      <span class="hd-name" id="hd-name" title="클릭해서 이름 변경" style="display:none" onclick="startEditName()"></span>
      <button class="hd-btn" id="logout-btn" style="display:none" onclick="showModal('로그아웃 하시겠습니까?',logout)">로그아웃</button>
      <button class="hd-btn" onclick="location.href='challenge-gallery.html'">갤러리</button>
      <button class="hd-btn" onclick="location.href='challenge-stats.html'">통계</button>
      <button class="hd-btn" onclick="location.href='challenge-history.html'">정산</button>
    </div>
  </div>

  <div id="modal-root"></div>

  <div id="login-view" class="cd login-card" style="display:none">
    <div class="cd-title">로그인</div>
    <p class="cd-sub">팀 계정으로 로그인하세요.</p>
    <form onsubmit="event.preventDefault();login()">
    <div class="field">
      <label>이메일</label>
      <input id="email" type="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input id="password" type="password" placeholder="••••••••">
    </div>
    <button class="login-btn" type="submit">로그인</button>
    </form>
    <div id="login-error" class="msg err"></div>
  </div>

  <div id="app-view" style="display:none">
    <div class="cd fade">
      <div class="cd-title">이번 주 챌린지</div>
      <p class="cd-sub" id="welcome"></p>
      <div class="st-grid">
        <div class="st"><div class="st-k">목표 (영어/운동)</div><div class="st-v" id="target-count"></div></div>
        <div class="st"><div class="st-k">출석 (영어/운동)</div><div class="st-v" id="done-count"></div></div>
        <div class="st"><div class="st-k">미달 (영어/운동)</div><div class="st-v w" id="miss-count"></div></div>
        <div class="st"><div class="st-k">예상 벌금</div><div class="st-v d" id="penalty-amount"></div></div>
      </div>
      <div class="ci-week" id="week-range"></div>
      <div class="ci-date-toggle" id="date-toggle"></div>
      <div class="ci-btns">
        <button class="ci-btn eng" onclick="startCheckIn('english')">영어 출석</button>
        <button class="ci-btn fit" onclick="startCheckIn('exercise')">운동 출석</button>
      </div>
      <input type="file" id="proof-file" accept="image/*" capture="environment" hidden>
      <div class="proof-preview" id="proof-preview">
        <img id="proof-img">
        <button class="proof-remove" onclick="clearProof()">✕</button>
      </div>
      <div class="ci-hint">버튼 클릭 → 인증샷 선택 → 출석 완료</div>
      <div id="action-info" class="msg ok"></div>
      <div id="action-error" class="msg err"></div>
    </div>

    <div class="cd fade" style="animation-delay:.06s">
      <div class="att-title">이번 주 팀원 현황</div>
      <div class="progress-wrap" id="team-progress-wrap" style="display:none">
        <div class="progress-label"><span>팀 달성률</span><span id="team-progress-label"></span></div>
        <div class="progress-track"><div class="progress-fill" id="team-progress-fill" style="width:0%"></div></div>
      </div>
      <div id="team-summary" class="att-list"></div>
    </div>

    <div class="cd fade" style="animation-delay:.12s">
      <div class="cal-hd">
        <button class="cal-nav" id="cal-prev">&#8249;</button>
        <div class="cal-month" id="calendar-month"></div>
        <button class="cal-nav" id="cal-next">&#8250;</button>
      </div>
      <div id="calendar-grid" class="cal-g"></div>
      <div id="calendar-day-detail"></div>
    </div>

    <div class="cd fade" style="animation-delay:.18s">
      <div class="att-title">휴일 요청</div>
      <div id="holiday-list" class="att-list"></div>
    </div>

    <div class="cd fade" style="animation-delay:.18s">
      <div class="att-title">내 출석 기록</div>
      <div id="attendance-list" class="att-list"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://mfzlrmwjwwpykjbsafud.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_L9tV1otxzn8yoC7fvwD6fw_qqiN5iyp';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentMember = null;
let currentRule = { required_count_per_week: 4, penalty_per_miss: 10000, week_start: 'mon', start_date: '2026-04-27' };
let weeklyAttendances = [];
let allMembers = [];
let calendarAttendances = [];
let calendarCursor = new Date();
let selectedCalendarDate = null;
let teamWeeklyData = { members: [], attendances: [] };
let holidays = [];
let holidayVotes = [];

function pad(n) { return String(n).padStart(2, '0'); }
function fmtDate(date) { return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`; }
function money(n) { return `${Number(n || 0).toLocaleString('ko-KR')}원`; }
function escapeHtml(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

let proofFile = null;
let pendingCheckInType = null;
let checkInDate = fmtDate(new Date());

async function addTimestampToImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.src = e.target.result;
    };
    img.onload = () => {
      const MAX_WIDTH = 1920;
      const MAX_HEIGHT = 1920;
      const MAX_SIZE = 5 * 1024 * 1024;

      let width = img.width;
      let height = img.height;

      if (width > MAX_WIDTH || height > MAX_HEIGHT) {
        if (width > height) {
          height = Math.round((height * MAX_WIDTH) / width);
          width = MAX_WIDTH;
        } else {
          width = Math.round((width * MAX_HEIGHT) / height);
          height = MAX_HEIGHT;
        }
      }

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(img, 0, 0, width, height);

      const now = new Date();
      const timestamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const label = 'Challenge Check-in';

      const fontSize = Math.max(16, Math.floor(canvas.width / 25));
      ctx.font = `bold ${fontSize}px Arial, sans-serif`;

      const labelWidth = ctx.measureText(label).width;
      const timeWidth = ctx.measureText(timestamp).width;
      const maxWidth = Math.max(labelWidth, timeWidth);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(10, canvas.height - fontSize * 2 - 30, maxWidth + 20, fontSize * 2 + 26);

      ctx.fillStyle = '#ffffff';
      ctx.fillText(label, 20, canvas.height - fontSize * 2 - 12);
      ctx.fillText(timestamp, 20, canvas.height - fontSize - 8);

      let quality = 0.92;
      const compress = () => {
        canvas.toBlob((blob) => {
          if (!blob) {
            reject(new Error('이미지 처리 실패'));
            return;
          }

          if (blob.size > MAX_SIZE && quality > 0.1) {
            quality -= 0.1;
            compress();
            return;
          }

          const processedFile = new File([blob], file.name.replace(/\.[^/.]+$/, '.webp'), { type: 'image/webp' });
          resolve(processedFile);
        }, 'image/webp', quality);
      };
      compress();
    };
    img.onerror = () => reject(new Error('이미지 로드 실패'));
    reader.readAsDataURL(file);
  });
}

function initDateToggle() {
  const todayStr = fmtDate(new Date());
  const { start } = getWeekRange(new Date(), currentRule.week_start || 'mon');
  const dayNames = ['일','월','화','수','목','금','토'];
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    days.push({ str: fmtDate(d), label: dayNames[d.getDay()], dd: d.getDate() });
  }
  const startDate = currentRule.start_date || '2000-01-01';
  const minAllowed = fmtDate(new Date(Date.now() - 2 * 24 * 60 * 60 * 1000));
  const validDays = days.filter(d => d.str >= startDate && d.str <= todayStr && d.str >= minAllowed);
  if (!validDays.find(d => d.str === checkInDate)) checkInDate = todayStr;
  const el = document.getElementById('date-toggle');
  el.innerHTML = days.map(d => {
    const future = d.str > todayStr;
    const tooOld = d.str < minAllowed || d.str < startDate;
    const disabled = future;
    const locked = !future && tooOld;
    const cls = [
      'ci-dt',
      checkInDate === d.str ? 'active' : '',
      d.str === todayStr ? 'today' : '',
      disabled ? 'disabled' : '',
      locked ? 'locked' : ''
    ].filter(Boolean).join(' ');
    const onclick = future || locked ? '' : `onclick="checkInDate='${d.str}';initDateToggle()"`;
    const tooltip = locked ? 'data-tooltip="2일 이전은 출석 불가"' : '';
    return `<div class="${cls}" ${onclick} ${tooltip}>${d.dd}<div class="ci-dt-day">${d.label}</div></div>`;
  }).join('');
}

function getWeekRange(now, weekStart) {
  const d = new Date(now);
  const day = d.getDay();
  const startOffset = weekStart === 'sun' ? day : (day === 0 ? 6 : day - 1);
  const start = new Date(d);
  start.setDate(d.getDate() - startOffset);
  start.setHours(0, 0, 0, 0);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  end.setHours(23, 59, 59, 999);
  return { start, end };
}

function getMonthRange(baseDate) {
  const start = new Date(baseDate.getFullYear(), baseDate.getMonth(), 1);
  const end = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 0);
  return { start, end };
}

  }

async function calcStreak() {
  const ws = currentRule.week_start || 'mon';
  const ruleStart = currentRule.start_date || '2000-01-01';
  let streak = 0;
  for (let off = -1; off >= -52; off--) {
    const { start, end } = getWeekRange(new Date(), ws);
    const s = new Date(start); s.setDate(s.getDate() + off * 7);
    const e = new Date(end); e.setDate(e.getDate() + off * 7);
    const sStr = fmtDate(s), eStr = fmtDate(e);
    if (eStr < ruleStart) break;
    const req = currentMember.required_count != null ? Number(currentMember.required_count) : Number(currentRule.required_count_per_week || 4);
    const { data } = await sb.from('challenge_attendances')
      .select('activity_type')
      .eq('member_id', currentMember.id)
      .gte('attended_on', sStr).lte('attended_on', eStr);
    const rows = data || [];
    const eng = rows.filter(r => r.activity_type === 'english').length;
    const fit = rows.filter(r => r.activity_type === 'exercise').length;
    if (eng >= req && fit >= req) streak++;
    else break;
  }
  return streak;
}

function renderTeamSummary() {
  const el = document.getElementById('team-summary');
  if (!el) return;
  const { members, attendances } = teamWeeklyData;
  const { start, end } = getWeekRange(new Date(), currentRule.week_start || 'mon');
  const approvedHolidays = holidays.filter(h => h.status === 'approved' && h.holiday_date >= fmtDate(start) && h.holiday_date <= fmtDate(end));
  const holidayCount = approvedHolidays.length;

  const defaultReq = Number(currentRule.required_count_per_week || 4);
  const baseReq = defaultReq;
  const req = Math.max(0, baseReq - holidayCount);
  const unit = Number(currentRule.penalty_per_miss || 10000);
  if (!members.length) { el.innerHTML = '<div class="tm-row" style="color:var(--dim)">팀원 없음</div>'; return; }

  let totalSlots = 0, totalDone = 0;
  members.forEach(m => {
    const baseR = m.required_count != null ? Number(m.required_count) : defaultReq;
    const r = Math.max(0, baseR - holidayCount);
    totalSlots += r * 2;
    const eng = attendances.filter(a => a.member_id === m.id && a.activity_type === 'english').length;
    const fit = attendances.filter(a => a.member_id === m.id && a.activity_type === 'exercise').length;
    totalDone += Math.min(eng, r) + Math.min(fit, r);
  });
  const pct = totalSlots ? Math.round(totalDone / totalSlots * 100) : 0;
  const pw = document.getElementById('team-progress-wrap');
  if (pw) {
    pw.style.display = 'block';
    document.getElementById('team-progress-fill').style.width = pct + '%';
    document.getElementById('team-progress-label').textContent = `${totalDone}/${totalSlots} (${pct}%)`;
  }

  el.innerHTML = members.map(m => {
    const baseMReq = m.required_count != null ? Number(m.required_count) : defaultReq;
    const mReq = Math.max(0, baseMReq - holidayCount);
    const mUnit = m.penalty_per_miss != null ? Number(m.penalty_per_miss) : unit;
    const eng = attendances.filter(a => a.member_id === m.id && a.activity_type === 'english').length;
    const fit = attendances.filter(a => a.member_id === m.id && a.activity_type === 'exercise').length;
    const miss = Math.max(Math.max(0, mReq - eng), Math.max(0, mReq - fit));
    const pen = miss * mUnit;
    const penCls = pen === 0 ? 'tm-penalty ok' : 'tm-penalty';
    const penText = pen === 0 ? '✓' : money(pen);
    return `<div class="tm-row">
      <span class="tm-name">${escapeHtml(m.name)}</span>
      <span class="tm-cnt eng"><span class="tm-dot eng"></span>${eng}<span style="color:var(--dim);font-weight:400">/${mReq}</span></span>
      <span class="tm-cnt fit"><span class="tm-dot fit"></span>${fit}<span style="color:var(--dim);font-weight:400">/${mReq}</span></span>
      <span class="${penCls}">${penText}</span>
    </div>`;
  }).join('');
}

function renderCalendar() {
  const grid = document.getElementById('calendar-grid');
  if (!grid) return;

  const { start, end } = getMonthRange(calendarCursor);
  const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
  const todayKey = fmtDate(new Date());
  const dayMap = new Map();

  calendarAttendances.forEach(item => {
    const list = dayMap.get(item.attended_on) || [];
    list.push(item);
    dayMap.set(item.attended_on, list);
  });

  const wdCls = ['sun','','','','','','sat'];
  let html = weekdays.map((d,i) => `<div class="cal-wd ${wdCls[i]}">${d}</div>`).join('');

  for (let i = 0; i < start.getDay(); i++) html += '<div class="cal-c empty"></div>';

  for (let day = 1; day <= end.getDate(); day++) {
    const date = new Date(start.getFullYear(), start.getMonth(), day);
    const dateKey = fmtDate(date);
    const dow = date.getDay();
    const items = dayMap.get(dateKey) || [];
    const engN = items.filter(x => x.activity_type === 'english').length;
    const fitN = items.filter(x => x.activity_type === 'exercise').length;

    let dots = '';
    for (let i = 0; i < engN; i++) dots += '<span class="dot eng"></span>';
    for (let i = 0; i < fitN; i++) dots += '<span class="dot fit"></span>';

    const cls = [
      'cal-c',
      selectedCalendarDate === dateKey ? 'sel' : '',
      dateKey === todayKey ? 'today' : '',
      dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''
    ].filter(Boolean).join(' ');

    html += `<div class="${cls}" data-date="${dateKey}">
      <div class="cal-d">${day}</div>
      ${dots ? `<div class="cal-dots">${dots}</div>` : ''}
    </div>`;
  }

  grid.innerHTML = html;
  grid.querySelectorAll('.cal-c[data-date]').forEach(el => {
    el.addEventListener('click', () => {
      const d = el.getAttribute('data-date');
      selectedCalendarDate = selectedCalendarDate === d ? null : d;
      renderCalendar();
      renderCalendarDayDetail();
    });
  });
}

async function renderSummary() {
  const { start, end } = getWeekRange(new Date(), currentRule.week_start || 'mon');
  const approvedHolidays = holidays.filter(h => h.status === 'approved' && h.holiday_date >= fmtDate(start) && h.holiday_date <= fmtDate(end));
  const holidayCount = approvedHolidays.length;

  const baseReq = currentMember && currentMember.required_count != null
    ? Number(currentMember.required_count)
    : Number(currentRule.required_count_per_week || 4);
  const req = Math.max(0, baseReq - holidayCount);
  const unit = currentMember && currentMember.penalty_per_miss != null
    ? Number(currentMember.penalty_per_miss)
    : Number(currentRule.penalty_per_miss || 10000);
  const englishDone = weeklyAttendances.filter(x => x.activity_type === 'english').length;
  const exerciseDone = weeklyAttendances.filter(x => x.activity_type === 'exercise').length;
  const englishMiss = Math.max(0, req - englishDone);
  const exerciseMiss = Math.max(0, req - exerciseDone);
  const totalMiss = Math.max(englishMiss, exerciseMiss);
  const penalty = totalMiss * unit;

  const streakWeeks = await calcStreak();
  const streakHtml = streakWeeks >= 2 ? `<span class="streak-badge">🔥 ${streakWeeks}주 연속</span>` : '';
  const holidayInfo = holidayCount > 0 ? ` (휴일 ${holidayCount}일로 목표 조정)` : '';
  
  const isComplete = englishDone >= req && exerciseDone >= req;
  const welcomeText = isComplete 
    ? `${escapeHtml(currentMember.name)}님, 이번 주 목표를 달성했습니다! 🎉${streakHtml}${holidayInfo}`
    : `${escapeHtml(currentMember.name)}님, 이번 주 목표를 채워보세요.${streakHtml}${holidayInfo}`;
  
  document.getElementById('welcome').innerHTML = welcomeText;
  document.getElementById('target-count').textContent = `${req} / ${req}`;
  document.getElementById('done-count').textContent = `${englishDone} / ${exerciseDone}`;
  document.getElementById('miss-count').textContent = `${englishMiss} / ${exerciseMiss}`;
  document.getElementById('penalty-amount').textContent = money(penalty);

  const list = document.getElementById('attendance-list');
  if (!weeklyAttendances.length) {
    list.innerHTML = `<div class="att-row"><span class="att-date" style="color:var(--dim)">아직 출석 기록이 없습니다.</span></div>`;
    return;
  }
  list.innerHTML = weeklyAttendances.map(row => {
    const cls = row.activity_type === 'english' ? 'eng' : 'fit';
    const label = row.activity_type === 'english' ? '영어' : '운동';
    const thumb = row.note
      ? `<img class="proof-thumb" src="${row.note}" onclick="openLightbox('${row.note}')">`
      : '';
    const editBtn = `<button class="att-edit" onclick="startReplaceProof('${row.id}','${row.member_id}','${row.activity_type}','${row.attended_on}')" title="사진 ${row.note ? '변경' : '추가'}">📷</button>`;
    return `<div class="att-row">${thumb}<div class="att-info"><span class="att-date">${row.attended_on}</span><span class="dd-tag ${cls}">${label}</span></div>${editBtn}<button class="att-del" onclick="deleteAttendance('${row.id}','${row.attended_on}','${label}')">✕</button></div>`;
  }).join('');
}

  overlay.querySelector('#modal-ok').onclick = () => { overlay.remove(); onConfirm(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

function startReplaceProof(attId, memberId, type, dateStr) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showError('action-error', '5MB 이하만 가능합니다.'); return; }
    const ext = file.name.split('.').pop() || 'jpg';
    const path = `${memberId}/${dateStr}_${type}.${ext}`;
    const { error: upErr } = await sb.storage.from('challenge-proofs').upload(path, file, { upsert: true });
    if (upErr) { showError('action-error', '업로드 실패: ' + upErr.message); return; }
    const { data } = sb.storage.from('challenge-proofs').getPublicUrl(path);
    const url = data.publicUrl + '?t=' + Date.now();
    const { error } = await sb.from('challenge_attendances').update({ note: url }).eq('id', attId);
    if (error) { showError('action-error', error.message); return; }
    showInfo('인증샷이 변경되었습니다.');
    await loadAttendances();
    renderSummary();
    await loadTeamCalendarData();
    renderCalendar();
    renderCalendarDayDetail();
  };
  input.click();
}

}

function startCheckIn(type) {

  if (already) {

  }

  const fileInput = document.getElementById('proof-file');

  fileInput.removeAttribute('capture');
  fileInput.click();

async function checkIn(type) {
  clearActionMessage();
  const targetDate = checkInDate;

  const already = weeklyAttendances.find(a => a.attended_on === targetDate && a.activity_type === type);
  if (already) {
    const label = type === 'english' ? '영어' : '운동';
    showError('action-error', `${targetDate} ${label}는 이미 출석 처리되었습니다.`);
    return;
  }

  let proofUrl = null;
  if (proofFile) {
    try {
      proofUrl = await uploadProof(currentMember.id, type, targetDate);
    } catch (e) {
      showError('action-error', e.message);
      return;
    }
  }

  const payload = {
    member_id: currentMember.id,
    user_id: currentUser.id,
    activity_type: type,
    attended_on: targetDate,
    note: proofUrl || null
  };

  const { error } = await sb.from('challenge_attendances').insert(payload);
  if (error) {
    showError('action-error', error.message);
    return;
  }

  clearProof();
  showInfo(`${type === 'english' ? '영어' : '운동'} 출석 완료! (${targetDate})`);
  await loadAttendances();
  renderSummary();
  await Promise.all([loadTeamWeekly(), loadTeamCalendarData()]);
  renderTeamSummary();
  selectedCalendarDate = targetDate;
  renderCalendar();
  renderCalendarDayDetail();
}

async function loadHolidays() {
  const [hRes, vRes] = await Promise.all([
    sb.from('challenge_holidays').select('*').order('holiday_date', { ascending: true }),
    sb.from('challenge_holiday_votes').select('*')
  ]);
  if (hRes.error) throw hRes.error;
  if (vRes.error) throw vRes.error;
  holidays = hRes.data || [];
  holidayVotes = vRes.data || [];
  console.log('휴일 로드:', holidays.map(h => ({ date: h.holiday_date, status: h.status })));
}

function renderHolidayList() {
  const el = document.getElementById('holiday-list');
  if (!el) return;
  if (!holidays.length) {
    el.innerHTML = '<div class="att-row"><span class="att-date" style="color:var(--dim)">휴일 요청이 없습니다.</span></div>';
    return;
  }

  const membersById = new Map(allMembers.map(m => [m.id, m.name]));
  const activeMemberCount = allMembers.length;

  el.innerHTML = holidays.map(h => {
    const votes = holidayVotes.filter(v => v.holiday_id === h.id);
    const agreeCount = votes.filter(v => v.vote === true).length;
    const disagreeCount = votes.filter(v => v.vote === false).length;
    const myVote = votes.find(v => v.member_id === currentMember.id);
    const isApproved = h.status === 'approved';
    const isRejected = h.status === 'rejected';
    const isPending = h.status === 'pending';

    let statusBadge = '';
    if (isApproved) statusBadge = '<span class="dd-tag eng" style="font-size:9px;padding:2px 6px">승인</span>';
    else if (isRejected) statusBadge = '<span class="dd-tag" style="color:var(--danger);background:rgba(239,94,94,.1);border-color:rgba(239,94,94,.3);font-size:9px;padding:2px 6px">거부</span>';
    else statusBadge = `<span class="dd-tag" style="color:var(--warn);background:rgba(240,169,68,.1);border-color:rgba(240,169,68,.3);font-size:9px;padding:2px 6px">${agreeCount}/${activeMemberCount}</span>`;

    let actionBtn = '';
    if (isPending && !myVote) {
      actionBtn = `
        <div style="display:flex;gap:4px">
          <button class="hd-btn" onclick="voteHoliday('${h.id}', true)" style="font-size:10px;padding:4px 8px">동의</button>
          <button class="hd-btn" onclick="voteHoliday('${h.id}', false)" style="font-size:10px;padding:4px 8px;border-color:var(--danger);color:var(--danger)">거부</button>
        </div>
      `;
    } else if (myVote) {
      const voteText = myVote.vote ? '동의' : '거부';
      actionBtn = `<span style="font-size:10px;color:var(--dim)">${voteText}</span>`;
    }

    return `<div class="att-row" style="padding:6px 10px">
      <span class="att-date" style="min-width:90px">${h.holiday_date}</span>
      <span style="font-size:11px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(h.reason)}</span>
      ${statusBadge}
      <div style="display:flex;align-items:center;gap:8px;margin-left:8px">
        ${actionBtn}
      </div>
    </div>`;
  }).join('');
}

function showHolidayRequestModal(preDate = '') {
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-msg">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px">휴일 요청</div>
        <div class="field">
          <label>날짜</label>
          <input type="date" id="holiday-date" value="${preDate}" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)">
        </div>
        <div class="field">
          <label>사유</label>
          <input type="text" id="holiday-reason" placeholder="예: 여행, 개인 일정 등" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)">
        </div>
      </div>
      <div class="modal-btns">
        <button class="modal-btn cancel" id="modal-cancel">취소</button>
        <button class="modal-btn danger" id="modal-ok">요청</button>
      </div>
    </div>
  `;
  root.appendChild(overlay);
  overlay.querySelector('#modal-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#modal-ok').onclick = async () => {
    const date = document.getElementById('holiday-date').value;
    const reason = document.getElementById('holiday-reason').value.trim();
    if (!date) { alert('날짜를 선택하세요.'); return; }
    if (!reason) { alert('사유를 입력하세요.'); return; }

    const { data: holiday, error } = await sb.from('challenge_holidays').insert({
      holiday_date: date,
      reason: reason,
      requested_by: currentMember.id,
      status: 'pending'
    }).select().single();
    if (error) {
      alert('요청 실패: ' + error.message);
      return;
    }

    const { error: voteError } = await sb.from('challenge_holiday_votes').insert({
      holiday_id: holiday.id,
      member_id: currentMember.id,
      vote: true
    });
    if (voteError) {
      alert('투표 실패: ' + voteError.message);
      return;
    }

    overlay.remove();
    showInfo('휴일 요청이 등록되었습니다.');
    await loadHolidays();
    renderHolidayList();
    if (selectedCalendarDate) renderCalendarDayDetail();
  };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

async function voteHoliday(holidayId, vote) {
  const { error } = await sb.from('challenge_holiday_votes').upsert({
    holiday_id: holidayId,
    member_id: currentMember.id,
    vote: vote
  }, { onConflict: 'holiday_id,member_id' });
  if (error) {
    showError('action-error', '투표 실패: ' + error.message);
    return;
  }

  await loadHolidays();
  await checkHolidayApproval(holidayId);
  await loadHolidays();
  renderHolidayList();
  if (selectedCalendarDate) renderCalendarDayDetail();
}

async function checkHolidayApproval(holidayId) {
  const [hRes, vRes] = await Promise.all([
    sb.from('challenge_holidays').select('*').eq('id', holidayId).single(),
    sb.from('challenge_holiday_votes').select('*').eq('holiday_id', holidayId)
  ]);
  if (hRes.error || !hRes.data) return;
  if (vRes.error) return;

  const holiday = hRes.data;
  if (holiday.status !== 'pending') return;

  const votes = vRes.data || [];
  const activeMemberCount = allMembers.length;
  const agreeCount = votes.filter(v => v.vote === true).length;
  const disagreeCount = votes.filter(v => v.vote === false).length;

  if (disagreeCount > 0) {
    await sb.from('challenge_holidays').update({ status: 'rejected' }).eq('id', holidayId);
  } else if (agreeCount >= activeMemberCount) {
    await sb.from('challenge_holidays').update({ status: 'approved' }).eq('id', holidayId);
  }
}

  const { data: { session } } = await sb.auth.getSession();
  const loginView = document.getElementById('login-view');
  const appView = document.getElementById('app-view');
  if (!session) {
    loginView.style.display = 'block';
    appView.style.display = 'none';
    return;
  }

  currentUser = session.user;
  document.getElementById('logout-btn').style.display = 'inline-block';

  appView.style.display = 'block';

  try {
    await ensureMember();
    const hdName = document.getElementById('hd-name');
    hdName.textContent = currentMember.name;
    hdName.style.display = 'inline-block';
    initDateToggle();
    await loadRule();
    await Promise.all([loadAttendances(), loadHolidays()]);
    renderSummary();
    await Promise.all([loadTeamWeekly(), loadTeamCalendarData()]);
    renderTeamSummary();
    renderHolidayList();
    selectedCalendarDate = fmtDate(new Date());
    renderCalendar();
    renderCalendarDayDetail();

    document.getElementById('cal-prev').addEventListener('click', async () => {
      calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() - 1, 1);

      selectedCalendarDate = null;
      renderCalendar();
      renderCalendarDayDetail();
    });

    document.getElementById('cal-next').addEventListener('click', async () => {
      calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + 1, 1);
      await loadTeamCalendarData();
      selectedCalendarDate = null;
      renderCalendar();
      renderCalendarDayDetail();
    });
  } catch (e) {
    showError('action-error', e.message || '초기 로딩에 실패했습니다. RLS와 테이블을 확인하세요.');
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function subscribePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  if (!currentMember) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    const { endpoint, keys } = sub.toJSON();
    await sb.from('push_subscriptions').upsert({
      member_id: currentMember.id,
      user_id: currentUser.id,
      endpoint,
      p256dh: keys.p256dh,
      auth: keys.auth
    }, { onConflict: 'user_id,endpoint' });
  } catch (e) {
    console.warn('push subscribe failed', e);
  }
}
