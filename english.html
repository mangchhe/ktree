/* 오늘 영어 인증 — 챌린지 앱과 같은 자리(challenge_attendances · challenge-proofs)에 쓴다.
 * 그래서 챌린지 앱 시절 기록과 그대로 이어지고, 챌린지 앱을 따로 안 열어도 된다. */
async function tgCheckIn(file, t, day){
  let me = t.meRow;
  if (!me) {                                     // 로스터에 없으면 지금 들어간다 (insert 는 본인 행만 허용)
    const { data, error } = await sb.from('challenge_members').insert({ user_id: currentUser.id,
      name: (currentUser.email || '').split('@')[0], email: currentUser.email }).select('id').single();
    if (error) throw new Error('멤버 등록 실패 — ' + error.message);
    me = data;
  }
  const blob = await tgStamp(file, day);
  const path = `${me.id}/${day}_english.jpg`;
  const up = await sb.storage.from('challenge-proofs').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
  if (up.error) throw new Error('사진 올리기 실패 — 연결 확인');
  const url = sb.storage.from('challenge-proofs').getPublicUrl(path).data.publicUrl + '?t=' + Date.now();
  const { error } = await sb.from('challenge_attendances').upsert({ member_id: me.id, user_id: currentUser.id,
    activity_type: 'english', attended_on: day, note: url }, { onConflict: 'member_id,attended_on,activity_type' });
  if (error) throw new Error('인증 저장 실패 — ' + error.message);
}

/** 1600px 로 줄이고 왼쪽 아래에 날짜 도장(챌린지 앱과 같은 관례). JPEG — 아이폰 사파리는 webp 로 못 굽는다. */
async function tgStamp(file, day){
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0, c.width, c.height);
  const fs = Math.max(16, Math.round(c.width / 28)), label = day === today() ? `English · ${day} ${new Date().toTimeString().slice(0,5)}` : `English · ${day}`;
  x.font = `bold ${fs}px sans-serif`;
  x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(10, c.height - fs * 2 - 10, x.measureText(label).width + 20, fs * 1.8);
  x.fillStyle = '#fff'; x.fillText(label, 20, c.height - fs * 0.75 - 10);
  for (let q = 0.85; q > 0.3; q -= 0.15) {
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (b && (b.size <= 1.5e6 || q <= 0.4)) return b;
  }
  throw new Error('사진 처리 실패');
}

/* ═══ 보관함 — 지난 장면·기사 다시 하기 ════════════════
 *
 * 세 가지를 지킨다. 안 지키면 콘텐츠가 쌓일수록 어긋난다:
 *  ① **오늘 것은 뺀다.** 오늘 판에 이미 있는 걸 또 보여주면 "보관함"이 아니다.
 *  ② **토픽 필터를 건다.** 어휘 장부는 끈 토픽을 빼는데 여기만 안 빼면 앞뒤가 안 맞는다.
 *  ③ **상한 대신 더 보기.** 하루 4~5개씩 쌓이면 40개는 열흘이면 찬다 —
 *     고정 limit 이면 그때부터 오래된 것이 말없이 사라진다.
 */
const AV_PAGE = 20;
let avLimit = AV_PAGE;

async function renderArchive(){
  const box = $('av-list');
  const names = activeTopicNames();
  // KST 자정 경계. created_at 은 timestamptz 라 UTC 로 환산해 비교한다.
  const dayStart = new Date(Date.parse(today() + 'T00:00:00+09:00')).toISOString();
  // 🔴 보관함도 **단계를 따른다.** 판은 S1 이라 L2 장면만 내는데 보관함이 L3 53개·뉴스 19개를
  // 그대로 띄우면, 주말에 "더 해볼까" 하고 연 순간 S3~S4 재료를 집고 다시 "너무 어렵다" 가 된다.
  // 숨긴 건 숫자로만 알려준다 — 사라진 게 아니라 잠긴 것이다.
  const st = curStage();
  const news = st.board.req.includes('article') || st.board.opt.includes('article');
  const base = (t, cols, opt) => {
    let x = sb.from(t).select(cols, opt).lt('created_at', dayStart);
    if (names.length) x = x.in('topic', names);
    return x;
  };
  const list = (t, f) => f(base(t, '*', { count:'exact' })).order('created_at',{ascending:false}).limit(avLimit);
  const count = (t, f) => f(base(t, 'id', { count:'exact', head:true }));
  const none = Promise.resolve({ data:[], count:0 });
  const [sc, ar, scLock, arLock, mine] = await Promise.all([
    list('eng_scenes', x => x.lte('level', st.scMax)),
    news ? list('eng_articles', x => x) : none,
    count('eng_scenes', x => x.gt('level', st.scMax)),
    news ? none : count('eng_articles', x => x),
    sb.from('eng_done').select('item, item_id').eq('user_id', currentUser.id),
  ]);
  const fixHead = await archiveFixes();
  if (sc.error || ar.error) { box.innerHTML = '<div class="empty">Could not load the archive.</div>'; return; }
  const scenes = sc.data || [], arts = ar.data || [];
  // 해본 것과 안 해본 것을 가른다 — 다시 하기와 처음 하기는 다른 선택이다.
  // "해봄" 은 **끝까지 간 것**이다(eng_done). 판에 올라왔다는 것만으론 안 된다.
  const doneRows = mine.data || [];
  const didSc = new Set(doneRows.filter(r => r.item === 'scene').map(r => r.item_id));
  const didAr = new Set(doneRows.filter(r => r.item === 'article').map(r => r.item_id));
  // 잠긴 재료가 몇 단계에서 열리나
  const opensAt = ok => +Object.keys(STAGES).find(n => +n > tStage && ok(STAGES[n])) || null;
  const lockN = (scLock.count || 0) + (arLock.count || 0);
  const lockAt = Math.min(...[scLock.count ? opensAt(x => x.scMax > st.scMax) : null,
    arLock.count ? opensAt(x => x.board.req.includes('article') || x.board.opt.includes('article')) : null]
    .filter(Boolean));
  const lockHtml = lockN ? `<div class="vcard" style="margin:0 0 12px;padding:10px 13px">
      <div class="vm">🔒 <b style="color:var(--text)">S${lockAt} 부터 열리는 재료 ${lockN}개</b>
        — ${[scLock.count ? `어려운 장면(L3) ${scLock.count}` : '', arLock.count ? `뉴스 ${arLock.count}` : ''].filter(Boolean).join(' · ')}.
        지금 집으면 다시 "너무 어렵다" 가 된다. 단계가 오르면 여기 나온다.</div></div>` : '';
  if (!scenes.length && !arts.length) {
    // 왜 비었는지 갈라 말해준다 — "아직 없음"과 "토픽을 다 꺼둠"은 다른 상황이다.
    // topics 가 비어 있는 건 **로드 전/실패**일 수도 있다. 그걸 "다 꺼둠"이라고 하면 거짓말이 된다.
    const allOff = topics.length > 0 && !names.length;
    box.innerHTML = fixHead + lockHtml + (allOff
      ? '<div class="empty">All topics are off. Turn one on in Today to see archived material.</div>'
      : '<div class="empty">Nothing here yet — today\'s material moves in tomorrow.</div>');
    wireFix(box);
    return;
  }
  const more = (sc.count || 0) > scenes.length || (ar.count || 0) > arts.length;
  const did = on => on ? ' · <b style="color:var(--ok)">✓ 해봄</b>' : '';
  box.innerHTML = `<p class="leg" style="margin:0 0 12px">지난 재료. 주말에 더 하고 싶으면 여기서 골라 —
      <b>S${tStage} 에 맞는 것만</b> 보인다.</p>
    ${fixHead}
    ${lockHtml}
    ${scenes.length ? `<div class="vprog">장면 ${sc.count ?? scenes.length}개 · 안 해본 것 ${scenes.filter(x => !didSc.has(x.id)).length}${(sc.count ?? 0) > scenes.length ? '+' : ''}</div>` + scenes.map(x =>
      `<div class="initem"><div class="itx"><div class="ie">${esc(x.situation_ko)}</div>
        <div class="isrc">${esc((x.created_at||'').slice(0,10))} · ${esc(topicLabel(x.topic))} L${x.level} · ${Math.round(x.ms/1000)}s${did(didSc.has(x.id))}</div></div>
        <button class="btn sm" data-sc="${x.id}">Open</button></div>`).join('') : ''}
    ${arts.length ? `<div class="vprog" style="margin-top:14px">뉴스 ${ar.count ?? arts.length}개</div>` + arts.map(x =>
      `<div class="initem"><div class="itx"><div class="ie">${esc(x.title)}</div>
        <div class="isrc">${esc((x.created_at||'').slice(0,10))} · ${(x.sentences||[]).length} sentences · ${Math.round(x.ms/1000)}s${did(didAr.has(x.id))}</div></div>
        <button class="btn sm" data-ar="${x.id}">Open</button></div>`).join('') : ''}
    ${more ? `<div class="actbar" style="margin-top:14px;justify-content:center">
      <button class="btn sm" id="av-more">Show more</button></div>` : ''}`;
  const mb = $('av-more');
  if (mb) mb.onclick = () => { avLimit += AV_PAGE; renderArchive(); };
  wireFix(box);
  // 🔴 보관함에서 연 건 **다시 보기**다 — 오늘 판에 손대면 안 된다. 전엔 tScenes 를 그 장면으로
  // 바꿔치기해서 (1) Today 로 돌아오면 오늘 장면이 사라졌고 (2) 그걸 끝내면 오늘 Scenes 칸이
  // 1/1 완료로 찍혔고 (3) 오늘 아직 저장 전이면 그 옛 장면이 오늘 판에 박혔다. 뉴스는 열기만 해도
  // 저장할 때 오늘 기사가 옛 기사로 덮였다. replay() 로 맡겨두고, 저장은 막고, Today 에서 되돌린다.
  // show('today') 가 renderToday 로 되돌리기를 하므로 replay 는 **그 뒤에** 건다.
  box.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => {
    const one = scenes.find(x => x.id === b.dataset.sc);
    if (!one) return;
    show('today');
    setTimeout(() => { replay({ scenes:[one] }); scIdx = 0; openAct('scene'); }, 30);
  });
  box.querySelectorAll('[data-ar]').forEach(b => b.onclick = () => {
    const one = arts.find(x => x.id === b.dataset.ar);
    if (!one) return;
    show('today');
    setTimeout(() => { replay({ article:one }); openAct('article'); }, 30);
  });
}

/* 세 칸을 다 채웠으면 완주 보너스. 한 번만 준다 */
async function maybeComplete(){
  if (tReplay || !tSession || tSession.completed_at) return;
  // 단계가 정한 req 칸만 본다 — S1 에서 장면(선택)·뉴스(없음)를 안 했다고 완주가 막히면 안 된다.
  // 재료가 없는 칸(total 0)은 끝난 것으로 친다 — 재료가 모자란 날 완주가 불가능해지면 안 된다.
  const b = curStage().board;
  const ok = b.req.every(partDone) && (!b.quiz || partDone('quiz'));
  if (!ok) return;
  try {
    await sb.from('eng_sessions').update({ completed_at: new Date().toISOString() })
      .eq('user_id', currentUser.id).eq('session_date', sessDay());
    tSession.completed_at = new Date().toISOString();
  } catch(_) {}
  await bumpXp(XP.complete, 'Board complete 🎉');
}

/* 앱을 켜둔 채 자정을 넘기면 화면은 어제 판이다. 돌아올 때 날짜가 바뀌었으면 다시 세운다. */
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !tSession || tSession.session_date === today()) return;
  tLoaded = false; tGain = 0;
  await loadStage(); await loadPrompts();
  await loadToday();
  if ($('s-today')?.classList.contains('on')) renderToday();
});

/* ================= init ================= */
async function init(){
  paintBuild();
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ $('login-view').style.display='block'; $('app-view').style.display='none'; $('tabbar').style.display='none'; return; }
  currentUser = session.user;
  $('login-view').style.display='none'; $('app-view').style.display='block'; $('tabbar').style.display='grid';
  try {
    await flushPending();
    await loadTopics();
    await loadTodayVocab();
    await loadStage();          // 단계가 문항 유형을 정하므로 문항보다 먼저
    await loadPrompts();
  } catch (e) {
    // 오프라인 폴백: 마지막 큐 스냅샷으로 복습은 가능하게
    toast('Offline — grades are queued and sync when you are back');
    console.warn(e);
  }
  // 「오늘」이 기본 화면이다. show() 를 안 거치고 뜨므로 여기서 직접 그려야 한다 —
  // 안 부르면 앱을 열었을 때 첫 화면이 그냥 빈 채로 있다.
  // try 밖에 둔다: 오늘 판이 실패했다고 "오프라인 모드" 토스트가 뜨면 원인을 잘못 가리킨다.
  try { await renderToday(); } catch (e) { console.warn('오늘 판', e); }

  if ('speechSynthesis' in window) speechSynthesis.getVoices();

  // 이미 허용해둔 사람은 조용히 재구독한다. 푸시 구독은 브라우저가 주기적으로
  // 만료·교체하므로 갱신 경로가 없으면 어느 날부터 조용히 끊긴다 (버튼은 계속 "켜짐"이고).
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') subscribePush(false);
}

init();
// 경로는 **상대**여야 한다. 사이트가 mangchhe.github.io/ktree/ 하위라 '/sw.js' 는 404 였고,
// 그래서 서비스워커가 한 번도 등록된 적이 없다 (오프라인·푸시가 조용히 죽어 있었다).
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js')
  .catch(e => console.warn('sw 등록 실패', e));
</script>
