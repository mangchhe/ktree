<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English">
<link rel="manifest" href="manifest-english.json">
<!-- iOS 는 apple-touch-icon 에 SVG 를 받지 않는다 — PNG 180 이어야 홈 화면 아이콘이 나온다 -->
<link rel="apple-touch-icon" href="icon-english-180.png">
<title>English — ktree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-log.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08090e;--card:#111318;--card2:#16181f;--card-el:#1c1f28;
  --border:#23262f;--border-hl:#3b3f4f;
  --text:#e8eaef;--sub:#8b8fa3;--dim:#53576a;
  --eng:#5b8cff;--eng-bg:rgba(91,140,255,.12);--eng-bd:rgba(91,140,255,.28);
  --ok:#3ddfa0;--ok-bg:rgba(61,223,160,.1);--ok-bd:rgba(61,223,160,.25);
  --warn:#f0a944;--warn-bg:rgba(240,169,68,.12);
  --danger:#ef5e5e;--danger-bg:rgba(239,94,94,.12);
  --r:12px;
  --num:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html{color-scheme:dark}
/* 어떤 자식도 화면을 넓히지 못하게 한다 — 한 군데만 삐져나와도 전체가 잘려 보인다 */
html,body{max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;color:var(--text);background:var(--bg);
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--eng);outline-offset:2px}
/* 상단도 safe-area 를 먹여야 한다. apple-mobile-web-app-status-bar-style 이
   black-translucent 이고 viewport-fit=cover 라, 홈 화면에 설치하면 웹뷰가 상태바
   **아래까지** 올라온다 — 안 더하면 헤더가 시계·배터리에 깔린다.
   설치 안 한 Safari 는 inset 이 0이라 그대로다. */
.wrap{max-width:520px;margin:0 auto;
  padding:calc(8px + env(safe-area-inset-top)) 14px calc(112px + env(safe-area-inset-bottom))}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* --- header --- */
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;gap:8px;min-width:0}
.hd-logo{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-logo{font-size:15px;font-weight:800;letter-spacing:-.3px}
.hd-logo b{color:var(--eng)}
.hd-right{display:flex;align-items:center;gap:6px}
.streakpill{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:5px 11px}
.hd-btn{font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid transparent;background:none;color:var(--dim);flex:none}
.hd-btn:hover{color:var(--sub)}
.hd-btn.icon{padding:6px;display:grid;place-items:center}
.hd-btn.icon svg{width:19px;height:19px;display:block}
.hd-btn.icon:hover{color:var(--eng)}

/* --- login --- */
.login-card{max-width:380px;margin:60px auto 0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.login-card h2{font-size:17px;font-weight:800;margin-bottom:4px}
.login-card p{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px}
.field input{width:100%;padding:11px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--border-hl);color:var(--text);font-family:inherit;font-size:14px}
.field input:focus{outline:none;border-color:var(--eng)}
.primary-btn{width:100%;padding:12px;border-radius:11px;font-size:14px;font-weight:700;background:var(--eng);border:none;color:#fff}
.primary-btn:disabled{opacity:.5;cursor:default}
.msg{margin-top:10px;font-size:12.5px;border-radius:9px;padding:9px 12px;display:none}
.msg.err{background:var(--danger-bg);color:var(--danger)}
.msg.show{display:block}

/* --- shared --- */

.screen{display:none}
.screen.on{display:block;animation:fadeUp .25s ease both}
.empty{text-align:center;color:var(--dim);font-size:12.5px;line-height:1.7;padding:30px 16px}
/* Together 탭 — 주간 격자와 누적. 챌린지앱의 주간 표와 같은 읽는 법이다. */
.tgh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  font-weight:600;margin:18px 0 8px}
.tgh:first-child{margin-top:4px}
/* 주간 — 월간과 같은 "사람마다 카드" 구조. 다만 칸이 7개뿐이라 색만 칠하지 않고
   무엇을 했는지(장면·기사·어휘 세 갈래)까지 칸 안에 담는다. 그게 주간의 값이다.
   칸은 1fr — 한 줄이라 넓어져도 덩어리가 되지 않는다 (월간이 30px 고정인 이유와 반대). */
.tgwk{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:10px 12px 12px}
.tgwk+.tgwk{margin-top:7px}
.tgwk.me{background:var(--eng-bg);border-color:var(--eng-bd)}
.tgwkh{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.tgwkh .nm{font-size:12.5px;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgwkh .cnt{margin-left:auto;font-size:10.5px;color:var(--dim);font-family:var(--num);flex:none}
.tgwkh .cnt b{color:var(--ok);font-size:12px}
.tgwg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;
  max-width:378px;margin:0 auto}   /* 520px 에서 1fr 로 두면 칸이 62px 로 퍼져 납작해진다 */
.tgwg>div{min-width:0;display:grid;gap:4px;justify-items:center}
.tgwg .dw{font-size:9px;color:var(--dim);font-family:var(--num);line-height:1}
.tgwg .dw.we{color:var(--warn);opacity:.75}   /* 주말은 몰아서 할 수 있는 날 */
.tgwg .cell{width:100%;min-height:40px;border-radius:8px;background:var(--card2);
  border:1px solid transparent;padding:6px 0;display:grid;gap:5px;
  justify-items:center;align-content:center}
.tgwg .cell .dd{font-size:11.5px;font-family:var(--num);color:var(--sub);line-height:1}
.tgwg .cell .seg{display:flex;gap:2px;height:3px}
.tgwg .cell .seg u{width:4px;border-radius:2px;background:var(--border-hl);display:block}
.tgwg .cell .seg u.on{background:var(--ok)}
.tgwg .cell .seg u.hf{background:var(--ok);opacity:.45}
.tgwg .cell.part{background:var(--ok-bg);border-color:var(--ok-bd)}
.tgwg .cell.part .dd{color:var(--ok)}
.tgwg .cell.full{background:var(--ok);border-color:var(--ok)}
.tgwg .cell.full .dd{color:#06231a;font-weight:700}
.tgwg .cell.full .seg u{background:rgba(6,35,26,.3)}
.tgwg .cell.full .seg u.on{background:#06231a}
.tgwg .cell.fut{background:none;border-color:var(--border)}
.tgwg .cell.fut .dd{color:#2b2e39}
.tgwg .cell.fut .seg{visibility:hidden}
.tgwg .cell.now{box-shadow:0 0 0 2px var(--warn)}

/* 주/월 토글 머리 */
.tghead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
.tghead .tgh{margin:0}

/* 월간 — 사람마다 달력 하나. 한 칸에 둘을 겹치면 누구 것인지 안 읽힌다. */
.tgnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.tgmlabel{font-size:12px;color:var(--sub);font-family:var(--num);font-weight:600;
  min-width:150px;text-align:center}
.tgarrow{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--sub);font-size:17px;line-height:1;cursor:pointer;flex:none}
.tgarrow:hover:not(:disabled){border-color:var(--eng);color:var(--eng)}
.tgarrow:disabled{opacity:.3;cursor:default}
.tgcal{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:10px 12px 12px}
.tgcal+.tgcal{margin-top:7px}
.tgcal.me{background:var(--eng-bg);border-color:var(--eng-bd)}
.tgcalh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tgcalh .nm{font-size:12.5px;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgcalh .cnt{margin-left:auto;font-size:10.5px;color:var(--dim);font-family:var(--num);flex:none}
.tgcalh .cnt b{color:var(--ok);font-size:12px}
.tgdow,.tggrid{display:grid;grid-template-columns:repeat(7,30px);gap:5px;justify-content:center}
.tgdow span{font-size:9px;color:var(--dim);text-align:center;font-family:var(--num);padding-bottom:3px}
/* 칸을 1fr 로 두면 폭에 맞춰 44px 까지 늘어나 한 달이 화면을 통째로 먹는다. 고정 30px. */
.tggrid i{width:30px;height:30px;border-radius:7px;background:var(--card2);
  border:1px solid transparent;display:grid;place-items:center;
  font-style:normal;font-size:10px;font-family:var(--num);color:var(--dim);line-height:1}
.tggrid i.part{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.tggrid i.full{background:var(--ok);border-color:var(--ok);color:#06231a;font-weight:700}
.tggrid i.fut{background:none;border-color:var(--border);color:#2b2e39}
.tggrid i.pad{background:none;border:0}
.tggrid i.now{box-shadow:0 0 0 2px var(--warn)}

.tgtot{display:flex;flex-direction:column;gap:7px}
.tgcard{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:11px 13px}
.tgcard.me{background:var(--eng-bg);border-color:var(--eng-bd)}
.tgname{font-size:13px;font-weight:650;margin-bottom:6px}
.tgname{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.tgname em{font-style:normal;font-size:10.5px;color:var(--dim);font-weight:500}
.tgfire{margin-left:auto;font-size:11px;color:var(--warn);font-weight:600;flex:none}
.tgfig{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11.5px;color:var(--dim)}
.tgfig b{font-family:var(--num);font-size:14px;color:var(--text);font-weight:700;
  font-variant-numeric:tabular-nums;margin-right:3px}
/* 독백 — 분량과 구조를 버티는 화면이라, 읽을 것을 최소로 두고 타이머를 크게 둔다 */
.spq{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.spkind{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:2px 9px;margin-bottom:8px}
.spen{font-size:17px;line-height:1.5;font-weight:600;margin:0}
.sphint{font-size:12.5px;color:var(--sub);line-height:1.6;margin:8px 0 0}
.sptimer{text-align:center;margin:18px 0 12px}
.sptime{font-family:var(--num);font-size:40px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--text);transition:color .2s}
.sptime.hit{color:var(--ok)}
.sptrack{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin:10px auto 6px;max-width:300px}
.sptrack i{display:block;height:100%;background:var(--sub);border-radius:99px;transition:width .25s linear}
.sptrack i.hit{background:var(--ok)}
.sptarget{font-family:var(--num);font-size:10.5px;color:var(--dim)}
.spmodel{background:var(--card);border-left:3px solid var(--ok);border-radius:0 10px 10px 0;
  padding:13px 16px;margin-top:14px}
.spmodel p{font-size:15px;line-height:1.65;margin:0}
.spmodel p+p{margin-top:11px}
.spnote{font-size:12px;color:var(--sub);line-height:1.6;margin-top:10px;padding:10px 13px;
  background:var(--card2);border-radius:10px}
.spnote .l{display:block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);font-weight:700;margin-bottom:3px}
.spph{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sprow{display:flex;gap:12px;align-items:baseline;padding:8px 13px;font-size:12.5px}
.sprow+.sprow{border-top:1px solid var(--border)}
.sprow b{flex:0 0 auto;max-width:55%;color:var(--text);font-weight:650}
.sprow span{color:var(--dim);min-width:0;flex:1 1 auto}
/* 장면 전 어휘 훑기 — 읽고 넘어가는 자리라 카드보다 목록에 가깝게 */
.prelist{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.prow2{padding:11px 14px;cursor:pointer;transition:background .12s}
.prow2+.prow2{border-top:1px solid var(--border)}
.prow2:active,.prow2.on{background:var(--eng-bg)}
.prow2 .pt{font-size:15px;font-weight:650;line-height:1.4}
.prow2 .pk2{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.5}
.prow2 .pex{font-size:12px;color:var(--dim);margin-top:4px;font-style:italic}
/* 구(phrase) 안의 모르는 단어를 따로 짚는다. 구의 뜻만 알면 그 구에서만 쓸 수 있다. */
.prow2 .pkw{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;padding-top:6px;
  border-top:1px dashed var(--border)}
.prow2 .pkw span{font-size:11.5px;color:var(--dim)}
.prow2 .pkw b{color:var(--ok);font-weight:650;margin-right:3px}
.btn.sm.on{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--card-el);border:1px solid var(--border-hl);border-radius:99px;
  padding:9px 16px;font-size:12.5px;color:var(--text);z-index:50;display:none;white-space:nowrap;
}
.toast.has-act{align-items:center;gap:12px;padding-right:8px}
.toast-act{
  background:none;border:none;color:var(--accent);font:inherit;font-weight:700;
  padding:4px 8px;margin:0;border-radius:99px;cursor:pointer;
}
.toast-act:active{background:var(--card-el)}

/* --- home --- */

.stat .n{font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .n small{font-size:12px;font-weight:600;color:var(--dim)}

.stat.due .n{color:var(--eng)}

.lvlchip.done{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}

.tchip{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:99px;border:1px solid var(--border);background:none;color:var(--dim);white-space:nowrap;transition:color .15s,border-color .15s}
.tchip.on{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}

/* --- review --- */

.tfilter .tchip.on{color:var(--eng);border-color:var(--eng-bd);background:var(--eng-bg)}

.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.grade{padding:12px 4px;border-radius:11px;font-size:13px;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--text)}
.grade small{display:block;font-size:10px;font-weight:600;color:var(--dim);margin-top:2px}
.grade.miss{border-color:rgba(239,94,94,.3);color:var(--danger)}
.grade.soso{border-color:rgba(240,169,68,.3);color:var(--warn)}
.grade.good{border-color:var(--ok-bd);color:var(--ok)}
.grade:active{background:var(--card-el)}
.donebox{text-align:center;padding:50px 20px}
.donebox .big{font-size:40px}
.donebox h3{font-size:17px;font-weight:800;margin:12px 0 6px}
.donebox p{font-size:13px;color:var(--sub);line-height:1.6}
.donebox button{margin-top:18px;padding:11px 22px;border-radius:11px;border:1px solid var(--eng-bd);background:var(--eng-bg);color:var(--eng);font-size:13px;font-weight:700}

/* --- listen --- */

.rate button.on{background:var(--eng-bg);color:var(--eng)}

/* --- speak / journal --- */

.check{margin-top:14px;width:100%;padding:12px;border-radius:11px;font-size:14px;font-weight:700;background:var(--eng);border:none;color:#fff}

.result.show{display:block}
.result.good{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok)}

/* --- inbox --- */

.initem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.initem .itx{flex:1;min-width:0}
.initem .ie{font-size:13.5px;font-weight:600;line-height:1.4;overflow-wrap:break-word}
.initem .isrc{font-size:11px;color:var(--dim);margin-top:1px}
.ipill{font-size:10px;font-weight:700;padding:4px 8px;border-radius:99px;flex:none}
.ipill.wait{color:var(--warn);background:var(--warn-bg)}
.ipill.done{color:var(--ok);background:var(--ok-bg)}
.buildline{margin:18px 0 2px;text-align:center;font-size:10.5px;color:var(--dim);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.buildline b{font-weight:600;color:var(--sub)}
.buildline .stale{color:var(--warn)}
.initem .indel{flex:none;width:28px;height:28px;border:0;border-radius:8px;background:var(--card-el);color:var(--dim);font-size:13px;cursor:pointer}
.initem .indel:hover:not(:disabled){color:var(--danger);background:var(--danger-bg)}
.initem .indel:disabled{opacity:.4}

/* ═══ 오늘 판 (개편) ═══ */
/* 앱에 없던 범용 버튼·상황줄. hd-btn 의 톤을 따른다 */
.btn{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--border-hl)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:11.5px;padding:6px 10px}
.btn.primary-btn{width:auto;background:var(--eng);border-color:var(--eng);color:#fff}
.sit{background:var(--eng-bg);border:1px solid var(--eng-bd);border-radius:9px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.sit b{color:var(--eng)}
.xpbar{
  border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:10px;
  background:linear-gradient(160deg,var(--card2),var(--card));
}
.xpbar .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.xpbar .rk{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:baseline;gap:7px}
.xpbar .rk em{
  font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--eng);background:var(--eng-bg);border:1px solid var(--eng-bd);border-radius:99px;padding:2px 8px;
}
.xpbar .n{font-family:var(--num);font-size:11.5px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums}
.xpbar .xtrack{height:7px;border-radius:99px;background:var(--card-el);margin-top:11px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.xpbar .xtrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--eng),var(--ok));transition:width .35s ease}
/* 얻은 XP 가 없는 날은 줄 자체를 없앤다 — min-height 로 자리를 비워두니 카드에 빈 구멍이 났다 */
.xpbar .gain{font-size:11.5px;color:var(--ok);font-weight:600}
.xpbar .gain:not(:empty){margin-top:9px}
.board{display:flex;flex-direction:column;gap:7px}
.bcard{
  position:relative;overflow:hidden;border:1px solid var(--border);border-radius:12px;

  display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;
  column-gap:9px;row-gap:7px;align-items:center;
  transition:border-color .15s,transform .1s;
}
.bcard:active:not(:disabled){transform:scale(.99)}
.bcard:disabled{opacity:.45;cursor:not-allowed}
/* 잠긴 퀴즈는 "고장"이 아니라 "아직"이다 — 점선 테로 그걸 말한다.
   막대를 visibility:hidden 으로 감췄더니 grid-row 2 와 row-gap 이 그대로 남아
   그 칸만 아래가 10px 붕 떴다. 막대를 아예 건드리지 않는다 — 0% 홈이 그대로 보이면
   높이가 넷 다 정확히 같고, "아직 시작 안 함" 이라 사실과도 맞는다. */
.bcard.locked{border-style:dashed;opacity:.7}

/* 퀴즈 4지선다 */

.qopt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.qopt.no{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}

.bcard .chk{grid-column:1;grid-row:1}
.bcard .bs{grid-column:3;grid-row:1;justify-self:end;white-space:nowrap}
.bcard .bar{grid-column:1/-1;grid-row:2}
/* 빈 네모는 '안 누른 체크박스'로 읽혀 할 일이 아니라 양식처럼 보였다. 상태 고리로 바꾼다. */
.bcard .chk{
  flex:none;width:16px;height:16px;border-radius:99px;border:2px solid var(--dim);
  display:inline-grid;place-items:center;font-size:9px;color:transparent;transition:all .15s;
}
.bcard .bs{font-family:var(--num);font-size:11.5px;font-weight:500;color:var(--sub);line-height:1.4;font-variant-numeric:tabular-nums}

   앱이 기기 로컬 날짜를 쓰면 시차 지역에서 앱과 푸시가 하루 어긋난다 — 여행 토픽이 있는 앱이다. */
const KST = 9 * 3600e3;
const kstDate = t => new Date((t == null ? Date.now() : new Date(t).getTime()) + KST).toISOString().slice(0,10);
const today = () => kstDate();
/* action 을 주면 「되돌리기」 같은 버튼이 붙고 더 오래 머문다.
   되돌릴 수 있는 일은 묻지 말고 **실행하고 물릴 기회를 준다** — 확인 모달은 의도한 탭마다
   세금을 물리고, '다시 묻지 않기'를 켜는 순간 보호가 통째로 사라진다. */
function toast(msg, action){
  const t=$('toast'); t.textContent=msg; clearTimeout(toast._t);
  t.classList.toggle('has-act', !!action);
  if (action) {
    const b=document.createElement('button');
    b.className='toast-act'; b.textContent=action.label;
    b.onclick=()=>{ hideToast(); action.onClick(); };
    t.appendChild(b);
    t.style.display='flex';
  } else { t.style.display='block'; }
  toast._t=setTimeout(hideToast, action ? 6000 : 2200);
}
function hideToast(){ const t=$('toast'); clearTimeout(toast._t);
  t.style.display='none'; t.classList.remove('has-act'); }

function applyGrade(card, grade){
  if (grade === 'good'){
    card.streak++; card.ease = Math.min(2.8, Number(card.ease) + 0.05);
    card.interval_days = card.interval_days < 1 ? 2 : Math.round(card.interval_days * card.ease);
  } else if (grade === 'soso'){
    card.interval_days = Math.max(1, Math.ceil((card.interval_days || 1) * 1.2));
  } else {
    card.streak = 0; card.ease = Math.max(1.3, Number(card.ease) - 0.2);
    card.interval_days = 1;
  }
  card.interval_days = Math.min(card.interval_days, 365);
  card.next_review = kstDate(Date.now() + card.interval_days * 864e5);
  card.status = card.interval_days >= 21 ? 'mature' : 'learning';
}

async function saveGrade(card, grade, mode){
  const fields = { status:card.status, interval_days:card.interval_days, ease:card.ease,
                   streak:card.streak, next_review:card.next_review };
  const op = { card_id: card.id, fields, grade, mode, at: new Date().toISOString() };
  try {
    const [u, l] = await Promise.all([
      sb.from('eng_cards').update(fields).eq('id', card.id),
      sb.from('eng_review_log').insert({ user_id:currentUser.id, card_id:card.id, grade, mode })
    ]);
    if (u.error || l.error) throw (u.error || l.error);
  } catch (_) {
    // 오프라인(지하철) — 로컬에 쌓고 복귀하면 flush
    const pend = JSON.parse(localStorage.getItem(LS.pending) || '[]');
    pend.push(op);
    localStorage.setItem(LS.pending, JSON.stringify(pend));
  }
}

async function flushPending(){
  const pend = JSON.parse(localStorage.getItem(LS.pending) || '[]');
  if (!pend.length) return;
  const rest = [];
  for (const op of pend){
    try {
      // 🔴 .error 를 반드시 본다. supabase-js 는 PostgREST 오류를 throw 하지 않고
      // { error } 로 resolve 하므로, 안 보면 실패한 복습이 조용히 버려진다 (saveGrade 와 같은 규칙).
      const u = await sb.from('eng_cards').update(op.fields).eq('id', op.card_id);
      if (u.error) throw u.error;
      const l = await sb.from('eng_review_log').insert({ user_id:currentUser.id, card_id:op.card_id, grade:op.grade, mode:op.mode, reviewed_at:op.at });
      if (l.error) throw l.error;
    } catch(_) { rest.push(op); }
  }
  localStorage.setItem(LS.pending, JSON.stringify(rest));
  const synced = pend.length - rest.length;
  if (rest.length) toast(`Synced ${synced} · ${rest.length} failed — will retry later`);
  else if (synced)  toast(`Synced ${synced} offline reviews`);
}
window.addEventListener('online', flushPending);

// (기본은 미리 구운 네이티브 mp3 재생이라 이건 파일이 없을 때만 쓰인다)
function pickVoice(){
  const vs = ('speechSynthesis' in window ? speechSynthesis.getVoices() : []).filter(v=>v.lang.startsWith('en'));
  if (!vs.length) return null;
  return vs.find(v=>/premium/i.test(v.name))
    || vs.find(v=>/enhanced/i.test(v.name))
    || vs.find(v=>/siri/i.test(v.name))
    || vs.find(v=>/Samantha|Google US/i.test(v.name))
    || vs[0];
}

function speak(text, onend){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = tRate;
  const v = pickVoice(); if (v) u.voice = v;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}

/* 잠금화면·제어센터에 뭘 틀고 있는지 띄운다.
 *
 * iOS 는 **홈 화면 PWA 에서 백그라운드 오디오를 막아둔다** (WebKit 알려진 제약).
 * MediaSession 이 그걸 뚫어주지는 못하지만, 재생 중임을 시스템에 알려 잠금화면
 * 컨트롤이 생기고 중단 빈도가 줄어든다. Safari 탭에서는 백그라운드 재생이 되므로
 * 거기서는 확실히 이득이다. */
function setMedia(title, artist){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title, artist: artist || 'ktree English', album: 'ktree English',
    });
    navigator.mediaSession.playbackState = 'playing';
  } catch (_) {}
}
function clearMedia(){
  if (!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.playbackState = 'paused'; } catch (_) {}
}

function playCard(card, onend){
  if (!card?.id || noAudio.has(card.id)) return speak(card.answer_en, onend);
  if (cardAudio) cardAudio.pause();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const a = new Audio(`${SUPABASE_URL}/storage/v1/object/public/eng-audio/cards/${card.id}.mp3`);
  cardAudio = a;
  a.playbackRate = tRate;
  if (onend) a.onended = onend;
  const fallback = () => { noAudio.add(card.id); speak(card.answer_en, onend); };
  a.onerror = fallback;
  a.play().catch(fallback);
}

function urlBase64ToUint8Array(s){
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const b64 = (s + pad).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from([...atob(b64)].map(c=>c.charCodeAt(0)));
}
async function subscribePush(interactive){
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || typeof Notification === 'undefined'){
    if (interactive) toast("Push isn't supported here (on iOS, add to Home Screen first)");
    return;
  }
  try {
    const reg = await navigator.serviceWorker.ready;
    const permission = await Notification.requestPermission();
    if (permission !== 'granted'){ if (interactive) toast('Notification permission denied'); return; }
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    const { endpoint, keys } = sub.toJSON();
    const row = { user_id: currentUser.id, endpoint, p256dh: keys.p256dh, auth: keys.auth };
    // push_subscriptions 는 챌린지와 공유 — member 가 있으면 붙인다
    const { data: member } = await sb.from('challenge_members').select('id').eq('user_id', currentUser.id).maybeSingle();
    if (member) row.member_id = member.id;
    const { error } = await sb.from('push_subscriptions').upsert(row, { onConflict:'user_id,endpoint' });
    if (error) throw error;
    // 버튼은 이제 설정 화면에 있다. 설정을 열어둔 채로 눌렀을 때만 존재한다.
    const pb = $('st-push');
    if (pb) { pb.textContent = '🔔 Morning push is on'; pb.classList.add('primary-btn'); }
    if (interactive) toast('Review push starts tomorrow morning');
  } catch (e) {
    console.warn('push subscribe failed', e);
    if (interactive) toast('Push registration failed — check the console');
  }
}

// 누르게 되고, 그러면 복습 간격이 가짜로 벌어져 SRS 전체가 무의미해진다.
const SCENE_N = 4;            // 하루 장면 개수

             article:8, recog:1, quizOk:5, quizMiss:2, complete:30, cap:250 };
const RANKS = [
  [0,'Starter'], [400,'Everyday'], [1000,'Conversational'], [1800,'Fluent-ish'],
  [2800,'Confident'], [4000,'Sharp'], [5400,'Native-ish'],
];
function rankOf(xp){
  let i = 0;
  for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k][0]) i = k;
  const next = RANKS[i+1] ? RANKS[i+1][0] : RANKS[i][0] + 1800;
  return { n:i+1, name:RANKS[i][1], from:RANKS[i][0], to:next };
}

/* 프레임마다 현재 이벤트를 찾는다. timeupdate 는 초당 4회라 하이라이트가 뚝뚝 끊긴다. */
function tFollow(a, ev, paint){
  let last = -1;
  const step = () => {
    if (!a || a.paused) return;
    const ms = a.currentTime * 1000;
    let lo = 0, hi = ev.length - 1, hit = -1;
    while (lo <= hi) { const mid = (lo+hi)>>1; if (ms < ev[mid].t) hi = mid-1; else { hit = mid; lo = mid+1; } }
    if (hit !== last) { last = hit; paint(hit); }
    tRaf = requestAnimationFrame(step);
  };
  tRaf = requestAnimationFrame(step);
}

async function loadToday(){
  if (!currentUser) return;
  const d = today();
  try {
    // 🔴 장면·기사에도 토픽 필터를 건다. 어휘에만 걸려 있어서, 마케팅을 꺼도
    // 마케팅 장면이 그대로 나왔고 거기서 뽑힌 어휘가 다시 큐로 들어왔다 —
    // 같이 쓰는 사람의 도메인 용어를 영어로 외우게 되는 상태였다.
    const tn = activeTopicNames();
    const scQ = sb.from('eng_scenes').select('*').eq('status','ready');
    const arQ = sb.from('eng_articles').select('*');
    const [sc, ar, se, pr, past] = await Promise.all([
      (tn.length ? scQ.in('topic', tn) : scQ).order('created_at',{ascending:false}).limit(30),
      (tn.length ? arQ.in('topic', tn) : arQ).order('created_at',{ascending:false}).limit(10),
      // 🔴 user_id 를 **명시한다.** 진도 공유로 읽기가 열려 있어, RLS 에 기대면
      // maybeSingle() 이 두 사람 행을 만나 터지거나 남의 진도를 내 것으로 표시한다.
      sb.from('eng_sessions').select('*').eq('user_id', currentUser.id).eq('session_date', d).maybeSingle(),
      sb.from('eng_progress').select('*').eq('user_id', currentUser.id).maybeSingle(),
      // 🔴 지난 날 무엇을 했는지. 이게 없으면 "오늘 판"이 날짜에 묶이지 않고 그냥
      // 최신 5개라, 자정이 지나면 진도만 0 이 되고 **같은 장면을 또 한다.**
      sb.from('eng_sessions').select('session_date, scene_ids, article_id')
        .eq('user_id', currentUser.id).lt('session_date', d)
        .order('session_date',{ascending:false}).limit(60),
    ]);
    // 테이블이 아직 없으면 화면이 그 사실을 말해야 한다 — 조용히 비면 버그로 보인다
    const missing = [sc,ar,se,pr].some(r => r.error && /schema cache|does not exist/i.test(r.error.message));
    if (missing) { tMissing = true; tLoaded = true; return; }
    // 오늘 판이 이미 정해져 있으면 그걸 쓴다 (하루 안에서는 내용이 안 바뀌어야 한다).
    // 없으면 **지난 날 했던 것을 빼고** 새로 고른다.
    const allSc = sc.data || [], allAr = ar.data || [];
    const pinned = se.data?.scene_ids || [];
    if (pinned.length) {
      tScenes = pinned.map(id => allSc.find(x => x.id === id)).filter(Boolean);
    } else {
      const usedSc = new Set((past.data || []).flatMap(r => r.scene_ids || []));
      const fresh = allSc.filter(x => !usedSc.has(x.id));
      // 다 소진했으면 최신 것으로라도 채운다 — 빈 날을 만들지 않는다
      tScenes = (fresh.length ? fresh : allSc).slice(0, SCENE_N);
    }
    const pinnedAr = se.data?.article_id;
    if (pinnedAr) tArticle = allAr.find(x => x.id === pinnedAr) || null;
    else {
      const usedAr = new Set((past.data || []).map(r => r.article_id).filter(Boolean));
      tArticle = allAr.find(x => !usedAr.has(x.id)) || allAr[0] || null;
    }
    tSession = se.data || null;
    tProg = pr.data || { xp_total:0, xp_today:0, xp_date:d, listened_ms:0, turns_spoken:0, articles_read:0 };
    if (tProg.xp_date !== d) { tProg.xp_today = 0; tProg.xp_date = d; }   // 날짜가 바뀌면 상한 리셋
    await materializeVocab();
    await loadTodayVocab();
  } catch (_) { tMissing = true; }
  tLoaded = true;
}

const VOCAB_NEW = 12, VOCAB_DUE = 8;   // 마무리는 2분짜리다. 더 넣으면 통째로 건너뛰게 된다.

/** 공유 장면·기사에 실린 어휘를 **내 계정의 카드로** 만들어낸다.
 *
 * 장면·기사는 둘이 같이 읽지만 SRS 상태는 사람마다 달라야 한다. 그래서 생성기는 어휘를
 * 행에 싣기만 하고, 카드는 각자의 앱이 여기서 만든다 — 그래야 같은 어휘를 각자의 진도로 간다.
 *
 * 🔴 ignoreDuplicates 가 핵심이다. 그냥 upsert 하면 **이미 복습 중인 카드의 SRS 상태가
 * 매번 초기값으로 덮인다.** 간격도 연속도 다 날아간다. */
async function materializeVocab(){
  const src = [
    ...tScenes.map(x => ({ ref:x.scene_id, topic:x.topic, scen:'scene',    kind:'scene',   v:x.vocab||[] })),
    ...(tArticle ? [{ ref:tArticle.article_id, topic:tArticle.topic, scen:'briefing', kind:'article', v:tArticle.vocab||[] }] : []),
  ];
  const rows = [];
  for (const g of src) for (const v of g.v) {
    if (!v.term) continue;
    const word = v.kind === 'word';
    const prompt = word ? v.meaning_ko : v.prompt_ko;
    if (!prompt) continue;
    rows.push({
      user_id: currentUser.id, kind: word ? 'word' : 'phrase',
      topic: g.topic || '일상', scenario: g.scen, level: v.level || 2,
      // 칸의 역할이 층마다 바뀐다 — word 는 뜻이 정답, phrase 는 상황이 문제다
      prompt_ko: prompt, answer_en: v.term,
      note: word ? (v.example || '') : (v.meaning_ko || ''),
      source: g.kind, source_ref: g.ref,
      // 컬럼 기본값이 current_date(**UTC**)라 KST 00~09 시에 앱을 열면 어제 날짜가 박힌다.
      // 아침 푸시가 07:30 KST 니 정확히 그 창에서 열게 된다 — 명시적으로 KST 를 넣는다.
      next_review: today(),
    });
  }
  if (!rows.length) return;
  try {
    await sb.from('eng_cards').upsert(rows,
      { onConflict:'user_id,prompt_ko,answer_en', ignoreDuplicates:true });
  } catch (_) { /* 실패해도 화면은 돈다 — 다음 로드에서 다시 시도한다 */ }
}

/* 오픽 문항은 유형이 정해져 있다. 같은 유형만 돌면 익숙한 것만 늘고 시험에서 막힌다.
   **안 해본 유형을 먼저**, 그 안에서 오래된 것부터 고른다. */
async function loadPrompts(){
  tPrompts = [];
  const [pool, log] = await Promise.all([
    sb.from('eng_prompts').select('*'),
    sb.from('eng_prompt_log').select('prompt_id, done_on, self_grade')
      .eq('user_id', currentUser.id).order('done_on', { ascending:false }).limit(400),
  ]);
  if (pool.error || !pool.data?.length) return;        // v6 미실행이면 조용히 비운다
  const names = activeTopicNames();
  const all = names.length ? pool.data.filter(p => names.includes(p.topic)) : pool.data;
  if (!all.length) return;

  const lastOf = {}, gradeOf = {};
  for (const r of (log.data || [])) {
    if (!lastOf[r.prompt_id]) { lastOf[r.prompt_id] = r.done_on; gradeOf[r.prompt_id] = r.self_grade; }
  }
  const kindSeen = {};
  for (const p of all) if (lastOf[p.id]) kindSeen[p.kind] = Math.max(kindSeen[p.kind] || 0, 1);

  const score = p => {
    if (!lastOf[p.id]) return 0;                        // 아직 안 해본 것이 1순위
    if (gradeOf[p.id] === 'again') return 1;             // 다시 해야 한다고 스스로 찍은 것
    return 2;
  };
  const sorted = all.slice().sort((a,b) =>
    score(a) - score(b) || (lastOf[a.id] || '').localeCompare(lastOf[b.id] || ''));

  // 유형이 겹치지 않게 두 개
  const pick = [];
  for (const p of sorted) {
    if (pick.length >= SPEAK_N) break;
    if (pick.some(x => x.kind === p.kind)) continue;
    pick.push(p);
  }
  for (const p of sorted) { if (pick.length >= SPEAK_N) break; if (!pick.includes(p)) pick.push(p); }
  tPrompts = pick;
}

async function loadTodayVocab(){
  const d = today();
  // **"오늘 것"은 날짜가 아니라 '아직 안 만난 것'이다.**
  // 날짜로만 뽑으면 상한에 밀린 신규가 영원히 갇힌다 — status='new' 라서
  // '지난 것'(neq status new) 질의에도 안 걸리기 때문이다.
  // 실제로 오늘 90장이 만들어져 20장에서 잘렸고 70장이 고아가 될 뻔했다.
  const { data: fresh } = await sb.from('eng_cards').select('*')
    .eq('user_id', currentUser.id)
    .eq('status','new').neq('status','suspended')
    .gte('created_at', d + 'T00:00:00').limit(VOCAB_NEW);
  let mine = fresh || [];
  if (mine.length < VOCAB_NEW) {
    // 모자라면 **오래된 미학습 카드부터** 채운다 (pack 으로 올린 것도 여기서 소화된다)
    const { data: backlog } = await sb.from('eng_cards').select('*')
      .eq('user_id', currentUser.id)
      .eq('status','new').neq('status','suspended')
      .lt('created_at', d + 'T00:00:00')
      .order('created_at').limit(VOCAB_NEW - mine.length);
    mine = [...mine, ...(backlog || [])];
  }
  const { data: due } = await sb.from('eng_cards').select('*')
    .eq('user_id', currentUser.id)
    .neq('status','new').neq('status','suspended').lte('next_review', d)
    .order('next_review').limit(VOCAB_DUE);
  tVocab = { today: mine, past: due || [] };
}

async function bumpXp(n, why){
  if (!tProg) return;
  const room = Math.max(0, XP.cap - tProg.xp_today);
  const add = Math.min(n, room);
  if (!add) { tGain = -1; paintXp(why + ' (daily cap)'); return; }
  tProg.xp_total += add; tProg.xp_today += add; tGain += add;
  paintXp(why);
  try {
    await sb.from('eng_progress').upsert({
      user_id: currentUser.id, xp_total: tProg.xp_total, xp_today: tProg.xp_today,
      xp_date: tProg.xp_date, listened_ms: tProg.listened_ms, turns_spoken: tProg.turns_spoken,
      articles_read: tProg.articles_read, updated_at: new Date().toISOString(),
    }, { onConflict:'user_id' });
  } catch(_) { /* 오프라인이면 화면만 올라간다 — 다음 로드에서 맞춰진다 */ }
}

async function saveProgress(patch){
  const p = Object.assign({}, tSession?.progress || {}, patch);
  // 🔴 오늘 고른 것을 **실제로 박아둔다.** 전에는 tSession 에 없으면 빈 배열을 저장해
  // scene_ids 가 영영 null 이었고, 그래서 "오늘 판"이 날짜에 묶이지 않았다 —
  // 자정이 지나면 진도만 0 이 되고 같은 장면을 또 했다.
  const row = { user_id: currentUser.id, session_date: today(), progress: p,
                scene_ids: (tSession?.scene_ids?.length ? tSession.scene_ids : tScenes.map(x => x.id)),
                vocab_ids: (tSession?.vocab_ids?.length ? tSession.vocab_ids
                            : [...tVocab.today, ...tVocab.past].map(x => x.id)),
                xp_earned: (tSession?.xp_earned || 0) + tGain };
  if (tArticle) row.article_id = tArticle.id;
  try {
    const { data } = await sb.from('eng_sessions').upsert(row, { onConflict:'user_id,session_date' }).select().maybeSingle();
    if (data) tSession = data; else tSession = Object.assign({}, tSession, row);
  } catch(_) { tSession = Object.assign({}, tSession, row); }
}

function paintXp(why){
  const el = $('t-gain'); if (!el) return;
  el.textContent = tGain > 0 ? `+${tGain} XP today${why ? ' · ' + why : ''}` : (why || '');
  const r = rankOf(tProg?.xp_total || 0);
  const pct = Math.min(100, ((tProg?.xp_total || 0) - r.from) / (r.to - r.from) * 100);
  const b = $('t-track'); if (b) b.style.width = Math.max(pct, 2) + '%';
  const t = $('t-rank'); if (t) t.innerHTML = `Lv ${r.n} <em>${esc(r.name)}</em>`;
  const n = $('t-xpnum'); if (n) n.textContent = `${tProg?.xp_total || 0} / ${r.to} XP`;
}

function actBar(title){
  return `<div class="actbar"><button class="btn sm back" id="t-back">‹ Today</button>
    <b style="font-size:14px">${esc(title)}</b>
    <div class="rate2" id="t-rate"><button data-r="0.75">0.75×</button><button data-r="1" aria-pressed="true">1×</button><button data-r="1.25">1.25×</button></div></div>`;
}
function wireBar(){
  $('t-back').onclick = () => { tStopAudio(); renderToday(); };
  $('t-rate').onclick = e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    tRate = +b.dataset.r;
    document.querySelectorAll('#t-rate button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.r === tRate)));
    if (tAudio) tAudio.playbackRate = tRate;
  };
  document.querySelectorAll('#t-rate button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.r === tRate)));
}
function openAct(a){
  $('t-board').textContent = '';
  const el = $('t-act'); el.hidden = false;
  if (a === 'scene') actScene(el);
  else if (a === 'speak') actSpeak(el);
  else if (a === 'article') actArticle(el);
  else if (a === 'quiz') actQuiz(el);
  else actVocab(el);
}

/* ── 막 1 · 상황 대화 ───────────────────────────────── */

let scIdx = 0, scMode = 'listen';
let scPhase = 'pre';      // 'pre' = 어휘 먼저, 'dialog' = 대화
let scLoop = false;       // 장면 반복 재생

function actScene(el){
  const done = tSession?.progress?.scenes?.done || 0;
  scIdx = Math.min(done, tScenes.length - 1);
  scPhase = 'pre';
  drawScene(el);
}

/* 🔴 어휘를 **대화 앞에** 둔다.
 * 전에는 장면 → 기사 → 어휘 순이라, 모르는 표현을 모른 채로 대화를 다 지나간 뒤에야
 * 어휘를 만났다. 들어도 안 들리고, 뒤늦게 외워도 그 대화는 이미 끝나 있었다.
 * 먼저 2~5개를 훑고 들어가면 같은 오디오가 "들리는" 경험이 된다. */
function drawPre(el, sc){
  const own = (sc.vocab || []).filter(x => x.term);
  // 🔴 장면의 vocab 은 표현에 심하게 쏠려 있다(실측 표현 228 · 단어 49).
  // 그러면 훑기 화면에 **구만 나오고 단어는 안 나온다** — "영단어도 알려주고 가야지"가
  // 그 얘기다. 오늘 큐의 단어 카드를 앞에 붙여, 단어를 먼저 보고 구로 넘어가게 한다.
  const haveTerm = new Set(own.map(x => x.term));
  const words = [...tVocab.today, ...tVocab.past]
    .filter(c => (c.kind || 'phrase') === 'word' && !haveTerm.has(c.answer_en))
    .slice(0, 5)
    .map(c => ({ kind:'word', term:c.answer_en, meaning_ko:c.prompt_ko, example:c.note || '' }));
  const v = [...words, ...own];
  if (!v.length) { scPhase = 'dialog'; drawScene(el); return; }
  el.innerHTML = actBar(`Scene ${scIdx+1}/${tScenes.length} · warm-up`) + `
    <div class="sit" style="background:var(--eng-bg);border-radius:9px;padding:10px 13px;font-size:13px;margin-bottom:12px">
      <b style="color:var(--eng)">Context</b> · ${esc(sc.situation_ko)}</div>
    <p class="leg" style="margin:0 0 10px">Words first, then the phrases you'll hear. Tap one to listen.</p>
    <div class="prelist">
      ${v.map((x,i) => `<div class="prow2" data-i="${i}">
        <div class="pt">${esc(x.term)}${x.kind === 'word' ? '<em class="kdot">Word</em>' : ''}</div>
        <div class="pk2">${esc(x.kind === 'word' ? (x.meaning_ko || '') : (x.meaning_ko || x.prompt_ko || ''))}</div>
        ${x.example ? `<div class="pex">${esc(x.example)}</div>` : ''}
        ${(x.keywords || []).length ? `<div class="pkw">${(x.keywords||[]).map(k =>
          `<span><b>${esc(k.word)}</b> ${esc(k.meaning_ko)}</span>`).join('')}</div>` : ''}
      </div>`).join('')}
    </div>
    <div class="actbar" style="margin-top:14px">
      <button class="btn sm primary-btn" id="pre-go" style="padding:9px 16px">Got it — start the scene →</button>
    </div>`;
  wireBar();
  // 탭하면 읽어준다. 🔴 기기 TTS 를 직접 부르지 않는다 — 다른 화면은 Edge 뉴럴
  // 음성을 쓰는데 여기만 로봇 소리가 나서 티가 난다.
  // 🔴 오늘 큐(tVocab)에서만 찾으면 안 된다 — 장면 어휘가 전부 큐에 드는 게 아니라
  //    (실측 25개 중 5개가 밖) 그 몇 개만 로봇으로 떨어진다. DB 에서 한 번에 찾아둔다.
  const idOf = new Map([...tVocab.today, ...tVocab.past].map(c => [c.answer_en, c]));
  const missing = v.map(x => x.term).filter(t => !idOf.has(t));
  if (missing.length) {
    sb.from('eng_cards').select('id, answer_en, kind, prompt_ko, note')
      .eq('user_id', currentUser.id).in('answer_en', missing)
      .then(({ data }) => (data || []).forEach(c => idOf.set(c.answer_en, c)));
  }
  el.querySelectorAll('.prow2').forEach(r => r.onclick = () => {
    const term = v[+r.dataset.i]?.term; if (!term) return;
    const c = idOf.get(term);
    if (c) playCard(c); else speak(term);
    r.classList.add('on'); setTimeout(() => r.classList.remove('on'), 700);
  });
  $('pre-go').onclick = () => { scPhase = 'dialog'; drawScene(el); };
}

function drawScene(el){
  const sc = tScenes[scIdx];
  if (!sc) { renderToday(); return; }
  if (scPhase === 'pre') { drawPre(el, sc); return; }
  const turns = sc.turns || [];
  el.innerHTML = actBar(`Scene ${scIdx+1}/${tScenes.length}`) + `
    <div class="sit" style="background:var(--eng-bg);border-radius:9px;padding:10px 13px;font-size:13px;margin-bottom:12px">
      <b style="color:var(--eng)">Context</b> · ${esc(sc.situation_ko)}</div>
    <div class="actbar">
      <button class="btn sm" id="sc-listen">▶ Play all</button>
      <button class="btn sm" id="sc-fill">Fill my turns</button>
      <button class="btn sm" id="sc-stop">■ Stop</button>
      <button class="btn sm${scLoop ? ' on' : ''}" id="sc-loop" title="Play the scene over and over">🔁 Repeat</button>
      <button class="btn sm" id="sc-words">Words</button>
    </div>
    <div id="sc-turns"></div>
    <p class="leg"><span class="sw">Dotted</span> = swallowed under 150ms. Natives barely pronounce it.</p>
    <div class="actbar" style="margin-top:14px">
      <button class="btn sm primary-btn" id="sc-next" style="padding:8px 14px">${scIdx+1 < tScenes.length ? 'Next scene →' : 'Back to Today →'}</button>
    </div>`;
  wireBar();
  paintTurns(sc);
  // 기본은 1배. 자동으로 0.75× 로 내리면 원속에 귀가 안 익는다 — 실전 속도로
  // 알아듣는 게 목적이다. 느리게 듣고 싶으면 배율을 직접 누른다.
  // 🔴 전체 듣기는 **통짜 파일 한 개**로 돌린다. 백그라운드에서 끊기는 지점이
  // "다음 트랙 시작"이라, 트랙을 하나로 만들면 그 지점이 사라진다.
  // 역할 채우기는 내 턴에서 멈춰야 하므로 그대로 턴별 파일을 쓴다.
  $('sc-listen').onclick = () => {
    scMode='listen'; turns.forEach(t=>t.open=true); paintTurns(sc);
    if (sc.full_url) playFull(sc); else chainTurn(sc,0);
  };
  $('sc-fill').onclick   = () => { scMode='fill';   turns.forEach(t=>t.open=false); paintTurns(sc); chainTurn(sc,0); };
  $('sc-stop').onclick   = () => { scLoop = false; $('sc-loop')?.classList.remove('on'); tStopAudio(); };
  // 듣기는 반복이 전부다 — 한 번 듣고 넘어가면 귀에 안 남는다.
  $('sc-loop').onclick = function(){
    scLoop = !scLoop; this.classList.toggle('on', scLoop);
    if (scLoop) { scMode='listen'; turns.forEach(t=>t.open=true); paintTurns(sc); chainTurn(sc,0); }
  };
  // 대화 중에 모르는 표현이 나오면 되돌아갈 수 있어야 한다
  $('sc-words').onclick = () => { tStopAudio(); scPhase='pre'; drawScene(el); };
  $('sc-next').onclick = async () => {
    tStopAudio();
    const n = Math.max(tSession?.progress?.scenes?.done || 0, scIdx + 1);
    await saveProgress({ scenes: { done: n, total: tScenes.length } });
    if (n >= tScenes.length) { await maybeComplete(); renderToday(); }
    else { scIdx = Math.min(n, tScenes.length - 1); scPhase = 'pre'; drawScene(el); }
  };
}

function paintTurns(sc){
  const box = $('sc-turns'); box.textContent = '';
  (sc.turns || []).forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'dturn' + (t.is_me ? ' mine' : '');
    d.dataset.i = i;
    const hide = t.is_me && scMode === 'fill' && !t.open;
    // 역할 채우기로 가린 자리에는 뜻도 내주지 않는다 — 뜻이 보이면 답이 새어나간다.
    // 내 턴은 meaning_ko 가 없을 수 있으므로 intent_ko 로 대신한다 — 대화를 다
    // 이해하려면 **모든 줄**에 기댈 것이 있어야 한다. 모르는 줄이 하나라도 있으면
    // 거기서 흐름이 끊긴다.
    const mean = !hide && (t.meaning_ko || (t.is_me ? t.intent_ko : ''));
    d.innerHTML = `<span class="who">${esc(t.role_ko || t.who)}</span><span class="line">
      ${t.is_me && t.intent_ko ? `<span class="intent">↳ ${esc(t.intent_ko)}</span>` : ''}
      ${hide ? '<span class="hid">Your turn — tap to see the model line</span>' : segHtml(t.segs || [], t.ev || [])}
      ${mean ? `<button class="tchev${t.showMean ? ' open' : ''}" aria-label="Show meaning" aria-expanded="${!!t.showMean}">›</button>` : ''}
      ${mean && t.showMean ? `<span class="mean">${esc(mean)}</span>` : ''}</span>`;
    const mb = d.querySelector('.tchev');
    if (mb) mb.onclick = e => { e.stopPropagation(); t.showMean = !t.showMean; paintTurns(sc); };
    d.querySelector('.line').onclick = async () => {
      if (hide) {
        t.open = true; paintTurns(sc); playTurnA(sc, i);
        // 내 턴을 메운 것이 이 세션에서 가장 값나가는 행동이다
        tProg.turns_spoken = (tProg.turns_spoken || 0) + 1;
        await bumpXp(XP.turn, 'Dialogue turn');
        return;
      }
      playTurnA(sc, i);
    };
    box.appendChild(d);
  });
}

function playTurnA(sc, i, then){
  tStopAudio();
  const t = (sc.turns || [])[i];
  if (!t?.audio_url) { then && then(); return; }
  const el = document.querySelector(`.dturn[data-i="${i}"]`);
  el?.classList.add('on');
  el?.scrollIntoView({ block:'nearest', behavior:'smooth' });
  tAudio = new Audio(t.audio_url);
  tAudio.playbackRate = tRate;
  setMedia(sc.situation_ko || 'Scene', `Scene ${scIdx+1} · turn ${i+1}`);
  tFollow(tAudio, t.ev || [], hit => {
    el?.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on'));
    if (hit >= 0) el?.querySelector(`.kw[data-e="${hit}"]`)?.classList.add('on');
  });
  tAudio.onended = () => {
    cancelAnimationFrame(tRaf);
    el?.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on'));
    el?.classList.remove('on');
    tProg.listened_ms = (tProg.listened_ms || 0) + (t.ms || 0);
    then && then();
  };
  tAudio.play().catch(() => { then && then(); });
}

/* 통짜 파일 재생 — 턴 경계는 full_starts 로 짚어 하이라이트를 유지한다. */
function playFull(sc){
  tStopAudio();
  const turns = sc.turns || [], starts = sc.full_starts || [];
  const a = new Audio(sc.full_url);
  tAudio = a; a.playbackRate = tRate;
  setMedia(sc.situation_ko || 'Scene', `Scene ${scIdx+1} · ${turns.length} turns`);

  let cur = -1;
  const step = () => {
    if (!tAudio || tAudio !== a || a.paused) return;
    const ms = a.currentTime * 1000;
    // 지금 어느 턴인지
    let i = 0; for (let k = 0; k < starts.length; k++) if (ms >= starts[k]) i = k;
    if (i !== cur) {
      document.querySelectorAll('.dturn.on').forEach(x => x.classList.remove('on'));
      const el = document.querySelector(`.dturn[data-i="${i}"]`);
      el?.classList.add('on');
      el?.scrollIntoView({ block:'nearest', behavior:'smooth' });
      cur = i;
    }
    // 턴 안에서의 단어 하이라이트
    const el = document.querySelector(`.dturn[data-i="${i}"]`);
    const ev = turns[i]?.ev || [], rel = ms - (starts[i] || 0);
    let hit = -1; for (let k = 0; k < ev.length; k++) if (rel >= ev[k].t) hit = k;
    el?.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on'));
    if (hit >= 0) el?.querySelector(`.kw[data-e="${hit}"]`)?.classList.add('on');
    tRaf = requestAnimationFrame(step);
  };
  a.onended = () => {
    cancelAnimationFrame(tRaf);
    document.querySelectorAll('.dturn.on,.kw.on').forEach(x => x.classList.remove('on'));
    tProg.listened_ms = (tProg.listened_ms || 0) + (sc.ms || 0);
    if (scLoop) setTimeout(() => { if (scLoop) playFull(sc); }, 900);
  };
  a.play().then(() => { tRaf = requestAnimationFrame(step); })
          .catch(() => chainTurn(sc, 0));   // 통짜가 안 되면 기존 방식으로
}

function chainTurn(sc, i){
  const turns = sc.turns || [];
  if (i >= turns.length) {
    tStopAudio();
    if (scLoop) setTimeout(() => { if (scLoop) chainTurn(sc, 0); }, 900);   // 한 박자 쉬고 다시
    return;
  }
  const t = turns[i];
  if (scMode === 'fill' && t.is_me && !t.open) {        // 내 턴에서 멈춘다
    tStopAudio();
    const el = document.querySelector(`.dturn[data-i="${i}"]`);
    el?.classList.add('on'); el?.scrollIntoView({ block:'center', behavior:'smooth' });
    return;
  }
  playTurnA(sc, i, () => chainTurn(sc, i + 1));
}

/* ── 막 1.5 · 독백 (오픽) ───────────────────────────────
 *
 * 장면은 한 문장짜리 턴을 훈련한다. 오픽은 **혼자 60~90초**다.
 * 등급을 가르는 것은 text type — 문장 단위면 IM, 문단으로 조직하면 IH.
 * 그래서 이 화면의 목적은 "맞게 말하기"가 아니라 **분량과 구조를 버티는 것**이다.
 *
 * 녹음은 있으면 쓰고 없으면 넘어간다. iOS 홈 화면 PWA 에서 마이크가 열리는지는
 * 기기마다 다르고, 안 되더라도 타이머·모범답안만으로 훈련은 돌아가야 한다.
 */
const KIND_LABEL = { describe:'Describe', habit:'Routine', past:'Past experience',
                     compare:'Compare', ask:'Ask questions', solve:'Solve a problem' };
let spIdx = 0, spTimer = null, spStart = 0, spRec = null, spChunks = [], spUrl = null;

function spStop(){
  if (spTimer) { clearInterval(spTimer); spTimer = null; }
  try { if (spRec && spRec.state === 'recording') spRec.stop(); } catch(_) {}
}

function actSpeak(el){
  const done = tSession?.progress?.speak?.done || 0;
  spIdx = Math.min(done, Math.max(tPrompts.length - 1, 0));
  drawSpeak(el);
}

function drawSpeak(el){
  spStop();
  const p = tPrompts[spIdx];
  if (!p) { renderToday(); return; }
  const target = p.seconds || 75;

  el.innerHTML = actBar(`Speaking ${spIdx+1}/${tPrompts.length}`) + `
    <div class="spq">
      <span class="spkind">${esc(KIND_LABEL[p.kind] || p.kind)}</span>
      <p class="spen">${esc(p.question_en)}</p>
      ${p.hint_ko ? `<p class="sphint">${esc(p.hint_ko)}</p>` : ''}
    </div>
    <div class="sptimer">
      <div class="sptime" id="sp-time">0:00</div>
      <div class="sptrack"><i id="sp-bar" style="width:0%"></i></div>
      <div class="sptarget">target ${Math.floor(target/60)}:${String(target%60).padStart(2,'0')}</div>
    </div>
    <div class="actbar">
      <button class="btn sm primary-btn" id="sp-go">▶ Start speaking</button>
      <button class="btn sm" id="sp-end" disabled>■ Done</button>
    </div>
    <audio id="sp-play" controls hidden style="width:100%;margin-top:10px"></audio>
    <div id="sp-after" hidden>
      <button class="check" id="sp-reveal" style="margin-top:14px">Show a model answer</button>
      <div id="sp-model" hidden></div>
    </div>`;
  wireBar();

  const timeEl = $('sp-time'), barEl = $('sp-bar');
  const tick = () => {
    const sec = Math.floor((Date.now() - spStart) / 1000);
    timeEl.textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
    barEl.style.width = Math.min(sec / target * 100, 100) + '%';
    timeEl.classList.toggle('hit', sec >= target);
    barEl.classList.toggle('hit', sec >= target);
  };

  $('sp-go').onclick = async () => {
    spStart = Date.now(); spChunks = [];
    $('sp-go').disabled = true; $('sp-end').disabled = false;
    spTimer = setInterval(tick, 250); tick();
    // 녹음은 **덤**이다. 거부되거나 지원이 없으면 조용히 타이머만 돈다.
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      spRec = new MediaRecorder(stream);
      spRec.ondataavailable = e => e.data.size && spChunks.push(e.data);
      spRec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        if (!spChunks.length) return;
        if (spUrl) URL.revokeObjectURL(spUrl);
        spUrl = URL.createObjectURL(new Blob(spChunks, { type: spRec.mimeType || 'audio/webm' }));
        const a = $('sp-play'); if (a) { a.src = spUrl; a.hidden = false; }
      };
      spRec.start();
    } catch (_) { spRec = null; }
  };

  $('sp-end').onclick = async () => {
    const ms = Date.now() - spStart;
    spStop();
    $('sp-end').disabled = true;
    $('sp-after').hidden = false;
    tProg.turns_spoken = (tProg.turns_spoken || 0) + 1;
    await bumpXp(XP.speak, 'Monologue');
    try {
      await sb.from('eng_prompt_log').upsert({
        user_id: currentUser.id, prompt_id: p.id, done_on: today(), spoke_ms: ms,
      }, { onConflict:'user_id,prompt_id,done_on' });
    } catch(_) {}
    $('sp-reveal').onclick = function(){
      this.remove();
      const box = $('sp-model'); box.hidden = false;
      box.innerHTML = `
        <div class="spmodel">${esc(p.model_en).replace(/\n\n/g,'</p><p>').replace(/^/,'<p>')+'</p>'}</div>
        ${p.model_note_ko ? `<div class="spnote"><span class="l">why it\'s built this way</span>${esc(p.model_note_ko)}</div>` : ''}
        ${(p.phrases||[]).length ? `<div class="spph">${(p.phrases||[]).map(x =>
          `<div class="sprow"><b>${esc(x.term)}</b><span>${esc(x.meaning_ko)}</span></div>`).join('')}</div>` : ''}
        <div class="grades" style="margin-top:14px">
          <button class="grade miss" data-g="again">Again</button>
          <button class="grade soso" data-g="ok">OK</button>
          <button class="grade good" data-g="good">Good</button>
        </div>`;
      box.querySelector('.grades').onclick = async e => {
        const g = e.target.closest('.grade'); if (!g) return;
        try {
          await sb.from('eng_prompt_log').upsert({
            user_id: currentUser.id, prompt_id: p.id, done_on: today(),
            spoke_ms: ms, self_grade: g.dataset.g,
          }, { onConflict:'user_id,prompt_id,done_on' });
        } catch(_) {}
        const n = Math.max(tSession?.progress?.speak?.done || 0, spIdx + 1);
        await saveProgress({ speak: { done:n, total:tPrompts.length } });
        if (n >= tPrompts.length) { await maybeComplete(); renderToday(); }
        else { spIdx = n; drawSpeak(el); }
      };
    };
  };
}

/* ── 막 2 · 뉴스 읽기 ───────────────────────────────── */

function actArticle(el){
  const a = tArticle;
  if (!a) { renderToday(); return; }
  el.innerHTML = actBar('News') + `
    <div class="sit" style="background:var(--eng-bg);border-radius:9px;padding:10px 13px;font-size:13.5px;font-weight:600;margin-bottom:12px">${esc(a.title)}</div>
    <div class="actbar"><button class="btn sm" id="ar-play">▶ Play</button><button class="btn sm" id="ar-stop">■ Stop</button>
      <span class="vprog" id="ar-prog" style="margin:0 0 0 auto"></span></div>
    <div id="ar-sents">${(a.segs||[]).map((sg,i)=>`<div class="asbox" data-s="${i}">${segHtml(sg, a.ev||[])}</div>`).join('')}</div>
    <p class="leg"><span class="sw">Dotted</span> = swallowed · tap a sentence to replay from there.</p>
    ${(a.summary_ko||[]).length ? `<div class="vcard" style="margin-top:16px"><div class="vt" style="font-size:14px">Summary</div>
      <div class="vm">${a.summary_ko.map(x=>`• ${esc(x)}`).join('<br>')}</div></div>` : ''}`;
  wireBar();
  const boxes = [...el.querySelectorAll('.asbox')];
  let maxSent = tSession?.progress?.article?.sent || 0;
  const showProg = () => { $('ar-prog').textContent = `Sentence ${maxSent}/${boxes.length}`; };
  showProg();

  const run = fromMs => {
    tStopAudio();
    tAudio = new Audio(a.audio_url);
    tAudio.playbackRate = tRate;
    setMedia(a.title || 'News', 'ktree English · News');
    tAudio.currentTime = (fromMs || 0) / 1000;
    tFollow(tAudio, a.ev || [], hit => {
      el.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on'));
      boxes.forEach(b => b.classList.remove('on'));
      if (hit < 0) return;
      const span = el.querySelector(`.kw[data-e="${hit}"]`); if (!span) return;
      span.classList.add('on');
      const box = span.closest('.asbox');
      box?.classList.add('on'); box?.scrollIntoView({ block:'nearest' });
      const si = +(box?.dataset.s ?? -1);
      if (si + 1 > maxSent) { maxSent = si + 1; showProg(); }
    });
    tAudio.onended = async () => {
      tStopAudio();
      tProg.listened_ms = (tProg.listened_ms || 0) + (a.ms || 0);
      tProg.articles_read = (tProg.articles_read || 0) + 1;
      maxSent = boxes.length; showProg();
      await saveProgress({ article: { sent: maxSent, total: boxes.length } });
      await bumpXp(XP.article, 'Article finished');
      await maybeComplete();
    };
    tAudio.play().catch(()=>{});
  };
  $('ar-play').onclick = () => run(0);
  $('ar-stop').onclick = async () => { tStopAudio(); await saveProgress({ article:{ sent:maxSent, total:boxes.length } }); };
  boxes.forEach(b => b.onclick = () => run(a.starts?.[+b.dataset.s] ?? 0));
}

/* ── 막 3 · 어휘 마무리 ─────────────────────────────── */

function actVocab(el){
  // 오늘 것은 인지(채점 없음), 지난 것은 산출(SRS 채점). 방금 본 표현을 채점하면
  // 전부 "맞음"이 나와서 복습 간격이 가짜로 벌어진다.
  const list = [...tVocab.today.map(c=>({c,kind:'recog'})), ...tVocab.past.map(c=>({c,kind:'prod'}))];
  let i = tSession?.progress?.vocab?.done || 0;
  el.innerHTML = actBar('Vocab drill') + `<div class="vprog" id="v-prog"></div><div id="v-body"></div>`;
  wireBar();
  draw();

  function draw(){
    const prog = $('v-prog'), body = $('v-body');
    if (i >= list.length) {
      prog.textContent = '';
      body.innerHTML = `<div class="donebox"><div class="big">🎉</div><h3>Vocab drill done</h3>
        <p>${tVocab.today.length} from today · ${tVocab.past.length} from before.</p>
        <button onclick="renderToday()">Back to Today</button></div>`;
      return;
    }
    const { c, kind } = list[i];
    const isWord = c.kind === 'word';
    prog.textContent = `${i+1} / ${list.length} · ` + (kind === 'recog'
      ? `New ${isWord ? 'word' : 'phrase'} today (just check)`
      : isWord ? 'Earlier word — meaning?' : 'Earlier phrase — say it');
    if (kind === 'recog') {
      body.innerHTML = `<div class="vcard"><span class="klabel">${isWord ? 'Word' : 'Phrase'}</span>
        <div class="vt">${esc(c.answer_en)}</div>
        <div class="vm">${esc(isWord ? c.prompt_ko : (c.note || c.prompt_ko || ''))}</div>
        ${isWord && c.note ? `<div class="vex">${esc(c.note)}</div>` : ''}
        ${c.source_ref ? `<div class="vsrc">Source · ${esc(c.source_ref)}</div>` : ''}
        <div class="srow" style="margin-top:12px">
          <button class="check" id="v-ok" style="margin-top:0;flex:1 1 auto">Got it — next</button>
          <button class="btn sm" id="v-kill" title="Never show this again">✕</button></div></div>`;
      $('v-kill').onclick = async () => {
        // 어색한 카드는 알아챈 자리에서 바로 뺄 수 있어야 한다. 참고 넘기면 계속 돌아온다.
        // 되돌리기를 붙인 이유: 주 버튼 바로 옆이라 오탭이 잦은데, 한 번 죽이면 장부에서도
        // 걸러져 앱 어디에서도 다시 못 본다. status 플래그 하나라 복구는 공짜다.
        const prev = c.status || 'new', at = i;
        const { error } = await sb.from('eng_cards').update({ status:'suspended' }).eq('id', c.id);
        if (error) return toast('Failed — check your connection');
        const [removed] = list.splice(at, 1);
        await saveProgress({ vocab:{ done:i, total:list.length } }); draw();
        toast("You won't see this again", { label:'Undo', onClick: async () => {
          const { error } = await sb.from('eng_cards').update({ status:prev }).eq('id', c.id);
          if (error) return toast('Undo failed — check your connection');
          list.splice(at, 0, removed);
          await saveProgress({ vocab:{ done:i, total:list.length } }); draw();
          toast('Restored');
        }});
      };
      $('v-ok').onclick = async () => {
        playVocab(c);
        await bumpXp(XP.recog, 'Vocab check');
        i++; await saveProgress({ vocab:{ done:i, total:list.length } }); draw();
      };
    } else if (isWord) {
      // 단어는 **영어를 보고 뜻을 떠올리는** 시험이다. 상황을 주고 말하게 하면 층이 어긋난다.
      body.innerHTML = `<div class="vcard"><span class="klabel">Word</span>
        <div class="vm" style="margin:0 0 8px">What does this mean?</div>
        <div class="vt">${esc(c.answer_en)}</div>
        <button class="check" id="v-reveal" style="margin-top:12px">Show meaning</button>
        <div id="v-ans" hidden style="margin-top:12px">
          <div class="vt" style="font-size:16px">${esc(c.prompt_ko)}</div>
          ${c.note ? `<div class="vex">${esc(c.note)}</div>` : ''}
          <div class="grades" style="margin-top:12px">
            <button class="grade miss">Again</button><button class="grade soso">Hard</button><button class="grade good">Good</button>
          </div></div></div>`;
    } else {
      body.innerHTML = `<div class="vcard"><span class="klabel">Phrase</span>
        <div class="vm" style="margin:0 0 8px">Say this in English</div>
        <div class="vt" style="font-size:16px">${esc(c.prompt_ko)}</div>
        <button class="check" id="v-reveal" style="margin-top:12px">Show answer</button>
        <div id="v-ans" hidden style="margin-top:12px">
          <div class="vt">${esc(c.answer_en)}</div>
          ${c.note ? `<div class="vm">${esc(c.note)}</div>` : ''}
          <div class="grades" style="margin-top:12px">
            <button class="grade miss">Again</button><button class="grade soso">Hard</button><button class="grade good">Good</button>
          </div></div></div>`;
    }
    // 배선은 분기 밖에 둔다 — 단어·표현 두 갈래가 같은 reveal/채점을 쓴다.
    // 분기 안에 두면 새 갈래를 만들 때 조용히 빠진다 (실제로 단어 갈래가 그랬다).
    if ($('v-reveal')) {
      $('v-reveal').onclick = function(){ $('v-ans').hidden = false; this.remove(); playVocab(c); };
      body.querySelector('.grades').onclick = async e => {
        const g = e.target.closest('.grade'); if (!g) return;
        const grade = g.classList.contains('miss') ? 'miss' : g.classList.contains('soso') ? 'soso' : 'good';
        applyGrade(c, grade);
        await saveGrade(c, grade, 'vocab');
        if (!isWord) tProg.turns_spoken = (tProg.turns_spoken || 0) + 1;   // 단어는 '말한 턴'이 아니다
        // **오답에도 XP 를 준다.** 0 이면 「맞음」을 거짓으로 누르게 되고 SRS 가 망가진다.
        const good = grade !== 'miss';
        const pts = isWord ? (good ? XP.wordGood : XP.wordMiss) : (good ? XP.prodGood : XP.prodMiss);
        await bumpXp(pts, (isWord ? 'Word' : 'Production') + (good ? ' correct' : ' (XP anyway)'));
        i++; await saveProgress({ vocab:{ done:i, total:list.length } }); draw();
      };
    }
  }
}
function playVocab(c){ tStopAudio(); playCard(c); }

/* ── 막 4 · 마무리 퀴즈 ──────────────────────────────────
 *
 * 세 칸을 가로지르는 **회수(retrieval)** 한 번. 이 판에서 유일하게
 * "오늘 배운 걸 오늘 꺼내보는" 자리다 — drill 의 오늘 카드는 보기만 하고,
 * News 는 아예 확인 장치가 없었다.
 *
 * 🔴 **SRS 에 쓰지 않는다.** next_review · interval · ease 를 건드리지 않는다.
 *    방금 본 것을 채점하면 전부 "맞음"이 나와 복습 간격이 가짜로 벌어진다
 *    (drill 이 오늘 카드를 일부러 채점 안 하는 것과 같은 이유).
 *    여기 점수는 오늘 얼마나 회수됐는지를 **보여주기만** 한다.
 *
 * 문항은 **오늘 것만**으로 만든다. 새로운 걸 물으면 매일 끝에서 기분 나쁘게 끝난다.
 */

/* 날짜로 씨를 고정한다. 안 그러면 다시 그릴 때마다 문항이 바뀌어
   "3/8 까지 했다" 는 진도가 다른 문제를 가리킨다. */
function seedRng(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = h << 13 | h >>> 19;
  }
  return function(){
    h = Math.imul(h ^ h >>> 16, 2246822507);
    h = Math.imul(h ^ h >>> 13, 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}
function shuf(arr, rnd){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}

const QUIZ_MAX = 8;

/* 오늘 재료만으로 조립한다 — 새 데이터도, 스키마도, 밤 보급 변경도 없다. */
function buildQuiz(){
  const rnd = seedRng('quiz' + today());
  const todays = tVocab.today || [];
  const words   = todays.filter(c => (c.kind || 'phrase') === 'word');
  const phrases = todays.filter(c => (c.kind || 'phrase') !== 'word');
  const qs = [];

  // ① 오늘 표현 산출 — drill 에서는 보기만 했던 것을 이제 꺼낸다
  for (const c of shuf(phrases, rnd).slice(0, 3))
    qs.push({ t:'prod', card:c, prompt:c.prompt_ko, answer:c.answer_en, note:c.note || '' });

  // ② 오늘 단어 인지 — 4지선다. 오답 보기는 **오늘 다른 카드의 뜻**에서 뽑는다.
  //    공짜로 생기고, 헷갈리는 것끼리 붙여주는 효과까지 있다.
  // 🔴 오답 보기는 **같은 층에서** 먼저 뽑는다. 단어 뜻("졸린") 옆에 표현 상황
  //    ("비용을 떠안았다고 말해봐")을 세우면 생김새만 보고 걸러져서 문제가 안 된다.
  //    같은 층이 모자랄 때만 다른 층에서 채운다.
  const all = [...todays, ...(tVocab.past || [])];
  const meanings = k => [...new Set(all.filter(c => (c.kind || 'phrase') === k)
    .map(c => c.prompt_ko).filter(Boolean))];
  const wordPool = meanings('word'), otherPool = meanings('phrase');
  for (const c of shuf(words, rnd).slice(0, 3)) {
    const same = shuf(wordPool.filter(m => m !== c.prompt_ko), rnd);
    const rest = shuf(otherPool.filter(m => m !== c.prompt_ko), rnd);
    const wrong = [...same, ...rest].slice(0, 3);
    if (wrong.length < 3) {                       // 보기가 모자라면 4지선다가 성립 안 한다
      qs.push({ t:'prod', card:c, prompt:'뜻을 떠올려봐', answer:c.answer_en, note:c.prompt_ko });
      continue;
    }
    const opts = shuf([c.prompt_ko, ...wrong], rnd);
    qs.push({ t:'mcq', card:c, stem:c.answer_en, options:opts, ai:opts.indexOf(c.prompt_ko),
              note:c.note || '' });
  }

  // ③ 장면 내 턴 하나 — 오늘 말했던 대사를 다시
  const mine = [];
  for (const sc of tScenes) for (const t of (sc.turns || []))
    if (t.is_me && t.intent_ko && t.en) mine.push({ intent:t.intent_ko, en:t.en });
  for (const t of shuf(mine, rnd).slice(0, 1))
    qs.push({ t:'turn', prompt:t.intent, answer:t.en, note:'' });

  // ④ 기사 빈칸 — 오늘 어휘가 실제로 박혀 있는 문장을 찾아 그 자리를 비운다.
  //    기사 칸에 확인 장치가 하나도 없던 것을 이걸로 메운다 (내용 이해 문항은 v2).
  const sents = (tArticle?.sentences || []);
  const terms = todays.map(c => c.answer_en).filter(t => t && t.length > 2);
  const used = new Set();
  for (const term of shuf(terms, rnd)) {
    if (qs.filter(q => q.t === 'cloze').length >= 2) break;
    const low = term.toLowerCase();
    const si = sents.findIndex((x, i) => !used.has(i) && x.toLowerCase().includes(low));
    if (si < 0) continue;
    const at = sents[si].toLowerCase().indexOf(low);
    const others = [...new Set(terms.filter(x => x.toLowerCase() !== low))];
    const wc = t => t.trim().split(/\s+/).length;
    const near = shuf(others.filter(x => Math.abs(wc(x) - wc(term)) <= 1), rnd);
    const far  = shuf(others.filter(x => Math.abs(wc(x) - wc(term)) > 1), rnd);
    const wrong = [...near, ...far].slice(0, 3);
    if (wrong.length < 3) break;
    used.add(si);
    const opts = shuf([term, ...wrong], rnd);
    qs.push({ t:'cloze', before:sents[si].slice(0, at), after:sents[si].slice(at + term.length),
              options:opts, ai:opts.indexOf(term), note:'' });
  }

  // 세 문항이 안 되면 회수 연습이라 부를 게 없다 — 퀴즈 자체를 띄우지 않는다
  return qs.length >= 3 ? shuf(qs, rnd).slice(0, QUIZ_MAX) : [];
}

function actQuiz(el){
  const qs = buildQuiz();
  let i = tSession?.progress?.quiz?.done || 0;
  let right = tSession?.progress?.quiz?.right || 0;
  el.innerHTML = `<div class="actbar"><button class="btn sm back" id="t-back">‹ Today</button>
      <b style="font-size:14px">Quiz</b></div>
    <div class="vprog" id="q-prog"></div><div id="q-body"></div>`;
  $('t-back').onclick = () => { tStopAudio(); renderToday(); };
  draw();

  async function next(ok, card){
    if (ok) right++;
    await bumpXp(ok ? XP.quizOk : XP.quizMiss, ok ? 'Quiz correct' : 'Quiz (XP anyway)');
    i++;
    // 🔴 카드의 SRS 는 건드리지 않는다. 진도와 점수만 적는다.
    await saveProgress({ quiz:{ done:i, right, total:qs.length } });
    if (i >= qs.length) await maybeComplete();
    draw();
  }

  function draw(){
    const prog = $('q-prog'), body = $('q-body');
    if (i >= qs.length) {
      prog.textContent = '';
      const pct = qs.length ? Math.round(right / qs.length * 100) : 0;
      body.innerHTML = `<div class="donebox"><div class="big">${pct >= 80 ? '🎯' : pct >= 50 ? '👍' : '🌱'}</div>
        <h3>${right} / ${qs.length}</h3>
        <p>Today's board is done. Anything you missed comes back on its own —
          this score doesn't change the review schedule.</p>
        <button onclick="renderToday()">Back to Today</button></div>`;
      return;
    }
    const q = qs[i];
    prog.textContent = `${i+1} / ${qs.length} · ` + ({
      prod:'Say it in English', mcq:'What does it mean?',
      turn:'Your line from today', cloze:'Fill the gap',
    })[q.t];

    if (q.t === 'prod' || q.t === 'turn') {
      body.innerHTML = `<div class="vcard">
        <span class="klabel">${q.t === 'turn' ? 'Scene' : 'Phrase'}</span>
        <div class="vt" style="font-size:16px">${esc(q.prompt)}</div>
        <button class="check" id="q-rev" style="margin-top:12px">Show answer</button>
        <div id="q-ans" hidden style="margin-top:12px">
          <div class="vt">${esc(q.answer)}</div>
          ${q.note ? `<div class="vm">${esc(q.note)}</div>` : ''}
          <div class="grades" style="margin-top:12px">
            <button class="grade miss" data-ok="0">Missed it</button>
            <button class="grade good" data-ok="1">Got it</button>
          </div></div></div>`;
      $('q-rev').onclick = function(){
        $('q-ans').hidden = false; this.remove();
        if (q.card) playVocab(q.card);
      };
      body.querySelector('.grades').onclick = e => {
        const b = e.target.closest('[data-ok]'); if (!b) return;
        next(b.dataset.ok === '1', q.card);
      };
      return;
    }

    // 4지선다 — 누르는 즉시 정·오를 보여주고 잠깐 뒤 넘어간다
    const stem = q.t === 'mcq'
      ? `<div class="vt" style="font-size:17px">${esc(q.stem)}</div>`
      : `<div class="vt" style="font-size:15px;line-height:1.7">${esc(q.before)}<span class="qgap">____</span>${esc(q.after)}</div>`;
    body.innerHTML = `<div class="vcard"><span class="klabel">${q.t === 'mcq' ? 'Word' : 'From the article'}</span>
      ${stem}
      <div class="qopts">${q.options.map((o,k) =>
        `<button class="qopt" data-k="${k}">${esc(o)}</button>`).join('')}</div></div>`;
    body.querySelector('.qopts').onclick = e => {
      const b = e.target.closest('.qopt'); if (!b || b.disabled) return;
      const k = +b.dataset.k, ok = k === q.ai;
      body.querySelectorAll('.qopt').forEach((x, xi) => {
        x.disabled = true;
        if (xi === q.ai) x.classList.add('ok');
        else if (xi === k) x.classList.add('no');
      });
      if (q.card) playVocab(q.card);
      setTimeout(() => next(ok, q.card), ok ? 550 : 1300);   // 틀렸으면 정답을 볼 틈을 준다
    };
  }
}


/* 연속일. renderHome 을 걷어내면서 아무도 안 채우게 돼 '🔥 —' 로 굳어 있었다.
   세션이 있었던 날을 세되 **오늘 아직 안 했으면 어제부터** 센다 — 그래야 아침에 0으로 안 떨어진다. */
async function paintStreak(){
  const el = $('streak'); if (!el) return;
  try {
    const { data } = await sb.from('eng_sessions').select('session_date')
      .eq('user_id', currentUser.id)
      .order('session_date', { ascending:false }).limit(120);
    const days = new Set((data || []).map(r => r.session_date));
    let n = 0, cur = Date.now();
    if (!days.has(kstDate(cur))) cur -= 864e5;
    while (days.has(kstDate(cur))) { n++; cur -= 864e5; }
    el.textContent = n ? `🔥 ${n}d` : '🔥 not started';
  } catch (_) { el.textContent = '🔥 —'; }
}

/* 판 아래 띠 — 인박스 한 줄 · 일기 · 푸시 · 토픽 토글 */
function wireStrip(){
  const add = async () => {
    const el = $('t-inb'), v = el.value.trim();
    if (!v) return;
    const { error } = await sb.from('eng_inbox').insert({ user_id: currentUser.id, text: v });
    if (error) return toast('Could not add — check your connection');
    el.value = ''; toast('Saved to inbox — becomes a card tonight');
  };
  $('t-inb-add').onclick = add;
  $('t-inb').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

  $('t-jr-send').onclick = async () => {
    const raw = $('t-jr').value.trim();
    if (!raw) return;
    const { error } = await sb.from('eng_journal').upsert(
      { user_id: currentUser.id, entry_date: today(), raw, status: 'pending', corrected: null },
      { onConflict: 'user_id,entry_date' });
    $('t-jr-msg').textContent = error ? 'Submit failed' : '✅ Submitted — corrected overnight';
    if (!error) toast('Journal submitted 📓');
  };
  sb.from('eng_journal').select('raw,status').eq('entry_date', today()).maybeSingle()
    .then(({ data }) => {
      if (!data) return;
      $('t-jr').value = data.raw || '';
      $('t-jr-msg').textContent = data.status === 'corrected' ? '✅ Corrected' : '✅ Submitted — corrected overnight';
    }).catch(() => {});

}

/* ═══ 설정 ═══════════════════════════════════════════════
 *
 * 오늘 판에서 **설정거리만** 걷어 온 화면이다. 판에는 학습 데이터만 남긴다 —
 * 푸시 스위치와 토픽 칩은 한 번 정하면 몇 주를 안 건드리는데
 * 매일 보는 화면 꼬리를 차지하고 있었다.
 *
 * 탭이 아니라 헤더 톱니바퀴로만 들어온다. 그래서 돌아갈 길(‹ Today)을
 * 화면 안에 둔다 — 탭바에 설정이 없으니 선택된 탭이 하나도 없는 상태가 된다.
 */
function renderSettings(){
  const pushOn = typeof Notification !== 'undefined' && Notification.permission === 'granted';
  const pushNo = typeof Notification === 'undefined';
  $('st-body').innerHTML = `
    <div class="actbar"><button class="btn sm back" id="st-back">‹ Today</button>
      <b style="font-size:14px">Settings</b></div>

    <div class="stsec">
      <h3>Notifications</h3>

        ? `<p class="leg warnline">This browser can't do web push. On iPhone, add the app to your
             Home Screen first — Safari only allows push for installed apps.</p>`
        : `<button class="btn sm${pushOn ? ' primary-btn' : ''}" id="st-push">
             ${pushOn ? '🔔 Morning push is on' : '🔔 Turn on morning push'}</button>`}
    </div>

    <div class="stsec">
      <h3>Topics</h3>
      <p class="leg">Turned off topics drop out of the vocabulary queue and the ledger.

    <div class="stsec">
      <h3>Account</h3>

    </div>

      <h3>App</h3>

  const tw = $('st-topics'); tw.textContent = '';
  for (const t of topics) {
    const b = document.createElement('button');
    b.className = 'tchip' + (t.active ? ' on' : '');
    b.textContent = topicLabel(t.name);
    b.onclick = async () => {
      t.active = !t.active; b.classList.toggle('on', t.active);
