<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English">
<link rel="manifest" href="manifest-english.json">
<!-- iOS 는 apple-touch-icon 에 SVG 를 받지 않는다 — PNG 180 이어야 홈 화면 아이콘이 나온다 -->
<link rel="apple-touch-icon" href="icon-english-180.png">
<title>English — ktree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-log.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08090e;--card:#111318;--card2:#16181f;--card-el:#1c1f28;
  --border:#23262f;--border-hl:#3b3f4f;
  --text:#e8eaef;--sub:#8b8fa3;--dim:#53576a;
  --eng:#5b8cff;--eng-bg:rgba(91,140,255,.12);--eng-bd:rgba(91,140,255,.28);
  --ok:#3ddfa0;--ok-bg:rgba(61,223,160,.1);--ok-bd:rgba(61,223,160,.25);
  --warn:#f0a944;--warn-bg:rgba(240,169,68,.12);
  --danger:#ef5e5e;--danger-bg:rgba(239,94,94,.12);
  --r:12px;
  --num:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html{color-scheme:dark}
/* 🔴 하단 탭바(+사파리 바)가 ~130px 를 덮는다 — scrollIntoView 가 그만큼 비켜서 멈추게. 없으면 재생 중인 줄이 탭바 밑에 숨었다 */
html{scroll-padding:12px 0 calc(140px + env(safe-area-inset-bottom))}
/* 어떤 자식도 화면을 넓히지 못하게 한다 — 한 군데만 삐져나와도 전체가 잘려 보인다 */
html,body{max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;color:var(--text);background:var(--bg);
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--eng);outline-offset:2px}
/* 상단도 safe-area 를 먹여야 한다. apple-mobile-web-app-status-bar-style 이
   black-translucent 이고 viewport-fit=cover 라, 홈 화면에 설치하면 웹뷰가 상태바
   **아래까지** 올라온다 — 안 더하면 헤더가 시계·배터리에 깔린다.
   설치 안 한 Safari 는 inset 이 0이라 그대로다. */
.wrap{max-width:520px;margin:0 auto;
  padding:calc(8px + env(safe-area-inset-top)) 14px calc(112px + env(safe-area-inset-bottom))}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* --- header --- */
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;gap:8px;min-width:0}
.hd-logo{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-logo{font-size:15px;font-weight:800;letter-spacing:-.3px}
.hd-logo b{color:var(--eng)}
.hd-right{display:flex;align-items:center;gap:6px}
.streakpill{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:5px 11px}
.hd-btn{font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid transparent;background:none;color:var(--dim);flex:none}
.hd-btn:hover{color:var(--sub)}
.hd-btn.icon{padding:6px;display:grid;place-items:center}
.hd-btn.icon svg{width:19px;height:19px;display:block}
.hd-btn.icon:hover{color:var(--eng)}

/* --- login --- */
.login-card{max-width:380px;margin:60px auto 0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.login-card h2{font-size:17px;font-weight:800;margin-bottom:4px}
.login-card p{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px}
.field input{width:100%;padding:11px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--border-hl);color:var(--text);font-family:inherit;font-size:14px}
.field input:focus{outline:none;border-color:var(--eng)}
.primary-btn{width:100%;padding:12px;border-radius:11px;font-size:14px;font-weight:700;background:var(--eng);border:none;color:#fff}
.primary-btn:disabled{opacity:.5;cursor:default}
.msg{margin-top:10px;font-size:12.5px;border-radius:9px;padding:9px 12px;display:none}
.msg.err{background:var(--danger-bg);color:var(--danger)}
.msg.show{display:block}

/* --- shared --- */

.screen{display:none}
.screen.on{display:block;animation:fadeUp .25s ease both}
.empty{text-align:center;color:var(--dim);font-size:12.5px;line-height:1.7;padding:30px 16px}
/* Together 탭 — 주간 격자와 누적. 챌린지앱의 주간 표와 같은 읽는 법이다. */
.tgh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  font-weight:600;margin:18px 0 8px}
.tgh:first-child{margin-top:4px}
/* 주간 — 월간과 같은 "사람마다 카드" 구조. 다만 칸이 7개뿐이라 색만 칠하지 않고
   무엇을 했는지(장면·기사·어휘 세 갈래)까지 칸 안에 담는다. 그게 주간의 값이다.
   칸은 1fr — 한 줄이라 넓어져도 덩어리가 되지 않는다 (월간이 30px 고정인 이유와 반대). */
.tgwk{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:10px 12px 12px}
.tgwk+.tgwk{margin-top:7px}
.tgwk.me{background:var(--eng-bg);border-color:var(--eng-bd)}
.tgwkh{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.tgwkh .nm{font-size:12.5px;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgwkh .cnt{margin-left:auto;font-size:10.5px;color:var(--dim);font-family:var(--num);flex:none}
.tgwkh .cnt b{color:var(--ok);font-size:12px}
.tgwg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;
  max-width:378px;margin:0 auto}   /* 520px 에서 1fr 로 두면 칸이 62px 로 퍼져 납작해진다 */
.tgwg>div{min-width:0;display:grid;gap:4px;justify-items:center}
.tgwg .dw{font-size:9px;color:var(--dim);font-family:var(--num);line-height:1}
.tgwg .dw.we{color:var(--warn);opacity:.75}   /* 주말은 몰아서 할 수 있는 날 */
.tgwg .cell{width:100%;min-height:40px;border-radius:8px;background:var(--card2);
  border:1px solid transparent;padding:6px 0;display:grid;gap:5px;
  justify-items:center;align-content:center}
.tgwg .cell .dd{font-size:11.5px;font-family:var(--num);color:var(--sub);line-height:1}
.tgwg .cell .seg{display:flex;gap:2px;height:3px}
.tgwg .cell .seg u{width:4px;border-radius:2px;background:var(--border-hl);display:block}
.tgwg .cell .seg u.on{background:var(--ok)}
.tgwg .cell .seg u.hf{background:var(--ok);opacity:.45}
.tgwg .cell.part{background:var(--ok-bg);border-color:var(--ok-bd)}
.tgwg .cell.part .dd{color:var(--ok)}
.tgwg .cell.full{background:var(--ok);border-color:var(--ok)}
.tgwg .cell.full .dd{color:#06231a;font-weight:700}
.tgwg .cell.full .seg u{background:rgba(6,35,26,.3)}
.tgwg .cell.full .seg u.on{background:#06231a}
.tgwg .cell .pf{font-size:11px;line-height:1;cursor:pointer}
.tgproof{margin-bottom:14px;padding:12px 13px}
.tgpok{display:flex;gap:12px;align-items:center}
.tgpok img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer}
.pfbox{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.pfbox img{max-width:100%;max-height:100%;border-radius:10px}
.tgwg .cell.fut{background:none;border-color:var(--border)}
.tgwg .cell.fut .dd{color:#2b2e39}
.tgwg .cell.fut .seg{visibility:hidden}
.tgwg .cell.now{box-shadow:0 0 0 2px var(--warn)}

/* 주/월 토글 머리 */
.tghead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
.tghead .tgh{margin:0}

/* 월간 — 사람마다 달력 하나. 한 칸에 둘을 겹치면 누구 것인지 안 읽힌다. */
.tgnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.tgmlabel{font-size:12px;color:var(--sub);font-family:var(--num);font-weight:600;
  min-width:150px;text-align:center}
.tgarrow{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--sub);font-size:17px;line-height:1;cursor:pointer;flex:none}
.tgarrow:hover:not(:disabled){border-color:var(--eng);color:var(--eng)}
.tgarrow:disabled{opacity:.3;cursor:default}
.tgcal{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:10px 12px 12px}
.tgcal+.tgcal{margin-top:7px}
.tgcal.me{background:var(--eng-bg);border-color:var(--eng-bd)}
.tgcalh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tgcalh .nm{font-size:12.5px;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgcalh .cnt{margin-left:auto;font-size:10.5px;color:var(--dim);font-family:var(--num);flex:none}
.tgcalh .cnt b{color:var(--ok);font-size:12px}
.tgdow,.tggrid{display:grid;grid-template-columns:repeat(7,30px);gap:5px;justify-content:center}
.tgdow span{font-size:9px;color:var(--dim);text-align:center;font-family:var(--num);padding-bottom:3px}
/* 칸을 1fr 로 두면 폭에 맞춰 44px 까지 늘어나 한 달이 화면을 통째로 먹는다. 고정 30px. */
.tggrid i{width:30px;height:30px;border-radius:7px;background:var(--card2);
  border:1px solid transparent;display:grid;place-items:center;
  font-style:normal;font-size:10px;font-family:var(--num);color:var(--dim);line-height:1}
.tggrid i.part{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.tggrid i.full{background:var(--ok);border-color:var(--ok);color:#06231a;font-weight:700}
.tggrid i.fut{background:none;border-color:var(--border);color:#2b2e39}
.tggrid i.pad{background:none;border:0}
.tggrid i.now{box-shadow:0 0 0 2px var(--warn)}

.tgtot{display:flex;flex-direction:column;gap:7px}
.tgcard{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:11px 13px}
.tgcard.me{background:var(--eng-bg);border-color:var(--eng-bd)}
.tgname{font-size:13px;font-weight:650;margin-bottom:6px}
.tgname{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.tgname em{font-style:normal;font-size:10.5px;color:var(--dim);font-weight:500}
.tgfire{margin-left:auto;font-size:11px;color:var(--warn);font-weight:600;flex:none}
.tgfig{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11.5px;color:var(--dim)}
.tgfig b{font-family:var(--num);font-size:14px;color:var(--text);font-weight:700;
  font-variant-numeric:tabular-nums;margin-right:3px}
/* 독백 — 분량과 구조를 버티는 화면이라, 읽을 것을 최소로 두고 타이머를 크게 둔다 */
.spq{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.spkind{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:2px 9px;margin-bottom:8px}
.spen{font-size:17px;line-height:1.5;font-weight:600;margin:0}
.sptimer{text-align:center;margin:18px 0 12px}
.sptime{font-family:var(--num);font-size:40px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--text);transition:color .2s}
.sptime.hit{color:var(--ok)}
.sptrack{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin:10px auto 6px;max-width:300px}
.sptrack i{display:block;height:100%;background:var(--sub);border-radius:99px;transition:width .25s linear}
.sptrack i.hit{background:var(--ok)}
.sptarget{font-family:var(--num);font-size:10.5px;color:var(--dim)}
.spmodel{background:var(--card);border-left:3px solid var(--ok);border-radius:0 10px 10px 0;
  padding:13px 16px;margin-top:14px}
.spmodel p{font-size:15px;line-height:1.65;margin:0}
.spmodel p+p{margin-top:11px}
.spnote{font-size:12px;color:var(--sub);line-height:1.6;margin-top:10px;padding:10px 13px;
  background:var(--card2);border-radius:10px}
.spnote .l{display:block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);font-weight:700;margin-bottom:3px}
.spph{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sprow{display:flex;gap:12px;align-items:baseline;padding:8px 13px;font-size:12.5px}
.sprow+.sprow{border-top:1px solid var(--border)}
.sprow b{flex:0 0 auto;max-width:55%;color:var(--text);font-weight:650}
.sprow span{color:var(--dim);min-width:0;flex:1 1 auto}
/* 장면 전 어휘 훑기 — 읽고 넘어가는 자리라 카드보다 목록에 가깝게 */
.prelist{border:1px solid var(--border);border-radius:12px;overflow:clip;background:var(--card)}
.prow2{padding:11px 14px;cursor:pointer;transition:background .12s}
.prow2+.prow2{border-top:1px solid var(--border)}
.prow2:active,.prow2.on{background:var(--eng-bg)}
.prow2 .pt{font-size:15px;font-weight:650;line-height:1.4}
.prow2 .pk2{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.5}
.prow2 .pex{font-size:12px;color:var(--dim);margin-top:4px;font-style:italic}
/* 구(phrase) 안의 모르는 단어를 따로 짚는다. 구의 뜻만 알면 그 구에서만 쓸 수 있다. */
.prow2 .pkw{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;padding-top:6px;
  border-top:1px dashed var(--border)}
.prow2 .pkw span{font-size:11.5px;color:var(--dim)}
.prow2 .pkw b{color:var(--ok);font-weight:650;margin-right:3px}
.btn.sm.on{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--card-el);border:1px solid var(--border-hl);border-radius:99px;
  padding:9px 16px;font-size:12.5px;color:var(--text);z-index:50;display:none;white-space:nowrap;
}
.toast.has-act{align-items:center;gap:12px;padding-right:8px}
.toast-act{
  background:none;border:none;color:var(--accent);font:inherit;font-weight:700;
  padding:4px 8px;margin:0;border-radius:99px;cursor:pointer;
}
.toast-act:active{background:var(--card-el)}

/* --- home --- */

.stat .n{font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .n small{font-size:12px;font-weight:600;color:var(--dim)}

.stat.due .n{color:var(--eng)}

.lvlchip.done{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}

.tchip{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:99px;border:1px solid var(--border);background:none;color:var(--dim);white-space:nowrap;transition:color .15s,border-color .15s}
.tchip.on{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}

/* --- review --- */

.tfilter .tchip.on{color:var(--eng);border-color:var(--eng-bd);background:var(--eng-bg)}

.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.grade{padding:12px 4px;border-radius:11px;font-size:13px;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--text)}
.grade small{display:block;font-size:10px;font-weight:600;color:var(--dim);margin-top:2px}
.grade.miss{border-color:rgba(239,94,94,.3);color:var(--danger)}
.grade.soso{border-color:rgba(240,169,68,.3);color:var(--warn)}
.grade.good{border-color:var(--ok-bd);color:var(--ok)}
.grade:active{background:var(--card-el)}
.donebox{text-align:center;padding:50px 20px}
.donebox .big{font-size:40px}
.donebox h3{font-size:17px;font-weight:800;margin:12px 0 6px}
.donebox p{font-size:13px;color:var(--sub);line-height:1.6}
.donebox button{margin-top:18px;padding:11px 22px;border-radius:11px;border:1px solid var(--eng-bd);background:var(--eng-bg);color:var(--eng);font-size:13px;font-weight:700}

/* --- listen --- */

.rate button.on{background:var(--eng-bg);color:var(--eng)}

/* --- speak / journal --- */

.check{margin-top:14px;width:100%;padding:12px;border-radius:11px;font-size:14px;font-weight:700;background:var(--eng);border:none;color:#fff}

.result.show{display:block}
.result.good{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok)}

/* --- inbox --- */

.initem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.initem+.initem{margin-top:6px}
.initem .itx{flex:1;min-width:0}
.initem .ie{font-size:13.5px;font-weight:600;line-height:1.4;overflow-wrap:break-word}
.initem .isrc{font-size:11px;color:var(--dim);margin-top:1px}
.ipill{font-size:10px;font-weight:700;padding:4px 8px;border-radius:99px;flex:none}
.ipill.wait{color:var(--warn);background:var(--warn-bg)}
.ipill.done{color:var(--ok);background:var(--ok-bg)}
.buildline{margin:18px 0 2px;text-align:center;font-size:10.5px;color:var(--dim);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.buildline b{font-weight:600;color:var(--sub)}
.buildline .stale{color:var(--warn)}
.initem .indel{flex:none;width:28px;height:28px;border:0;border-radius:8px;background:var(--card-el);color:var(--dim);font-size:13px;cursor:pointer}
.initem .indel:hover:not(:disabled){color:var(--danger);background:var(--danger-bg)}
.initem .indel:disabled{opacity:.4}

/* ═══ 오늘 판 (개편) ═══ */
/* 앱에 없던 범용 버튼·상황줄. hd-btn 의 톤을 따른다 */
.btn{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--border-hl)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:11.5px;padding:6px 10px}
.btn.primary-btn{width:auto;background:var(--eng);border-color:var(--eng);color:#fff}
.sit{background:var(--eng-bg);border:1px solid var(--eng-bd);border-radius:9px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.sit b{color:var(--eng)}
.xpbar{
  border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:10px;
  background:linear-gradient(160deg,var(--card2),var(--card));
}
.xpbar .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.xpbar .rk{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:baseline;gap:7px}
.xpbar .rk em{
  font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--eng);background:var(--eng-bg);border:1px solid var(--eng-bd);border-radius:99px;padding:2px 8px;
}
.xpbar .n{font-family:var(--num);font-size:11.5px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums}
.xpbar .xtrack{height:7px;border-radius:99px;background:var(--card-el);margin-top:11px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.xpbar .xtrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--eng),var(--ok));transition:width .35s ease}
/* 얻은 XP 가 없는 날은 줄 자체를 없앤다 — min-height 로 자리를 비워두니 카드에 빈 구멍이 났다 */
.xpbar .gain{font-size:11.5px;color:var(--ok);font-weight:600}
.xpbar .gain:not(:empty){margin-top:9px}
.board{display:flex;flex-direction:column;gap:7px}
.bcard{
  position:relative;overflow:hidden;border:1px solid var(--border);border-radius:12px;
  background:var(--card);padding:11px 13px;text-align:left;cursor:pointer;font:inherit;color:inherit;
  display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;
  column-gap:9px;row-gap:7px;align-items:center;
  transition:border-color .15s,transform .1s;
}
.bcard:active:not(:disabled){transform:scale(.99)}
.bcard:disabled{opacity:.45;cursor:not-allowed}
/* 잠긴 퀴즈는 "고장"이 아니라 "아직"이다 — 점선 테로 그걸 말한다.
   막대를 visibility:hidden 으로 감췄더니 grid-row 2 와 row-gap 이 그대로 남아
   그 칸만 아래가 10px 붕 떴다. 막대를 아예 건드리지 않는다 — 0% 홈이 그대로 보이면
   높이가 넷 다 정확히 같고, "아직 시작 안 함" 이라 사실과도 맞는다. */
.bcard.locked{border-style:dashed;opacity:.7}

/* 퀴즈 4지선다 */
.qopts{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.qopt{appearance:none;font:inherit;font-size:13.5px;text-align:left;color:var(--text);
  background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;cursor:pointer;transition:border-color .12s,background .12s}
.qopt:active:not(:disabled){transform:scale(.995)}
.qopt:disabled{cursor:default}
.qopt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.qopt.no{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.qgap{display:inline-block;min-width:74px;text-align:center;color:var(--eng);
  border-bottom:2px solid var(--eng-bd);margin:0 3px}
.bcard .bt{grid-column:2;font-size:14px;font-weight:700;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .chk{grid-column:1;grid-row:1}
.bcard .bs{grid-column:3;grid-row:1;justify-self:end;white-space:nowrap}
.bcard .bar{grid-column:1/-1;grid-row:2}
/* 빈 네모는 '안 누른 체크박스'로 읽혀 할 일이 아니라 양식처럼 보였다. 상태 고리로 바꾼다. */
.bcard .chk{
  flex:none;width:16px;height:16px;border-radius:99px;border:2px solid var(--dim);
  display:inline-grid;place-items:center;font-size:9px;color:transparent;transition:all .15s;
}
.bcard .bs{font-family:var(--num);font-size:11.5px;font-weight:500;color:var(--sub);line-height:1.4;font-variant-numeric:tabular-nums}
.bcard .bar{display:block;height:3px;border-radius:99px;background:var(--card-el);overflow:hidden}
.bcard .bar i{display:block;height:100%;border-radius:99px;background:var(--warn);transition:width .3s}
.bcard.part{border-color:var(--warn-bg)}
.bcard.part .chk{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.bcard.done{border-color:var(--ok-bd);background:linear-gradient(160deg,var(--ok-bg),var(--card))}
.bcard.done .chk{background:var(--ok);border-color:var(--ok);color:#06210f}
.bcard.done .bar i{background:var(--ok)}
/* 학습량은 부차적인 정보다. 카드 세 개로 두면 판의 세 칸과 무게가 같아져 위계가 무너진다. */
.tstats{display:flex;gap:0;margin-top:10px;border:1px solid var(--border);border-radius:11px;background:var(--card);overflow:hidden}
.tstat{flex:1 1 0;min-width:0;padding:9px 6px;text-align:center}
.tstat+.tstat{border-left:1px solid var(--border)}
.tstat .v{font-family:var(--num);font-size:17px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.tstat .v small{font-family:'Noto Sans KR',sans-serif;font-size:10px;color:var(--dim);font-weight:400;letter-spacing:0}
.tstat .l{font-size:10.5px;color:var(--sub);margin-top:3px;line-height:1.3}

/* 막 안쪽 */
.actbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.actbar .back{margin-right:auto}
.rate2{display:flex;gap:2px}
.rate2 button{border:1px solid var(--border);background:var(--card);color:var(--sub);font:inherit;font-size:11px;padding:5px 7px;cursor:pointer}
.rate2 button:first-child{border-radius:7px 0 0 7px}.rate2 button:last-child{border-radius:0 7px 7px 0}
.rate2 button[aria-pressed="true"]{background:var(--eng);border-color:var(--eng);color:#06210f}
.dturn{display:flex;gap:8px;align-items:flex-start;margin-bottom:9px}
.dturn .who{flex:0 0 30px;font-size:9.5px;color:var(--dim);padding-top:8px}
.dturn .line{flex:1 1 auto;min-width:0;border-radius:12px;padding:10px 13px;background:var(--card-el);font-size:16px;line-height:1.6;cursor:pointer;transition:box-shadow .15s}
.dturn.mine .line{background:var(--eng-bg);border:1px solid var(--eng-bd)}
.dturn.on .line{box-shadow:0 0 0 2px var(--warn)}
.dturn .intent{display:block;font-size:12px;color:var(--eng);font-weight:600;margin-bottom:5px}
.dturn .hid{color:var(--dim);font-style:italic;font-size:13.5px}
/* 뜻은 기본으로 감춘다 — 늘 보이면 듣기가 읽기가 된다. 턴 탭은 이미 재생에 쓰이므로
   어휘 장부와 같은 셰브론으로 펴고 접는다 (버튼 탭이 재생으로 새지 않게 stopPropagation). */
.dturn .line{position:relative;padding-right:30px}
.dturn .tchev{
  position:absolute;right:6px;top:6px;width:22px;height:22px;padding:0;
  border:0;background:none;color:var(--dim);font:inherit;font-size:15px;line-height:22px;
  text-align:center;cursor:pointer;transition:transform .15s;
}
.dturn .tchev.open{transform:rotate(90deg);color:var(--eng)}
.dturn .mean{display:block;margin-top:7px;padding-top:7px;border-top:1px solid var(--border);
  font-size:13px;color:var(--dim);line-height:1.55}
.kw{border-radius:3px;padding:0 .06em}
.fixbox{margin-top:12px}.fixbox .spnote{margin-top:8px}
.fixwait{font-size:13px;color:var(--sub);padding:10px 12px;border:1px dashed var(--border);border-radius:9px}
.fixrow{margin-top:8px;padding:8px 11px;border-radius:9px;background:var(--card);border:1px solid var(--border)}
.fsaid{font-size:13px;color:var(--dim);text-decoration:line-through}
.fbetter{font-size:15px;color:var(--ok);font-weight:600;margin-top:2px}
.fbetter .fplay{padding:1px 7px;margin-left:4px;font-size:11px}
.fwhy{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.5}
.fsent{cursor:pointer}
.gform{margin:8px 0;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.gfr{display:flex;gap:10px;padding:6px 10px;font-size:12.5px;line-height:1.45}
.gfr+.gfr{border-top:1px solid var(--border)}
.gfr b{flex:0 0 74px;color:var(--sub);font-weight:600}
.goops{margin-top:10px}
.gol{font-size:11.5px;color:var(--warn);font-weight:700;margin-bottom:4px}
.gor{font-size:13px;padding:5px 0;line-height:1.45}
.gor s{color:var(--dim)} .gor b{color:var(--ok)}
.gor span{display:block;font-size:12px;color:var(--sub)}
.gcard{margin-bottom:12px;padding:12px 13px}
.kw.on{background:var(--warn);color:#241a05;font-weight:700;border-radius:4px}
.kw.red{opacity:.5;border-bottom:1px dotted currentColor}
.kw.red.on{opacity:1}
.asbox{border:1px solid var(--border);border-radius:11px;padding:11px 13px;background:var(--card);font-size:16px;line-height:1.65;cursor:pointer;transition:border-color .15s,background .15s}
.asbox+.asbox{margin-top:6px}
.asbox.on{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-bg)}
.leg{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.55}
.leg b{color:var(--sub);font-weight:600}
.leg .sw{opacity:.5;border-bottom:1px dotted currentColor}
.vcard{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:14px 15px}
.vcard .vt{font-size:17px;font-weight:700;line-height:1.4}
.klabel{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--eng);
  background:var(--eng-bg);border:1px solid var(--eng-bd);border-radius:99px;padding:2px 8px;margin-bottom:9px}
.vex{font-family:var(--num);font-size:12px;color:var(--dim);margin-top:8px;line-height:1.55}
.vcard .vm{font-size:13px;color:var(--sub);margin-top:7px;line-height:1.6}
.vcard .vsrc{font-size:10.5px;color:var(--dim);margin-top:9px}
.vprog{font-size:11.5px;color:var(--sub);margin-bottom:10px;font-variant-numeric:tabular-nums}
.stsec{margin-top:20px;border-top:1px solid var(--border);padding-top:14px}
.stsec:first-of-type{border-top:0;padding-top:4px}
.stsec h3{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);font-weight:600}
.stsec .leg{margin:0 0 10px}
.stsec .warnline{color:var(--warn)}
.strip{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
.strip .btn.sm{flex:none}

/* 어휘 목록 — 누르면 펼쳐지는 줄 */
.vrow{border:1px solid var(--border);border-radius:11px;background:var(--card);margin-bottom:7px;overflow:hidden;transition:border-color .15s}
.vrow.open{border-color:var(--eng-bd)}
.vsum{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;background:none;border:0;text-align:left;font:inherit;color:inherit}
.vsum .itx{flex:1 1 auto;min-width:0}
.vsum .ie{display:block;font-size:14px;font-weight:700;letter-spacing:-.2px;line-height:1.35;overflow-wrap:anywhere}
.kdot{font-style:normal;font-size:9px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:1px 6px;margin-left:5px;vertical-align:2px}
.vsum .ipill{flex:none}
.vchev{flex:none;color:var(--dim);font-size:15px;transition:transform .15s}
.vrow.open .vchev{transform:rotate(90deg)}
.vmore{padding:0 13px 12px}
.vmean{font-size:14px;color:var(--text);line-height:1.55;margin-bottom:6px}
.vmk{display:inline-block;font-size:9.5px;font-weight:700;color:var(--eng);background:var(--eng-bg);
  border-radius:99px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.vnote{font-size:12.5px;color:var(--sub);line-height:1.6}
.vmeta{font-family:var(--num);font-size:10.5px;color:var(--dim);margin-top:6px}
.vkill{color:var(--danger)!important;border-color:var(--danger-bg)!important}
.srow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-width:0}
.strip input,.strip textarea{flex:1 1 120px;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit;font-size:13px;color:var(--text)}
.strip input::placeholder,.strip textarea::placeholder{color:var(--dim)}
.strip input:focus,.strip textarea:focus{border-color:var(--eng-bd);outline:none}
.strip textarea{width:100%;margin-top:8px;resize:vertical}
.sdet{margin-top:10px}
.tip{padding:10px 0;border-bottom:1px solid var(--border)}
.tiph{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.tipb{font-size:13px;color:var(--sub);line-height:1.55;margin:4px 0 6px;white-space:pre-line}
.tipt{background:none;border:1px solid var(--border);border-radius:8px;color:var(--eng);font:inherit;font-size:11px;padding:2px 7px;cursor:pointer;flex:none}
.tipt.tsl{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);border-radius:0;color:var(--text);font-size:12.5px;padding:6px 0}
.tipsrc{max-height:50vh;overflow:auto}
.tipr{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tips{font-family:var(--num);font-size:10px;color:var(--dim);border:1px solid var(--border);border-radius:6px;padding:0 5px}
.tips.on{color:var(--eng);border-color:var(--eng-bd)}
.tsl .ct{font-family:var(--num);font-size:10.5px;color:var(--dim);margin-right:6px}
.clines{max-height:42vh;overflow:auto;position:relative;margin:0 0 8px;border:1px solid var(--border);border-radius:var(--r)}
.cl{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);
  color:var(--text);font:inherit;font-size:15px;line-height:1.45;padding:9px 12px;cursor:pointer}
.cl.on{background:var(--eng-bg);box-shadow:inset 3px 0 0 var(--eng)}
.cl .ct{font-family:var(--num);font-size:10.5px;color:var(--dim);margin-right:6px}
.cl .ck{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.sdet>summary{cursor:pointer;font-size:12.5px;color:var(--sub);list-style:none}
.sdet>summary::-webkit-details-marker{display:none}
.sdet>summary::before{content:"▸ ";color:var(--dim)}
.sdet[open]>summary::before{content:"▾ "}

/* --- tab bar --- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  /* 탭 수를 박지 않는다 — 6으로 박혀 있어서 탭이 3개가 되자 왼쪽에 몰렸다 */
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  max-width:520px;margin:0 auto;
  border-top:1px solid var(--border);background:rgba(13,15,20,.92);backdrop-filter:blur(10px);
  /* 홈 화면에 설치하지 않은 Safari 는 safe-area 가 0이라 하단 바에 글자가 가린다 */
  /* 홈 화면에 설치하지 않은 Safari 는 safe-area 가 0인데 하단 바가 약 50px 덮는다 */
  padding:8px 8px calc(22px + env(safe-area-inset-bottom));
}
/* 이모지는 회색 필터를 씌워도 탁하게 남는다. 선 아이콘이 currentColor 를 따라가 깔끔하다. */
.tab{background:none;border:none;color:var(--dim);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center;padding:6px 0;border-radius:10px;transition:color .15s}
.tab .ti{width:21px;height:21px;opacity:.75;transition:opacity .15s}
.tab.on{color:var(--eng)}
.tab.on .ti{opacity:1}

/* --- 하루 모드 · 학습 순서 --- */
.daymode{display:flex;align-items:center;gap:5px;margin:0 0 9px;flex-wrap:wrap}
.daymode .dmh{font-size:10.5px;color:var(--dim);font-weight:600}
.cmtrow{display:flex;align-items:center;gap:6px;margin:0 0 11px;flex-wrap:wrap}
.pstep{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.pstep:last-child{border-bottom:none}
.pstep .pn{flex:none;width:20px;height:20px;border-radius:99px;background:var(--eng-bg);
  color:var(--eng);font-size:10.5px;font-weight:800;display:grid;place-items:center;margin-top:1px;font-family:var(--num)}
.pstep.off .pn{background:var(--card-el);color:var(--dim)}
.pstep .pw{font-size:10.5px;color:var(--eng);font-weight:800;letter-spacing:.02em}
.pstep .pb{font-size:12.5px;line-height:1.6;color:var(--sub);margin-top:2px}
.pstep .pb b{color:var(--text)}
.sh{font-size:17px;font-weight:800;margin:2px 0 8px}
.gram{background:var(--card2);border:1px solid var(--border);border-radius:9px;margin:0 0 12px;font-size:12.5px}
.gram summary{padding:9px 13px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;font-weight:600}
.gram summary::-webkit-details-marker{display:none}
.gram summary::after{content:'›';margin-left:auto;color:var(--dim);font-size:15px;transition:transform .15s}
.gram[open] summary::after{transform:rotate(90deg)}
.gram .gl{font-size:10px;font-weight:800;color:var(--warn);background:var(--warn-bg);padding:2px 7px;border-radius:99px;flex:none}
.gram .gw{padding:0 13px 2px;color:var(--sub);line-height:1.6}
.gram .ge{padding:7px 13px 11px;color:var(--text);font-style:italic}
.gram .ge em{font-style:normal;font-size:10.5px;color:var(--dim);font-family:var(--num)}
/* 단계 게이지 — 판 맨 위. 누르면 순서 탭(로드맵)으로 간다 */
.stage{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--eng-bd);
  border-radius:12px;padding:11px 14px;margin-bottom:12px;color:var(--text);font:inherit;cursor:pointer}
.stage .st1{display:flex;align-items:baseline;gap:6px;font-size:14px;font-weight:700}
.stage .st1 b{color:var(--eng)}
.stage .st1 em{font-style:normal;font-size:10.5px;color:var(--dim);font-weight:700}
.stage .stn{margin-left:auto;font-family:var(--num);font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.stage .sttrack{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin:8px 0 6px}
.stage .sttrack i{display:block;height:100%;background:var(--eng);border-radius:99px;transition:width .3s}
.stage .st2{font-size:11.5px;color:var(--dim);line-height:1.5}
.stage .st2 b{color:var(--text)}
.bcard.opt{border-style:dashed}
/* 대사 아래 문법 칩 — 장면 상단 "문법"(패턴 하나)과 같은 노란 계열 */
.dturn .grow{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.gchip{font:inherit;font-size:10.5px;font-weight:700;line-height:1.3;padding:2px 8px;border-radius:99px;
  border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);cursor:pointer}
.gchip.on{box-shadow:0 0 0 2px var(--warn)}
.gbox{display:block;margin-top:8px;padding:9px 11px;border-radius:9px;background:var(--card);
  border:1px solid var(--border);font-size:12.5px;line-height:1.6;cursor:default}
.gm{display:block;color:var(--dim);font-size:11px}
.gr{display:block;margin:5px 0 7px;color:var(--sub);white-space:pre-line}
.gex{display:block;width:100%;text-align:left;font:inherit;font-size:13px;background:none;border:0;
  border-top:1px dashed var(--border);padding:6px 0;color:var(--text);cursor:pointer}
.gex span{display:block;font-size:11.5px;color:var(--dim)}
.gall{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:var(--eng);cursor:pointer}
.gram .gr,.gram .gm{padding:0 13px}
.gram .gex{padding:6px 13px}
.gram .gex:last-child{padding-bottom:11px}
.frame .fb{padding:6px 13px}
.frame .fb+.fb{border-top:1px solid var(--border)}
.frame .fk{display:block;font-size:10px;color:var(--dim);font-weight:700}
.frame .fe{display:block;font-size:13.5px;line-height:1.5;margin-top:2px}
.prow2{position:relative}
.pflag{position:absolute;top:7px;right:7px;padding:3px 8px;font-size:12px;line-height:1}
/* 별이 떠 있는 자리를 글자가 비워둬야 한다 — 안 비우면 긴 문장 첫 줄이 별 아래로 들어간다.
   대화 줄(.dturn .line)은 이미 이렇게 비워두는데 어휘 줄만 빠져 있었다. */
.prow2 .pt{padding-right:40px}
.tflag{padding:2px 7px;font-size:11px;line-height:1;margin-left:6px;vertical-align:middle}
</style>

<body>
<div class="wrap">

  <div id="login-view" class="login-card" style="display:none">

async function loadTopics(){
  let { data, error } = await sb.from('eng_topics').select('*').order('sort').order('created_at');
  if (error) throw error;
  if (!data?.length) {
    const rows = DEFAULT_TOPICS.map((name,i)=>({ user_id:currentUser.id, name, active:true, sort:i }));
    const ins = await sb.from('eng_topics').insert(rows).select();
    data = ins.data || [];
  } else {
    // 기본 토픽이 나중에 늘어나도 기존 사용자에게 붙게 한다 —
    // '비어 있을 때만 심기'라 마케팅을 추가해도 기존 계정엔 안 생겼다
    const have = new Set(data.map(t => t.name));
    const miss = DEFAULT_TOPICS.filter(n => !have.has(n));
    if (miss.length) {
      const ins = await sb.from('eng_topics')
        .insert(miss.map((name,i)=>({ user_id:currentUser.id, name, active:true, sort:data.length+i })))
        .select();
      data = [...data, ...(ins.data || [])];
    }
  }
  topics = data;
}

/* ================= SRS ================= */
function applyGrade(card, grade){
  if (grade === 'good'){
    card.streak++; card.ease = Math.min(2.8, Number(card.ease) + 0.05);
    card.interval_days = card.interval_days < 1 ? 2 : Math.round(card.interval_days * card.ease);
  } else if (grade === 'soso'){
    card.interval_days = Math.max(1, Math.ceil((card.interval_days || 1) * 1.2));
  } else {
    card.streak = 0; card.ease = Math.max(1.3, Number(card.ease) - 0.2);
    card.interval_days = 1;
  }
  card.interval_days = Math.min(card.interval_days, 365);
  card.next_review = kstDate(Date.now() + card.interval_days * 864e5);
  card.status = card.interval_days >= 21 ? 'mature' : 'learning';
}

async function saveGrade(card, grade, mode){
  const fields = { status:card.status, interval_days:card.interval_days, ease:card.ease,
                   streak:card.streak, next_review:card.next_review };
  const op = { card_id: card.id, fields, grade, mode, at: new Date().toISOString() };
  try {
    const [u, l] = await Promise.all([
      sb.from('eng_cards').update(fields).eq('id', card.id),
      sb.from('eng_review_log').insert({ user_id:currentUser.id, card_id:card.id, grade, mode })
    ]);
    if (u.error || l.error) throw (u.error || l.error);
  } catch (_) {
    // 오프라인(지하철) — 로컬에 쌓고 복귀하면 flush
    const pend = JSON.parse(localStorage.getItem(LS.pending) || '[]');
    pend.push(op);
    localStorage.setItem(LS.pending, JSON.stringify(pend));
  }
}

async function flushPending(){
  const pend = JSON.parse(localStorage.getItem(LS.pending) || '[]');
  if (!pend.length) return;
  const rest = [];
  for (const op of pend){
    try {
      // 🔴 .error 를 반드시 본다. supabase-js 는 PostgREST 오류를 throw 하지 않고
      // { error } 로 resolve 하므로, 안 보면 실패한 복습이 조용히 버려진다 (saveGrade 와 같은 규칙).
      const u = await sb.from('eng_cards').update(op.fields).eq('id', op.card_id);
      if (u.error) throw u.error;
      const l = await sb.from('eng_review_log').insert({ user_id:currentUser.id, card_id:op.card_id, grade:op.grade, mode:op.mode, reviewed_at:op.at });
      if (l.error) throw l.error;
    } catch(_) { rest.push(op); }
  }
  localStorage.setItem(LS.pending, JSON.stringify(rest));
  const synced = pend.length - rest.length;
  if (rest.length) toast(`Synced ${synced} · ${rest.length} failed — will retry later`);
  else if (synced)  toast(`Synced ${synced} offline reviews`);
}

// 폴백용 기기 음성 자동 선택 — 프리미엄/향상된 음성이 있으면 그걸 쓴다.
// (기본은 미리 구운 네이티브 mp3 재생이라 이건 파일이 없을 때만 쓰인다)
function pickVoice(){
  const vs = ('speechSynthesis' in window ? speechSynthesis.getVoices() : []).filter(v=>v.lang.startsWith('en'));
  if (!vs.length) return null;
  return vs.find(v=>/premium/i.test(v.name))
    || vs.find(v=>/enhanced/i.test(v.name))
    || vs.find(v=>/siri/i.test(v.name))
    || vs.find(v=>/Samantha|Google US/i.test(v.name))
    || vs[0];
}

function speak(text, onend){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = tRate;
  const v = pickVoice(); if (v) u.voice = v;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}

// 카드 오디오: tts-cards.mjs 가 구워둔 네이티브 mp3 를 먼저 시도, 없으면 기기 TTS 폴백
const noAudio = new Set();
let cardAudio = null;
/* 잠금화면·제어센터에 뭘 틀고 있는지 띄운다.
 *
 * iOS 는 **홈 화면 PWA 에서 백그라운드 오디오를 막아둔다** (WebKit 알려진 제약).
 * MediaSession 이 그걸 뚫어주지는 못하지만, 재생 중임을 시스템에 알려 잠금화면
 * 컨트롤이 생기고 중단 빈도가 줄어든다. Safari 탭에서는 백그라운드 재생이 되므로
 * 거기서는 확실히 이득이다. */
function setMedia(title, artist){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title, artist: artist || 'ktree English', album: 'ktree English',
    });
    navigator.mediaSession.playbackState = 'playing';
  } catch (_) {}
}
function clearMedia(){
  if (!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.playbackState = 'paused'; } catch (_) {}
}

/** 글자 → 오디오 파일 이름. 읽을 수 있게 두고 끝에 해시를 붙여 잘림·충돌을 막는다.
 *  tts-cards.mjs 가 **이 함수를 이 파일에서 그대로 읽어** 쓴다 — 양쪽이 어긋날 수 없다. */
function audioKey(s){
  const n = String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  let h = 0; for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) | 0;
  return n.replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) + '-' + (h >>> 0).toString(36);
}
const CARD_AUD = `${SUPABASE_URL}/storage/v1/object/public/eng-audio/cards`;
const enUrl = t => t ? `${CARD_AUD}/t/${audioKey(t)}.mp3` : null;
const koUrl = t => t ? `${CARD_AUD}/k/${audioKey(t)}.mp3` : null;

function playCard(card, onend){
  const key = card?.answer_en && audioKey(card.answer_en);
  if (!key || noAudio.has(key)) return speak(card?.answer_en, onend);
  // 찍어둔 대화 줄은 자기 턴 음성을 들고 있다 — 글자키 음성은 오늘 밤에 구워지므로
  // 찍은 직후부터 들리려면 이미 있는 파일을 가리켜야 한다.
  const src = card.audio_url || enUrl(card.answer_en);
  if (cardAudio) cardAudio.pause();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const a = new Audio(src);
  cardAudio = a;
  a.playbackRate = tRate;
  if (onend) a.onended = onend;
  const fallback = () => { noAudio.add(key); speak(card.answer_en, onend); };
  a.onerror = fallback;
  a.play().catch(fallback);
}

function urlBase64ToUint8Array(s){
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const b64 = (s + pad).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from([...atob(b64)].map(c=>c.charCodeAt(0)));
}
async function subscribePush(interactive){
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || typeof Notification === 'undefined'){
    if (interactive) toast("Push isn't supported here (on iOS, add to Home Screen first)");
    return;
  }
  try {
    const reg = await navigator.serviceWorker.ready;
    const permission = await Notification.requestPermission();
    if (permission !== 'granted'){ if (interactive) toast('Notification permission denied'); return; }
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    const { endpoint, keys } = sub.toJSON();
    const row = { user_id: currentUser.id, endpoint, p256dh: keys.p256dh, auth: keys.auth };
    // push_subscriptions 는 챌린지와 공유 — member 가 있으면 붙인다
    const { data: member } = await sb.from('challenge_members').select('id').eq('user_id', currentUser.id).maybeSingle();
    if (member) row.member_id = member.id;
    const { error } = await sb.from('push_subscriptions').upsert(row, { onConflict:'user_id,endpoint' });
    if (error) throw error;
    // 버튼은 이제 설정 화면에 있다. 설정을 열어둔 채로 눌렀을 때만 존재한다.
    const pb = $('st-push');
    if (pb) { pb.textContent = '🔔 Morning push is on'; pb.classList.add('primary-btn'); }
    if (interactive) toast('Review push starts tomorrow morning');
  } catch (e) {
    console.warn('push subscribe failed', e);
    if (interactive) toast('Push registration failed — check the console');
  }
}

/* 버전을 화면에 박는다. 폰에서 "지금 최신을 보고 있나"를 눈으로 확인할 수 있어야 한다.
   서비스워커 캐시 이름도 같이 읽는다 — PWA 가 구버전을 물고 있으면 두 값이 어긋나서 바로 드러난다. */
async function paintBuild(){
  const els = document.querySelectorAll('.buildline');
  if (!els.length) return;
  els.forEach(el => { el.innerHTML = `build <b>${esc(BUILD)}</b>`; });
  if (!('caches' in window)) return;
  try {
    const keys = await caches.keys();
    const mine = keys.filter(k => k.startsWith('ktree-'));
    const stale = mine.filter(k => k !== `ktree-${BUILD}`);
    if (!stale.length) return;
    els.forEach(el => {
      el.innerHTML = `build <b>${esc(BUILD)}</b> · <span class="stale">cache ${esc(stale.join(', '))} — fully close and reopen the app</span>`;
    });
  } catch(_) { /* 캐시를 못 읽는 브라우저면 버전만 보여준다 */ }
}

const PROMOTE = { answers:10, days:5 };   // 목표 시간 넘긴 답(Again 제외) 10개 + 말한 날 5일

/* 보관함 "다시 보기" 중이면 오늘 판의 장면·기사를 여기 맡겨둔다. Today 로 돌아오면 되돌린다. */

function replay(over){

async function markDone(item, id){

const curStage = () => STAGES[tStage] || STAGES[1];

/* 승급 실적 — 이 단계에 올라온 뒤, 목표 시간을 넘기고 Again 이 아닌 답만 센다.
 * 같은 문항을 같은 날 여러 번 해도 한 번이다(eng_prompt_log 의 키가 그렇다). */
function stageGot(rows, sec, since){
  const hit = (rows || []).filter(r => (!since || r.done_on >= since)
    && (r.spoke_ms || 0) >= sec * 1000 && (r.self_grade === 'ok' || r.self_grade === 'good'));
  return { answers: hit.length, days: new Set(hit.map(r => r.done_on)).size };
}

/* 🔴 승급은 **다음 날부터**다. 하루 중간에 단계가 바뀌면 그날 판의 완주 조건(S2 는 장면이
 * 필수)이 갑자기 늘어 다 한 판이 미완이 된다. 그래서 stage_since 를 내일로 적고, 그날까지는
 * 이전 단계로 읽는다. 순서 탭에서 손으로 바꾼 건 바로 적용한다. */
async function loadStage(){
  const { data } = await sb.from('eng_progress').select('stage, stage_since')
    .eq('user_id', currentUser.id).maybeSingle();
  const st = data?.stage || 1, since = data?.stage_since || null;
  tStageNext = !!since && since > today();
  tStage = tStageNext ? Math.max(1, st - 1) : st;
  tStageSince = tStageNext ? null : since;
  // 🔴 단계 첫날이 비어 있으면 오늘을 첫날로 적는다. 안 적으면 todayGrammar 가 매일 "오늘이 첫날"로
  // 계산해 **첫 문법에 영원히 멈추고**, 승급 실적도 단계 이전 것까지 센다.
  if (!since) await setStage(st);
}

async function setStage(n, why, since = today()){
  // 행이 없을 수도 있다(아직 XP 를 한 번도 안 받은 사람) — upsert 로 만든다
  await sb.from('eng_progress').upsert({ user_id: currentUser.id, stage:n, stage_since:since },
    { onConflict:'user_id' });
  if (since <= today()) { tStage = n; tStageSince = since; tStageGot = { answers:0, days:0 }; tStageNext = false; }
  else tStageNext = true;
  if (why) toast(why);
}

/* 답을 채점할 때마다 부른다. 올라가면 true. */
async function checkPromote(){
  if (tStage >= 4 || tStageNext) return false;
  const { data } = await sb.from('eng_prompt_log').select('done_on, spoke_ms, self_grade')
    .eq('user_id', currentUser.id);
  tStageGot = stageGot(data, curStage().sec, tStageSince);
  if (tStageGot.answers < PROMOTE.answers || tStageGot.days < PROMOTE.days) return false;
  const next = tStage + 1;
  await setStage(next, `🎉 S${next} ${STAGES[next].name} — 내일부터 목표 ${STAGES[next].sec}초`,
                 kstDate(Date.now() + 864e5));
  return true;
}

  { st:1, name:"현재형 — I go · She goes",
    why:"평소에 하는 일은 현재형. 나·너·우리·그들은 그대로, 그 사람 하나(he·she·my friend)면 끝에 -s. 습관 문항이 전부 이거다.",
    form:[["나·너·우리·그들","I/You/We/They work"],["그 사람 하나","He/She/My friend works"],
          ["-s 붙이는 법","go → goes · watch → watches · study → studies · have → has"]],
    ex:[["I take the subway to work.","나는 지하철로 출근한다."],
        ["I go to the gym after work.","나는 퇴근 후에 헬스장에 간다."],
        ["My friend lives near my home.","내 친구는 우리 집 근처에 산다."],
        ["My mom watches dramas every night.","엄마는 매일 밤 드라마를 본다."],
        ["We have lunch together.","우리는 점심을 같이 먹는다."]],
    oops:[["I am go to work.","I go to work.","평소 하는 일엔 am 을 붙이지 않는다."],
          ["She live in Busan.","She lives in Busan.","그 사람 하나면 -s."],
          ["I going to the gym.","I go to the gym.","-ing 는 혼자 못 쓴다. 평소 일은 그냥 go."]],
    try:"평일 아침에 하는 일 하나." },
  { st:1, name:"부정 — don't · doesn't · am not",
    why:"\"안 한다/아니다\". 일반동사는 don't(그 사람 하나면 doesn't) + 동사 원형, be동사는 뒤에 not. 싫어하는 것·안 하는 것을 말해야 답에 대비가 생긴다.",
    form:[["일반동사","I don't + 동사 · He doesn't + 동사(‑s 빼고)"],["be동사","I'm not · It isn't · They aren't"],
          ["can","I can't + 동사"]],
    ex:[["I don't cook very often.","요리를 자주 안 한다."],
        ["I don't like crowded places.","붐비는 곳은 안 좋아한다."],
        ["My brother doesn't drink coffee.","형은 커피를 안 마신다."],
        ["It isn't far from here.","여기서 멀지 않다."],
        ["I'm not good at sports.","운동을 잘 못한다."]],
    oops:[["I no like it.","I don't like it.","no 로 동사를 부정하지 않는다."],
          ["He don't work here.","He doesn't work here.","그 사람 하나면 doesn't."],
          ["She doesn't likes it.","She doesn't like it.","doesn't 뒤 동사엔 -s 를 다시 안 붙인다."]],
    try:"네가 안 하는 것 하나, 안 좋아하는 것 하나." },
  { st:1, name:"There is · There are",
    why:"\"~이 있다\". 하나면 is, 여럿이면 are. 장소 묘사에서 제일 많이 쓴다 — 보이는 걸 하나씩 짚으면 30초가 찬다.",
    form:[["하나","There is a/an ~"],["여럿","There are two/many/some ~s"],
          ["없다","There isn't a ~ · There aren't any ~s"],["있어요?","Is there a ~ near here?"]],
    ex:[["There is a park near my home.","우리 집 근처에 공원이 있다."],
        ["There are two rooms in my apartment.","우리 집엔 방이 두 개 있다."],
        ["There is a coffee shop downstairs.","아래층에 카페가 있다."],
        ["There are many restaurants on my street.","우리 거리엔 식당이 많다."],
        ["There isn't a big supermarket nearby.","근처에 큰 마트는 없다."]],
    oops:[["My home has park near.","There is a park near my home.","\"~에 ~이 있다\"는 There is 로 시작하면 쉽다."],
          ["There is many shops.","There are many shops.","여럿이면 are."],
          ["Have a park near my home.","There is a park near my home.","\"있다\"를 have 로 옮기지 않는다."]],
    try:"네 동네에 뭐가 있는지 두 문장." },
  { st:1, name:"a · an · the",
    why:"처음 꺼내는 하나는 a(모음 소리 앞은 an), 이미 말했거나 서로 아는 건 the. 한국어엔 없어서 계속 빠진다 — 완벽히 못해도 a 하나만 붙여도 훨씬 자연스럽다.",
    form:[["처음 말하는 하나","a park · a small room · an apartment · an hour"],["이미 말한 것·하나뿐인 것","the park · the sea · the subway"],
          ["여럿·일반적인 것","관사 없이 — I like dogs. · Coffee is cheap."]],
    ex:[["I live in an apartment.","나는 아파트에 산다."],
        ["The park near my home is very big.","우리 집 근처 (그) 공원은 아주 크다."],
        ["I take the subway every day.","매일 지하철을 탄다."],
        ["I usually go to the beach in summer.","여름엔 보통 바다에 간다."],
        ["I like dogs.","나는 개를 좋아한다."]],
    oops:[["I live in apartment.","I live in an apartment.","셀 수 있는 것 하나엔 a/an 을 붙인다. apartment 는 모음 소리라 an."],
          ["I have a dogs.","I have dogs. / I have a dog.","a 는 하나일 때만."],
          ["There is park.","There is a park.","There is 뒤 하나에도 a."]],
    try:"네 집에 있는 물건 두 개 — 처음엔 a, 두 번째 문장에선 the." },
  { st:1, name:"in · on · at — 때와 곳",
    why:"넓으면 in, 날짜·요일은 on, 콕 집은 시각·지점은 at. 묘사·습관 문항의 문장 끝은 거의 이걸로 끝난다.",
    form:[["때","at 7 · on Monday · on weekends · in the morning · in summer · in 2020"],
          ["곳","in Seoul · in my room · on the 10th floor · on the street · at home · at work · at the station"],
          ["안 붙이는 것","last week · next month · every day · this weekend — 앞에 아무것도 안 붙는다"]],
    ex:[["I get up at seven.","7시에 일어난다."],
        ["I go hiking on weekends.","주말마다 등산 간다."],
        ["I usually work out in the evening.","보통 저녁에 운동한다."],
        ["My office is on the tenth floor.","사무실은 10층에 있다."],
        ["I stay at home on Sundays.","일요일엔 집에 있는다."]],
    oops:[["in Monday","on Monday","요일·날짜는 on."],
          ["on last weekend","last weekend","last·next·every·this 앞엔 전치사를 안 붙인다."],
          ["I'm in home.","I'm at home.","집에 있다는 at home."]],
    try:"네 하루를 시간으로 두 문장 (at ~ / in the ~)." },
  { st:1, name:"좋아하는 것·하고 싶은 것 — like ~ing · want to ~",
    why:"\"~하는 걸 좋아한다\"는 like + ~ing, \"~하고 싶다\"는 want to + 동사. 묘사·습관 문항에서 \"왜 좋냐\"를 말하는 제일 쉬운 틀이다.",
    form:[["좋아한다","I like/love/enjoy + ~ing (walking, reading)"],["하고 싶다","I want to + 동사 (go, try)"],
          ["싫다","I don't like ~ing · I hate ~ing"]],
    ex:[["I like walking by the river.","강가를 걷는 걸 좋아한다."],
        ["I enjoy cooking on weekends.","주말에 요리하는 걸 즐긴다."],
        ["I want to go to Japan again.","일본에 또 가고 싶다."],
        ["I don't like waiting in line.","줄 서서 기다리는 거 싫어한다."],
        ["I want to try surfing someday.","언젠가 서핑을 해보고 싶다."]],
    oops:[["I like walk.","I like walking.","like 뒤 동사는 ~ing (또는 to walk)."],
          ["I want go there.","I want to go there.","want 뒤엔 to 가 꼭."],
          ["I enjoy to cook.","I enjoy cooking.","enjoy 는 ~ing 만."]],
    try:"좋아하는 것 하나, 해보고 싶은 것 하나." },
  { st:1, name:"can · can't",
    why:"\"~할 수 있다/없다\". 뒤에는 동사 그대로. 롤플레이에서 부탁할 때도 이걸 쓴다(Can I ~?).",
    form:[["긍정","I can + 동사"],["부정","I can't + 동사"],["부탁·허락","Can I ~? · Can you ~?"]],
    ex:[["I can walk to the station.","역까지 걸어갈 수 있다."],
        ["I can't cook very well.","나는 요리를 잘 못한다."],
        ["Can I pay by card?","카드로 내도 돼요?"],
        ["You can see the river from my window.","창문으로 강이 보인다."],
        ["Can you recommend a good place?","좋은 곳 추천해 줄 수 있어요?"]],
    oops:[["I can to swim.","I can swim.","can 뒤엔 to 없이 동사."],
          ["She cans drive.","She can drive.","can 엔 -s 를 안 붙인다."],
          ["Can I paying by card?","Can I pay by card?","can 뒤 동사는 원형."]],
    try:"네가 할 수 있는 것 하나, 못하는 것 하나." },
  { st:1, name:"질문 만들기 — Do you ~? · Where do you ~?",
    why:"일반동사 질문은 Do 를 맨 앞에. 무엇·어디·언제를 물으면 그 앞에 What·Where·When. \"질문해 봐\" 문항이 이걸로 끝난다.",
    form:[["예/아니오","Do you + 동사? · Does he + 동사? · Are you ~? · Is it ~?"],
          ["의문사","What/Where/When/How + do you + 동사?"],
          ["자주 쓰는 것","How often ~? · How long ~? · How much is it? · What kind of ~?"]],
    ex:[["Do you like your new job?","새 직장 마음에 들어?"],
        ["Where do you usually go?","보통 어디 가?"],
        ["What time does it start?","몇 시에 시작해요?"],
        ["How often do you go there?","거기 얼마나 자주 가?"],
        ["Is it far from your home?","집에서 멀어?"]],
    oops:[["You like it?","Do you like it?","말끝만 올리지 말고 Do 를 앞에."],
          ["Where you live?","Where do you live?","의문사 뒤에 do you."],
          ["Does she likes it?","Does she like it?","Does 뒤 동사는 원형."]],
    try:"친구에게 주말 계획을 묻는 질문 두 개." },

  // ── S2 과거로 말하기 ──────────────────────────────────────
  { st:2, name:"과거형 — -ed",
    why:"지난 일은 동사 끝에 -ed. 소리는 \"드·트·이드\"로 갈린다 — 들을 때 이 끝소리를 잡아야 과거인 줄 안다.",
    form:[["대부분","watch → watched · play → played · visit → visited"],["e 로 끝나면","live → lived · move → moved"],
          ["자음+y","study → studied · try → tried"],["소리","walked(트) · played(드) · visited(이드)"]],
    ex:[["I watched a movie last night.","어젯밤 영화를 봤다."],
        ["We played soccer in the park.","우리는 공원에서 축구를 했다."],
        ["I visited Busan last summer.","작년 여름 부산에 갔다."],
        ["I moved to Seoul three years ago.","3년 전에 서울로 이사했다."],
        ["We stayed at a small hotel.","작은 호텔에 묵었다."]],
    oops:[["Yesterday I watch a movie.","Yesterday I watched a movie.","지난 일이면 동사를 과거로 — 시간 말(yesterday)만으론 안 된다."],
          ["I was watched a movie.","I watched a movie.","과거에 was 를 따로 붙이지 않는다."]],
    try:"어제 한 일 하나." },
  { st:2, name:"과거형 — went · ate · saw · had · got · took · bought",
    why:"자주 쓰는 불규칙 일곱 개. 오픽 과거 문항에 나오는 건 거의 이것뿐이다.",
    form:[["짝 1","go→went · eat→ate · see→saw · have→had"],
          ["짝 2","get→got · take→took · buy→bought · lose→lost · meet→met · find→found"]],
    ex:[["I went to Jeju with my friends.","친구들과 제주에 갔다."],
        ["We ate seafood by the sea.","바닷가에서 해산물을 먹었다."],
        ["I lost my wallet on the subway.","지하철에서 지갑을 잃어버렸다."],
        ["I saw a great movie last week.","지난주에 좋은 영화를 봤다."],
        ["I bought a new laptop last month.","지난달 노트북을 새로 샀다."]],
    oops:[["I goed there.","I went there.","go 의 과거는 went."],
          ["I buyed it.","I bought it.","buy 의 과거는 bought."]],
    try:"최근 여행이나 외식 한 문장." },
  { st:2, name:"was · were",
    why:"be동사의 과거. 나·그 사람 하나는 was, 여럿·you 는 were. 과거 경험 문항에서 \"어땠다\"(It was fun)를 말하는 유일한 길이다.",
    form:[["긍정","I/He/It was · We/You/They were"],["부정","wasn't · weren't"],["질문","Was it ~? · Were you ~?"]],
    ex:[["It was really fun.","정말 재밌었다."],
        ["The hotel was clean but small.","호텔은 깨끗했지만 작았다."],
        ["We were very tired.","우리는 너무 피곤했다."],
        ["The food wasn't very good.","음식은 별로였다."],
        ["I was so nervous on my first day.","첫 출근날 정말 긴장했다."]],
    oops:[["It is fun yesterday.","It was fun yesterday.","지난 일의 상태는 was."],
          ["We was tired.","We were tired.","여럿은 were."],
          ["I very tired.","I was very tired.","형용사 앞 be동사를 빼먹지 않는다."]],
    try:"지난 주말이 어땠는지 It was 로 두 문장." },
  { st:2, name:"과거 부정·질문 — didn't · Did you ~?",
    why:"과거를 부정하거나 물을 땐 did 가 과거를 맡고 동사는 원형으로 돌아간다. 문제해결·질문 문항에서 계속 나온다.",
    form:[["부정","I didn't + 동사원형"],["질문","Did you + 동사원형?"],["be동사","wasn't · Were you ~?"]],
    ex:[["I didn't sleep well last night.","어젯밤 잘 못 잤다."],
        ["We didn't have time to eat.","먹을 시간이 없었다."],
        ["Did you have a good weekend?","주말 잘 보냈어?"],
        ["Where did you go?","어디 갔었어?"],
        ["My package didn't arrive.","택배가 안 왔다."]],
    oops:[["I didn't went.","I didn't go.","didn't 뒤엔 원형."],
          ["Did you went there?","Did you go there?","Did 뒤도 원형."],
          ["I no went.","I didn't go.","no 로 부정하지 않는다."]],
    try:"어제 못 한 것 하나, 친구에게 과거를 묻는 질문 하나." },
  { st:2, name:"언제 — ago · last · when I was ~",
    why:"과거 문항 첫 문장은 \"언제\"로 연다. 시간을 먼저 말하면 듣는 사람이 따라오고, 너도 과거형을 떠올릴 시간이 생긴다.",
    form:[["~전에","two days ago · three years ago (숫자 + ago)"],["지난","last night · last week · last summer"],
          ["~때","when I was young · when I was in college"]],
    ex:[["Two years ago, I went to Japan.","2년 전에 일본에 갔다."],
        ["Last summer, I visited my grandparents.","지난 여름 조부모님 댁에 갔다."],
        ["When I was in college, I lived alone.","대학 때 혼자 살았다."],
        ["I started this job a year ago.","1년 전에 이 일을 시작했다."],
        ["Last weekend, it rained all day.","지난 주말엔 하루 종일 비가 왔다."]],
    oops:[["Before two years, I went.","Two years ago, I went.","\"~전에\"는 숫자 뒤에 ago."],
          ["On last week","Last week","last 앞엔 on·in 을 안 붙인다."]],
    try:"\"~ ago\"로 시작하는 기억 하나." },
  { st:2, name:"because · so",
    why:"because 뒤엔 이유, so 뒤엔 결과. 문장 두 개를 하나로 묶는 첫 고리다 — 여기서 \"이어 말하기\"가 시작된다.",
    form:[["이유","결과 + because + 이유 (I like it because it is quiet.)"],["결과","이유 + so + 결과 (It was cold, so I stayed home.)"]],
    ex:[["I like it because it is quiet.","조용해서 좋다."],
        ["It rained, so we stayed inside.","비가 와서 안에 있었다."],
        ["I was tired, so I went to bed early.","피곤해서 일찍 잤다."],
        ["I take the subway because it is fast.","빨라서 지하철을 탄다."],
        ["The bus was late, so I took a taxi.","버스가 늦어서 택시를 탔다."]],
    oops:[["Because quiet.","Because it is quiet.","because 뒤에도 주어+동사가 다 있어야 한다."],
          ["Because it was cold. So I stayed home.","It was cold, so I stayed home.","둘을 한 문장으로 잇는다."]],
    try:"네 동네가 좋은(싫은) 이유 하나." },
  { st:2, name:"얼마나 자주 — usually · sometimes · twice a week",
    why:"동사 앞에 둔다(I usually go). 습관 문항에서 이게 빠지면 \"평소\"를 묻는 질문에 답을 안 한 셈이다.",
    form:[["자주 순","always > usually > often > sometimes > rarely > never"],["자리","동사 앞 (I usually go) · be동사 뒤 (It is always busy)"],
          ["횟수","once a week · twice a month · three times a year · every day — 문장 끝"]],
    ex:[["I usually get up at seven.","보통 7시에 일어난다."],
        ["I sometimes cook on weekends.","주말에 가끔 요리한다."],
        ["I go to the gym twice a week.","일주일에 두 번 헬스장에 간다."],
        ["The subway is always crowded.","지하철은 항상 붐빈다."],
        ["I rarely eat breakfast.","아침은 거의 안 먹는다."]],
    oops:[["I go usually to the gym.","I usually go to the gym.","빈도 말은 동사 앞."],
          ["two times in a week","twice a week","\"일주일에\"는 a week."]],
    try:"운동이나 취미를 얼마나 자주 하는지." },

  // ── S3 이어 말하기 ────────────────────────────────────────
  { st:3, name:"순서 — first · then · after that",
    why:"일의 순서를 잇는 고리. 문장 다섯 개가 한 덩어리가 된다 — IL 과 IM 을 가르는 게 이 덩어리다.",
    form:[["여는 말","First, · To begin with,"],["잇는 말","Then · After that, · Next,"],["닫는 말","Finally, · In the end,"]],
    ex:[["First, I check my email.","먼저 이메일을 확인한다."],
        ["Then I have a short meeting.","그다음 짧은 회의를 한다."],
        ["After that, I start my real work.","그 후에 본격적으로 일한다."],
        ["Finally, I go home around seven.","마지막으로 7시쯤 집에 간다."],
        ["In the end, we had a great time.","결국 즐거운 시간을 보냈다."]],
    oops:[["And... and... and...","First, ~. Then ~. After that, ~.","and 로만 이으면 덩어리가 안 보인다."]],
    try:"퇴근 후 저녁을 순서대로 세 문장." },
  { st:3, name:"비교 — bigger than · more convenient · better",
    why:"짧은 말은 -er, 긴 말은 more, good 은 better. 비교 문항(예전 vs 지금)이 이걸로 굴러간다.",
    form:[["짧은 말","big → bigger · cheap → cheaper · busy → busier"],["긴 말","more convenient · more expensive"],
          ["불규칙","good → better · bad → worse"],["가장","the biggest · the most convenient · the best"]],
    ex:[["My new place is bigger than my old one.","새 집이 예전 집보다 크다."],
        ["Online shopping is more convenient.","온라인 쇼핑이 더 편하다."],

/* 🔴 알아듣기 문법. GRAMMAR(말하기)는 단계마다 천천히 가도 되지만, 듣는 문법은 **첫날부터** 필요하다 —
 * 장면 대사 658줄을 세어 보니 넷 중 하나에 could/would 가 나왔다(23%). 'll·will 16%, if 10%,
 * want/need/have to 9%, let's 8%, 진행 6%, 수동 5%, 현재완료 4%. 기본 문법을 모르면 그게 무슨
 * 문법인지조차 몰라 찾아볼 수도 없다. 그래서 대사에서 **찾아서 이름과 해석법을 붙여준다.**
 * 순서 = 우선순위. 한 줄에 칩은 두 개까지라, 더 구체적인 것(부탁·I'd like)을 앞에 둔다.
 * re 를 고치면 check-read.mjs 가 각 항목의 예문이 자기 re 에 걸리는지, 흔한 오탐을 안 거는지 본다. */
const READ = [
  { key:'request', name:'Could you ~? · Can you ~?', ko:'부탁',
    re:/\b(could|would|can|will) you\b/i,
    read:'질문 모양이지만 부탁이다 — "~해 줄 수 있어요?". could·would 가 can 보다 공손하다. 대답은 Sure. / Of course.',
    ex:[['Could you check it for me?','그거 좀 확인해 줄 수 있어요?'],['Can you send me the file?','파일 좀 보내 줄래요?']] },
  { key:'like', name:"I'd like ~", ko:'~ 주세요 · ~하고 싶어요',
    re:/\b(I'd|I would|we'd|we would) like\b|\bwould you like\b/i,
    read:"'d 는 would 다. I'd like + 물건 = ~ 주세요, I'd like to + 동사 = ~하고 싶어요. want 의 공손한 말이다.\nWould you like ~? = ~ 드릴까요?",
    ex:[["I'd like a coffee, please.",'커피 한 잔 주세요.'],["I'd like to change my booking.",'예약을 바꾸고 싶어요.']] },

    re:/\b\w+'ll\b|\bwill\b|\bwon't\b/i,
    read:"'ll 은 will 이다 — \"~할게\"(그 자리에서 정한 약속), \"~할 거야\"(예상).\nwon't 는 will not — ~안 할 거야, ~안 될 거야.",
    ex:[["I'll call you back.",'다시 전화할게.'],["It won't take long.",'오래 안 걸릴 거야.']] },
  { key:'goingto', name:'be going to · gonna', ko:'~할 거야 (정해둔 계획)',
    re:/\bgoing to (?!the\b|a\b|an\b|my\b|your\b|our\b|his\b|her\b|their\b|work\b|school\b|bed\b)\w+|\bgonna\b/i,
    read:'going to 뒤에 동사가 오면 "가다"가 아니라 미래다 — 이미 정해둔 계획. 말할 땐 gonna 로 줄인다.\n(going to the store 는 그냥 "가게에 가는 중")',
    ex:[["I'm going to visit my parents.",'부모님 댁에 갈 거야.'],["It's going to rain.",'비 올 것 같아.']] },
  { key:'should', name:'should', ko:'~하는 게 좋겠어',
    re:/\bshould(n't)?\b/i,

  { key:'maybe', name:'might · may · could be', ko:'~일지도 몰라',
    re:/\bmight\b|(?<!\bin )(?<!\bof )\bmay\b(?! \d)|\bcould (be|take|happen|work|help|get)\b/i,   // in May·May 3 은 달이다
    read:'확실하지 않을 때 — "~할지도 몰라, ~일 수도 있어".\nMay I ~? 는 따로다 — "~해도 될까요?"',
    ex:[['It might rain later.','이따 비 올지도 몰라.'],['That could be a problem.','그게 문제가 될 수도 있어.']] },
  { key:'would', name:"would · 'd", ko:'~할 텐데 · ~겠어요',
    re:/\bwould(n't)?\b(?! you\b)(?! like\b)|\b(I|you|we|they|he|she|it|that)'d\b(?! like\b)(?! better\b)/i,

    ex:[['That would be great.','그러면 정말 좋겠어요.'],["I'd rather stay home.",'차라리 집에 있을래.']] },
  { key:'if', name:'if', ko:'만약 ~하면',
    re:/\bif\b/i,

  { key:'to', name:'want to · need to · have to', ko:'~하고 싶다 · ~해야 한다',

    read:'to + 동사 = "~하는 것".\nwant to ~ = ~하고 싶다 · need to ~ = ~해야 한다 · have to ~ = (어쩔 수 없이) ~해야 한다 · try to ~ = ~하려고 하다',

    re:/\blet's\b|\blet (me|us)\b/i,

    ex:[["Let's take a break.",'좀 쉬자.'],['Let me check.','확인해 볼게요.']] },
  { key:'ing', name:'be + -ing', ko:'~하는 중',
    re:/\b(I'm|you're|we're|they're|he's|she's|it's|am|is|are|was|were)\s+(?!(nothing|something|anything|everything|thing|morning|evening|building|meeting|ceiling|during|going to)\b)\w{2,}ing\b/i,
    read:'"~하는 중이다, ~하고 있다". was ~ing = 그때 ~하고 있었다.\n가까운 미래도 된다 — I\'m leaving tomorrow = 내일 떠나.',
    ex:[["I'm working from home today.",'오늘 재택하는 중이야.'],['I was paying at the store.','가게에서 계산하고 있었어.']] },
  { key:'passive', name:'be · get + p.p.', ko:'~되다 · ~당하다',
    re:/\b(is|are|was|were|been|be|being|get|gets|got)\s+(?!used to\b)(\w{3,}ed|done|made|taken|given|sent|told|shown|known|charged|stuck|broken|lost|found|paid|sold|built|held|hurt|kept|left|stolen)\b/i,
    read:'"~되다, ~당하다" — 누가 했는지보다 무슨 일이 일어났는지가 중요할 때.\ngot + p.p. 는 말할 때 많이 쓴다 — My card got declined = 카드가 거절됐어.',
    ex:[['My card got declined.','카드가 거절됐어.'],['The flight was delayed.','비행기가 지연됐어.']] },
  { key:'perfect', name:"have + p.p. (I've been)", ko:'~해 봤다 · ~해 왔다',
    // 도치(Have you ~?)는 문장 첫머리만 — 가운데 "have it delivered" 는 사역(배달시키다)이다.
    // got 은 뺀다 — I've got 은 "있다"(= I have)라 "~해 봤다"로 읽으면 틀린다.
    re:/(?:\b(?:I've|you've|we've|they've|have|has|haven't|hasn't)|(?:^|[.?!]\s+)(?:have|has|haven't|hasn't)\s+(?:you|we|they|he|she|it|I))\s+(?:(?:already|just|never|ever|not|always|recently)\s+)*(?:been|done|gotten|had|made|seen|heard|tried|used|finished|lost|found|told|said|taken|given|come|gone|left|bought|paid|sent|\w{3,}ed)\b/i,
    read:'과거에 한 일이 지금까지 이어지거나 남아 있다. 한국어로는 상황 따라 셋 중 하나로 읽는다:\n① ~해 봤다 (경험) — I\'ve been to Japan = 일본 가 봤어\n② ~했다, 그래서 지금 그렇다 — I\'ve lost my wallet = 지갑 잃어버렸어 (지금도 없다)\n③ ~해 왔다 (계속) — I\'ve been working late = 계속 늦게까지 일해 왔어\nlast week 처럼 때를 콕 집으면 안 쓰고 그냥 과거(went)를 쓴다.',
    ex:[["I've been to Japan twice.",'일본에 두 번 가 봤어.'],["I've lost my wallet.",'지갑을 잃어버렸어.'],["We've been working late.",'계속 늦게까지 일해 왔어.']] },

    read:'전치사 뒤에 동사가 오면 -ing 로 바꾼다 — "~하는 것".\nThanks for calling = 전화해 줘서 고마워요 · before leaving = 떠나기 전에',

/* 문법 사전(순서 탭)의 그 항목을 펼쳐서 연다 */
function openGdict(key){
  show('plan');
  const d = key && document.getElementById('gd-' + key);
  if (d) d.open = true;
  (d || $('gdict'))?.scrollIntoView({ block:'start', behavior:'smooth' });
}

/* 대사에서 알아듣기 문법을 찾는다. 앞 항목이 우선, 두 개까지. m 은 실제로 걸린 조각. */
function readHits(en, max = 2){
  const out = [], s = String(en || '');
  for (let i = 0; i < READ.length && out.length < max; i++) {
    const m = s.match(READ[i].re);
    if (m) out.push({ i, m: m[0] });
  }
  return out;
}

/* 문법 한 항목을 펼친 모양 — 장면 대사 칩과 문법 사전이 같은 걸 쓴다 */
function readBoxHtml(g, hit){
  return `${hit ? `<span class="gm">이 줄에서 — “${esc(hit)}”</span>` : ''}
    <span class="gr">${esc(g.read)}</span>
    ${g.ex.map(([en, ko]) => `<button class="gex" data-en="${esc(en)}">▶ ${esc(en)}<span>${esc(ko)}</span></button>`).join('')}`;
}

/* 말하기 문법 한 항목 — 오늘 판과 문법 사전이 같은 걸 쓴다.
 * 이유 → 꼴(긍정·부정·질문) → 예문 → 자주 틀리는 것. 예문만 주면 "언제 is 고 언제 are 지"가 안 남고,
 * 틀리는 것을 안 보여주면 같은 실수를 계속한다(스피킹 교정에서 실제로 "I am live" 가 나왔다). */
function gramHtml(g, withEx = true){
  return `<span class="gr">${esc(g.why)}</span>
    ${(g.form || []).length ? `<div class="gform">${g.form.map(([k, v]) =>
      `<div class="gfr"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div>` : ''}
    ${withEx ? g.ex.map(([en, ko]) => `<button class="gex" data-en="${esc(en)}">▶ ${esc(en)}<span>${esc(ko)}</span></button>`).join('') : ''}
    ${(g.oops || []).length ? `<div class="goops"><div class="gol">자주 틀리는 것</div>${g.oops.map(([bad, good, why]) =>
      `<div class="gor"><s>${esc(bad)}</s> → <b>${esc(good)}</b><span>${esc(why)}</span></div>`).join('')}</div>` : ''}`;
}

/* 오늘의 문법. 단계에 올라온 날이 0번째 — 순서대로 돌고 다 돌면 처음부터(복습).
 * S4 는 자기 문법 + 앞 단계 전체를 섞어 복습한다. */
function todayGrammar(){
  const pool = tStage >= 4 ? GRAMMAR : GRAMMAR.filter(g => g.st === tStage);
  if (!pool.length) return null;
  const since = tStageSince || today();
  const n = Math.max(0, Math.round((Date.parse(today() + 'T00:00:00+09:00') - Date.parse(since + 'T00:00:00+09:00')) / 864e5));
  return pool[n % pool.length];
}
const XP = { commute:10, speak:20, turn:15, prodGood:10, prodMiss:4, wordGood:6, wordMiss:3,
             article:8, recog:1, quizOk:5, quizMiss:2, complete:30, cap:250 };
const RANKS = [
  [0,'Starter'], [400,'Everyday'], [1000,'Conversational'], [1800,'Fluent-ish'],
  [2800,'Confident'], [4000,'Sharp'], [5400,'Native-ish'],
];
function rankOf(xp){
  let i = 0;
  for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k][0]) i = k;
  const next = RANKS[i+1] ? RANKS[i+1][0] : RANKS[i][0] + 1800;
  return { n:i+1, name:RANKS[i][1], from:RANKS[i][0], to:next };
}

/* 프레임마다 현재 이벤트를 찾는다. timeupdate 는 초당 4회라 하이라이트가 뚝뚝 끊긴다. */
function tFollow(a, ev, paint){
  let last = -1;
  const step = () => {
    if (!a || a.paused) return;
    const ms = a.currentTime * 1000;
    let lo = 0, hi = ev.length - 1, hit = -1;
    while (lo <= hi) { const mid = (lo+hi)>>1; if (ms < ev[mid].t) hi = mid-1; else { hit = mid; lo = mid+1; } }
    if (hit >= 0 && ms > ev[hit].t + (ev[hit].d ?? 600) + 200) hit = -1;   // 문장 끝 침묵에 마지막 단어가 남지 않게
    if (hit !== last) { last = hit; paint(hit); }
    tRaf = requestAnimationFrame(step);
  };
  tRaf = requestAnimationFrame(step);
}

async function loadToday(){
  if (!currentUser) return;
  const d = today();
  const clipQ = sb.from('eng_clips').select('*').eq('user_id', currentUser.id).order('created_at');
  try {
    // 🔴 장면·기사에도 토픽 필터를 건다. 어휘에만 걸려 있어서, 마케팅을 꺼도
    // 마케팅 장면이 그대로 나왔고 거기서 뽑힌 어휘가 다시 큐로 들어왔다 —
    // 같이 쓰는 사람의 도메인 용어를 영어로 외우게 되는 상태였다.
    const tn = activeTopicNames();
    // 단계보다 어려운 장면은 안 뽑는다 (S1·S2 는 L2 까지)
    const scQ = sb.from('eng_scenes').select('*').eq('status','ready').lte('level', curStage().scMax);
    const arQ = sb.from('eng_articles').select('*');
    tClips = (await clipQ).data || [];   // 판의 Shadowing 칸이 영상이 있는지 알아야 한다
    const [sc, ar, se, pr, past] = await Promise.all([
      (tn.length ? scQ.in('topic', tn) : scQ).order('created_at',{ascending:false}).limit(30),
      (tn.length ? arQ.in('topic', tn) : arQ).order('created_at',{ascending:false}).limit(10),
      // 🔴 user_id 를 **명시한다.** 진도 공유로 읽기가 열려 있어, RLS 에 기대면
      // maybeSingle() 이 두 사람 행을 만나 터지거나 남의 진도를 내 것으로 표시한다.
      sb.from('eng_sessions').select('*').eq('user_id', currentUser.id).eq('session_date', d).maybeSingle(),
      sb.from('eng_progress').select('*').eq('user_id', currentUser.id).maybeSingle(),
      // 🔴 지난 날 무엇을 했는지. 이게 없으면 "오늘 판"이 날짜에 묶이지 않고 그냥
      // 최신 5개라, 자정이 지나면 진도만 0 이 되고 **같은 장면을 또 한다.**
      sb.from('eng_sessions').select('session_date, scene_ids, article_id')
        .eq('user_id', currentUser.id).lt('session_date', d)
        .order('session_date',{ascending:false}).limit(60),
    ]);
    // 테이블이 아직 없으면 화면이 그 사실을 말해야 한다 — 조용히 비면 버그로 보인다
    const missing = [sc,ar,se,pr].some(r => r.error && /schema cache|does not exist/i.test(r.error.message));
    if (missing) { tMissing = true; tLoaded = true; return; }
    // 오늘 판이 이미 정해져 있으면 그걸 쓴다 (하루 안에서는 내용이 안 바뀌어야 한다).
    // 없으면 **지난 날 했던 것을 빼고** 새로 고른다.
    const allSc = sc.data || [], allAr = ar.data || [];
    const pinned = se.data?.scene_ids || [];
    if (pinned.length) {
      tScenes = pinned.map(id => allSc.find(x => x.id === id)).filter(Boolean);
    } else {
      const usedSc = new Set((past.data || []).flatMap(r => r.scene_ids || []));
      const fresh = allSc.filter(x => !usedSc.has(x.id));
      // 다 소진했으면 최신 것으로라도 채운다 — 빈 날을 만들지 않는다
      tScenes = (fresh.length ? fresh : allSc).slice(0, curStage().scN);
    }
    const pinnedAr = se.data?.article_id;
    if (pinnedAr) tArticle = allAr.find(x => x.id === pinnedAr) || null;
    else {
      const usedAr = new Set((past.data || []).map(r => r.article_id).filter(Boolean));
      tArticle = allAr.find(x => !usedAr.has(x.id)) || allAr[0] || null;
    }
    tSession = se.data || null;
    tProg = pr.data || { xp_total:0, xp_today:0, xp_date:d, listened_ms:0, turns_spoken:0, articles_read:0 };
    if (tProg.xp_date !== d) { tProg.xp_today = 0; tProg.xp_date = d; }   // 날짜가 바뀌면 상한 리셋
    await materializeVocab();
    await loadTodayVocab();
  } catch (_) { tMissing = true; }
  tLoaded = true;
}

const VOCAB_NEW = 12, VOCAB_DUE = 8;   // 마무리는 2분짜리다. 더 넣으면 통째로 건너뛰게 된다.

/** 공유 장면·기사에 실린 어휘를 **내 계정의 카드로** 만들어낸다.
 *
 * 장면·기사는 둘이 같이 읽지만 SRS 상태는 사람마다 달라야 한다. 그래서 생성기는 어휘를
 * 행에 싣기만 하고, 카드는 각자의 앱이 여기서 만든다 — 그래야 같은 어휘를 각자의 진도로 간다.
 *
 * 🔴 ignoreDuplicates 가 핵심이다. 그냥 upsert 하면 **이미 복습 중인 카드의 SRS 상태가
 * 매번 초기값으로 덮인다.** 간격도 연속도 다 날아간다. */
async function materializeVocab(){
  const src = [
    ...tScenes.map(x => ({ ref:x.scene_id, topic:x.topic, scen:'scene',    kind:'scene',   v:x.vocab||[] })),
    ...(tArticle ? [{ ref:tArticle.article_id, topic:tArticle.topic, scen:'briefing', kind:'article', v:tArticle.vocab||[] }] : []),
  ];
  const rows = [];
  for (const g of src) for (const v of g.v) {
    if (!v.term) continue;
    const word = v.kind === 'word';
    const prompt = word ? v.meaning_ko : v.prompt_ko;
    if (!prompt) continue;
    rows.push({
      user_id: currentUser.id, kind: word ? 'word' : 'phrase',
      topic: g.topic || '일상', scenario: g.scen, level: v.level || 2,
      // 칸의 역할이 층마다 바뀐다 — word 는 뜻이 정답, phrase 는 상황이 문제다
      // 🔴 phrase 의 정답은 **문장(example)** 이다. prompt_ko 는 "한 달 해보고 상황을 보자고 말해봐"처럼
      //    문장 전체를 시키는데 정답이 덩어리(see how it goes)만이라 둘이 따로 놀았다 (2026-10-30 전수 수정).
      prompt_ko: prompt, answer_en: word ? v.term : (v.example || v.term),
      note: word ? (v.example || '') : (v.meaning_ko ? `${v.term} — ${v.meaning_ko}` : v.term),
      source: g.kind, source_ref: g.ref,
      // 컬럼 기본값이 current_date(**UTC**)라 KST 00~09 시에 앱을 열면 어제 날짜가 박힌다.
      // 아침 푸시가 07:30 KST 니 정확히 그 창에서 열게 된다 — 명시적으로 KST 를 넣는다.
      next_review: today(),
    });
  }
  if (!rows.length) return;
  try {
    await sb.from('eng_cards').upsert(rows,
      { onConflict:'user_id,prompt_ko,answer_en', ignoreDuplicates:true });
  } catch (_) { /* 실패해도 화면은 돈다 — 다음 로드에서 다시 시도한다 */ }
}

/* 하루 독백을 **한 주제의 콤보**로 뽑는다.
   주제는 안 해본 문항이 많이 남은 쪽부터 — 그래야 다섯 주제가 돌아간다.
   콤보 모양은 날짜로 고정해 같은 날 다시 그려도 같은 세 문항이 나온다.
   주제에 그 유형이 없으면(예: 운동엔 solve 가 없다) 같은 주제의 남은 유형으로 메운다. */
async function loadPrompts(){
  tPrompts = [];
  const [pool, log] = await Promise.all([
    sb.from('eng_prompts').select('*'),
    sb.from('eng_prompt_log').select('prompt_id, done_on, self_grade, spoke_ms')
      .eq('user_id', currentUser.id).order('done_on', { ascending:false }).limit(400),
  ]);
  tStageGot = stageGot(log.data, curStage().sec, tStageSince);
  if (pool.error || !pool.data?.length) return;        // v6 미실행이면 조용히 비운다
  const names = activeTopicNames();
  // 단계에 없는 유형은 안 뽑는다 — S1 에 롤플레이(문제해결)가 나오면 그날은 맨입이다
  const kinds = curStage().kinds;
  const all = (names.length ? pool.data.filter(p => names.includes(p.topic)) : pool.data)
    .filter(p => kinds.includes(p.kind));
  if (!all.length) return;

  const lastOf = {}, gradeOf = {};
  for (const r of (log.data || [])) {
    if (!lastOf[r.prompt_id]) { lastOf[r.prompt_id] = r.done_on; gradeOf[r.prompt_id] = r.self_grade; }
  }
  const score = p => {
    if (!lastOf[p.id]) return 0;                        // 아직 안 해본 것이 1순위
    if (gradeOf[p.id] === 'again') return 1;             // 다시 해야 한다고 스스로 찍은 것
    return 2;
  };
  const best = (a, b) => score(a) - score(b) || (lastOf[a.id] || '').localeCompare(lastOf[b.id] || '');

  // 주제 고르기 — 안 해본 문항이 많은 쪽, 같으면 가장 오래 안 건드린 쪽
  const byTopic = {};
  for (const p of all) (byTopic[p.topic] ||= []).push(p);
  const ranked = Object.keys(byTopic).sort((x, y) => {
    const fresh = t => byTopic[t].filter(p => !lastOf[p.id]).length;
    const touched = t => byTopic[t].map(p => lastOf[p.id] || '').sort()[byTopic[t].length - 1] || '';
    return fresh(y) - fresh(x) || touched(x).localeCompare(touched(y));
  });
  // 콤보를 채울 만큼 있는 주제만 — 문항 1~2개짜리 주제를 고르면 하루치가 비어버린다
  const topic = ranked.find(t => byTopic[t].length >= SPEAK_N) || ranked[0];

  // 콤보 모양대로 유형별 한 개씩, 없는 유형은 같은 주제의 남은 것으로 메운다
  const mine = byTopic[topic].slice().sort(best);
  const shape = COMBOS[Math.abs(hashDay(today())) % COMBOS.length];
  const pick = [];
  for (const k of shape) {
    const p = mine.find(x => x.kind === k && !pick.includes(x));
    if (p) pick.push(p);
  }
  for (const p of mine) { if (pick.length >= SPEAK_N) break; if (!pick.includes(p)) pick.push(p); }
  tPrompts = pick.slice(0, SPEAK_N);
  for (const x of tPrompts) x.seen = !!lastOf[x.id];   // 해본 문항은 설명·따라하기를 또 시키지 않는다
}

/** 날짜 문자열 → 작은 정수. 같은 날이면 같은 콤보가 나오게만 하면 된다. */
function hashDay(d){
  let h = 0;
  for (const c of d) h = (h * 31 + c.charCodeAt(0)) | 0;
  return h;
}

async function loadTodayVocab(){
  const d = today();
  // **"오늘 것"은 날짜가 아니라 '아직 안 만난 것'이다.**
  // 날짜로만 뽑으면 상한에 밀린 신규가 영원히 갇힌다 — status='new' 라서
  // '지난 것'(neq status new) 질의에도 안 걸리기 때문이다.
  // 실제로 오늘 90장이 만들어져 20장에서 잘렸고 70장이 고아가 될 뻔했다.
  const { data: fresh } = await sb.from('eng_cards').select('*')
    .eq('user_id', currentUser.id)
    .eq('status','new').neq('status','suspended').neq('kind','line')
    .gte('created_at', d + 'T00:00:00').limit(VOCAB_NEW);
  let mine = fresh || [];
  if (mine.length < VOCAB_NEW) {
    // 모자라면 **오래된 미학습 카드부터** 채운다 (pack 으로 올린 것도 여기서 소화된다)
    const { data: backlog } = await sb.from('eng_cards').select('*')
      .eq('user_id', currentUser.id)
      .eq('status','new').neq('status','suspended').neq('kind','line')
      .lt('created_at', d + 'T00:00:00')
      .order('created_at').limit(VOCAB_NEW - mine.length);
    mine = [...mine, ...(backlog || [])];
  }
  const { data: due } = await sb.from('eng_cards').select('*')
    .eq('user_id', currentUser.id)
    .neq('status','new').neq('status','suspended').neq('kind','line').lte('next_review', d)
    .order('next_review').limit(VOCAB_DUE);
  tVocab = { today: mine, past: due || [] };
}

async function bumpXp(n, why){
  if (!tProg) return;
  const room = Math.max(0, XP.cap - tProg.xp_today);
  const add = Math.min(n, room);
  if (!add) { tGain = -1; paintXp(why + ' (daily cap)'); return; }
  tProg.xp_total += add; tProg.xp_today += add; tGain += add;
  paintXp(why);
  try {
    await sb.from('eng_progress').upsert({
      user_id: currentUser.id, xp_total: tProg.xp_total, xp_today: tProg.xp_today,
      xp_date: tProg.xp_date, listened_ms: tProg.listened_ms, turns_spoken: tProg.turns_spoken,
      articles_read: tProg.articles_read, updated_at: new Date().toISOString(),
    }, { onConflict:'user_id' });
  } catch(_) { /* 오프라인이면 화면만 올라간다 — 다음 로드에서 맞춰진다 */ }
}

/* 칸마다 [한 것, 할 것]. 판 그리기·완주 판정·퀴즈 잠금이 **같은 계산**을 써야 한다 —
 * 따로 세면 판엔 다 찼는데 완주가 안 찍히는 날이 생긴다. */
function partState(k){
  const pg = tSession?.progress || {};
  switch (k) {
    case 'grammar': return [pg.grammar?.done || 0, todayGrammar() ? 1 : 0];
    case 'speak':   return [pg.speak?.done || 0,   tPrompts.length];
    case 'scene':   return [pg.scenes?.done || 0,  tScenes.length];
    case 'article': return [pg.article?.sent || 0, tArticle ? (tArticle.sentences || []).length : 0];
    case 'vocab':   return [pg.vocab?.done || 0,   tVocab.today.length + tVocab.past.length];
    case 'quiz':    return [pg.quiz?.done || 0,    pg.quiz?.total ?? buildQuiz().length];
    case 'shadow':  return [Math.min(Math.floor((pg.shadow?.sec || 0) / 60), SHADOW_MIN), tClips.length ? SHADOW_MIN : 0];
  }
  return [0, 0];
}
// 재료가 없는 칸(할 것 0)은 끝난 것으로 친다 — 재료가 모자란 날 완주가 불가능해지면 안 된다
function partDone(k){ const [d, n] = partState(k); return !n || d >= n; }

/* 판을 세운 날짜. 앱을 켜둔 채 자정을 넘기면 today() 는 바뀌지만 화면의 판은 어제 것이다. */
const sessDay = () => tSession?.session_date || today();

async function saveProgress(patch){
  if (tReplay) return;   // 보관함 다시 보기 — 오늘 판의 진도가 아니다
  const p = Object.assign({}, tSession?.progress || {}, patch);
  // 🔴 오늘 고른 것을 **실제로 박아둔다.** 전에는 tSession 에 없으면 빈 배열을 저장해
  // scene_ids 가 영영 null 이었고, 그래서 "오늘 판"이 날짜에 묶이지 않았다 —
  // 자정이 지나면 진도만 0 이 되고 같은 장면을 또 했다.
  // 🔴 session_date 를 매번 today() 로 잡으면 자정을 넘긴 순간 **어제 판의 진도·XP·장면이
  // 오늘 판으로 복사된다.** 실측: 10-21 00:00:59 에 어제 것이 그대로 들어와 오늘이
  // 손도 안 댔는데 완료로 찍혔고, 어제 장면 4개가 오늘 판에 박혀 같은 걸 또 하게 됐다.
  // 지금 하고 있는 건 어제 세운 판이니 **어제 날짜에** 기록한다.
  const row = { user_id: currentUser.id, session_date: sessDay(), progress: p,
                scene_ids: (tSession?.scene_ids?.length ? tSession.scene_ids : tScenes.map(x => x.id)),
                vocab_ids: (tSession?.vocab_ids?.length ? tSession.vocab_ids
                            : [...tVocab.today, ...tVocab.past].map(x => x.id)),
                xp_earned: (tSession?.xp_earned || 0) + tGain };
  if (tArticle) row.article_id = tArticle.id;
  try {
    const { data } = await sb.from('eng_sessions').upsert(row, { onConflict:'user_id,session_date' }).select().maybeSingle();
    if (data) tSession = data; else tSession = Object.assign({}, tSession, row);
  } catch(_) { tSession = Object.assign({}, tSession, row); }
}

function paintXp(why){
  const el = $('t-gain'); if (!el) return;
  el.textContent = tGain > 0 ? `+${tGain} XP today${why ? ' · ' + why : ''}` : (why || '');
  const r = rankOf(tProg?.xp_total || 0);
  const pct = Math.min(100, ((tProg?.xp_total || 0) - r.from) / (r.to - r.from) * 100);
  const b = $('t-track'); if (b) b.style.width = Math.max(pct, 2) + '%';
  const t = $('t-rank'); if (t) t.innerHTML = `Lv ${r.n} <em>${esc(r.name)}</em>`;
  const n = $('t-xpnum'); if (n) n.textContent = `${tProg?.xp_total || 0} / ${r.to} XP`;
}
