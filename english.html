/* 🔴 훑기 전체 듣기도 **한 트랙**으로 묶는다.
 * 카드 mp3 를 하나씩 이어 붙이면 장면이 겪던 그대로 — 백그라운드에서 "다음 트랙 시작"이
 * 막혀 끊긴다. 카드 오디오가 장면과 같은 24kHz 모노 MP3 라 브라우저에서 바이트로
 * 이어 붙여 Blob 하나로 만들 수 있다. 그러면 백그라운드에서도 끝까지 간다.
 * 한국어 뜻도 같은 포맷으로 구워두었기에 "해석 같이" 모드도 한 트랙이 된다. */
/** mp3 여러 개를 **바이트로 이어** 한 트랙으로 만든다.
 *  턴별·카드별 파일을 하나씩 체인으로 재생하면 iOS 홈화면 PWA 가 "한 트랙은 끝나는데
 *  다음이 시작되지 않는" WebKit 버그에 걸린다. 통짜 한 파일이면 그 함정이 없다.
 *  msedge-tts 산출물이 24kHz 모노 CBR 로 고정이라 ffmpeg 없이 이어붙여도 맞는다.
 *  groups 는 url 묶음의 배열 — 묶음 하나가 marks 한 칸이 된다. 하나라도 없으면 null. */
async function concatMp3(groups, onProgress){
  // 🔴 하나씩 순서대로 받으면 **항목 수만큼 왕복이 쌓인다** — 어휘 25개를 "해석 같이"로
  // 들으면 50왕복이라 누르고 몇 초를 기다렸다. 장면·기사는 통짜 파일 한 개라 바로 시작한다.
  // 그래서 한 번에 다 던진다. 동시 연결 수는 브라우저가 호스트당 알아서 제한한다.
  const grab = async u => {
    try { const r = await fetch(u); return r.ok ? new Uint8Array(await r.arrayBuffer()) : null; }
    catch (_) { return null; }
  };
  let done = 0;
  const got = await Promise.all(groups.map(async g => {
    const bufs = await Promise.all(g.filter(Boolean).map(grab));
    onProgress && onProgress(++done, groups.length);
    return bufs;
  }));
  const parts = [], marks = [];
  let at = 0;
  for (const bufs of got) {
    if (!bufs.length || bufs.some(b => !b)) return null;   // 하나라도 없으면 통짜를 포기한다
    marks.push(at);
    for (const b of bufs) { parts.push(b); at += b.length; }
  }
  const all = new Uint8Array(at);
  let off = 0; for (const b of parts) { all.set(b, off); off += b.length; }
  return { blob: new Blob([all], { type:'audio/mpeg' }), marks, bytes: at };
}

    </div>`;
  wireBar();

  // 경로가 글자에서 나오므로 **카드 행을 찾을 필요가 없다.** 전에는 여기서 eng_cards 를
  // 한 번 더 조회했고(큐에 안 든 어휘가 로봇 음성으로 떨어져서), 그 왕복이 Play all 을
  // 누를 때마다 기다리게 만들었다. 카드가 아직 없는 어휘도 이제 네이티브로 나온다.
  const koText = x => x.kind === 'word' ? (x.meaning_ko || '') : (x.meaning_ko || x.prompt_ko || '');
  const cards = v.map(x => ({ term:x.term, url:enUrl(x.term), koUrl:koUrl(koText(x)),
                              card:{ answer_en:x.term } }));

  const rowEl = i => el.querySelector(`.prow2[data-i="${i}"]`);
  const mark = i => {
    document.querySelectorAll('.prow2.on').forEach(x => x.classList.remove('on'));
    const r = rowEl(i); if (!r) return; r.classList.add('on');
    // 🔴 scrollIntoView 를 안 쓴다 — .prelist(overflow:hidden) 안이라 iOS 가 그 상자만 굴리려다
    // 창은 덜 움직였다(부르는 줄이 탭바 밑에). 창을 직접, 줄이 화면 1/3 쯤 오게 굴린다.
    window.scrollTo({ top: r.getBoundingClientRect().top + scrollY - innerHeight / 3, behavior:'smooth' });
  };

  // 통짜를 못 만들 때의 폴백 — 오디오가 빠진 카드가 있으면 하나씩 잇는다.
  function chainPre(cards){
    const next = i => {
      if (preStop || i >= v.length) {
        document.querySelectorAll('.prow2.on').forEach(x=>x.classList.remove('on'));
        if (!preStop && preLoop) setTimeout(() => next(0), 700);
        return;
      }
      mark(i);
      const after = () => setTimeout(() => next(i+1), 300);
      const c = cards[i].card;
      if (c && preMode === 'ko') playCard(c, () => speak(v[i].meaning_ko || v[i].prompt_ko || '', after));
      else if (c) playCard(c, after);
      else speak(v[i].term, after);
    };
    next(0);
  }

  el.querySelectorAll('.prow2').forEach(r => r.onclick = async () => {
    stopPre(); preStop = true;
    const i = +r.dataset.i;
    mark(i);
    if (cards[i].card) playCard(cards[i].card); else speak(v[i].term);
  });

  // 카드가 아직 없는 어휘도 찍을 수 있어야 한다 — 어휘 카드는 사람마다 공부하는
  // 순간 만들어지므로 "아직 없어서 못 찍는" 구멍이 생긴다.
  el.querySelectorAll('[data-ft]').forEach(b => b.onclick = () => {
    const x = v.find(y => y.term === b.dataset.ft);
    flagByText(b, { en:x.term, ko:koText(x), kind:x.kind === 'word' ? 'word' : 'phrase' });
  });
  paintFlags(el);

  el.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => {
    preMode = b.dataset.pm; stopPre();
    drawWarmup(el, { title, context, items, onDone, backLabel, nav, onNav });
  });
  if (onNav) el.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => onNav(+b.dataset.nav));

  $('pre-all').onclick = async () => {
    stopPre(); preStop = false;
    const btn = $('pre-all');
    const track = await buildPreTrack(cards, preMode === 'ko',
      (n, m) => { if (btn) btn.textContent = `… ${n}/${m}`; });
    if (btn) btn.textContent = '▶ Play all';
    if (preStop) return;
    if (!track) { chainPre(cards); return; }

    preUrl = URL.createObjectURL(track.blob);
    const a = new Audio(preUrl); preAudio = a; a.playbackRate = tRate; a.loop = preLoop;
    setMedia(title, preMode === 'ko' ? 'Warm-up · English + 뜻' : 'Warm-up · English');
    let cur = -1;
    const step = () => {
      if (!preAudio || preAudio !== a || a.paused) return;
      // 바이트 위치로 지금 몇 번째 항목인지 짚는다 (CBR 이라 시간에 비례한다)
      const pos = (a.currentTime / (a.duration || 1)) * track.bytes;
      let i = 0; for (let k = 0; k < track.marks.length; k++) if (pos >= track.marks[k]) i = k;
      if (i !== cur) { cur = i; mark(i); }
      tRaf = requestAnimationFrame(step);
    };
    a.onended = () => { cancelAnimationFrame(tRaf); document.querySelectorAll('.prow2.on').forEach(x=>x.classList.remove('on')); };
    a.play().then(() => { tRaf = requestAnimationFrame(step); }).catch(() => chainPre(cards));
  };

  $('pre-stop').onclick = stopPre;
  $('pre-loop').onclick = function(){
    preLoop = !preLoop; this.classList.toggle('on', preLoop);
    if (preAudio) preAudio.loop = preLoop;
  };
  $('pre-go').onclick = () => { stopPre(); onDone(); };
}

function drawPre(el, sc){
  const own = (sc.vocab || []).filter(x => x.term);
  // 장면의 vocab 은 표현에 쏠려 있다(실측 표현 228 · 단어 49). 그러면 훑기에 구만 나오고
  // 단어는 안 나온다 — 오늘 큐의 단어 카드를 앞에 붙여 단어 → 구 순서로 만든다.
  const haveTerm = new Set(own.map(x => x.term));
  const words = [...tVocab.today, ...tVocab.past]
    .filter(c => (c.kind || 'phrase') === 'word' && !haveTerm.has(c.answer_en))
    .slice(0, 5)
    .map(c => ({ kind:'word', term:c.answer_en, meaning_ko:c.prompt_ko, example:c.note || '' }));
  drawWarmup(el, {
    title: `${rpTag()}Scene ${scIdx+1}/${tScenes.length} · warm-up`,
    context: sc.situation_ko,
    items: [...words, ...own],
    backLabel: 'Got it — start the scene →',
    onDone: () => { scPhase = 'dialog'; drawScene(el); },
  });
}

function drawScene(el){
  const sc = tScenes[scIdx];
  if (!sc) { renderToday(); return; }
  // 다음 장면·어휘↔대화 전환은 새 화면이다 — 앞 화면에서 내려간 스크롤을 물려받지 않는다
  window.scrollTo(0, 0);
  if (scPhase === 'pre') { drawPre(el, sc); return; }
  const turns = sc.turns || [];
  el.innerHTML = actBar(`${rpTag()}Scene ${scIdx+1}/${tScenes.length}`) + sceneNav() + `
    <div class="sit" style="background:var(--eng-bg);border-radius:9px;padding:10px 13px;font-size:13px;margin-bottom:12px">
      <b style="color:var(--eng)">Context</b> · ${esc(sc.situation_ko)}</div>
    ${grammarHtml(sc)}
    <div class="actbar">
      <button class="btn sm" id="sc-listen">▶ Play all</button>
      <button class="btn sm" id="sc-fill">Fill my turns</button>
      <button class="btn sm" id="sc-stop">■ Stop</button>
      <button class="btn sm${scLoop ? ' on' : ''}" id="sc-loop" title="Play the scene over and over">🔁 Repeat</button>
      <button class="btn sm" id="sc-words">Words</button>
      <button class="btn sm${scMean ? ' on' : ''}" id="sc-mean" title="Korean for every line">해석</button>
      <button class="btn sm${scGram ? ' on' : ''}" id="sc-gram" title="문법 칩">문법</button>
    </div>
    <div id="sc-turns"></div>
    <p class="leg"><span class="sw">Dotted</span> = swallowed under 150ms. Natives barely pronounce it.</p>
    <div class="actbar" style="margin-top:14px">
      <button class="btn sm primary-btn" id="sc-next" style="padding:8px 14px">${scIdx+1 < tScenes.length ? 'Next scene →' : 'Back to Today →'}</button>
    </div>`;
  wireBar();
  el.querySelectorAll('[data-si]').forEach(b => b.onclick = () => {
    tStopAudio(); scIdx = +b.dataset.si; scPhase = 'dialog'; drawScene(el);
  });
  paintTurns(sc);
  // 기본은 1배. 자동으로 0.75× 로 내리면 원속에 귀가 안 익는다 — 실전 속도로
  // 알아듣는 게 목적이다. 느리게 듣고 싶으면 배율을 직접 누른다.
  // 🔴 전체 듣기는 **통짜 파일 한 개**로 돌린다. 백그라운드에서 끊기는 지점이
  // "다음 트랙 시작"이라, 트랙을 하나로 만들면 그 지점이 사라진다.
  // 역할 채우기는 내 턴에서 멈춰야 하므로 그대로 턴별 파일을 쓴다.
  $('sc-listen').onclick = () => {
    scMode='listen'; turns.forEach(t=>t.open=true); paintTurns(sc);
    if (sc.full_url) playFull(sc); else chainTurn(sc,0);
  };
  $('sc-fill').onclick   = () => { scMode='fill';   turns.forEach(t=>t.open=false); paintTurns(sc); chainTurn(sc,0); };
  $('sc-stop').onclick   = () => { scLoop = false; $('sc-loop')?.classList.remove('on'); tStopAudio(); };
  // 듣기는 반복이 전부다 — 한 번 듣고 넘어가면 귀에 안 남는다.
  $('sc-loop').onclick = function(){
    scLoop = !scLoop; this.classList.toggle('on', scLoop);
    if (scLoop) { scMode='listen'; turns.forEach(t=>t.open=true); paintTurns(sc); chainTurn(sc,0); }
  };
  // 대화 중에 모르는 표현이 나오면 되돌아갈 수 있어야 한다
  $('sc-words').onclick = () => { tStopAudio(); scPhase='pre'; drawScene(el); };
  $('sc-mean').onclick = function(){
    scMean = !scMean; this.classList.toggle('on', scMean);
    turns.forEach(t => t.showMean = false);   // 줄마다 따로 열어둔 것은 토글에 맞춘다
    paintTurns(sc);
  };
  $('sc-gram').onclick = function(){
    scGram = !scGram; this.classList.toggle('on', scGram);
    turns.forEach(t => t.gOpen = null);
    paintTurns(sc);
  };
  $('sc-next').onclick = async () => {
    tStopAudio();
    markDone('scene', sc.id);
    const n = Math.max(tSession?.progress?.scenes?.done || 0, scIdx + 1);
    await saveProgress({ scenes: { done: n, total: tScenes.length } });
    if (n >= tScenes.length) { await maybeComplete(); renderToday(); }
    else { scIdx = Math.min(n, tScenes.length - 1); scPhase = 'pre'; drawScene(el); }
  };
}

/* 장면에 쓰인 패턴 **하나**. 목록으로 나열하면 안 읽는 부록이 되고, 지금 막힌 건
   문법 지식이 아니라 입에서 나오느냐다. 그래서 하나만, 그 줄을 짚어서, 접어 둔다. */
function grammarHtml(sc){
  const g = sc.grammar;
  if (!g?.name_ko) return '';
  return `<details class="gram"><summary><span class="gl">문법</span>${esc(g.name_ko)}</summary>
    ${g.why_ko ? `<div class="gw">${esc(g.why_ko)}</div>` : ''}
    ${g.en ? `<div class="ge">${Number.isInteger(g.turn) ? `<em>turn ${g.turn + 1}</em> ` : ''}“${esc(g.en)}”</div>` : ''}
  </details>`;
}

function paintTurns(sc){
  const box = $('sc-turns'); box.textContent = '';
  (sc.turns || []).forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'dturn' + (t.is_me ? ' mine' : '');
    d.dataset.i = i;
    const hide = t.is_me && scMode === 'fill' && !t.open;
    // 역할 채우기로 가린 자리에는 뜻도 내주지 않는다 — 뜻이 보이면 답이 새어나간다.
    // 내 턴은 meaning_ko 가 없을 수 있으므로 intent_ko 로 대신한다 — 대화를 다
    // 이해하려면 **모든 줄**에 기댈 것이 있어야 한다. 모르는 줄이 하나라도 있으면
    // 거기서 흐름이 끊긴다.
    const mean = !hide && (t.meaning_ko || (t.is_me ? t.intent_ko : ''));
    const openMean = scMean || t.showMean;
    d.innerHTML = `<span class="who">${esc(t.role_ko || t.who)}</span><span class="line">
      ${t.is_me && t.intent_ko ? `<span class="intent">↳ ${esc(t.intent_ko)}</span>` : ''}
      ${hide ? '<span class="hid">Your turn — tap to see the model line</span>' : segHtml(t.segs || [], t.ev || [])}
      ${hide || !t.en ? '' : `<button class="btn sm tflag" data-ft="${esc(t.en)}" title="이 줄 찍어두기">☆</button>`}
      ${mean ? `<button class="tchev${openMean ? ' open' : ''}" aria-label="Show meaning" aria-expanded="${openMean}">›</button>` : ''}
      ${mean && openMean ? `<span class="mean">${esc(mean)}</span>` : ''}
      ${(hits => hits.length ? `<span class="grow">${hits.map(h =>
          `<button class="gchip${t.gOpen === h.i ? ' on' : ''}" data-gi="${h.i}">${esc(READ[h.i].ko)}</button>`).join('')}</span>
        ${hits.some(h => h.i === t.gOpen) ? `<span class="gbox"><b>${esc(READ[t.gOpen].name)}</b>
          ${readBoxHtml(READ[t.gOpen], hits.find(h => h.i === t.gOpen).m)}
          <span class="gall">문법 사전 전체 ›</span></span>` : ''}` : '')(!hide && scGram ? readHits(t.en) : [])}</span>`;
    const mb = d.querySelector('.tchev');
    if (mb) mb.onclick = e => { e.stopPropagation(); t.showMean = !t.showMean; paintTurns(sc); };
    // 문법 칩·펼침 안을 눌러도 줄 재생으로 번지면 안 된다
    d.querySelectorAll('.gchip').forEach(b => b.onclick = e => {
      e.stopPropagation(); t.gOpen = t.gOpen === +b.dataset.gi ? null : +b.dataset.gi; paintTurns(sc);
    });
    d.querySelectorAll('.gex').forEach(b => b.onclick = e => { e.stopPropagation(); playCard({ answer_en:b.dataset.en }); });
    const gb = d.querySelector('.gbox'); if (gb) gb.addEventListener('click', e => e.stopPropagation());
    const ga = d.querySelector('.gall'); if (ga) ga.onclick = e => { e.stopPropagation(); openGdict(READ[t.gOpen].key); };
    const fb = d.querySelector('.tflag');
    if (fb) fb.onclick = e => {
      e.stopPropagation();                    // 줄을 누르면 재생이라 번져선 안 된다
      flagByText(fb, { en:t.en, ko:t.meaning_ko || t.intent_ko, kind:'line',
                       topic:sc.topic, ref:sc.scene_id, audio:t.audio_url });
    };
    d.querySelector('.line').onclick = async () => {
      if (hide) {
        t.open = true; paintTurns(sc); playTurnA(sc, i);
        // 내 턴을 메운 것이 이 세션에서 가장 값나가는 행동이다
        tProg.turns_spoken = (tProg.turns_spoken || 0) + 1;
        await bumpXp(XP.turn, 'Dialogue turn');
        return;
      }
      playTurnA(sc, i);
    };
    box.appendChild(d);
  });
  paintFlags(box);
}

function playTurnA(sc, i, then){
  tStopAudio();
  const t = (sc.turns || [])[i];
  if (!t?.audio_url) { then && then(); return; }
  const el = document.querySelector(`.dturn[data-i="${i}"]`);
  el?.classList.add('on');
  // 🔴 nearest 는 화면 끝에 겨우 걸칠 만큼만 굴려서, 하단 탭바에 줄이 반쯤 가렸다 — 가운데로
  el?.scrollIntoView({ block:'center', behavior:'smooth' });
  tAudio = new Audio(t.audio_url);
  tAudio.playbackRate = tRate;
  setMedia(sc.situation_ko || 'Scene', `Scene ${scIdx+1} · turn ${i+1}`);
  tFollow(tAudio, t.ev || [], hit => {
    el?.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on'));
    if (hit >= 0) el?.querySelector(`.kw[data-e="${hit}"]`)?.classList.add('on');
  });
  tAudio.onended = () => {
    cancelAnimationFrame(tRaf);
    el?.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on'));
    el?.classList.remove('on');
    tProg.listened_ms = (tProg.listened_ms || 0) + (t.ms || 0);
    then && then();
  };
  tAudio.play().catch(() => { then && then(); });
}

/* 통짜 파일 재생 — 턴 경계는 full_starts 로 짚어 하이라이트를 유지한다. */
function playFull(sc){
  tStopAudio();
  const turns = sc.turns || [], starts = sc.full_starts || [];
  const a = new Audio(sc.full_url);
  tAudio = a; a.playbackRate = tRate;
  setMedia(sc.situation_ko || 'Scene', `Scene ${scIdx+1} · ${turns.length} turns`);

  let cur = -1;
  const step = () => {
    if (!tAudio || tAudio !== a || a.paused) return;
    const ms = a.currentTime * 1000;
    // 지금 어느 턴인지
    let i = 0; for (let k = 0; k < starts.length; k++) if (ms >= starts[k]) i = k;
    if (i !== cur) {
      document.querySelectorAll('.dturn.on').forEach(x => x.classList.remove('on'));
      const el = document.querySelector(`.dturn[data-i="${i}"]`);
      el?.classList.add('on');
      el?.scrollIntoView({ block:'center', behavior:'smooth' });
      cur = i;
    }
    // 턴 안에서의 단어 하이라이트
    const el = document.querySelector(`.dturn[data-i="${i}"]`);
    const ev = turns[i]?.ev || [], rel = ms - (starts[i] || 0);
    let hit = -1; for (let k = 0; k < ev.length; k++) if (rel >= ev[k].t) hit = k;
    if (hit >= 0 && rel > ev[hit].t + (ev[hit].d ?? 600) + 200) hit = -1;   // tFollow 과 같은 규칙
    // 문서 전체에서 끈다 — 이 턴만 끄면 앞 턴의 마지막 단어가 켜진 채 남았다
    document.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on'));
    if (hit >= 0) el?.querySelector(`.kw[data-e="${hit}"]`)?.classList.add('on');
    tRaf = requestAnimationFrame(step);
  };
  a.onended = () => {
    cancelAnimationFrame(tRaf);
    document.querySelectorAll('.dturn.on,.kw.on').forEach(x => x.classList.remove('on'));
    tProg.listened_ms = (tProg.listened_ms || 0) + (sc.ms || 0);
    if (scLoop) setTimeout(() => { if (scLoop) playFull(sc); }, 900);
  };
  a.play().then(() => { tRaf = requestAnimationFrame(step); })
          .catch(() => chainTurn(sc, 0));   // 통짜가 안 되면 기존 방식으로
}

function chainTurn(sc, i){
  const turns = sc.turns || [];
  if (i >= turns.length) {
    tStopAudio();
    if (scLoop) setTimeout(() => { if (scLoop) chainTurn(sc, 0); }, 900);   // 한 박자 쉬고 다시
    return;
  }
  const t = turns[i];
  if (scMode === 'fill' && t.is_me && !t.open) {        // 내 턴에서 멈춘다
    tStopAudio();
    const el = document.querySelector(`.dturn[data-i="${i}"]`);
    el?.classList.add('on'); el?.scrollIntoView({ block:'center', behavior:'smooth' });
    return;
  }
  playTurnA(sc, i, () => chainTurn(sc, i + 1));
}

/* ── 막 1.5 · 독백 (오픽) ───────────────────────────────
 *
 * 장면은 한 문장짜리 턴을 훈련한다. 오픽은 **혼자 60~90초**다.
 * 등급을 가르는 것은 text type — 문장 단위면 IM, 문단으로 조직하면 IH.
 * 그래서 이 화면의 목적은 "맞게 말하기"가 아니라 **분량과 구조를 버티는 것**이다.
 *
 * 녹음은 있으면 쓰고 없으면 넘어간다. iOS 홈 화면 PWA 에서 마이크가 열리는지는
 * 기기마다 다르고, 안 되더라도 타이머·모범답안만으로 훈련은 돌아가야 한다.
 */
const KIND_LABEL = { describe:'Describe', habit:'Routine', past:'Past experience',
                     compare:'Compare', ask:'Ask questions', solve:'Solve a problem' };

/* 🔴 초보의 벽은 "뭘 어떻게 말하지" 다. 모범답안은 말한 **뒤에** 나오니 그 벽엔 안 닿는다.
 * 오픽 답은 유형마다 뼈대가 고정이라 질문마다 다를 게 없다 — 상수로 둔다.
 * 접어 둔다: 시험처럼 맨입으로 해보고 싶으면 안 펴면 된다. */
const FRAME = {
  describe: [['어떤지 한마디',        `It's ~. / I'd say it's pretty ~.`],
             ['눈에 보이는 것 둘셋',  `There's ~, and right next to it, ~.`],
             ['거기서 내가 뭘 하나',  `That's where I usually ~.`],
             ['한 줄로 묶기',         `So overall, it's ~.`]],
  habit:    [['얼마나 자주',          `I'd say I ~ about twice a week.`],
             ['순서대로',             `First I ~, and then I ~. After that, ~.`],
             ['왜 그렇게 하나',       `The reason I do that is ~.`],
             ['요즘 달라진 점',       `These days, though, I ~.`]],
  past:     [['언제·어디서',          `This was about two years ago, when I ~.`],
             ['무슨 일이 있었나',     `What happened was, ~.`],
             ['그래서 어떻게 했나',   `So I ended up ~.`],
             ['그게 남긴 것',         `Looking back, it ~.`]],
  compare:  [['옛날엔 이랬다',        `Back then, ~.`],
             ['지금은 이렇다',        `But now, ~.`],
             ['뭐가 가장 바뀌었나',   `The biggest change is probably ~.`],
             ['어느 쪽이 나은가',     `Personally, I'd say ~ is better, because ~.`]],
  ask:      [['왜 묻는지 한마디',     `I have a few questions about ~.`],
             ['첫 질문',              `First, could you tell me ~?`],
             ['둘째·셋째',            `Also, I was wondering ~. And is there any way to ~?`],
             ['마무리',               `That's all I needed — thanks.`]],
  solve:    [['문제를 말한다',        `So here's the thing — ~.`],
             ['왜 곤란한지',          `The problem is that ~.`],

};

/* S1·S2 용 틀. FRAME 의 "I'd say ~"·"What happened was ~" 는 IM 영어라 NH 가 입에 못 올린다.
 * 여기 쓰는 건 그 단계 문법(be동사·현재형·There is·과거형·because)뿐이다. */
const FRAME_L1 = {
  describe: [['어떤 곳인지 한마디', `I live in a ~. / It is a ~ place.`],
             ['보이는 것',          `There is a ~. There are ~.`],
             ['거기서 내가 하는 것', `I usually ~ there.`],
             ['좋은 이유',          `I like it because it is ~.`]],
  habit:    [['얼마나 자주',        `I usually ~ every ~.`],
             ['무엇을',             `I ~ and ~.`],
             ['언제',               `I do it after work. / I do it on ~.`],
             ['왜',                 `I like it because ~.`]],
  past:     [['언제·어디',          `Last ~, I went to ~.`],
             ['무슨 일',            `I ~ed ~. But there was a problem.`],
             ['어떻게 했나',        `So I ~.`],
             ['기분',               `I was very ~.`]],
  compare:  [['예전',               `Before, I ~ed ~.`],
             ['지금',               `Now, I ~.`],
             ['차이',               `It is ~er now.`],
             ['내 생각',            `I like it now because ~.`]],
  ask:      [['한마디',             `I have some questions.`],
             ['질문 1',             `What ~ do you ~?`],
             ['질문 2',             `Where / When do you ~?`],
             ['질문 3',             `Do you ~?`]],
  solve:    [['문제',               `Hello, I have a problem.`],
             ['무슨 문제',          `I ~ed ~, but ~.`],
             ['부탁',               `Can you ~, please?`],
             ['대안',               `Or can I ~?`]],
};

/* l1 이면 S1·S2 틀. 핵심표현(phrases)은 모범답안(IH)에서 뽑은 것이라 그때는 숨긴다. */
function frameHtml(p, open, l1){
  const beats = (l1 ? FRAME_L1 : FRAME)[p.kind] || FRAME[p.kind] || [];
  const ph = l1 ? [] : (p.phrases || []);
  if (!beats.length && !p.hint_ko && !ph.length) return '';
  return `<details class="gram frame"${open ? ' open' : ''}>
    <summary><span class="gl">틀</span>막막하면 — ${esc(KIND_LABEL[p.kind] || p.kind)} 는 이 순서로</summary>
    ${p.hint_ko ? `<div class="gw">${esc(p.hint_ko)}</div>` : ''}
    ${beats.map(([ko, en]) => `<div class="fb"><span class="fk">${esc(ko)}</span><span class="fe">${esc(en)}</span></div>`).join('')}
    ${ph.length ? `<div class="spph" style="margin:10px 13px 12px">${ph.map(x =>
      `<div class="sprow"><b>${esc(x.term)}</b><span>${esc(x.meaning_ko)}</span></div>`).join('')}</div>` : ''}
  </details>`;
}
let spIdx = 0, spTimer = null, spStart = 0, spRec = null, spChunks = [], spUrl = null;
let spBlob = null;   // Done 이 녹음 Blob 을 기다리는 약속 (onstop 이 비동기라)

function spStop(){
  if (spTimer) { clearInterval(spTimer); spTimer = null; }
  try { if (spRec && spRec.state === 'recording') spRec.stop(); } catch(_) {}
}

function actSpeak(el){
  const done = tSession?.progress?.speak?.done || 0;
  const all = done >= tPrompts.length;
  spIdx = all ? 0 : Math.min(done, Math.max(tPrompts.length - 1, 0));
  spStep = tPrompts[spIdx]?.seen ? 4 : 1;   // 처음 보는 문항은 설명부터, 해본 건 바로 혼자
  drawSpeak(el);
}

/* 🔴 "자음 배운 사람에게 완전한 문장을 시키는 느낌" — 맞는 말이었다. 실측으로도
 * 3초·10초 말하고 Done 을 눌렀다. 그래서 질문 하나를 네 걸음으로 쪼갠다.
 * 걸음마다 내 입에서 나오는 양이 늘고, 마지막 걸음만 시험과 같다.
 *   1 이해 — 뭘 묻는 질문인지 읽는다 (말 안 함)
 *   2 따라 — 모범답안을 한 줄씩 듣고 그대로 따라 말한다 (내 말 0%)
 *   3 틀   — 틀만 보고 빈칸을 채워 말한다 (내 말 절반)
 *   4 혼자 — 질문만 듣고 90초 (전부 내 말, 여기만 시험)
 * 설명은 유형마다 고정이고 문항마다 다를 게 없다 — 상수로 둔다. */
const KIND_GUIDE = {
  describe: {

    when: '처음 만난 사람에게 내 공간이나 내 일을 설명하는 상황.',

    trap: '형용사만 쌓다가 30초에 막힌다. 눈에 보이는 것을 짚어라.',

    asks: '딱 한 번의 일을 시간 순서로. 언제, 무슨 일이, 어떻게 됐나.',

  },
  compare: {
    asks: '과거와 지금, 또는 둘 중 어느 쪽. 변화의 방향을 묻는다.',
    exam: '콤보의 마지막이나 어려운 쪽 문항. "과거에는 ~했는데 지금은?" 형태로 온다.',
