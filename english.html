const STEP_LABEL = ['이해', '따라', '틀', '혼자'];
let spStep = 1;

/* 모범답안을 문장으로 쪼갠다. 따라 말하기는 한 문장이 한 입이다. */
const sentences = t => (String(t || '').match(/[^.!?]+[.!?]*/g) || []).map(x => x.trim()).filter(Boolean);

const stepRow = () => `<div class="srow" style="margin-bottom:12px">${STEP_LABEL.map((l, i) =>
  `<button class="tchip${spStep === i+1 ? ' on' : ''}" data-nav="${i+1}">${i+1} ${l}</button>`).join('')}</div>`;

function qBtns(p){
  // 🔴 실제 시험은 질문이 귀로만 온다. 텍스트를 띄워두면 읽기 연습이 되고
  // "질문을 못 알아듣는" 상태가 그대로 남는다 — 시험장에서 실제로 그 일이 났다.
  return `<div class="spq">
    <span class="spkind">${esc(KIND_LABEL[p.kind] || p.kind)}</span>
    <div class="actbar" style="margin:8px 0 0">
      <button class="btn sm primary-btn" id="sp-q">🔊 Listen to the question</button>
      <button class="btn sm" id="sp-show">Show text</button>
      ${p.question_ko ? '<button class="btn sm" id="sp-ko">한국어 뜻</button>' : ''}
      <button class="btn sm" id="sp-tip" hidden>💡 팁</button>
    </div>
    <div id="sp-tips" data-tipbox hidden style="margin-top:8px"><div class="tipvid"></div></div>
    <p class="spen" id="sp-text" hidden>${esc(p.question_en)}</p>
    <p class="spen" id="sp-ko-text" hidden style="font-size:14px;color:var(--sub)">${esc(p.question_ko || '')}</p>
  </div>`;
}

function wireQ(p){
  let qPlays = 0;
  const qUrl = `${SUPABASE_URL}/storage/v1/object/public/eng-audio/prompts/${p.id}.mp3`;
  $('sp-q').onclick = function(){
    tStopAudio();
    const a = new Audio(qUrl); tAudio = a; a.playbackRate = tRate;
    setMedia('Question', KIND_LABEL[p.kind] || p.kind);
    a.onended = () => { qPlays++; this.textContent = qPlays >= 2 ? '🔊 Listen again' : `🔊 Listen again (${2-qPlays} left)`; };
    a.play().catch(() => speak(p.question_en));   // 음성이 없으면 기기 TTS
  };
  $('sp-show').onclick = function(){ $('sp-text').hidden = false; this.remove(); };
  // 뜻은 영어와 따로 연다 — 같이 열면 영어를 안 읽고 한국어만 보게 된다
  const ko = $('sp-ko'); if (ko) ko.onclick = function(){ $('sp-ko-text').hidden = false; this.remove(); };
  // 그 유형(묘사·과거·롤플레이…)의 팁 + 전 유형 팁. 많으면 앞에서 5개
  loadTips().then(() => {
    const b = $('sp-tip'), box = $('sp-tips'); if (!b || !box) return;
    const list = [...tipsFor(p.kind), ...tipsFor('general')].slice(0, 6);
    if (!list.length) return;
    b.hidden = false;
    b.onclick = () => {
      box.hidden = !box.hidden;
      if (!box.dataset.ok) { box.dataset.ok = '1'; box.insertAdjacentHTML('beforeend', list.map(x => tipHtml(x)).join('')); wireTips(box); }
    };
  });
}

function goStep(el, n){ spStop(); spStep = n; drawSpeak(el); }

/* 단계에 맞는 답. S1·S2 는 짧은 답(model_l1), 없으면 원래 답으로 떨어진다. */
const spL1 = () => curStage().model === 'l1';
const spModel = p => spL1() && p.model_l1 ? p.model_l1 : p.model_en;

function drawSpeak(el){
  spStop();
  const p = tPrompts[spIdx];
  if (!p) { renderToday(); return; }
  const head = `Speaking ${spIdx+1}/${tPrompts.length}`;

  if (spStep === 1) return drawSpBrief(el, p, head);
  if (spStep === 2) return drawSpShadow(el, p, head);
  if (spStep === 3) return drawSpFrame(el, p, head);
  return drawSpSolo(el, p, head);
}

/* 1 이해 — 말하기 전에 뭘 묻는 질문인지 안다 */
function drawSpBrief(el, p, head){
  const g = KIND_GUIDE[p.kind];
  const rows = g ? [['뭘 묻는 질문인가', g.asks], ['시험에서는', g.exam],
                    ['이런 상황이다', g.when], ['뭐가 점수가 되나', g.earns],
                    ['자주 하는 실수', g.trap]] : [];
  el.innerHTML = actBar(head) + stepRow() + qBtns(p) +
    `<div class="spnote" style="margin-top:8px;border-left:3px solid var(--eng)"><span class="l">S${tStage} ${esc(curStage().name)} — 이번 단계에서는</span>${esc(curStage().focus)}</div>` +
    rows.map(([l, t]) => `<div class="spnote" style="margin-top:8px"><span class="l">${esc(l)}</span>${esc(t)}</div>`).join('') +
    (p.hint_ko ? `<div class="spnote" style="margin-top:8px"><span class="l">이 문항 힌트</span>${esc(p.hint_ko)}</div>` : '') +
    `<div class="actbar" style="margin-top:14px">
      <button class="btn sm primary-btn" id="sp-next" style="padding:9px 16px">다음 — 따라 말하기 →</button>
    </div>`;
  wireBar(); wireQ(p);
  el.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => goStep(el, +b.dataset.nav));
  $('sp-next').onclick = () => goStep(el, 2);
}

/* 2 따라 — 어휘 훑기와 하는 일이 같다(한 줄 듣고 입으로 따라한다). 그 화면을 그대로 쓴다. */
function drawSpShadow(el, p, head){
  const ss = sentences(spModel(p));
  if (!ss.length) return goStep(el, 3);
  drawWarmup(el, {
    title: `${head} · 따라 말하기`,
    context: (spL1() ? `S${tStage} 답이다 — 짧고 쉬운 문장만 썼다. ` : '') +
      '한 줄씩 듣고 소리내서 그대로 따라 말해라. 외우는 게 아니라 입에 붙이는 것이다.',
    items: ss.map(x => ({ term:x, kind:'phrase', meaning_ko:'' })),
    backLabel: '다음 — 틀 보고 말하기 →',
    nav: stepRow(),
    onNav: n => goStep(el, n),
    onDone: () => goStep(el, 3),
  });
}

/* 3 틀 — 모범답안을 덮고 틀만 보고 말한다. 내 말이 절반 섞이는 첫 걸음이다. */
function drawSpFrame(el, p, head){
  el.innerHTML = actBar(`${head} · 틀 보고 말하기`) + stepRow() + qBtns(p) +
    `<div class="spnote" style="margin:10px 0"><span class="l">하는 법</span>박자마다 한두 문장씩, 빈칸(~)을 네 얘기로 채워 소리내서 말해라. 시간은 안 잰다. 막히면 2번으로 돌아가 다시 들어라.</div>
    ${(g => g ? `<div class="spnote" style="margin:0 0 10px;border-left:3px solid var(--warn)"><span class="l">오늘 문법 — 여기서 한 번 써봐</span>${esc(g.name)} · <i>${esc(g.ex[0][0])}</i></div>` : '')(todayGrammar())}
    ${frameHtml(p, true, spL1())}
    <div class="actbar" style="margin-top:14px">
      <button class="btn sm primary-btn" id="sp-next" style="padding:9px 16px">다음 — 혼자 ${curStage().sec}초 →</button>
    </div>`;
  wireBar(); wireQ(p);
  el.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => goStep(el, +b.dataset.nav));
  $('sp-next').onclick = () => goStep(el, 4);
}

/* 4 혼자 — 질문만 듣고 90초. 여기만 시험과 같다. */
function drawSpSolo(el, p, head){
  // 🔴 목표와 문턱은 **단계**가 정한다. 문항의 seconds(75~90)는 IH 기준이라 NH 에게 그대로 주면
  // 30초에서 막히고, 그러면 매번 실패로 끝난다 — 올라가는 재미가 안 생긴다.
  const target = curStage().sec, minSec = curStage().min;
  el.innerHTML = actBar(head) + stepRow() + qBtns(p) + `
    <div class="sptimer">
      <div class="sptime" id="sp-time">0:00</div>
      <div class="sptrack"><i id="sp-bar" style="width:0%"></i></div>
      <div class="sptarget">target ${Math.floor(target/60)}:${String(target%60).padStart(2,'0')}</div>
    </div>
    <div class="actbar">
      <button class="btn sm primary-btn" id="sp-go">▶ Start speaking</button>
      <button class="btn sm" id="sp-end" disabled>■ Done</button>
    </div>
    <audio id="sp-play" controls hidden style="width:100%;margin-top:10px"></audio>
    <div id="sp-fix"></div>
    <div id="sp-after" hidden>
      <button class="check" id="sp-reveal" style="margin-top:14px">Show a model answer</button>
      <div id="sp-model" hidden></div>
    </div>`;
  wireBar(); wireQ(p);
  el.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => goStep(el, +b.dataset.nav));
  $('sp-q').click();                               // 들어오자마자 한 번 들려준다

  const timeEl = $('sp-time'), barEl = $('sp-bar'), endEl = $('sp-end');
  const tick = () => {
    const sec = Math.floor((Date.now() - spStart) / 1000);
    timeEl.textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
    barEl.style.width = Math.min(sec / target * 100, 100) + '%';
    timeEl.classList.toggle('hit', sec >= target);
    barEl.classList.toggle('hit', sec >= target);
    // 🔴 문턱 전엔 Done 을 막는다. 3초 말하고 끝낸 날이 실제로 있었고, 그게 쌓이면
    // "했다" 는 기록만 남고 실력은 그대로다. 오픽은 분량 자체가 채점 항목이다.
    endEl.disabled = sec < minSec;
    endEl.textContent = sec < minSec ? `■ Done (${minSec - sec}s)` : '■ Done';
  };

  $('sp-go').onclick = async () => {
    spStart = Date.now(); spChunks = [];
    let gotBlob; spBlob = new Promise(r => gotBlob = r);
    $('sp-go').disabled = true;
    spTimer = setInterval(tick, 250); tick();
    // 녹음은 덤이다. 거부되거나 지원이 없으면 조용히 타이머만 돈다.
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      spRec = new MediaRecorder(stream);
      spRec.ondataavailable = e => e.data.size && spChunks.push(e.data);
      spRec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        if (!spChunks.length) return gotBlob(null);
        if (spUrl) URL.revokeObjectURL(spUrl);
        const blob = new Blob(spChunks, { type: spRec.mimeType || 'audio/webm' });
        gotBlob(blob);
        spUrl = URL.createObjectURL(blob);
        const a = $('sp-play'); if (a) { a.src = spUrl; a.hidden = false; }
      };
      spRec.start();
    } catch (_) { spRec = null; gotBlob(null); }
  };

  $('sp-end').onclick = async () => {
    const ms = Date.now() - spStart;
    spStop();
    $('sp-end').disabled = true;
    $('sp-after').hidden = false;
    tProg.turns_spoken = (tProg.turns_spoken || 0) + 1;
    await bumpXp(XP.speak, 'Monologue');
    try {
      await sb.from('eng_prompt_log').upsert({
        user_id: currentUser.id, prompt_id: p.id, done_on: today(), spoke_ms: ms,
      }, { onConflict:'user_id,prompt_id,done_on' });
    } catch(_) {}
    sendFix(p, ms);    // 기다리지 않는다 — 올리는 동안 모범답을 볼 수 있다
    $('sp-reveal').onclick = function(){
      this.remove();
      const box = $('sp-model'); box.hidden = false;
      const para = t => esc(t).replace(/\n\n/g,'</p><p>').replace(/^/,'<p>')+'</p>';
      const full = `
        ${p.model_note_ko ? `<div class="spnote"><span class="l">why it\'s built this way</span>${esc(p.model_note_ko)}</div>` : ''}
        ${(p.phrases||[]).length ? `<div class="spph">${(p.phrases||[]).map(x =>
          `<div class="sprow"><b>${esc(x.term)}</b><span>${esc(x.meaning_ko)}</span></div>`).join('')}</div>` : ''}`;
      // S1·S2 는 짧은 답이 기준이다. 긴 답은 "언젠가 갈 곳"으로 접어둔다 — 펼쳐 놓으면
      // 방금 30초를 채운 사람에게 "넌 아직 멀었다"를 보여주는 꼴이 된다.
      box.innerHTML = spL1() && p.model_l1 ? `
        <div class="spmodel">${para(p.model_l1)}</div>
        <details class="gram" style="margin-top:10px"><summary><span class="gl">S3~</span>나중에 갈 답 — 지금은 들어만 둬</summary>
          <div class="spmodel" style="margin:0 13px 12px">${para(p.model_en)}</div>${full}</details>` : `
        <div class="spmodel">${para(p.model_en)}</div>${full}`;
      box.innerHTML += `
        <div class="grades" style="margin-top:14px">
          <button class="grade miss" data-g="again">Again</button>
          <button class="grade soso" data-g="ok">OK</button>
          <button class="grade good" data-g="good">Good</button>
        </div>`;
      box.querySelector('.grades').onclick = async e => {
        const g = e.target.closest('.grade'); if (!g) return;
        try {
          await sb.from('eng_prompt_log').upsert({
            user_id: currentUser.id, prompt_id: p.id, done_on: today(),
            spoke_ms: ms, self_grade: g.dataset.g,
          }, { onConflict:'user_id,prompt_id,done_on' });
        } catch(_) {}
        try { await checkPromote(); } catch(_) {}   // 실패해도 다음 채점 때 다시 센다
        const n = Math.max(tSession?.progress?.speak?.done || 0, spIdx + 1);
        await saveProgress({ speak: { done:n, total:tPrompts.length } });
        if (n >= tPrompts.length) { await maybeComplete(); renderToday(); }
        else { spIdx = n; spStep = tPrompts[n]?.seen ? 4 : 1; drawSpeak(el); }
      };
    };
  };
}

/* ── 스피킹 교정 ─────────────────────────────────────
 * 녹음을 비공개 버킷(eng-speak)에 올리고 pending 행을 만든다. Mac 의 speak-fix.mjs 가
 * 1분마다 받아쓰기(whisper) + 교정(claude)을 해서 채운다 — 보통 1~2분. Mac 이 꺼져 있으면
 * 켜질 때 채워진다. 결과는 이 화면(기다리는 동안)과 오늘 판 아래 「스피킹 교정」에 뜬다. */
async function sendFix(p, ms){
  const box = $('sp-fix'); if (!box) return;
  const blob = spBlob ? await Promise.race([spBlob, new Promise(r => setTimeout(() => r(null), 3000))]) : null;
  if (!blob) { box.innerHTML = `<div class="spnote" style="margin-top:10px">녹음이 안 돼서 교정은 못 받아 — 마이크 권한을 확인해줘.</div>`; return; }
  box.innerHTML = fixHtml({ status:'sending' });
  const ext = /mp4|m4a|aac/.test(blob.type) ? 'm4a' : /ogg/.test(blob.type) ? 'ogg' : 'webm';
  const path = `${currentUser.id}/${today()}-${p.id.slice(0,8)}-${Date.now()}.${ext}`;
  const up = await sb.storage.from('eng-speak').upload(path, blob, { contentType: blob.type || 'audio/webm' });
  const ins = up.error ? up : await sb.from('eng_speak_fix')
    .insert({ prompt_id:p.id, stage:tStage, audio_path:path, spoke_ms:ms }).select('*').single();
  if (ins.error) { box.innerHTML = fixHtml({ status:'error', error:'올리기 실패 — 연결 확인' }); return; }
  watchFix(ins.data.id, box);
}

/** done/error 가 될 때까지 8초마다 본다. 화면을 떠나면(box 가 문서에서 빠지면) 멈춘다. */
function watchFix(id, box){
  let n = 0;
  const tick = async () => {
    if (!box.isConnected || ++n > 90) return;
    const { data } = await sb.from('eng_speak_fix').select('*, eng_prompts(question_en)').eq('id', id).maybeSingle();
    if (data) { box.innerHTML = fixHtml(data); wireFix(box); }
    if (!data || data.status === 'pending' || data.status === 'working') setTimeout(tick, 8000);
  };
  setTimeout(tick, 4000);
}

function fixHtml(r){
  const wrap = x => `<div class="fixbox">${x}</div>`;
  if (r.status === 'sending') return wrap('<div class="fixwait">⏫ 녹음 올리는 중…</div>');
  if (r.status === 'pending' || r.status === 'working') return wrap(`<div class="fixwait">⏳ ${
    r.status === 'working' ? '교정하는 중' : '교정 대기'} — 보통 1~2분. 다른 문항 해도 돼, 오늘 판 아래 「스피킹 교정」에 남아.</div>`);
  if (r.status === 'error') return wrap(`<div class="fixwait">✗ 교정 실패 — ${esc(r.error || '')}</div>`);
  const x = r.result || {};
  return wrap(`
    ${x.intent_ko ? `<div class="spnote"><span class="l">네가 하려던 말</span>${esc(x.intent_ko)}</div>` : ''}
    ${(x.fixes || []).map(f => `<div class="fixrow">
      ${f.said ? `<div class="fsaid">${esc(f.said)}</div>` : ''}
      <div class="fbetter">→ ${esc(f.better)} <button class="btn sm fplay" data-en="${esc(f.better)}">🔊</button></div>
      <div class="fwhy">${esc(f.why_ko || '')}</div></div>`).join('')}
    <div class="spnote"><span class="l">고친 답 — 이걸 따라 말해봐</span></div>
    <div class="spmodel">${sentences(x.fixed || '').map(t =>
      `<p class="fsent" data-en="${esc(t)}">${esc(t)}</p>`).join('')}</div>
    <div class="actbar" style="margin-top:6px">
      <button class="btn sm primary-btn fplayall" data-en="${esc(x.fixed || '')}">🔊 고친 답 듣기</button>
      ${r.audio_path ? `<button class="btn sm fmine" data-p="${esc(r.audio_path)}">🎙 내 녹음</button>` : ''}
    </div>
    ${x.good_ko ? `<div class="spnote"><span class="l">잘한 점</span>${esc(x.good_ko)}</div>` : ''}
    ${x.next_ko ? `<div class="spnote"><span class="l">다음엔 이거 하나만</span>${esc(x.next_ko)}</div>` : ''}
    ${r.transcript ? `<details class="gram"><summary><span class="gl">인식</span>앱이 알아들은 그대로</summary>
      <div class="fwhy" style="margin:0 13px 12px">${esc(r.transcript)}</div></details>` : ''}`);
}

function wireFix(root){
  // 원어민 음성은 일꾼이 교정할 때 글자키 경로로 구워둔다 — playCard 가 그걸 먼저 찾고 없으면 기기 음성
  root.querySelectorAll('.fplay,.fsent').forEach(b => b.onclick = e => {
    e.stopPropagation(); tStopAudio(); playCard({ answer_en:b.dataset.en });
  });
  root.querySelectorAll('.fplayall').forEach(b => b.onclick = async e => {
    e.stopPropagation(); tStopAudio();
    const ss = sentences(b.dataset.en);
    const track = await concatMp3(ss.map(t => [enUrl(t)]));
    if (!track) return speak(b.dataset.en);
    tAudio = new Audio(URL.createObjectURL(track.blob)); tAudio.playbackRate = tRate;
    tAudio.play().catch(() => {});
  });
  root.querySelectorAll('.fmine').forEach(b => b.onclick = async e => {
    e.stopPropagation(); tStopAudio();
    const { data } = await sb.storage.from('eng-speak').createSignedUrl(b.dataset.p, 600);
    if (!data) return toast('녹음을 못 불러왔어');
    tAudio = new Audio(data.signedUrl); tAudio.play().catch(() => {});
  });
}

/** 오늘 판 아래 — 최근 7일 교정. 판을 그린 뒤 채운다(판이 늦게 뜨면 안 된다). */
async function paintFixes(){
  const host = $('t-fixes'); if (!host) return;
  const { data } = await sb.from('eng_speak_fix').select('*, eng_prompts(question_en, question_ko)')
    .eq('user_id', currentUser.id).gte('created_at', kstDate(Date.now() - 6 * 864e5) + 'T00:00:00+09:00')
    .order('created_at', { ascending:false }).limit(20);
  if (!data?.length) { host.innerHTML = ''; return; }
  const mark = { done:'✓', error:'✗', pending:'⏳', working:'⏳' };
  host.innerHTML = `<div class="leg" style="margin:14px 0 6px"><b>🎙 스피킹 교정</b></div>` + data.map(r => `
    <details class="gram fixitem" data-id="${r.id}"><summary><span class="gl">${mark[r.status] || ''}</span>${
      esc(r.created_at.slice(5,10).replace('-','/'))} · ${esc(r.eng_prompts?.question_ko || r.eng_prompts?.question_en || '')}</summary>
      <div style="padding:0 13px 12px">${fixHtml(r)}</div></details>`).join('');
  wireFix(host);
  host.querySelectorAll('.fixitem').forEach(d => {
    const r = data.find(x => x.id === d.dataset.id);
    if (r.status === 'pending' || r.status === 'working') watchFix(r.id, d.querySelector('div'));
  });
}

/* ── 섀도잉 영상 — 유튜브를 구간째 따라 말한다 ─────────────
 * 친구 루틴: 10분 구간을 외울 만큼 반복 → 다음 10분, 안 되는 문장은 다시.
 * 영상은 퍼오지 않고 유튜브 공식 임베드로 튼다. 앱 장면이 본업이고 이건 진짜 억양 듣는 보조. */
const ytId = s => (String(s).match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/) || [])[1];
const ytStart = s => {   // t=190 · t=3m10s · t=1h2m
  const t = String(s).match(/[?&#]t=([\dhms]+)/)?.[1]; if (!t) return 0;
  if (/^\d+$/.test(t)) return +t;
  const n = k => +(t.match(new RegExp('(\\d+)' + k))?.[1] || 0);
  return n('h') * 3600 + n('m') * 60 + n('s');
};
const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;
let ytApi = null;
const loadYt = () => ytApi ||= new Promise(r => {
  window.onYouTubeIframeAPIReady = () => r(window.YT);
  const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.append(sc);
});

async function paintClips(){
  const host = $('t-clips'); if (!host) return;
  const { data } = await sb.from('eng_clips').select('*').eq('user_id', currentUser.id).order('created_at');
  const list = tClips = data || [];
  host.innerHTML = `<details class="sdet"${host.dataset.open ? ' open' : ''}><summary>🎬 섀도잉 영상${list.length ? ` · ${list.length}개` : ''}</summary>
    ${list.map(c => `<div class="srow" style="margin-top:8px">
      <button class="btn sm" data-clip="${c.id}" style="flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">▶ ${
        mmss(c.at_sec)}~${mmss(c.at_sec + c.chunk_sec)} · ${esc(c.title || c.video_id)}</button>
      <button class="btn sm" data-cdel="${c.id}" aria-label="지우기">✕</button></div>`).join('')}
    <div class="srow" style="margin-top:8px"><input id="t-clip-url" placeholder="유튜브 링크 (t=3m10s 면 거기서 시작)" aria-label="유튜브 링크">
      <button class="btn sm" id="t-clip-add">＋</button></div></details>`;
  const det = host.querySelector('details');
  det.ontoggle = () => { host.dataset.open = det.open ? '1' : ''; };
  host.querySelectorAll('[data-clip]').forEach(b => b.onclick = () => actClip(list.find(c => c.id === b.dataset.clip)));
  host.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('eng_clips').delete().eq('id', b.dataset.cdel);
    error ? toast('지우기 실패') : paintClips();
  });
  $('t-clip-add').onclick = async () => {
    const u = $('t-clip-url').value.trim(), id = ytId(u);
    if (!id) return toast('유튜브 링크가 아니야');
    const { error } = await sb.from('eng_clips').insert({ video_id:id, at_sec:ytStart(u) });
    error ? toast('저장 실패 — ' + error.message) : (host.dataset.open = '1', paintClips());
  };
}

/** 구간 안에서만 돈다(끝나면 구간 처음으로). A·B 로 한 문장을 묶으면 그것만 돈다. */
const SHADOW_MIN = 10;   // 판의 Shadowing 칸 — 하루 10분 (재생한 시간만 센다)
async function actClip(c){
  try { localStorage.setItem('ktree.clip', c.id); } catch (_) {}
  tStopAudio();
  $('t-board').textContent = '';
  const el = $('t-act'); el.hidden = false;
  el.innerHTML = `<div class="actbar"><button class="btn sm back" id="t-back">‹ Today</button>
      <b style="font-size:14px">섀도잉</b>
      <div class="rate2" id="c-rate"><button data-r="0.75">0.75×</button><button data-r="1" aria-pressed="true">1×</button></div></div>
    <div style="position:relative;aspect-ratio:16/9;margin:10px 0;background:#000;border-radius:10px;overflow:hidden">
      <div id="c-yt" style="position:absolute;inset:0;width:100%;height:100%"></div></div>
    <div class="leg" id="c-seg" style="margin:0 0 8px"></div>
    <div class="clines" id="c-lines"></div>
    <div class="actbar" style="flex-wrap:wrap;gap:6px">
      <button class="btn sm" id="c-back5">⏪ 5초</button>
      <button class="btn sm" id="c-a">A 여기부터</button>
      <button class="btn sm" id="c-b">B 여기까지</button>
      <button class="btn sm" id="c-next" style="margin-left:auto">다음 구간 →</button></div>
    <p class="leg">한 문장 듣고 멈춰서 <b>소리 내서</b> 따라 한다. 안 되는 문장은 A·B 로 묶어 될 때까지.
      구간을 거의 외우면 「다음 구간」. 못 한 데는 나중에 돌아와서 다시.</p>`;
  let a = null, ab = null, p = null;
  const seg = () => {
    $('c-seg').textContent = `구간 ${mmss(c.at_sec)} ~ ${mmss(c.at_sec + c.chunk_sec)}` +
      (ab ? ` · 🔁 ${mmss(ab[0])}~${mmss(ab[1])}` : a != null ? ` · A ${mmss(a)} — B 를 눌러` : '');
    $('c-a').classList.toggle('on', a != null); $('c-b').classList.toggle('on', !!ab);
  };
  // 문장·뜻 — 유튜브 임베드는 폰에서 자막을 안 띄운다. Mac 일꾼이 받아 둔 걸 구간만큼 보여준다
  let shown = [], cur = -1;
  const paintLines = () => {
    const box = $('c-lines'); cur = -1;
    if (!c.lines) {
      box.innerHTML = `<p class="leg" style="margin:8px 0">${c.lines_err
        ? '이 영상은 문장을 못 가져왔어 — ' + esc(c.lines_err) : '문장·뜻 준비 중 — 몇 분 뒤 다시 열어봐'}</p>`;
      return;
    }
    shown = c.lines.filter(l => l.t >= c.at_sec - 1 && l.t < c.at_sec + c.chunk_sec);
    box.innerHTML = shown.map((l, i) => `<button class="cl" data-i="${i}"><span class="ct">${mmss(l.t)}</span>${
      esc(l.en)}<span class="ck">${esc(l.ko || '')}</span></button>`).join('');
    box.querySelectorAll('.cl').forEach(b => b.onclick = () => p?.seekTo?.(shown[+b.dataset.i].t, true));
  };
  paintLines();
  // 🔴 광고 중엔 getCurrentTime 이 광고의 시간이라 목록이 따라 움직이고 구간 되감기도 걸렸다.
  //    API 가 광고 여부를 안 알려준다 → 길이가 마지막 자막보다 짧으면 본 영상이 아니다.
  //    ponytail: 영상보다 긴 광고는 못 거른다. 자막이 없으면 거르지 않는다.
  const lastT = c.lines?.at(-1)?.t || 0;
  const isAd = () => lastT > 0 && p.getDuration?.() > 0 && p.getDuration() < lastT;
  let sec = tSession?.progress?.shadow?.sec || 0, saved = sec;
  const saveSec = () => { if (sec - saved >= 1) { saved = sec; saveProgress({ shadow:{ sec: Math.round(sec) } }); } };
  const timer = setInterval(() => {
    if (!$('c-yt')) { saveSec(); return clearInterval(timer); }   // 다른 화면으로 갔다
    if (!p?.getCurrentTime || isAd()) return;
    if (p.getPlayerState?.() === 1) {   // 재생 중인 시간만 하루 10분에 센다
      sec += 0.2;
      if (sec - saved >= 15) saveSec();
      if (sec >= SHADOW_MIN * 60 && saved < SHADOW_MIN * 60) { saveSec(); toast(`섀도잉 ${SHADOW_MIN}분 ✓`); }
    }
    const t = p.getCurrentTime(), [lo, hi] = ab || [c.at_sec, c.at_sec + c.chunk_sec];
    if (t >= hi || t < lo - 2) p.seekTo(lo, true);
    const i = shown.findLastIndex(l => l.t <= t + 0.2);
    if (i !== cur) {
      const box = $('c-lines'), els = box.querySelectorAll('.cl');
      els[cur]?.classList.remove('on'); cur = i;
      const el = els[i]; if (!el) return;
      el.classList.add('on');
      box.scrollTop = el.offsetTop - box.clientHeight / 3;   // 페이지는 안 움직이고 목록만
    }
  }, 200);
  $('t-back').onclick = () => { clearInterval(timer); saveSec(); p?.destroy?.(); renderToday(); };
  const YT = await loadYt();
  p = new YT.Player('c-yt', { videoId: c.video_id, width:'100%', height:'100%',
    // hl:'en' — 폰 언어가 한국어면 유튜브가 자막을 한국어 자동번역으로 띄웠다. 영어 자막을 보며 따라 해야 한다
    playerVars: { start: c.at_sec, playsinline: 1, rel: 0, cc_load_policy: 1, cc_lang_pref: 'en', hl: 'en' },
    events: { onReady: () => {
      try { p.setOption('captions', 'track', { languageCode: 'en' }); } catch (_) {}
      const title = p.getVideoData?.().title;
      if (title && title !== c.title) { c.title = title; sb.from('eng_clips').update({ title }).eq('id', c.id).then(); }
    } } });
  $('c-rate').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    p.setPlaybackRate?.(+b.dataset.r);
    $('c-rate').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  };
  $('c-back5').onclick = () => p.seekTo?.(Math.max(0, p.getCurrentTime() - 5), true);
  $('c-a').onclick = () => { a = ab ? null : p.getCurrentTime?.() ?? null; ab = null; seg(); };
  $('c-b').onclick = () => {
    const t = p.getCurrentTime?.();
    if (a == null || t == null || t <= a + 0.5) return toast('A 를 먼저, B 는 그 뒤에');
    ab = [a, t]; a = null; p.seekTo(ab[0], true); seg();
  };
  $('c-next').onclick = async () => {
    c.at_sec += c.chunk_sec; a = ab = null; seg(); paintLines(); p.seekTo?.(c.at_sec, true);
    const { error } = await sb.from('eng_clips').update({ at_sec:c.at_sec }).eq('id', c.id);
    if (error) toast('구간 저장 실패');
  };
}

/** 보관함 맨 위 — 스피킹 교정 전부를 **질문별로** 묶는다. 판 아래는 7일만 보이고,
 *  같은 질문을 여러 번 하면 처음 답과 지금 답을 나란히 봐야 늘었는지 안다. 오래된 것부터. */
async function archiveFixes(){
  const { data } = await sb.from('eng_speak_fix').select('*, eng_prompts(question_en, question_ko)')
    .eq('user_id', currentUser.id).in('status', ['done','error']).order('created_at').limit(300);
  if (!data?.length) return '';
  const by = new Map();
  for (const r of data) (by.get(r.prompt_id) || by.set(r.prompt_id, []).get(r.prompt_id)).push(r);
  const groups = [...by.values()].sort((a, b) => b.at(-1).created_at.localeCompare(a.at(-1).created_at));
  return `<div class="vprog">🎙 스피킹 교정 — 질문 ${groups.length}개 · ${data.length}번</div>` + groups.map(g => `
    <details class="gram"><summary><span class="gl">${g.length}번</span>${esc(g[0].eng_prompts?.question_ko || g[0].eng_prompts?.question_en || '')}</summary>
      <div style="padding:0 13px 12px">${g.map((r, i) => `
        <details class="gram" ${i === g.length - 1 ? 'open' : ''}><summary><span class="gl">${i + 1}</span>${
          esc(r.created_at.slice(5,10).replace('-','/'))} · ${Math.round((r.spoke_ms || 0) / 1000)}초${
          r.status === 'error' ? ' · ✗' : ''}</summary><div style="padding:0 13px 12px">${fixHtml(r)}</div></details>`).join('')}
      </div></details>`).join('') + '<div style="height:14px"></div>';
}

/* ── 막 2 · 뉴스 읽기 ───────────────────────────────── */

let arPhase = 'pre';

function actArticle(el){
  const a = tArticle;
  if (!a) { renderToday(); return; }
  // 기사도 vocab 을 7~9개씩 갖고 있는데 화면이 없어 그냥 지나갔다. 장면과 같게 둔다.
  if (arPhase === 'pre') {
    drawWarmup(el, {
      title: rpTag() + 'News · warm-up',
      context: a.title,
      items: (a.vocab || []),
      backLabel: 'Got it — read the news →',
      onDone: () => { arPhase = 'read'; actArticle(el); },
    });
    return;
  }
  el.innerHTML = actBar(rpTag() + 'News') + `
    <div class="sit" style="background:var(--eng-bg);border-radius:9px;padding:10px 13px;font-size:13.5px;font-weight:600;margin-bottom:12px">${esc(a.title)}</div>
    <div class="actbar"><button class="btn sm" id="ar-play">▶ Play</button><button class="btn sm" id="ar-stop">■ Stop</button>
      <button class="btn sm" id="ar-words">Words</button>
      <span class="vprog" id="ar-prog" style="margin:0 0 0 auto"></span></div>
    <div id="ar-sents">${(a.segs||[]).map((sg,i)=>`<div class="asbox" data-s="${i}">${segHtml(sg, a.ev||[])}</div>`).join('')}</div>
    <p class="leg"><span class="sw">Dotted</span> = swallowed · tap a sentence to replay from there.</p>
    ${(a.summary_ko||[]).length ? `<div class="vcard" style="margin-top:16px"><div class="vt" style="font-size:14px">Summary</div>
      <div class="vm">${a.summary_ko.map(x=>`• ${esc(x)}`).join('<br>')}</div></div>` : ''}`;
  wireBar();
  $('ar-words').onclick = () => { tStopAudio(); arPhase = 'pre'; actArticle(el); };
  const boxes = [...el.querySelectorAll('.asbox')];
  let maxSent = tSession?.progress?.article?.sent || 0;
  const showProg = () => { $('ar-prog').textContent = `Sentence ${maxSent}/${boxes.length}`; };
  showProg();

  const run = fromMs => {
    tStopAudio();
    tAudio = new Audio(a.audio_url);
    tAudio.playbackRate = tRate;
    setMedia(a.title || 'News', 'ktree English · News');
    tAudio.currentTime = (fromMs || 0) / 1000;
    tFollow(tAudio, a.ev || [], hit => {
      el.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on'));
      boxes.forEach(b => b.classList.remove('on'));
      if (hit < 0) return;
      const span = el.querySelector(`.kw[data-e="${hit}"]`); if (!span) return;
      span.classList.add('on');
      const box = span.closest('.asbox');
      box?.classList.add('on'); box?.scrollIntoView({ block:'nearest' });
      const si = +(box?.dataset.s ?? -1);
      if (si + 1 > maxSent) { maxSent = si + 1; showProg(); }
    });
    tAudio.onended = async () => {
      tStopAudio();
      tProg.listened_ms = (tProg.listened_ms || 0) + (a.ms || 0);
      tProg.articles_read = (tProg.articles_read || 0) + 1;
      maxSent = boxes.length; showProg();
      markDone('article', tArticle?.id);
      await saveProgress({ article: { sent: maxSent, total: boxes.length } });
      await bumpXp(XP.article, 'Article finished');
      await maybeComplete();
    };
    tAudio.play().catch(()=>{});
  };
  $('ar-play').onclick = () => run(0);
  $('ar-stop').onclick = async () => { tStopAudio(); await saveProgress({ article:{ sent:maxSent, total:boxes.length } }); };
  boxes.forEach(b => b.onclick = () => run(a.starts?.[+b.dataset.s] ?? 0));
}

/* ── 막 3 · 어휘 마무리 ─────────────────────────────── */

function actVocab(el){
  // 오늘 것은 인지(채점 없음), 지난 것은 산출(SRS 채점). 방금 본 표현을 채점하면
  // 전부 "맞음"이 나와서 복습 간격이 가짜로 벌어진다.
  const list = [...tVocab.today.map(c=>({c,kind:'recog'})), ...tVocab.past.map(c=>({c,kind:'prod'}))];
  let i = tSession?.progress?.vocab?.done || 0;
  el.innerHTML = actBar('Vocab drill') + `<div class="vprog" id="v-prog"></div><div id="v-body"></div>`;
  wireBar();
  draw();

  function draw(){
    const prog = $('v-prog'), body = $('v-body');
    if (i >= list.length) {
      prog.textContent = '';
      maybeComplete();   // 어휘가 그날 마지막 칸일 수 있다 — 전엔 여기서 안 불러 완주가 안 찍혔다
      body.innerHTML = `<div class="donebox"><div class="big">🎉</div><h3>Vocab drill done</h3>
        <p>${tVocab.today.length} from today · ${tVocab.past.length} from before.</p>
        <button onclick="renderToday()">Back to Today</button></div>`;
      return;
    }
    const { c, kind } = list[i];
    const isWord = c.kind === 'word';
    prog.textContent = `${i+1} / ${list.length} · ` + (kind === 'recog'
      ? `New ${isWord ? 'word' : 'phrase'} today (just check)`
      : isWord ? 'Earlier word — meaning?' : 'Earlier phrase — say it');
    if (kind === 'recog') {
      body.innerHTML = `<div class="vcard"><span class="klabel">${isWord ? 'Word' : 'Phrase'}</span>
        <div class="vt">${esc(c.answer_en)}</div>
        <div class="vm">${esc(isWord ? c.prompt_ko : (c.note || c.prompt_ko || ''))}</div>
        ${isWord && c.note ? `<div class="vex">${esc(c.note)}</div>` : ''}
        ${c.source_ref ? `<div class="vsrc">Source · ${esc(c.source_ref)}</div>` : ''}
        <div class="srow" style="margin-top:12px">
          <button class="check" id="v-ok" style="margin-top:0;flex:1 1 auto">Got it — next</button>
          <button class="btn sm" id="v-replay" title="Play again">🔊</button>
          <button class="btn sm${c.flagged ? ' on' : ''}" id="v-flag" title="찍어두기">${c.flagged ? '★' : '☆'}</button>
          <button class="btn sm" id="v-kill" title="Never show this again">✕</button></div></div>`;
      $('v-kill').onclick = async () => {
        // 어색한 카드는 알아챈 자리에서 바로 뺄 수 있어야 한다. 참고 넘기면 계속 돌아온다.
        // 되돌리기를 붙인 이유: 주 버튼 바로 옆이라 오탭이 잦은데, 한 번 죽이면 장부에서도
        // 걸러져 앱 어디에서도 다시 못 본다. status 플래그 하나라 복구는 공짜다.
        const prev = c.status || 'new', at = i;
        const { error } = await sb.from('eng_cards').update({ status:'suspended' }).eq('id', c.id);
        if (error) return toast('Failed — check your connection');
        const [removed] = list.splice(at, 1);
        await saveProgress({ vocab:{ done:i, total:list.length } }); draw();
        toast("You won't see this again", { label:'Undo', onClick: async () => {
          const { error } = await sb.from('eng_cards').update({ status:prev }).eq('id', c.id);
          if (error) return toast('Undo failed — check your connection');
          list.splice(at, 0, removed);
          await saveProgress({ vocab:{ done:i, total:list.length } }); draw();
          toast('Restored');
        }});
      };
      $('v-ok').onclick = async () => {
        // 🔴 본 카드는 'new' 를 벗어나야 한다. 전엔 그대로 둬서 내일도 같은 12장이 '오늘 것'으로
        // 다시 나왔고, '지난 것'(채점) 큐엔 영원히 못 들어가 Studied 가 0 에 머물렀다.
        // 채점은 안 한다(방금 본 걸 채점하면 다 Good) — 내일 지난 것으로 처음 채점받는다.
        Object.assign(c, { status:'learning', interval_days:1, next_review:kstDate(Date.now() + 864e5) });
        sb.from('eng_cards').update({ status:c.status, interval_days:1, next_review:c.next_review }).eq('id', c.id)
          .then(({ error }) => error && toast('저장 실패 — 이 카드는 내일 또 나와'));
        await bumpXp(XP.recog, 'Vocab check');
        i++; await saveProgress({ vocab:{ done:i, total:list.length } }); draw();
      };
    } else if (isWord) {
      // 단어는 **영어를 보고 뜻을 떠올리는** 시험이다. 상황을 주고 말하게 하면 층이 어긋난다.
      body.innerHTML = `<div class="vcard"><span class="klabel">Word</span>
        <div class="vm" style="margin:0 0 8px">What does this mean?</div>
        <div class="vt">${esc(c.answer_en)}</div>
        <button class="check" id="v-reveal" style="margin-top:12px">Show meaning</button>
        <div id="v-ans" hidden style="margin-top:12px">
          <div class="vt" style="font-size:16px">${esc(c.prompt_ko)}</div>
          ${c.note ? `<div class="vex">${esc(c.note)}</div>` : ''}
          <div class="srow" style="margin-top:10px">
            <button class="btn sm" id="v-replay" title="Play again">🔊 Listen again</button>
            <button class="btn sm${c.flagged ? ' on' : ''}" id="v-flag" title="찍어두기">${c.flagged ? '★' : '☆'}</button>
          </div>
          <div class="grades" style="margin-top:12px">
            <button class="grade miss">Again</button><button class="grade soso">Hard</button><button class="grade good">Good</button>
          </div></div></div>`;
    } else {
      body.innerHTML = `<div class="vcard"><span class="klabel">Phrase</span>
        <div class="vm" style="margin:0 0 8px">Say this in English</div>
        <div class="vt" style="font-size:16px">${esc(c.prompt_ko)}</div>
        <button class="check" id="v-reveal" style="margin-top:12px">Show answer</button>
        <div id="v-ans" hidden style="margin-top:12px">
          <div class="vt">${esc(c.answer_en)}</div>
          ${c.note ? `<div class="vm">${esc(c.note)}</div>` : ''}
          <div class="srow" style="margin-top:10px">
            <button class="btn sm" id="v-replay" title="Play again">🔊 Listen again</button>
            <button class="btn sm${c.flagged ? ' on' : ''}" id="v-flag" title="찍어두기">${c.flagged ? '★' : '☆'}</button>
          </div>
          <div class="grades" style="margin-top:12px">
            <button class="grade miss">Again</button><button class="grade soso">Hard</button><button class="grade good">Good</button>
          </div></div></div>`;
    }
    // 🔊 다시 듣기 — 세 갈래 모두. 한 번 듣고 끝이면 못 외운 단어를 다시 들을 길이 없었다.
    const rp = $('v-replay');
    if (rp) rp.onclick = () => playVocab(c);
    const fl = $('v-flag');
    if (fl) fl.onclick = () => toggleFlag(c, fl);
    // 인지 카드는 보여주는 순간 들려준다 — 소리가 화면과 같은 카드여야 한다.
    if (kind === 'recog') playVocab(c);
    // 다음 카드 음성을 미리 받아 둔다. 탭할 때마다 네트워크를 기다리던 것이 이것 때문이다.
    const nx = list[i+1];
    if (nx) { const u = enUrl(nx.c.answer_en); if (u) { const a = new Audio(); a.preload = 'auto'; a.src = u; } }

    // 배선은 분기 밖에 둔다 — 단어·표현 두 갈래가 같은 reveal/채점을 쓴다.
    // 분기 안에 두면 새 갈래를 만들 때 조용히 빠진다 (실제로 단어 갈래가 그랬다).
    if ($('v-reveal')) {
      $('v-reveal').onclick = function(){ $('v-ans').hidden = false; this.remove(); playVocab(c); };
      body.querySelector('.grades').onclick = async e => {
        const g = e.target.closest('.grade'); if (!g) return;
        const grade = g.classList.contains('miss') ? 'miss' : g.classList.contains('soso') ? 'soso' : 'good';
        applyGrade(c, grade);
        await saveGrade(c, grade, 'vocab');
        if (!isWord) tProg.turns_spoken = (tProg.turns_spoken || 0) + 1;   // 단어는 '말한 턴'이 아니다
        // **오답에도 XP 를 준다.** 0 이면 「맞음」을 거짓으로 누르게 되고 SRS 가 망가진다.
        const good = grade !== 'miss';
        const pts = isWord ? (good ? XP.wordGood : XP.wordMiss) : (good ? XP.prodGood : XP.prodMiss);
        await bumpXp(pts, (isWord ? 'Word' : 'Production') + (good ? ' correct' : ' (XP anyway)'));
        i++; await saveProgress({ vocab:{ done:i, total:list.length } }); draw();
      };
    }
  }
}
function playVocab(c){ tStopAudio(); playCard(c); }

/* 찍어놓기 — 못 외운 것, 들어도 이해 안 되는 것을 손으로 표시한다.
   status(SRS 단계)와 섞지 않는다. 찍는 순간 복습 단계가 날아가면 안 된다. */
async function toggleFlag(c, btn){
  const want = !c.flagged;
  const { error } = await sb.from('eng_cards').update({ flagged: want }).eq('id', c.id);
  if (error) return toast('Failed — check your connection');
  c.flagged = want;
  paintFlagBtn(btn, want);
  toast(want ? '찍어뒀어 — Vocab 탭 Flagged 에서 모아 봐' : '찍기 해제');
}

function paintFlagBtn(btn, on){
  if (!btn) return;
  btn.textContent = btn.dataset.long ? (on ? '★ 찍음' : '☆ 찍어두기') : (on ? '★' : '☆');
  btn.classList.toggle('on', on);
}

/** ☆ 상태를 **그린 뒤에** 채운다.
 *  🔴 그리기 전에 질의하면 화면과 소리가 그만큼 늦어진다 (훑기가 그래서 느렸다).
 *  그래서 전에는 아예 '☆' 로 박아놨는데, 그러면 **찍어둔 게 안 보인다** — 나갔다
 *  들어오면 별이 사라진 것처럼 보이고, 누르면 해제만 됐다. 비동기로 칠한다. */
async function paintFlags(root){
  const nodes = [...root.querySelectorAll('[data-ft]')];
  const terms = [...new Set(nodes.map(n => n.dataset.ft).filter(Boolean))];
  if (!terms.length) return;
  const { data } = await sb.from('eng_cards').select('answer_en, flagged')
    .eq('user_id', currentUser.id).in('answer_en', terms);
  const on = new Set((data || []).filter(c => c.flagged).map(c => c.answer_en));
  for (const n of nodes) if (on.has(n.dataset.ft)) paintFlagBtn(n, true);
}

/** 글자로 찍는다 — 어휘든 대화 한 줄이든 같은 길을 쓴다. 카드가 없으면 만든다.
 *  대화 줄은 kind='line' 으로 들어가고 **매일 드릴 큐에는 안 든다** (loadTodayVocab) —
 *  문장이 섞이면 2분짜리 마무리가 무거워지고, 그러면 드릴 자체를 건너뛰게 된다. */
async function flagByText(btn, f){
  const en = (f.en || '').trim();
  if (!en) return;
  const { data: have } = await sb.from('eng_cards').select('id, flagged')
    .eq('user_id', currentUser.id).eq('answer_en', en).limit(1).maybeSingle();
  if (have) return toggleFlag(have, btn);
  const { error } = await sb.from('eng_cards').insert({
    user_id: currentUser.id, answer_en: en, prompt_ko: f.ko || en,
    kind: f.kind || 'phrase', topic: f.topic || '일상', source: 'flag',   // topic 은 NOT NULL
    source_ref: f.ref || null, status: 'new', flagged: true, audio_url: f.audio || null,
  });
  if (error) return toast('Failed — check your connection');
  paintFlagBtn(btn, true);
  toast('찍어뒀어 — Vocab 탭 Flagged 에서 모아 봐');
}

/* ── 막 4 · 마무리 퀴즈 ──────────────────────────────────
 *
 * 세 칸을 가로지르는 **회수(retrieval)** 한 번. 이 판에서 유일하게
 * "오늘 배운 걸 오늘 꺼내보는" 자리다 — drill 의 오늘 카드는 보기만 하고,
 * News 는 아예 확인 장치가 없었다.
 *
 * 🔴 **SRS 에 쓰지 않는다.** next_review · interval · ease 를 건드리지 않는다.
 *    방금 본 것을 채점하면 전부 "맞음"이 나와 복습 간격이 가짜로 벌어진다
 *    (drill 이 오늘 카드를 일부러 채점 안 하는 것과 같은 이유).
 *    여기 점수는 오늘 얼마나 회수됐는지를 **보여주기만** 한다.
 *
 * 문항은 **오늘 것만**으로 만든다. 새로운 걸 물으면 매일 끝에서 기분 나쁘게 끝난다.
 */

/* 날짜로 씨를 고정한다. 안 그러면 다시 그릴 때마다 문항이 바뀌어
   "3/8 까지 했다" 는 진도가 다른 문제를 가리킨다. */
function seedRng(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = h << 13 | h >>> 19;
  }
  return function(){
    h = Math.imul(h ^ h >>> 16, 2246822507);
    h = Math.imul(h ^ h >>> 13, 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}
function shuf(arr, rnd){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}

const QUIZ_MAX = 8;

/* 오늘 재료만으로 조립한다 — 새 데이터도, 스키마도, 밤 보급 변경도 없다. */
function buildQuiz(){
  const rnd = seedRng('quiz' + today());
  const todays = tVocab.today || [];
  const words   = todays.filter(c => (c.kind || 'phrase') === 'word');
  const phrases = todays.filter(c => (c.kind || 'phrase') !== 'word');
  const qs = [];

  // ① 오늘 표현 산출 — drill 에서는 보기만 했던 것을 이제 꺼낸다
  for (const c of shuf(phrases, rnd).slice(0, 3))
    qs.push({ t:'prod', card:c, prompt:c.prompt_ko, answer:c.answer_en, note:c.note || '' });

  // ② 오늘 단어 인지 — 4지선다. 오답 보기는 **오늘 다른 카드의 뜻**에서 뽑는다.
  //    공짜로 생기고, 헷갈리는 것끼리 붙여주는 효과까지 있다.
  // 🔴 오답 보기는 **같은 층에서** 먼저 뽑는다. 단어 뜻("졸린") 옆에 표현 상황
  //    ("비용을 떠안았다고 말해봐")을 세우면 생김새만 보고 걸러져서 문제가 안 된다.
  //    같은 층이 모자랄 때만 다른 층에서 채운다.
  const all = [...todays, ...(tVocab.past || [])];
  const meanings = k => [...new Set(all.filter(c => (c.kind || 'phrase') === k)
    .map(c => c.prompt_ko).filter(Boolean))];
  const wordPool = meanings('word'), otherPool = meanings('phrase');
  for (const c of shuf(words, rnd).slice(0, 3)) {
    const same = shuf(wordPool.filter(m => m !== c.prompt_ko), rnd);
    const rest = shuf(otherPool.filter(m => m !== c.prompt_ko), rnd);
    const wrong = [...same, ...rest].slice(0, 3);
    if (wrong.length < 3) {                       // 보기가 모자라면 4지선다가 성립 안 한다
      qs.push({ t:'prod', card:c, prompt:'뜻을 떠올려봐', answer:c.answer_en, note:c.prompt_ko });
      continue;
    }
    const opts = shuf([c.prompt_ko, ...wrong], rnd);
    qs.push({ t:'mcq', card:c, stem:c.answer_en, options:opts, ai:opts.indexOf(c.prompt_ko),
              note:c.note || '' });
  }

  // ③ 장면 내 턴 하나 — 오늘 말했던 대사를 다시
  const mine = [];
  for (const sc of tScenes) for (const t of (sc.turns || []))
    if (t.is_me && t.intent_ko && t.en) mine.push({ intent:t.intent_ko, en:t.en });
  for (const t of shuf(mine, rnd).slice(0, 1))
    qs.push({ t:'turn', prompt:t.intent, answer:t.en, note:'' });

  // ④ 기사 빈칸 — 오늘 어휘가 실제로 박혀 있는 문장을 찾아 그 자리를 비운다.
  //    기사 칸에 확인 장치가 하나도 없던 것을 이걸로 메운다 (내용 이해 문항은 v2).
  const sents = (tArticle?.sentences || []);
  const terms = todays.map(c => c.answer_en).filter(t => t && t.length > 2);
  const used = new Set();
  for (const term of shuf(terms, rnd)) {
    if (qs.filter(q => q.t === 'cloze').length >= 2) break;
    const low = term.toLowerCase();
    const si = sents.findIndex((x, i) => !used.has(i) && x.toLowerCase().includes(low));
    if (si < 0) continue;
    const at = sents[si].toLowerCase().indexOf(low);
    const others = [...new Set(terms.filter(x => x.toLowerCase() !== low))];
    const wc = t => t.trim().split(/\s+/).length;
    const near = shuf(others.filter(x => Math.abs(wc(x) - wc(term)) <= 1), rnd);
    const far  = shuf(others.filter(x => Math.abs(wc(x) - wc(term)) > 1), rnd);
    const wrong = [...near, ...far].slice(0, 3);
    if (wrong.length < 3) break;
    used.add(si);
    const opts = shuf([term, ...wrong], rnd);
    qs.push({ t:'cloze', before:sents[si].slice(0, at), after:sents[si].slice(at + term.length),
              options:opts, ai:opts.indexOf(term), note:'' });
  }

  // 세 문항이 안 되면 회수 연습이라 부를 게 없다 — 퀴즈 자체를 띄우지 않는다
  return qs.length >= 3 ? shuf(qs, rnd).slice(0, QUIZ_MAX) : [];
}

function actQuiz(el){
  const qs = buildQuiz();
  let i = tSession?.progress?.quiz?.done || 0;
  let right = tSession?.progress?.quiz?.right || 0;
  el.innerHTML = `<div class="actbar"><button class="btn sm back" id="t-back">‹ Today</button>
      <b style="font-size:14px">Quiz</b></div>
    <div class="vprog" id="q-prog"></div><div id="q-body"></div>`;
  $('t-back').onclick = () => { tStopAudio(); renderToday(); };
  draw();

  async function next(ok, card){
    if (ok) right++;
    await bumpXp(ok ? XP.quizOk : XP.quizMiss, ok ? 'Quiz correct' : 'Quiz (XP anyway)');
    i++;
    // 🔴 카드의 SRS 는 건드리지 않는다. 진도와 점수만 적는다.
    await saveProgress({ quiz:{ done:i, right, total:qs.length } });
    if (i >= qs.length) await maybeComplete();
    draw();
  }

  function draw(){
    const prog = $('q-prog'), body = $('q-body');
    if (i >= qs.length) {
      prog.textContent = '';
      const pct = qs.length ? Math.round(right / qs.length * 100) : 0;
      body.innerHTML = `<div class="donebox"><div class="big">${pct >= 80 ? '🎯' : pct >= 50 ? '👍' : '🌱'}</div>
        <h3>${right} / ${qs.length}</h3>
        <p>Today's board is done. Anything you missed comes back on its own —
          this score doesn't change the review schedule.</p>
        <button onclick="renderToday()">Back to Today</button></div>`;
      return;
    }
    const q = qs[i];
    prog.textContent = `${i+1} / ${qs.length} · ` + ({
      prod:'Say it in English', mcq:'What does it mean?',
      turn:'Your line from today', cloze:'Fill the gap',
    })[q.t];

    if (q.t === 'prod' || q.t === 'turn') {
      body.innerHTML = `<div class="vcard">
        <span class="klabel">${q.t === 'turn' ? 'Scene' : 'Phrase'}</span>
        <div class="vt" style="font-size:16px">${esc(q.prompt)}</div>
        <button class="check" id="q-rev" style="margin-top:12px">Show answer</button>
        <div id="q-ans" hidden style="margin-top:12px">
          <div class="vt">${esc(q.answer)}</div>
          ${q.note ? `<div class="vm">${esc(q.note)}</div>` : ''}
          <div class="grades" style="margin-top:12px">
            <button class="grade miss" data-ok="0">Missed it</button>
            <button class="grade good" data-ok="1">Got it</button>
          </div></div></div>`;
      $('q-rev').onclick = function(){
        $('q-ans').hidden = false; this.remove();
        if (q.card) playVocab(q.card);
      };
      body.querySelector('.grades').onclick = e => {
        const b = e.target.closest('[data-ok]'); if (!b) return;
        next(b.dataset.ok === '1', q.card);
      };
      return;
    }

    // 4지선다 — 누르는 즉시 정·오를 보여주고 잠깐 뒤 넘어간다
    const stem = q.t === 'mcq'
      ? `<div class="vt" style="font-size:17px">${esc(q.stem)}</div>`
      : `<div class="vt" style="font-size:15px;line-height:1.7">${esc(q.before)}<span class="qgap">____</span>${esc(q.after)}</div>`;
    body.innerHTML = `<div class="vcard"><span class="klabel">${q.t === 'mcq' ? 'Word' : 'From the article'}</span>
      ${stem}
      <div class="qopts">${q.options.map((o,k) =>
        `<button class="qopt" data-k="${k}">${esc(o)}</button>`).join('')}</div></div>`;
    body.querySelector('.qopts').onclick = e => {
      const b = e.target.closest('.qopt'); if (!b || b.disabled) return;
      const k = +b.dataset.k, ok = k === q.ai;
      body.querySelectorAll('.qopt').forEach((x, xi) => {
        x.disabled = true;
        if (xi === q.ai) x.classList.add('ok');
        else if (xi === k) x.classList.add('no');
      });
      if (q.card) playVocab(q.card);
      setTimeout(() => next(ok, q.card), ok ? 550 : 1300);   // 틀렸으면 정답을 볼 틈을 준다
    };
  }
}


/* 연속일. renderHome 을 걷어내면서 아무도 안 채우게 돼 '🔥 —' 로 굳어 있었다.
   세션이 있었던 날을 세되 **오늘 아직 안 했으면 어제부터** 센다 — 그래야 아침에 0으로 안 떨어진다. */
async function paintStreak(){
  const el = $('streak'); if (!el) return;
  try {
    const { data } = await sb.from('eng_sessions').select('session_date')
      .eq('user_id', currentUser.id)
      .order('session_date', { ascending:false }).limit(120);
    const days = new Set((data || []).map(r => r.session_date));
    let n = 0, cur = Date.now();
    if (!days.has(kstDate(cur))) cur -= 864e5;
    while (days.has(kstDate(cur))) { n++; cur -= 864e5; }
    el.textContent = n ? `🔥 ${n}d` : '🔥 not started';
  } catch (_) { el.textContent = '🔥 —'; }
}

/* 판 아래 띠 — 인박스 한 줄 · 일기 · 푸시 · 토픽 토글 */
function wireStrip(){
  const add = async () => {
    const el = $('t-inb'), v = el.value.trim();
    if (!v) return;
    const { error } = await sb.from('eng_inbox').insert({ user_id: currentUser.id, text: v });
    if (error) return toast('Could not add — check your connection');
    el.value = ''; toast('Saved to inbox — becomes a card tonight');
  };
  $('t-inb-add').onclick = add;
  $('t-inb').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

  $('t-jr-send').onclick = async () => {
    const raw = $('t-jr').value.trim();
    if (!raw) return;
    const { error } = await sb.from('eng_journal').upsert(
      { user_id: currentUser.id, entry_date: today(), raw, status: 'pending', corrected: null },
      { onConflict: 'user_id,entry_date' });
    $('t-jr-msg').textContent = error ? 'Submit failed' : '✅ Submitted — corrected overnight';
    if (!error) toast('Journal submitted 📓');
  };
  sb.from('eng_journal').select('raw,status').eq('entry_date', today()).maybeSingle()
    .then(({ data }) => {
      if (!data) return;
      $('t-jr').value = data.raw || '';
      $('t-jr-msg').textContent = data.status === 'corrected' ? '✅ Corrected' : '✅ Submitted — corrected overnight';
    }).catch(() => {});

}

/* ═══ 설정 ═══════════════════════════════════════════════
 *
 * 오늘 판에서 **설정거리만** 걷어 온 화면이다. 판에는 학습 데이터만 남긴다 —
 * 푸시 스위치와 토픽 칩은 한 번 정하면 몇 주를 안 건드리는데
 * 매일 보는 화면 꼬리를 차지하고 있었다.
 *
 * 탭이 아니라 헤더 톱니바퀴로만 들어온다. 그래서 돌아갈 길(‹ Today)을
 * 화면 안에 둔다 — 탭바에 설정이 없으니 선택된 탭이 하나도 없는 상태가 된다.
 */
function renderSettings(){
  const pushOn = typeof Notification !== 'undefined' && Notification.permission === 'granted';
  const pushNo = typeof Notification === 'undefined';
  $('st-body').innerHTML = `
    <div class="actbar"><button class="btn sm back" id="st-back">‹ Today</button>
      <b style="font-size:14px">Settings</b></div>

    <div class="stsec">
      <h3>Notifications</h3>
      <p class="leg">One push in the morning, 07:30 — how many cards are waiting.</p>
      ${pushNo
        ? `<p class="leg warnline">This browser can't do web push. On iPhone, add the app to your
             Home Screen first — Safari only allows push for installed apps.</p>`
        : `<button class="btn sm${pushOn ? ' primary-btn' : ''}" id="st-push">
             ${pushOn ? '🔔 Morning push is on' : '🔔 Turn on morning push'}</button>`}
    </div>

    <div class="stsec">
      <h3>Topics</h3>
      <p class="leg">Turned off topics drop out of the vocabulary queue and the ledger.
        Scenes and articles keep coming — this only changes what you're drilled on.</p>
      <div id="st-topics" class="srow" style="gap:5px"></div>
    </div>

    <div class="stsec">
      <h3>Account</h3>
      <p class="leg">${esc(currentUser?.email || '—')}</p>
      <button class="btn sm" id="st-out">Sign out</button>
    </div>

    <div class="stsec">
      <h3>App</h3>
      <div class="buildline" style="margin:6px 0 0;text-align:left"></div>
      <div class="buildline" id="t-supply" style="margin:2px 0 0;text-align:left"></div>
    </div>`;

  $('st-back').onclick = () => show('today');
  $('st-out').onclick = () => logout();
  const pb = $('st-push'); if (pb) pb.onclick = () => subscribePush(true);

  // 토픽 on/off — 어떤 토픽의 어휘를 큐에 넣을지 가른다
  const tw = $('st-topics'); tw.textContent = '';
  for (const t of topics) {
    const b = document.createElement('button');
    b.className = 'tchip' + (t.active ? ' on' : '');
    b.textContent = topicLabel(t.name);
    b.onclick = async () => {
      t.active = !t.active; b.classList.toggle('on', t.active);
      await sb.from('eng_topics').update({ active: t.active }).eq('id', t.id);
      // 큐가 바뀌므로 오늘 판을 다시 계산해 둔다. 화면은 설정에 그대로 있는다.
      await loadTodayVocab();
    };
    tw.appendChild(b);
  }
  paintBuild();
  // 밤 보급이 돌았는지 눈으로 확인할 수 있어야 한다 ("되고 있는지 모르겠다").
  // 🔴 **마지막으로 들어온 재료**의 날짜다. 전엔 오늘 판의 장면 날짜를 썼는데, 판은 안 해본 옛 장면부터
  // 꺼내므로 보급이 매일 와도 "10-18 · 8d old" 로 떠서 보급이 멈춘 것처럼 보였다.
  const sup = $('t-supply');
  if (sup) (async () => {   // 설정 화면은 먼저 그리고 날짜는 뒤에 채운다
    const last = t => sb.from(t).select('created_at').order('created_at', { ascending:false }).limit(1);
    const got = await Promise.all(['eng_scenes', 'eng_prompts', 'eng_articles'].map(last));
    const ts = got.map(r => r.data?.[0]?.created_at).filter(Boolean).sort().pop();
    if (!ts) sup.textContent = 'supply — none';
    else {
      const days = Math.round((Date.parse(today()+'T00:00:00+09:00') - Date.parse(kstDate(ts)+'T00:00:00+09:00')) / 864e5);
      sup.innerHTML = `supply <b>${kstDate(ts).slice(5)}</b>` +
        (days <= 0 ? '' : ` <span class="stale">${days}d old</span>`);
    }
  })();
}

/* ═══ 어휘 탭 — 쌓인 표현 전부와 SRS 상태 ═══════════════
   오늘 판의 「어휘 마무리」는 하루치만 본다. 여기는 **전체 장부**다 —
   무엇이 익었고 무엇이 아직인지, 그리고 앞당겨 복습할 자리. */
// 기본을 'studied' 로 둔다 — 쌓인 전부(수백 장)를 먼저 보여주면 "내가 뭘 공부했지"가
// 묻히고, 아직 만난 적 없는 카드까지 섞여 복습하는 자리로 안 읽힌다.
let vbFilter = 'studied', vbKind = 'all';
async function renderVocab(){
  const head = $('vb-head'), list = $('vb-list');
  const d = today();
  // 활성 토픽만 본다 — 토픽을 끄면 그 어휘는 장부에서도 빠져야 앞뒤가 맞는다
  const names = activeTopicNames();
  let q = sb.from('eng_cards').select('*').eq('user_id', currentUser.id).neq('status','suspended');
  if (names.length) q = q.in('topic', names);
  // 키가 하나면 같은 next_review 끼리 순서가 렌더마다 흔들린다 (Postgres 가 물리 순서로 준다).
  // 날짜가 몇 개 안 되고 한 날짜에 100장씩 몰려 있어 사실상 무작위로 보였다.
  //   next_review ↑  밀린 것부터
  //   created_at  ↓  최근에 배운 것을 위로 — 방금 만난 표현이 가장 찾고 싶은 것이다
  //   id          ↑  🔴 **동률을 끊는 마지막 키.** 어휘는 배치로 insert 돼 created_at 이
  //                  수십 장씩 완전히 같다 (실측: 165장이 17개 값을 공유, 최대 덩어리 51장).
  //                  유일 키를 안 끼우면 2차 정렬을 넣어도 순서가 보장되지 않는다.
  const { data, error } = await q
    .order('next_review').order('created_at', { ascending:false }).order('id')
    .limit(500);
  if (error) { head.innerHTML = '<div class="empty">Could not load vocabulary.</div>'; list.textContent=''; return; }
  const all = data || [];
  const n = k => all.filter(c => c.status === k).length;
  const due = all.filter(c => c.status !== 'new' && c.next_review <= d);
  // 🔴 칩 개수 템플릿에서 먼저 쓴다 — 아래쪽에 두면 TDZ 로 어휘 탭이 통째로 터진다
  //    (ReferenceError: Cannot access 'isStudied' before initialization)
  const isStudied = c => c.status === 'learning' || c.status === 'mature';
  // 🔴 칩 두 줄은 **서로를 반영해** 센다. 전엔 종류 칩(Word 163 · Phrase 295)이 상태와 무관하게
  // 전체를 셌는데 목록은 둘을 겹쳐 걸렀다 — "Phrase 295" 를 골랐는데 "Nothing studied yet" 이 떴다.
  // 종류 칩은 지금 상태 안에서, 상태 칩은 지금 종류 안에서 센다. 누르면 그 숫자만큼 나온다.
  const byStatus = {
    all: () => true, studied: isStudied, flagged: c => c.flagged,
    new: c => c.status === 'new', mature: c => c.status === 'mature',
  };
  const byKind = k => c => k === 'all' || (c.kind || 'phrase') === k;
  const cnt = (f, k) => all.filter(c => byStatus[f](c) && byKind(k)(c)).length;
  head.innerHTML = `
    <div class="tstats">
      <div class="tstat"><div class="v">${n('learning')+n('mature')}</div><div class="l">Studied<br><small>drilled at least once</small></div></div>
      <div class="tstat"><div class="v">${all.length}</div><div class="l">Collected</div></div>
      <div class="tstat"><div class="v">${due.length}</div><div class="l">Due today</div></div>
    </div>
    <div class="srow" style="margin:12px 0 7px">
      ${[['all','All'],['word','Word'],['phrase','Phrase'],['line','Line']]
        .map(([k,l]) => `<button class="tchip${vbKind===k?' on':''}" data-k="${k}">${l} ${cnt(vbFilter, k)}</button>`).join('')}
    </div>
    <div class="srow" style="margin:0 0 12px">
      ${[['studied','Studied'],['new','Not yet'],['mature','Mature'],['flagged','★ Flagged'],['all','All']]
        .map(([k,l]) => `<button class="tchip${vbFilter===k?' on':''}" data-f="${k}">${l} ${cnt(k, vbKind)}</button>`).join('')}
    </div>`;
  head.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { vbFilter = b.dataset.f; renderVocab(); });
  head.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { vbKind = b.dataset.k; renderVocab(); });

  const rows = all.filter(c => byStatus[vbFilter](c) && byKind(vbKind)(c));
  if (!rows.length) {
    list.innerHTML = vbFilter === 'studied'
      ? '<div class="empty">Nothing studied yet.<br>Finish a <b>Vocab drill</b> on the Today board — graded cards land here.</div>'
      : vbFilter === 'flagged'
      ? '<div class="empty">찍어둔 게 없어.<br>드릴이나 어휘 훑기에서 <b>☆</b> 를 누르면 여기 모여.</div>'
      : '<div class="empty">Nothing here. Run today\'s board once and they pile up.</div>';
    return;
  }
  // 찍은 것만 모아 한 트랙으로 — "얘들만 따로 들을 수 있게" 가 이 버튼이다.
  const bar = vbFilter === 'flagged' ? `<div class="actbar" style="margin-bottom:10px">
      <button class="btn sm primary-btn" id="vb-all">▶ 찍은 것 ${rows.length}개 듣기 (영어 → 뜻)</button>
      <button class="btn sm" id="vb-stop">■</button></div>` : '';
  const badge = c => c.status === 'mature' ? '<span class="ipill done">Mature</span>'
    : c.status === 'new' ? '<span class="ipill wait">New</span>'
    : `<span class="ipill wait">${c.interval_days}d</span>`;
  // 줄은 **누르면 펼쳐진다.** 뜻·발음·출처·빼기가 그 안에 있다 —
  // ✕ 를 모든 줄에 상시 노출하면 파괴적 동작이 목록의 기본 상태가 되고, 잘못 누르기도 쉽다.
  // **한글은 요약 줄에 두지 않는다.** 영어 옆에 답이 나란히 있으면 훑을 때마다 답을 먼저 읽게 되고,
  // 장부가 자가 점검 자리가 아니라 단순 목록이 된다. 영어를 보고 떠올린 뒤 펼쳐 맞춘다.
  list.innerHTML = bar + rows.map(c => `<div class="vrow" data-id="${esc(c.id)}">
      <button class="vsum">
        <span class="itx"><span class="ie">${esc(c.answer_en)}
          ${(c.kind||'phrase')==='word' ? '<em class="kdot">Word</em>' : ''}</span></span>
        ${badge(c)}<span class="vchev">›</span>
      </button>
      <div class="vmore" hidden>
        <div class="vmean"><span class="vmk">${(c.kind||'phrase')==='word' ? 'Meaning' : 'Context'}</span>${esc(c.prompt_ko)}</div>
        ${c.note ? `<div class="vnote">${esc(c.note)}</div>` : ''}
        <div class="vmeta">${c.next_review ? 'Next review ' + esc(c.next_review) : ''}${c.source_ref ? ' · ' + esc(c.source_ref) : ''}</div>
        <div class="srow" style="margin-top:9px">
          <button class="btn sm" data-play="${esc(c.id)}">🔊 Listen</button>
          <button class="btn sm${c.flagged ? ' on' : ''}" data-flag="${esc(c.id)}" data-long="1">${c.flagged ? '★ 찍음' : '☆ 찍어두기'}</button>
          <button class="btn sm vkill" data-kill="${esc(c.id)}">Never again</button>
        </div>
      </div></div>`).join('');

  list.querySelectorAll('.vsum').forEach(b => b.onclick = () => {
    const row = b.closest('.vrow'), more = row.querySelector('.vmore');
    const open = !more.hidden;
    list.querySelectorAll('.vmore').forEach(m => m.hidden = true);
    list.querySelectorAll('.vrow').forEach(r => r.classList.remove('open'));
    if (!open) { more.hidden = false; row.classList.add('open'); }
  });
  const byId = Object.fromEntries(rows.map(c => [c.id, c]));
  list.querySelectorAll('[data-play]').forEach(b => b.onclick = () => {
    tStopAudio(); playCard(byId[b.dataset.play]);
  });
  list.querySelectorAll('[data-flag]').forEach(b => b.onclick = () => toggleFlag(byId[b.dataset.flag], b));
  const va = $('vb-all');
  if (va) {
    va.onclick = async () => {
      tStopAudio();
      const label = va.textContent; va.disabled = true;
      const track = await concatMp3(rows.map(c => [c.audio_url || enUrl(c.answer_en), koUrl(c.prompt_ko)]),
        (n, m) => { va.textContent = `… ${n}/${m}`; });
      va.textContent = label; va.disabled = false;
      if (!track) return toast('오디오 일부가 아직 안 올라왔어');
      tAudio = new Audio(URL.createObjectURL(track.blob));
      tAudio.playbackRate = tRate;
      setMedia('Flagged vocabulary', `ktree English · ${rows.length} items`);
      tAudio.play().catch(() => {});
    };
    $('vb-stop').onclick = () => tStopAudio();
  }
  list.querySelectorAll('[data-kill]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const id = b.dataset.kill, prev = byId[id]?.status || 'new';
    const { error } = await sb.from('eng_cards').update({ status:'suspended' }).eq('id', id);
    if (error) { b.disabled = false; return toast('Failed — check your connection'); }
    renderVocab();
    toast("You won't see this again", { label:'Undo', onClick: async () => {
      const { error } = await sb.from('eng_cards').update({ status:prev }).eq('id', id);
      if (error) return toast('Undo failed — check your connection');
      toast('Restored'); renderVocab();
    }});
  });
}

/* ═══ 진도 공유 — 서로 얼마나 했는지 ═══════════════════
 *
 * 챌린지앱을 그대로 따른다: 로스터 + 기간 데이터를 통째로 가져와 앱에서 묶는다.
 * 읽기만 열려 있고(v5) 쓰기는 본인만이라, 남의 진도를 건드릴 수는 없다.
 *
 * 🔴 줄은 **로스터**로 만든다. 진도 행이 있는 사람으로 만들면 아직 시작 안 한 사람은
 *    줄 자체가 안 생겨, "안 했다"와 "공유가 꺼졌다"가 구분되지 않는다.
 *    안 한 게 보이는 것이 이 기능의 핵심이다.
 *
 * 이름은 challenge_members 를 빌려 쓴다 — 같은 프로젝트·같은 계정이고 이미 둘 다 있다.
 * 거기 없는 사람은 이메일 앞부분으로 떨어뜨린다.
 *
 * eng_cards 는 공유하지 않으므로(개인 SRS) 남의 카드 수는 알 수 없다.
 * 누적 수치는 eng_progress 가 가진 것만 쓴다.
 */
let tgCache = null;

async function loadTogether(force){
  if (tgCache && !force) return tgCache;
  // 월 이동용으로 넉넉히. 사람당 하루 한 행이라 400일이어도 두 명이면 800행이 최대다.
  const since = kstDate(Date.now() - 400*864e5);
  const [se, pr, mem, att] = await Promise.all([
    sb.from('eng_sessions').select('user_id, session_date, progress, xp_earned, completed_at')
      .gte('session_date', since).order('session_date',{ascending:false}),
    sb.from('eng_progress').select('user_id, xp_total, turns_spoken, listened_ms, articles_read'),
    sb.from('challenge_members').select('id, user_id, name, email, active'),
    // 이 앱으로 공부하지 않고 **챌린지 앱에서 영어 인증샷만** 올리는 사람도 있다.
    // 그 인증도 그날 출석이다 — 앱을 바꾸게 하지 말고 여기서 합쳐 센다.
    sb.from('challenge_attendances').select('member_id, user_id, attended_on, note')
      .eq('activity_type', 'english').gte('attended_on', since),
  ]);
  const roster = (mem.data || []).filter(m => m.active !== false);
  // 로스터에 없지만 진도를 남긴 사람도 놓치지 않는다
  const extra = [...new Set([...(se.data||[]).map(r=>r.user_id), ...(pr.data||[]).map(r=>r.user_id)])]
    .filter(u => !roster.some(m => m.user_id === u))
    .map(u => ({ user_id:u, name:null, email:null }));
  const people = [...roster, ...extra];
  const meRow = (mem.data || []).find(m => m.user_id === currentUser.id) || null;
  const order = [...people].sort((a,b) =>
    a.user_id === currentUser.id ? -1 : b.user_id === currentUser.id ? 1 : 0);
  const uidOf = new Map((mem.data || []).map(m => [m.id, m.user_id]));
  const proofs = new Map();                       // 'uid|날짜' → 사진 URL (없으면 '')
  for (const a of att.data || []) {
    const u = a.user_id || uidOf.get(a.member_id);
    if (u) proofs.set(`${u}|${a.attended_on}`, /^https?:/.test(a.note || '') ? a.note : '');
  }
  tgCache = {
    people: order,
    proofs,
    meRow,
    sessions: se.data || [],
    prog: pr.data || [],
    nameOf: m => m.name || (m.email || '').split('@')[0] || 'friend',
  };
  return tgCache;
}

function tgStreak(sessions, id, proofs){
  const days = new Set(sessions.filter(r=>r.user_id===id).map(r=>r.session_date));
  for (const k of proofs?.keys() || []) if (k.startsWith(id + '|')) days.add(k.slice(id.length + 1));
  let n = 0, cur = Date.now();
  if (!days.has(kstDate(cur))) cur -= 864e5;
  while (days.has(kstDate(cur))) { n++; cur -= 864e5; }
  return n;
}

/* ═══ Together 탭 — 이번 주와 누적 ═════════════════════ */
/* 주간은 "이번 주 리듬", 월간은 "흐름". 둘은 다른 질문이라 토글로 가른다.
   월 이동(prev/next)은 아직 없다 — 이번 달만 본다. */
let tgMode = 'week';
let tgMonth = null;                                  // 'YYYY-MM', null 이면 이번 달
let tgWeekOff = 0;
let tgPfDay = null;                                  // 인증할 날 (오늘·어제·그제)                                   // 0 이면 이번 주, -1 이면 지난 주

function tgCellClass(t, id, day, d){
  if (day > d) return 'fut';
  const se = t.sessions.find(r => r.user_id === id && r.session_date === day);
  if (t.proofs.has(`${id}|${day}`) && !se?.completed_at) return 'full proof';   // 인증샷 = 출석
  if (!se) return '';
  const pg = se.progress || {};
  const n = ['scenes','article','vocab','quiz'].filter(k => (pg[k]?.done || pg[k]?.sent || 0) > 0).length;
  return se.completed_at ? 'full' : n ? 'part' : '';
}

const TG_DOW = ['M','T','W','T','F','S','S'];

/* 한 날의 세 갈래 상태. 주간 칸 안에 담는다 — 색만으로는 "뭘 했는지"를 못 읽는다.
   2=끝냄 · 1=손댐 · 0=안 함. total 이 없으면 손댄 것만으로 끝냄으로 본다. */
function tgDayParts(se){
  const pg = se?.progress || {};
  const one = (o, k) => { const d = o?.[k] || 0, t = o?.total || 0;
    return !d ? 0 : (!t || d >= t) ? 2 : 1; };
  return [one(pg.scenes,'done'), one(pg.article,'sent'), one(pg.vocab,'done'), one(pg.quiz,'done')];
}

function tgWeekGrid(t, d){
  const now = new Date(Date.now() + 9*3600e3);
  const dow = (now.getUTCDay() + 6) % 7;               // 월=0
  const monday = Date.now() - dow*864e5 + tgWeekOff*7*864e5;
  const week = Array.from({length:7}, (_,i) => kstDate(monday + i*864e5));
  const fmt = s => new Date(s + 'T00:00:00Z')
    .toLocaleString('en-US', { month:'short', day:'numeric', timeZone:'UTC' });
  const label = `${fmt(week[0])} – ${fmt(week[6])}`
    + (tgWeekOff === 0 ? ' · this week' : '');

  // 기록이 있는 주까지만 뒤로 간다. 앞으로는 이번 주가 끝.
  const oldest = t.sessions.length
    ? t.sessions.map(r => r.session_date).sort()[0] : d;
  const prevEnd = kstDate(monday - 864e5);             // 지난 주 일요일

  return `<div class="tgnav">
      <button class="tgarrow" data-gw="${tgWeekOff-1}" ${prevEnd < oldest ? 'disabled' : ''}
        aria-label="Previous week">‹</button>
      <span class="tgmlabel">${esc(label)}</span>
      <button class="tgarrow" data-gw="${tgWeekOff+1}" ${tgWeekOff >= 0 ? 'disabled' : ''}
        aria-label="Next week">›</button>
    </div>
    ${t.people.map(m => {
      const mine = t.sessions.filter(r => r.user_id === m.user_id && week.includes(r.session_date));
      const done = week.filter(day => tgCellClass(t, m.user_id, day, d).startsWith('full')).length;
      const xp   = mine.reduce((a, r) => a + (r.xp_earned || 0), 0);
      return `<div class="tgwk${m.user_id===currentUser.id?' me':''}">
        <div class="tgwkh"><span class="nm">${esc(t.nameOf(m))}</span>
          <span class="cnt"><b>${done}</b>/7 days · ${xp.toLocaleString()} XP</span></div>
        <div class="tgwg">${week.map((day, i) => {
          const k = tgCellClass(t, m.user_id, day, d);
          const se = t.sessions.find(r => r.user_id === m.user_id && r.session_date === day);
          const pf = k.includes('proof') ? t.proofs.get(`${m.user_id}|${day}`) : null;
          const seg = pf != null ? `<span class="pf"${pf ? ` data-pf="${esc(pf)}"` : ''}>📷</span>`
            : tgDayParts(se).map(v => `<u class="${v === 2 ? 'on' : v === 1 ? 'hf' : ''}"></u>`).join('');
          const cls = ['cell', k, day === d ? 'now' : ''].filter(Boolean).join(' ');
          return `<div><span class="dw${i >= 5 ? ' we' : ''}">${TG_DOW[i]}</span>
            <span class="${cls}" title="${day}"><span class="dd">${+day.slice(8)}</span>
              <span class="seg">${seg}</span></span></div>`;
        }).join('')}</div></div>`;
    }).join('')}`;
}

/* 월간은 사람마다 달력 하나. 한 칸에 두 사람을 겹치면 누구 것인지 읽기 어렵다. */
function tgMonthGrid(t, d){
  const ym = tgMonth || d.slice(0,7);
  const [y, mo] = ym.split('-').map(Number);
  const first = new Date(Date.UTC(y, mo-1, 1));
  const lead = (first.getUTCDay() + 6) % 7;             // 월요일 시작까지 앞 빈칸
  const days = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const cells = [
    ...Array(lead).fill(null),
    ...Array.from({length:days}, (_,i) => `${ym}-${String(i+1).padStart(2,'0')}`),
  ];
  while (cells.length % 7) cells.push(null);
  const label = new Date(Date.UTC(y, mo-1, 1)).toLocaleString('en-US',{month:'long',year:'numeric'});

  const counts = id => {
    const done = cells.filter(c => c && c <= d && tgCellClass(t, id, c, d).startsWith('full')).length;
    const any  = cells.filter(c => c && c <= d && tgCellClass(t, id, c, d) !== '').length;
    return { done, any };
  };

  // 앞으로는 이번 달까지, 뒤로는 기록이 있는 달까지만 — 빈 달을 끝없이 넘기게 두지 않는다
  const cur = d.slice(0,7);
  const oldest = t.sessions.length
    ? t.sessions.map(r=>r.session_date).sort()[0].slice(0,7) : cur;
  const shift = (n) => { const dt = new Date(Date.UTC(y, mo-1+n, 1));
    return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}`; };
  const prev = shift(-1), next = shift(1);

  return `<div class="tgnav">
      <button class="tgarrow" data-gm="${prev}" ${prev < oldest ? 'disabled' : ''} aria-label="Previous month">‹</button>
      <span class="tgmlabel">${esc(label)}</span>
      <button class="tgarrow" data-gm="${next}" ${next > cur ? 'disabled' : ''} aria-label="Next month">›</button>
    </div>
    ${t.people.map(m => {
      const c = counts(m.user_id);
      return `<div class="tgcal${m.user_id===currentUser.id?' me':''}">
        <div class="tgcalh"><span class="nm">${esc(t.nameOf(m))}</span>
          <span class="cnt"><b>${c.done}</b> finished · ${c.any} active</span></div>
        <div class="tgdow">${TG_DOW.map(x=>`<span>${x}</span>`).join('')}</div>
        <div class="tggrid">${cells.map(day => {
          if (!day) return '<i class="pad"></i>';
          const k = tgCellClass(t, m.user_id, day, d);
          return `<i class="${k}${day === d ? ' now' : ''}">${+day.slice(8)}</i>`;
        }).join('')}</div></div>`;
    }).join('')}`;
}

/* ── 오픽 팁 — 유튜버 강의를 Mac 일꾼이 자막째 받아 팁으로 정리해 둔 것 (eng_tips) ─────────
 * Plan 에서는 영상별로 전부, Speaking 에서는 그 문항 유형에 맞는 것만 꺼낸다. */
let tTips = null, tGuide = null;
const loadTips = async () => {
  if (tTips) return tTips;
  const [a, b] = await Promise.all([
    sb.from('eng_tips').select('id, video_id, title, channel, sort, tips, err').eq('user_id', currentUser.id).order('sort'),
    sb.from('eng_guide').select('guide, src_n, updated_at').eq('user_id', currentUser.id).maybeSingle(),
  ]);
  tGuide = b.data || null;
  return tTips = a.data || [];
};
const tipVid = id => (tTips || []).find(v => v.video_id === id);
/** Speaking 「💡 팁」 — 종합 공략에서 그 유형 + 지금 단계까지 것. 공략이 아직 없으면 영상별 팁 */
const tipsFor = kind => tGuide
  ? tGuide.guide.sections.flatMap(sec => sec.items).filter(x => x.kinds?.includes(kind) && x.stage <= tStage)
  : (tTips || []).flatMap(v => (v.tips || []).filter(x => x.kinds?.includes(kind))
      .map(x => ({ ...x, refs:[{ v:v.video_id, t:x.t }] })));
function tipHtml(x, v){
  const refs = x.refs || (v ? [{ v:v.video_id, t:x.t }] : []);
  return `<div class="tip"><div class="tiph"><span>${x.stage ? `<span class="tips${x.stage === tStage ? ' on' : ''}">S${x.stage}</span> ` : ''}${esc(x.head)}</span></div>
    <div class="tipb">${esc(x.body)}</div>
    ${(x.ex || []).map(e => `<button class="gex" data-en="${esc(e)}">🔊 ${esc(e)}</button>`).join('')}
    ${refs.length ? `<div class="tipr">${refs.map(r => `<button class="tipt" data-tv="${esc(r.v)}" data-tt="${r.t}">▶ ${
      v ? '' : esc(tipVid(r.v)?.channel || '영상') + ' '}${mmss(r.t)}</button>`).join('')}</div>` : ''}</div>`;
}
/** ▶ 시각을 누르면 그 팁이 든 상자 맨 위에 영상을 그 시각부터 띄운다 */
function wireTips(root){
  root.querySelectorAll('.gex').forEach(b => b.onclick = () => playCard({ answer_en:b.dataset.en }));
  root.querySelectorAll('.tipt').forEach(b => b.onclick = () => {
    const box = b.closest('[data-tipbox]'), hold = box.querySelector('.tipvid');
    tStopAudio();
    hold.innerHTML = `<div style="position:relative;aspect-ratio:16/9;margin:6px 0 10px;border-radius:10px;overflow:hidden;background:#000">
      <iframe src="https://www.youtube.com/embed/${encodeURIComponent(b.dataset.tv)}?start=${+b.dataset.tt}&autoplay=1&playsinline=1&rel=0"
        style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
    hold.scrollIntoView({ block:'nearest', behavior:'smooth' });
  });
}
async function paintTips(){
  const host = $('pl-tips'); if (!host) return;

  if (!vids.length) { host.innerHTML = ''; return; }

  const g = tGuide?.guide;
  host.innerHTML = `<div class="vcard" style="margin-bottom:14px">
    <div class="vt" style="font-size:14px">💡 오픽 공략 <em class="kdot">${g ? `영상 ${tGuide.src_n}개 종합` : `정리 중 ${ready}/${vids.length}`}</em></div>
    ${g ? `<div class="vm" style="white-space:pre-line;color:var(--text)">${esc(g.summary)}</div>
      <div class="vm" style="margin-top:6px">S 표시는 연습에 들일 단계다 — <b style="color:var(--eng)">S${tStage}</b> 까지가 지금 할 것.
        ▶ 은 근거가 된 영상 대목. Speaking 문항 아래 「💡 팁」엔 그 유형·지금 단계 것만 뜬다.</div>
      ${g.sections.map(sec => `<details class="gram" data-tipbox style="margin:8px 0 0">
        <summary><span class="gl">${sec.items.length}</span>${esc(sec.title)}</summary>
        <div style="padding:0 13px 12px">${sec.why ? `<p class="leg" style="margin:4px 0">${esc(sec.why)}</p>` : ''}<div class="tipvid"></div>
          ${sec.items.map(x => tipHtml(x)).join('')}</div></details>`).join('')}`
      : `<div class="vm">유튜버 강의 ${vids.length}개를 자막째 받아 하나씩 정리하고 있다 (${ready}/${vids.length}).
          다 모이면 내 수준(NH → IM1)과 단계에 맞춰 <b>한 권으로 엮는다</b>. 그 전엔 아래 영상별 정리를 본다.</div>`}
    <details class="sdet"${g ? '' : ' open'}><summary>출처 영상 ${vids.length}개 · 팁 ${n}</summary>
    ${vids.map(v => `<details class="gram" data-tipbox data-id="${v.id}" style="margin:8px 0 0">
      <summary><span class="gl">${v.tips ? v.tips.length : v.err ? '✗' : '⏳'}</span>${esc(v.title || v.video_id)} <span style="color:var(--dim)">· ${esc(v.channel || '')}</span></summary>
      <div style="padding:0 13px 12px"><div class="tipvid"></div>
        ${v.tips ? v.tips.map(x => tipHtml(x, v)).join('')
          : `<p class="leg">${v.err ? '못 가져왔어 — ' + esc(v.err) : '정리 중 — Mac 이 자막을 받아 팁으로 묶고 있다 (영상 하나에 몇 분)'}</p>`}
        <details class="sdet"><summary>자막 원문</summary><div class="tipsrc">불러오는 중…</div></details>
      </div></details>`).join('')}
    </details>
  </div>`;
  wireTips(host);
  host.querySelectorAll('.tipsrc').forEach(d => d.parentElement.addEventListener('toggle', async () => {
    if (!d.parentElement.open || d.dataset.ok) return;
    const id = d.closest('[data-tipbox]').dataset.id;

    wireTips(d.closest('[data-tipbox]'));
