<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>English — ktree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08090e;--card:#111318;--card2:#16181f;--card-el:#1c1f28;
  --border:#23262f;--border-hl:#3b3f4f;
  --text:#e8eaef;--sub:#8b8fa3;--dim:#53576a;
  --eng:#5b8cff;--eng-bg:rgba(91,140,255,.12);--eng-bd:rgba(91,140,255,.28);
  --ok:#3ddfa0;--ok-bg:rgba(61,223,160,.1);--ok-bd:rgba(61,223,160,.25);
  --warn:#f0a944;--warn-bg:rgba(240,169,68,.12);
  --danger:#ef5e5e;--danger-bg:rgba(239,94,94,.12);
  --r:12px;
  --num:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html{color-scheme:dark}
/* 어떤 자식도 화면을 넓히지 못하게 한다 — 한 군데만 삐져나와도 전체가 잘려 보인다 */
html,body{max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;color:var(--text);background:var(--bg);
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--eng);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:8px 14px calc(112px + env(safe-area-inset-bottom))}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* --- header --- */
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;gap:8px;min-width:0}
.hd-logo{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-logo{font-size:15px;font-weight:800;letter-spacing:-.3px}
.hd-logo b{color:var(--eng)}
.hd-right{display:flex;align-items:center;gap:6px}
.streakpill{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:5px 11px}
.hd-btn{font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid transparent;background:none;color:var(--dim);flex:none}
.hd-btn:hover{color:var(--sub)}

/* --- login --- */
.login-card{max-width:380px;margin:60px auto 0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.login-card h2{font-size:17px;font-weight:800;margin-bottom:4px}
.login-card p{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px}
.field input{width:100%;padding:11px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--border-hl);color:var(--text);font-family:inherit;font-size:14px}
.field input:focus{outline:none;border-color:var(--eng)}
.primary-btn{width:100%;padding:12px;border-radius:11px;font-size:14px;font-weight:700;background:var(--eng);border:none;color:#fff}
.primary-btn:disabled{opacity:.5;cursor:default}
.msg{margin-top:10px;font-size:12.5px;border-radius:9px;padding:9px 12px;display:none}
.msg.err{background:var(--danger-bg);color:var(--danger)}
.msg.show{display:block}

/* --- shared --- */

.screen{display:none}
.screen.on{display:block;animation:fadeUp .25s ease both}
.empty{text-align:center;color:var(--dim);font-size:12.5px;line-height:1.7;padding:30px 16px}
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--card-el);border:1px solid var(--border-hl);border-radius:99px;
  padding:9px 16px;font-size:12.5px;color:var(--text);z-index:50;display:none;white-space:nowrap;
}

/* --- home --- */

.stat .n{font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .n small{font-size:12px;font-weight:600;color:var(--dim)}

.stat.due .n{color:var(--eng)}

.lvlchip.done{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}

.tchip{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:99px;border:1px solid var(--border);background:none;color:var(--dim);white-space:nowrap;transition:color .15s,border-color .15s}
.tchip.on{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}

/* --- review --- */

.tfilter .tchip.on{color:var(--eng);border-color:var(--eng-bd);background:var(--eng-bg)}

.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.grade{padding:12px 4px;border-radius:11px;font-size:13px;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--text)}
.grade small{display:block;font-size:10px;font-weight:600;color:var(--dim);margin-top:2px}
.grade.miss{border-color:rgba(239,94,94,.3);color:var(--danger)}
.grade.soso{border-color:rgba(240,169,68,.3);color:var(--warn)}
.grade.good{border-color:var(--ok-bd);color:var(--ok)}
.grade:active{background:var(--card-el)}
.donebox{text-align:center;padding:50px 20px}
.donebox .big{font-size:40px}
.donebox h3{font-size:17px;font-weight:800;margin:12px 0 6px}
.donebox p{font-size:13px;color:var(--sub);line-height:1.6}
.donebox button{margin-top:18px;padding:11px 22px;border-radius:11px;border:1px solid var(--eng-bd);background:var(--eng-bg);color:var(--eng);font-size:13px;font-weight:700}

/* --- listen --- */

.rate button.on{background:var(--eng-bg);color:var(--eng)}

/* --- speak / journal --- */

.check{margin-top:14px;width:100%;padding:12px;border-radius:11px;font-size:14px;font-weight:700;background:var(--eng);border:none;color:#fff}

.result.show{display:block}
.result.good{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok)}

/* --- inbox --- */

.initem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.initem .itx{flex:1;min-width:0}
.initem .ie{font-size:13.5px;font-weight:600;line-height:1.4;overflow-wrap:break-word}
.initem .isrc{font-size:11px;color:var(--dim);margin-top:1px}
.ipill{font-size:10px;font-weight:700;padding:4px 8px;border-radius:99px;flex:none}
.ipill.wait{color:var(--warn);background:var(--warn-bg)}
.ipill.done{color:var(--ok);background:var(--ok-bg)}
.buildline{margin:18px 0 2px;text-align:center;font-size:10.5px;color:var(--dim);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.buildline b{font-weight:600;color:var(--sub)}
.buildline .stale{color:var(--warn)}
.initem .indel{flex:none;width:28px;height:28px;border:0;border-radius:8px;background:var(--card-el);color:var(--dim);font-size:13px;cursor:pointer}
.initem .indel:hover:not(:disabled){color:var(--danger);background:var(--danger-bg)}
.initem .indel:disabled{opacity:.4}

/* ═══ 오늘 판 (개편) ═══ */
/* 앱에 없던 범용 버튼·상황줄. hd-btn 의 톤을 따른다 */
.btn{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--border-hl)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:11.5px;padding:6px 10px}
.btn.primary-btn{width:auto;background:var(--eng);border-color:var(--eng);color:#fff}
.sit{background:var(--eng-bg);border:1px solid var(--eng-bd);border-radius:9px;padding:10px 13px;font-size:13px;margin-bottom:12px}
.sit b{color:var(--eng)}
.xpbar{
  border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:10px;
  background:linear-gradient(160deg,var(--card2),var(--card));
}
.xpbar .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.xpbar .rk{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:baseline;gap:7px}
.xpbar .rk em{
  font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--eng);background:var(--eng-bg);border:1px solid var(--eng-bd);border-radius:99px;padding:2px 8px;
}
.xpbar .n{font-family:var(--num);font-size:11.5px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums}
.xpbar .xtrack{height:7px;border-radius:99px;background:var(--card-el);margin-top:11px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.xpbar .xtrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--eng),var(--ok));transition:width .35s ease}
/* 얻은 XP 가 없는 날은 줄 자체를 없앤다 — min-height 로 자리를 비워두니 카드에 빈 구멍이 났다 */
.xpbar .gain{font-size:11.5px;color:var(--ok);font-weight:600}
.xpbar .gain:not(:empty){margin-top:9px}
.board{display:flex;flex-direction:column;gap:7px}
.bcard{
  position:relative;overflow:hidden;border:1px solid var(--border);border-radius:12px;
  background:var(--card);padding:11px 13px;text-align:left;cursor:pointer;font:inherit;color:inherit;
  display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;
  column-gap:9px;row-gap:7px;align-items:center;
  transition:border-color .15s,transform .1s;
}
.bcard:active:not(:disabled){transform:scale(.99)}
.bcard:disabled{opacity:.45;cursor:not-allowed}
.bcard .bt{grid-column:2;font-size:14px;font-weight:700;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .chk{grid-column:1;grid-row:1}
.bcard .bs{grid-column:3;grid-row:1;justify-self:end;white-space:nowrap}
.bcard .bar{grid-column:1/-1;grid-row:2}
/* 빈 네모는 '안 누른 체크박스'로 읽혀 할 일이 아니라 양식처럼 보였다. 상태 고리로 바꾼다. */
.bcard .chk{
  flex:none;width:16px;height:16px;border-radius:99px;border:2px solid var(--dim);
  display:inline-grid;place-items:center;font-size:9px;color:transparent;transition:all .15s;
}
.bcard .bs{font-family:var(--num);font-size:11.5px;font-weight:500;color:var(--sub);line-height:1.4;font-variant-numeric:tabular-nums}
.bcard .bar{display:block;height:3px;border-radius:99px;background:var(--card-el);overflow:hidden}
.bcard .bar i{display:block;height:100%;border-radius:99px;background:var(--warn);transition:width .3s}
.bcard.part{border-color:var(--warn-bg)}
.bcard.part .chk{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.bcard.done{border-color:var(--ok-bd);background:linear-gradient(160deg,var(--ok-bg),var(--card))}
.bcard.done .chk{background:var(--ok);border-color:var(--ok);color:#06210f}
.bcard.done .bar i{background:var(--ok)}
/* 학습량은 부차적인 정보다. 카드 세 개로 두면 판의 세 칸과 무게가 같아져 위계가 무너진다. */
.tstats{display:flex;gap:0;margin-top:10px;border:1px solid var(--border);border-radius:11px;background:var(--card);overflow:hidden}
.tstat{flex:1 1 0;min-width:0;padding:9px 6px;text-align:center}
.tstat+.tstat{border-left:1px solid var(--border)}
.tstat .v{font-family:var(--num);font-size:17px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.tstat .v small{font-family:'Noto Sans KR',sans-serif;font-size:10px;color:var(--dim);font-weight:400;letter-spacing:0}
.tstat .l{font-size:10.5px;color:var(--sub);margin-top:3px;line-height:1.3}

/* 막 안쪽 */
.actbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.actbar .back{margin-right:auto}
.rate2{display:flex;gap:2px}
.rate2 button{border:1px solid var(--border);background:var(--card);color:var(--sub);font:inherit;font-size:11px;padding:5px 7px;cursor:pointer}
.rate2 button:first-child{border-radius:7px 0 0 7px}.rate2 button:last-child{border-radius:0 7px 7px 0}
.rate2 button[aria-pressed="true"]{background:var(--eng);border-color:var(--eng);color:#06210f}
.dturn{display:flex;gap:8px;align-items:flex-start;margin-bottom:9px}
.dturn .who{flex:0 0 30px;font-size:9.5px;color:var(--dim);padding-top:8px}
.dturn .line{flex:1 1 auto;min-width:0;border-radius:12px;padding:10px 13px;background:var(--card-el);font-size:16px;line-height:1.6;cursor:pointer;transition:box-shadow .15s}
.dturn.mine .line{background:var(--eng-bg);border:1px solid var(--eng-bd)}
.dturn.on .line{box-shadow:0 0 0 2px var(--warn)}
.dturn .intent{display:block;font-size:12px;color:var(--eng);font-weight:600;margin-bottom:5px}
.dturn .hid{color:var(--dim);font-style:italic;font-size:13.5px}
.kw{border-radius:3px;padding:0 .06em}
.kw.on{background:var(--warn);color:#241a05;font-weight:700;border-radius:4px}
.kw.red{opacity:.5;border-bottom:1px dotted currentColor}
.kw.red.on{opacity:1}
.asbox{border:1px solid var(--border);border-radius:11px;padding:11px 13px;background:var(--card);font-size:16px;line-height:1.65;cursor:pointer;transition:border-color .15s,background .15s}
.asbox+.asbox{margin-top:6px}
.asbox.on{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-bg)}
.leg{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.55}
.leg b{color:var(--sub);font-weight:600}
.leg .sw{opacity:.5;border-bottom:1px dotted currentColor}
.vcard{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:14px 15px}
.vcard .vt{font-size:17px;font-weight:700;line-height:1.4}
.klabel{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--eng);
  background:var(--eng-bg);border:1px solid var(--eng-bd);border-radius:99px;padding:2px 8px;margin-bottom:9px}
.vex{font-family:var(--num);font-size:12px;color:var(--dim);margin-top:8px;line-height:1.55}
.vcard .vm{font-size:13px;color:var(--sub);margin-top:7px;line-height:1.6}
.vcard .vsrc{font-size:10.5px;color:var(--dim);margin-top:9px}
.vprog{font-size:11.5px;color:var(--sub);margin-bottom:10px;font-variant-numeric:tabular-nums}
.strip{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
.strip .btn.sm{flex:none}

/* 어휘 목록 — 누르면 펼쳐지는 줄 */
.vrow{border:1px solid var(--border);border-radius:11px;background:var(--card);margin-bottom:7px;overflow:hidden;transition:border-color .15s}
.vrow.open{border-color:var(--eng-bd)}
.vsum{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;background:none;border:0;text-align:left;font:inherit;color:inherit}
.vsum .itx{flex:1 1 auto;min-width:0}
.vsum .ie{display:block;font-size:14px;font-weight:700;letter-spacing:-.2px;line-height:1.35;overflow-wrap:anywhere}
.kdot{font-style:normal;font-size:9px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:1px 6px;margin-left:5px;vertical-align:2px}
.vsum .isrc{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsum .ipill{flex:none}
.vchev{flex:none;color:var(--dim);font-size:15px;transition:transform .15s}
.vrow.open .vchev{transform:rotate(90deg)}
.vmore{padding:0 13px 12px}
.vnote{font-size:12.5px;color:var(--sub);line-height:1.6}
.vmeta{font-family:var(--num);font-size:10.5px;color:var(--dim);margin-top:6px}
.vkill{color:var(--danger)!important;border-color:var(--danger-bg)!important}
.srow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-width:0}
.strip input,.strip textarea{flex:1 1 120px;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit;font-size:13px;color:var(--text)}
.strip input::placeholder,.strip textarea::placeholder{color:var(--dim)}
.strip input:focus,.strip textarea:focus{border-color:var(--eng-bd);outline:none}
.strip textarea{width:100%;margin-top:8px;resize:vertical}
.sdet{margin-top:10px}
.sdet>summary{cursor:pointer;font-size:12.5px;color:var(--sub);list-style:none}
.sdet>summary::-webkit-details-marker{display:none}
.sdet>summary::before{content:"▸ ";color:var(--dim)}
.sdet[open]>summary::before{content:"▾ "}

/* --- tab bar --- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  /* 탭 수를 박지 않는다 — 6으로 박혀 있어서 탭이 3개가 되자 왼쪽에 몰렸다 */
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  max-width:520px;margin:0 auto;
  border-top:1px solid var(--border);background:rgba(13,15,20,.92);backdrop-filter:blur(10px);
  /* 홈 화면에 설치하지 않은 Safari 는 safe-area 가 0이라 하단 바에 글자가 가린다 */
  /* 홈 화면에 설치하지 않은 Safari 는 safe-area 가 0인데 하단 바가 약 50px 덮는다 */
  padding:8px 8px calc(22px + env(safe-area-inset-bottom));
}
/* 이모지는 회색 필터를 씌워도 탁하게 남는다. 선 아이콘이 currentColor 를 따라가 깔끔하다. */
.tab{background:none;border:none;color:var(--dim);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center;padding:6px 0;border-radius:10px;transition:color .15s}
.tab .ti{width:21px;height:21px;opacity:.75;transition:opacity .15s}
.tab.on{color:var(--eng)}
.tab.on .ti{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div id="login-view" class="login-card" style="display:none">
    <h2>k<b style="color:var(--eng)">tree</b> English</h2>
    <p>ktree 계정으로 로그인하세요. 한 번 로그인하면 유지됩니다.</p>
    <form onsubmit="event.preventDefault();login()">
      <div class="field"><label>이메일</label><input id="email" type="email" autocomplete="username" placeholder="you@example.com"></div>
      <div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="primary-btn" type="submit">로그인</button>
    </form>
    <div id="login-error" class="msg err"></div>
    <div class="buildline">build <b>—</b></div>
  </div>

  <div id="app-view" style="display:none">
    <div class="hd">
      <div class="hd-logo">k<b>tree</b> · English</div>
      <div class="hd-right">
        <span class="streakpill" id="streak">🔥 —</span>
        <button class="hd-btn" onclick="logout()">로그아웃</button>
      </div>
    </div>

    <!-- ============ 오늘 ============ -->
    <section class="screen on" id="s-today">
      <div id="t-board"></div>
      <div id="t-act" hidden></div>
    </section>

    <!-- ============ 어휘 ============ -->
    <section class="screen" id="s-vocab">
      <div id="vb-head"></div>
      <div id="vb-list"></div>
    </section>

    <!-- ============ 보관함 ============ -->
    <section class="screen" id="s-archive">
      <div id="av-list"></div>
    </section>

  </div>
</div>

<nav class="tabbar" id="tabbar" style="display:none">

function applyGrade(card, grade){
  if (grade === 'good'){
    card.streak++; card.ease = Math.min(2.8, Number(card.ease) + 0.05);
    card.interval_days = card.interval_days < 1 ? 2 : Math.round(card.interval_days * card.ease);
  } else if (grade === 'soso'){
    card.interval_days = Math.max(1, Math.ceil((card.interval_days || 1) * 1.2));
  } else {
    card.streak = 0; card.ease = Math.max(1.3, Number(card.ease) - 0.2);
    card.interval_days = 1;
  }
  card.interval_days = Math.min(card.interval_days, 365);
  card.next_review = kstDate(Date.now() + card.interval_days * 864e5);
  card.status = card.interval_days >= 21 ? 'mature' : 'learning';
}

async function saveGrade(card, grade, mode){
  const fields = { status:card.status, interval_days:card.interval_days, ease:card.ease,
                   streak:card.streak, next_review:card.next_review };
  const op = { card_id: card.id, fields, grade, mode, at: new Date().toISOString() };
  try {
    const [u, l] = await Promise.all([
      sb.from('eng_cards').update(fields).eq('id', card.id),
      sb.from('eng_review_log').insert({ user_id:currentUser.id, card_id:card.id, grade, mode })
    ]);
    if (u.error || l.error) throw (u.error || l.error);
  } catch (_) {
    // 오프라인(지하철) — 로컬에 쌓고 복귀하면 flush
    const pend = JSON.parse(localStorage.getItem(LS.pending) || '[]');
    pend.push(op);
    localStorage.setItem(LS.pending, JSON.stringify(pend));
  }
}

async function flushPending(){
  const pend = JSON.parse(localStorage.getItem(LS.pending) || '[]');
  if (!pend.length) return;
  const rest = [];
  for (const op of pend){
    try {
      // 🔴 .error 를 반드시 본다. supabase-js 는 PostgREST 오류를 throw 하지 않고
      // { error } 로 resolve 하므로, 안 보면 실패한 복습이 조용히 버려진다 (saveGrade 와 같은 규칙).
      const u = await sb.from('eng_cards').update(op.fields).eq('id', op.card_id);
      if (u.error) throw u.error;
      const l = await sb.from('eng_review_log').insert({ user_id:currentUser.id, card_id:op.card_id, grade:op.grade, mode:op.mode, reviewed_at:op.at });
      if (l.error) throw l.error;
    } catch(_) { rest.push(op); }
  }
  localStorage.setItem(LS.pending, JSON.stringify(rest));
  const synced = pend.length - rest.length;
  if (rest.length) toast(`동기화 ${synced}건 · ${rest.length}건 실패 — 다음에 다시 시도해요`);
  else if (synced)  toast(`오프라인 복습 ${synced}건 동기화됨`);
}

function urlBase64ToUint8Array(s){
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const b64 = (s + pad).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from([...atob(b64)].map(c=>c.charCodeAt(0)));
}
async function subscribePush(interactive){
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || typeof Notification === 'undefined'){
    if (interactive) toast('이 브라우저는 푸시를 지원하지 않아요 (iOS는 홈 화면에 추가 후 가능)');
    return;
  }
  try {
    const reg = await navigator.serviceWorker.ready;
    const permission = await Notification.requestPermission();
    if (permission !== 'granted'){ if (interactive) toast('알림 권한이 거부됐어요'); return; }
    const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    const { endpoint, keys } = sub.toJSON();
    const row = { user_id: currentUser.id, endpoint, p256dh: keys.p256dh, auth: keys.auth };
    // push_subscriptions 는 챌린지와 공유 — member 가 있으면 붙인다
    const { data: member } = await sb.from('challenge_members').select('id').eq('user_id', currentUser.id).maybeSingle();
    if (member) row.member_id = member.id;
    const { error } = await sb.from('push_subscriptions').upsert(row, { onConflict:'user_id,endpoint' });
    if (error) throw error;
    const pb = $('t-push'); if (pb) pb.textContent = '🔔 아침 푸시 켜짐';
    if (interactive) toast('내일 아침부터 복습 푸시가 와요');
  } catch (e) {
    console.warn('push subscribe failed', e);
    if (interactive) toast('푸시 등록 실패 — 콘솔을 확인하세요');
  }
}

// XP 는 **정답률이 아니라 입을 연 횟수**에 붙는다. 정답에만 주면 「맞음」을 거짓으로
// 누르게 되고, 그러면 복습 간격이 가짜로 벌어져 SRS 전체가 무의미해진다.
const XP = { turn:15, prodGood:10, prodMiss:4, wordGood:6, wordMiss:3,
             article:8, recog:1, complete:30, cap:250 };
const RANKS = [
  [0,'Starter'], [400,'Everyday'], [1000,'Conversational'], [1800,'Fluent-ish'],
  [2800,'Confident'], [4000,'Sharp'], [5400,'Native-ish'],
];
function rankOf(xp){
  let i = 0;
  for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k][0]) i = k;
  const next = RANKS[i+1] ? RANKS[i+1][0] : RANKS[i][0] + 1800;
  return { n:i+1, name:RANKS[i][1], from:RANKS[i][0], to:next };
}

function tStopAudio(){
  if (tAudio) { tAudio.pause(); tAudio = null; }

/* 프레임마다 현재 이벤트를 찾는다. timeupdate 는 초당 4회라 하이라이트가 뚝뚝 끊긴다. */
function tFollow(a, ev, paint){
  let last = -1;
  const step = () => {
    if (!a || a.paused) return;
    const ms = a.currentTime * 1000;
    let lo = 0, hi = ev.length - 1, hit = -1;
    while (lo <= hi) { const mid = (lo+hi)>>1; if (ms < ev[mid].t) hi = mid-1; else { hit = mid; lo = mid+1; } }
    if (hit !== last) { last = hit; paint(hit); }
    tRaf = requestAnimationFrame(step);
  };
  tRaf = requestAnimationFrame(step);
}

async function bumpXp(n, why){
  if (!tProg) return;
  const room = Math.max(0, XP.cap - tProg.xp_today);
  const add = Math.min(n, room);
  if (!add) { tGain = -1; paintXp(why + ' (하루 상한)'); return; }
  tProg.xp_total += add; tProg.xp_today += add; tGain += add;
  paintXp(why);
  try {
    await sb.from('eng_progress').upsert({
      user_id: currentUser.id, xp_total: tProg.xp_total, xp_today: tProg.xp_today,
      xp_date: tProg.xp_date, listened_ms: tProg.listened_ms, turns_spoken: tProg.turns_spoken,
      articles_read: tProg.articles_read, updated_at: new Date().toISOString(),
    }, { onConflict:'user_id' });
  } catch(_) { /* 오프라인이면 화면만 올라간다 — 다음 로드에서 맞춰진다 */ }
}

async function saveProgress(patch){
  const p = Object.assign({}, tSession?.progress || {}, patch);
  const row = { user_id: currentUser.id, session_date: today(), progress: p,
                scene_ids: tSession?.scene_ids || [], vocab_ids: tSession?.vocab_ids || [],
                xp_earned: (tSession?.xp_earned || 0) + tGain };
  if (tArticle) row.article_id = tArticle.id;
  try {
    const { data } = await sb.from('eng_sessions').upsert(row, { onConflict:'user_id,session_date' }).select().maybeSingle();
    if (data) tSession = data; else tSession = Object.assign({}, tSession, row);
  } catch(_) { tSession = Object.assign({}, tSession, row); }
}

function paintXp(why){
  const el = $('t-gain'); if (!el) return;
  el.textContent = tGain > 0 ? `오늘 +${tGain} XP${why ? ' · ' + why : ''}` : (why || '');
  const r = rankOf(tProg?.xp_total || 0);
  const pct = Math.min(100, ((tProg?.xp_total || 0) - r.from) / (r.to - r.from) * 100);
  const b = $('t-track'); if (b) b.style.width = Math.max(pct, 2) + '%';
  const t = $('t-rank'); if (t) t.innerHTML = `${r.n}단계 <em>${esc(r.name)}</em>`;
  const n = $('t-xpnum'); if (n) n.textContent = `${tProg?.xp_total || 0} / ${r.to} XP`;
}

  const vDone = pg.vocab?.done || 0, vTot = tVocab.today.length + tVocab.past.length;
  const r = rankOf(tProg?.xp_total || 0);
  const cls = (d, t) => !t ? '' : d >= t ? ' done' : d > 0 ? ' part' : '';
  const pct = (d, t) => t ? Math.round(d / t * 100) : 0;

  box.innerHTML = `
    <div class="xpbar">
      <div class="top"><span class="rk" id="t-rank">${r.n}단계 <em>${esc(r.name)}</em></span>
        <span class="n" id="t-xpnum">${tProg?.xp_total || 0} / ${r.to} XP</span></div>
      <div class="xtrack"><i id="t-track" style="width:${Math.max(((tProg?.xp_total||0)-r.from)/(r.to-r.from)*100,2)}%"></i></div>
      <div class="gain" id="t-gain"></div>
    </div>
    <div class="board">
      <button class="bcard${cls(sDone,sTot)}" data-a="scene" ${sTot?'':'disabled'}>
        <span class="chk">✓</span><span class="bt">상황 대화</span>
        <span class="bs">${sTot ? `${sDone}/${sTot}` : '없음'}</span>
        <span class="bar"><i style="width:${pct(sDone,sTot)}%"></i></span></button>
      <button class="bcard${cls(aSent,aTot)}" data-a="article" ${aTot?'':'disabled'}>
        <span class="chk">✓</span><span class="bt">뉴스 읽기</span>
        <span class="bs">${aTot ? `${aSent}/${aTot}문장` : '없음'}</span>
        <span class="bar"><i style="width:${pct(aSent,aTot)}%"></i></span></button>
      <button class="bcard${cls(vDone,vTot)}" data-a="vocab" ${vTot?'':'disabled'}>
        <span class="chk">✓</span><span class="bt">어휘 마무리</span>
        <span class="bs">${vTot ? `${vDone}/${vTot}` : '없음'}</span>
        <span class="bar"><i style="width:${pct(vDone,vTot)}%"></i></span></button>
    </div>
    <div class="tstats">
      <div class="tstat"><div class="v">${tProg?.turns_spoken || 0}</div><div class="l">말한 턴</div></div>
      <div class="tstat"><div class="v">${Math.round((tProg?.listened_ms||0)/60000)}<small>분</small></div><div class="l">들은 시간</div></div>
      <div class="tstat"><div class="v">${tProg?.articles_read || 0}</div><div class="l">읽은 기사</div></div>
    </div>
    <p class="leg">순서는 아무거나 먼저 해도 됩니다. 각 칸이 <b>어디까지 했는지 숫자로</b> 말해줍니다.</p>

    <!-- 옛 Inbox·일기·홈 탭이 하던 일. 탭을 따로 두면 안 쓰니 판 아래로 내렸다 -->
    <div class="strip">
      <div class="srow">
        <input id="t-inb" placeholder="주운 표현 한 줄 — 밤에 카드가 됩니다" aria-label="표현 추가">
        <button class="btn sm" id="t-inb-add">＋</button>
      </div>
      <details class="sdet"><summary>오늘 일기 — 3~5문장 (밤사이 교정됩니다)</summary>
        <textarea id="t-jr" rows="4" placeholder="Today I..."></textarea>
        <div class="srow" style="margin-top:8px"><button class="btn sm" id="t-jr-send">제출</button>
          <span class="leg" id="t-jr-msg" style="margin:0"></span></div>
      </details>
      <div class="srow" style="margin-top:10px">
        <button class="btn sm" id="t-push">🔔 아침 푸시 켜기</button>
        <span class="leg" style="margin:0">토픽</span>
        <span id="t-topics" class="srow" style="gap:4px"></span>
      </div>
    </div>`;
  box.querySelectorAll('.bcard').forEach(b => b.onclick = () => openAct(b.dataset.a));
  paintXp('');
  wireStrip();
  paintStreak();
}

function actBar(title){
  return `<div class="actbar"><button class="btn sm back" id="t-back">‹ 오늘 판</button>
    <b style="font-size:14px">${esc(title)}</b>
    <div class="rate2" id="t-rate"><button data-r="0.75">0.75×</button><button data-r="1" aria-pressed="true">1×</button><button data-r="1.25">1.25×</button></div></div>`;
}
function wireBar(){
  $('t-back').onclick = () => { tStopAudio(); renderToday(); };
  $('t-rate').onclick = e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    tRate = +b.dataset.r;
    document.querySelectorAll('#t-rate button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.r === tRate)));
    if (tAudio) tAudio.playbackRate = tRate;
  };
  document.querySelectorAll('#t-rate button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.r === tRate)));
}
function openAct(a){
  $('t-board').textContent = '';
  const el = $('t-act'); el.hidden = false;
  if (a === 'scene') actScene(el);
  else if (a === 'article') actArticle(el);
  else actVocab(el);
}

/* ── 막 1 · 상황 대화 ───────────────────────────────── */

let scIdx = 0, scMode = 'listen';

function actScene(el){
  const done = tSession?.progress?.scenes?.done || 0;
  scIdx = Math.min(done, tScenes.length - 1);
  drawScene(el);
}

function drawScene(el){
  const sc = tScenes[scIdx];
  if (!sc) { renderToday(); return; }
  const turns = sc.turns || [];
  el.innerHTML = actBar(`상황 대화 ${scIdx+1}/${tScenes.length}`) + `
    <div class="sit" style="background:var(--eng-bg);border-radius:9px;padding:10px 13px;font-size:13px;margin-bottom:12px">
      <b style="color:var(--eng)">상황</b> · ${esc(sc.situation_ko)}</div>
    <div class="actbar">
      <button class="btn sm" id="sc-listen">▶ 전체 듣기</button>
      <button class="btn sm" id="sc-fill">역할 채우기</button>
      <button class="btn sm" id="sc-stop">■ 정지</button>
    </div>
    <div id="sc-turns"></div>
    <p class="leg"><span class="sw">점선</span> = 150ms 미만으로 흘려 읽는 자리. 원어민이 거의 발음하지 않는다.</p>
    <div class="actbar" style="margin-top:14px">
      <button class="btn sm primary-btn" id="sc-next" style="padding:8px 14px">${scIdx+1 < tScenes.length ? '다음 장면 →' : '오늘 판으로 →'}</button>
    </div>`;
  wireBar();
  paintTurns(sc);
  // 기본은 1배. 자동으로 0.75× 로 내리면 원속에 귀가 안 익는다 — 실전 속도로
  // 알아듣는 게 목적이다. 느리게 듣고 싶으면 배율을 직접 누른다.
  $('sc-listen').onclick = () => { scMode='listen'; turns.forEach(t=>t.open=true); paintTurns(sc); chainTurn(sc,0); };
  $('sc-fill').onclick   = () => { scMode='fill';   turns.forEach(t=>t.open=false); paintTurns(sc); chainTurn(sc,0); };
  $('sc-stop').onclick   = tStopAudio;
  $('sc-next').onclick = async () => {
    tStopAudio();
    const n = Math.max(tSession?.progress?.scenes?.done || 0, scIdx + 1);
    await saveProgress({ scenes: { done: n, total: tScenes.length } });
    if (n >= tScenes.length) { await maybeComplete(); renderToday(); }
    else { scIdx = Math.min(n, tScenes.length - 1); drawScene(el); }
  };
}

function paintTurns(sc){
  const box = $('sc-turns'); box.textContent = '';
  (sc.turns || []).forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'dturn' + (t.is_me ? ' mine' : '');
    d.dataset.i = i;
    const hide = t.is_me && scMode === 'fill' && !t.open;
    d.innerHTML = `<span class="who">${esc(t.role_ko || t.who)}</span><span class="line">
      ${t.is_me && t.intent_ko ? `<span class="intent">↳ ${esc(t.intent_ko)}</span>` : ''}
      ${hide ? '<span class="hid">여기서 내가 말한다 — 눌러서 모범 대사 보기</span>' : segHtml(t.segs || [], t.ev || [])}</span>`;
    d.querySelector('.line').onclick = async () => {
      if (hide) {
        t.open = true; paintTurns(sc); playTurnA(sc, i);
        // 내 턴을 메운 것이 이 세션에서 가장 값나가는 행동이다
        tProg.turns_spoken = (tProg.turns_spoken || 0) + 1;
        await bumpXp(XP.turn, '대화 턴');
        return;
      }
      playTurnA(sc, i);
    };
    box.appendChild(d);
  });
}

function playTurnA(sc, i, then){
  tStopAudio();
  const t = (sc.turns || [])[i];
  if (!t?.audio_url) { then && then(); return; }
  const el = document.querySelector(`.dturn[data-i="${i}"]`);
  el?.classList.add('on');
  el?.scrollIntoView({ block:'nearest', behavior:'smooth' });
  tAudio = new Audio(t.audio_url);
  tAudio.playbackRate = tRate;
  tFollow(tAudio, t.ev || [], hit => {
    el?.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on'));
    if (hit >= 0) el?.querySelector(`.kw[data-e="${hit}"]`)?.classList.add('on');
  });
  tAudio.onended = () => {
    cancelAnimationFrame(tRaf);
    el?.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on'));
    el?.classList.remove('on');
    tProg.listened_ms = (tProg.listened_ms || 0) + (t.ms || 0);
    then && then();
  };
  tAudio.play().catch(() => { then && then(); });
}

function chainTurn(sc, i){
  const turns = sc.turns || [];
  if (i >= turns.length) { tStopAudio(); return; }
  const t = turns[i];
  if (scMode === 'fill' && t.is_me && !t.open) {        // 내 턴에서 멈춘다
    tStopAudio();
    const el = document.querySelector(`.dturn[data-i="${i}"]`);
    el?.classList.add('on'); el?.scrollIntoView({ block:'center', behavior:'smooth' });
    return;
  }
  playTurnA(sc, i, () => chainTurn(sc, i + 1));
}

/* ── 막 2 · 뉴스 읽기 ───────────────────────────────── */

function actArticle(el){
  const a = tArticle;
  if (!a) { renderToday(); return; }
  el.innerHTML = actBar('뉴스 읽기') + `
    <div class="sit" style="background:var(--eng-bg);border-radius:9px;padding:10px 13px;font-size:13.5px;font-weight:600;margin-bottom:12px">${esc(a.title)}</div>
    <div class="actbar"><button class="btn sm" id="ar-play">▶ 재생</button><button class="btn sm" id="ar-stop">■ 정지</button>
      <span class="vprog" id="ar-prog" style="margin:0 0 0 auto"></span></div>
    <div id="ar-sents">${(a.segs||[]).map((sg,i)=>`<div class="asbox" data-s="${i}">${segHtml(sg, a.ev||[])}</div>`).join('')}</div>
    <p class="leg"><span class="sw">점선</span> = 흘려 읽는 자리 · 문장을 누르면 거기부터 다시 읽습니다.</p>
    ${(a.summary_ko||[]).length ? `<div class="vcard" style="margin-top:16px"><div class="vt" style="font-size:14px">3줄 요약</div>
      <div class="vm">${a.summary_ko.map(x=>`• ${esc(x)}`).join('<br>')}</div></div>` : ''}`;
  wireBar();
  const boxes = [...el.querySelectorAll('.asbox')];
  let maxSent = tSession?.progress?.article?.sent || 0;
  const showProg = () => { $('ar-prog').textContent = `문장 ${maxSent}/${boxes.length}`; };
  showProg();

  const run = fromMs => {
    tStopAudio();
    tAudio = new Audio(a.audio_url);
    tAudio.playbackRate = tRate;
    tAudio.currentTime = (fromMs || 0) / 1000;
    tFollow(tAudio, a.ev || [], hit => {
      el.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on'));
      boxes.forEach(b => b.classList.remove('on'));
      if (hit < 0) return;
      const span = el.querySelector(`.kw[data-e="${hit}"]`); if (!span) return;
      span.classList.add('on');
      const box = span.closest('.asbox');
      box?.classList.add('on'); box?.scrollIntoView({ block:'nearest' });
      const si = +(box?.dataset.s ?? -1);
      if (si + 1 > maxSent) { maxSent = si + 1; showProg(); }
    });
    tAudio.onended = async () => {
      tStopAudio();
      tProg.listened_ms = (tProg.listened_ms || 0) + (a.ms || 0);
      tProg.articles_read = (tProg.articles_read || 0) + 1;
      maxSent = boxes.length; showProg();
      await saveProgress({ article: { sent: maxSent, total: boxes.length } });
      await bumpXp(XP.article, '기사 완독');
      await maybeComplete();
    };
    tAudio.play().catch(()=>{});
  };
  $('ar-play').onclick = () => run(0);
  $('ar-stop').onclick = async () => { tStopAudio(); await saveProgress({ article:{ sent:maxSent, total:boxes.length } }); };
  boxes.forEach(b => b.onclick = () => run(a.starts?.[+b.dataset.s] ?? 0));
}

/* ── 막 3 · 어휘 마무리 ─────────────────────────────── */

function actVocab(el){
  // 오늘 것은 인지(채점 없음), 지난 것은 산출(SRS 채점). 방금 본 표현을 채점하면
  // 전부 "맞음"이 나와서 복습 간격이 가짜로 벌어진다.
  const list = [...tVocab.today.map(c=>({c,kind:'recog'})), ...tVocab.past.map(c=>({c,kind:'prod'}))];
  let i = tSession?.progress?.vocab?.done || 0;
  el.innerHTML = actBar('어휘 마무리') + `<div class="vprog" id="v-prog"></div><div id="v-body"></div>`;
  wireBar();
  draw();

  function draw(){
    const prog = $('v-prog'), body = $('v-body');
    if (i >= list.length) {
      prog.textContent = '';
      body.innerHTML = `<div class="donebox"><div class="big">🎉</div><h3>어휘 마무리 끝</h3>
        <p>오늘 나온 것 ${tVocab.today.length}개 · 지난 것 ${tVocab.past.length}개.</p>
        <button onclick="renderToday()">오늘 판으로</button></div>`;
      return;
    }
    const { c, kind } = list[i];
    const isWord = c.kind === 'word';
    prog.textContent = `${i+1} / ${list.length} · ` + (kind === 'recog'
      ? `오늘 나온 ${isWord ? '단어' : '표현'} (확인만)`
      : isWord ? '지난 단어 — 뜻은?' : '지난 표현 — 말해보기');
    if (kind === 'recog') {
      body.innerHTML = `<div class="vcard"><span class="klabel">${isWord ? '단어' : '표현'}</span>
        <div class="vt">${esc(c.answer_en)}</div>
        <div class="vm">${esc(isWord ? c.prompt_ko : (c.note || c.prompt_ko || ''))}</div>
        ${isWord && c.note ? `<div class="vex">${esc(c.note)}</div>` : ''}
        ${c.source_ref ? `<div class="vsrc">출처 · ${esc(c.source_ref)}</div>` : ''}
        <div class="srow" style="margin-top:12px">
          <button class="check" id="v-ok" style="margin-top:0;flex:1 1 auto">들었다 — 다음</button>
          <button class="btn sm" id="v-kill" title="이 표현 다시 안 보기">✕</button></div></div>`;
      $('v-kill').onclick = async () => {
        // 어색한 카드는 알아챈 자리에서 바로 뺄 수 있어야 한다. 참고 넘기면 계속 돌아온다.
        await sb.from('eng_cards').update({ status:'suspended' }).eq('id', c.id);
        toast('이 표현은 다시 안 나와요');
        list.splice(i, 1); await saveProgress({ vocab:{ done:i, total:list.length } }); draw();
      };
      $('v-ok').onclick = async () => {
        playVocab(c);
        await bumpXp(XP.recog, '어휘 확인');
        i++; await saveProgress({ vocab:{ done:i, total:list.length } }); draw();
      };
    } else if (isWord) {
      // 단어는 **영어를 보고 뜻을 떠올리는** 시험이다. 상황을 주고 말하게 하면 층이 어긋난다.
      body.innerHTML = `<div class="vcard"><span class="klabel">단어</span>
        <div class="vm" style="margin:0 0 8px">이 단어의 뜻은?</div>
        <div class="vt">${esc(c.answer_en)}</div>
        <button class="check" id="v-reveal" style="margin-top:12px">뜻 보기</button>
        <div id="v-ans" hidden style="margin-top:12px">
          <div class="vt" style="font-size:16px">${esc(c.prompt_ko)}</div>
          ${c.note ? `<div class="vex">${esc(c.note)}</div>` : ''}
          <div class="grades" style="margin-top:12px">
            <button class="grade miss">몰랐음</button><button class="grade soso">가물</button><button class="grade good">알았음</button>
          </div></div></div>`;
    } else {
      body.innerHTML = `<div class="vcard"><span class="klabel">표현</span>
        <div class="vm" style="margin:0 0 8px">이 상황, 영어로</div>
        <div class="vt" style="font-size:16px">${esc(c.prompt_ko)}</div>
        <button class="check" id="v-reveal" style="margin-top:12px">정답 보기</button>
        <div id="v-ans" hidden style="margin-top:12px">
          <div class="vt">${esc(c.answer_en)}</div>
          ${c.note ? `<div class="vm">${esc(c.note)}</div>` : ''}
          <div class="grades" style="margin-top:12px">
            <button class="grade miss">틀림</button><button class="grade soso">애매</button><button class="grade good">맞음</button>
          </div></div></div>`;
    }
    // 배선은 분기 밖에 둔다 — 단어·표현 두 갈래가 같은 reveal/채점을 쓴다.
    // 분기 안에 두면 새 갈래를 만들 때 조용히 빠진다 (실제로 단어 갈래가 그랬다).
    if ($('v-reveal')) {
      $('v-reveal').onclick = function(){ $('v-ans').hidden = false; this.remove(); playVocab(c); };
      body.querySelector('.grades').onclick = async e => {
        const g = e.target.closest('.grade'); if (!g) return;
        const grade = g.classList.contains('miss') ? 'miss' : g.classList.contains('soso') ? 'soso' : 'good';
        applyGrade(c, grade);
        await saveGrade(c, grade, 'vocab');
        if (!isWord) tProg.turns_spoken = (tProg.turns_spoken || 0) + 1;   // 단어는 '말한 턴'이 아니다
        // **오답에도 XP 를 준다.** 0 이면 「맞음」을 거짓으로 누르게 되고 SRS 가 망가진다.
        const good = grade !== 'miss';
        const pts = isWord ? (good ? XP.wordGood : XP.wordMiss) : (good ? XP.prodGood : XP.prodMiss);
        await bumpXp(pts, (isWord ? '단어' : '산출') + (good ? ' 정답' : ' (틀려도 XP)'));
        i++; await saveProgress({ vocab:{ done:i, total:list.length } }); draw();
      };
    }
  }
}
function playVocab(c){ tStopAudio(); playCard(c); }

/* 연속일. renderHome 을 걷어내면서 아무도 안 채우게 돼 '🔥 —' 로 굳어 있었다.
   세션이 있었던 날을 세되 **오늘 아직 안 했으면 어제부터** 센다 — 그래야 아침에 0으로 안 떨어진다. */
async function paintStreak(){
  const el = $('streak'); if (!el) return;
  try {
    const { data } = await sb.from('eng_sessions').select('session_date')
      .order('session_date', { ascending:false }).limit(120);
    const days = new Set((data || []).map(r => r.session_date));
    let n = 0, cur = Date.now();
    if (!days.has(kstDate(cur))) cur -= 864e5;
    while (days.has(kstDate(cur))) { n++; cur -= 864e5; }
    el.textContent = n ? `🔥 ${n}일` : '🔥 시작 전';
  } catch (_) { el.textContent = '🔥 —'; }
}

/* 판 아래 띠 — 인박스 한 줄 · 일기 · 푸시 · 토픽 토글 */
function wireStrip(){
  const add = async () => {
    const el = $('t-inb'), v = el.value.trim();
    if (!v) return;
    const { error } = await sb.from('eng_inbox').insert({ user_id: currentUser.id, text: v });
    if (error) return toast('추가 실패 — 네트워크를 확인하세요');
    el.value = ''; toast('인박스에 던져둠 — 밤에 카드로 변환돼요');
  };
  $('t-inb-add').onclick = add;
  $('t-inb').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

  $('t-jr-send').onclick = async () => {
    const raw = $('t-jr').value.trim();
    if (!raw) return;
    const { error } = await sb.from('eng_journal').upsert(
      { user_id: currentUser.id, entry_date: today(), raw, status: 'pending', corrected: null },
      { onConflict: 'user_id,entry_date' });
    $('t-jr-msg').textContent = error ? '제출 실패' : '✅ 제출됨 — 밤사이 교정됩니다';
    if (!error) toast('일기 제출됨 📓');
  };
  sb.from('eng_journal').select('raw,status').eq('entry_date', today()).maybeSingle()
    .then(({ data }) => {
      if (!data) return;
      $('t-jr').value = data.raw || '';
      $('t-jr-msg').textContent = data.status === 'corrected' ? '✅ 교정까지 끝났어요' : '✅ 제출됨 — 밤사이 교정됩니다';
    }).catch(() => {});

  const pb = $('t-push');
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') pb.textContent = '🔔 아침 푸시 켜짐';
  pb.onclick = () => subscribePush(true);

  // 토픽 on/off — 어떤 토픽의 어휘를 큐에 넣을지 가른다
  const tw = $('t-topics'); tw.textContent = '';
  for (const t of topics) {
    const b = document.createElement('button');
    b.className = 'tchip' + (t.active ? ' on' : '');
    b.textContent = t.name;
    b.onclick = async () => {
      t.active = !t.active; b.classList.toggle('on', t.active);
      await sb.from('eng_topics').update({ active: t.active }).eq('id', t.id);
      await loadTodayVocab(); renderToday();   // 토픽을 끄면 그 토픽 어휘가 큐에서 빠진다
    };
    tw.appendChild(b);
  }
}

/* ═══ 어휘 탭 — 쌓인 표현 전부와 SRS 상태 ═══════════════
   오늘 판의 「어휘 마무리」는 하루치만 본다. 여기는 **전체 장부**다 —
   무엇이 익었고 무엇이 아직인지, 그리고 앞당겨 복습할 자리. */
let vbFilter = 'all', vbKind = 'all';
async function renderVocab(){
  const head = $('vb-head'), list = $('vb-list');
  const d = today();
  // 활성 토픽만 본다 — 토픽을 끄면 그 어휘는 장부에서도 빠져야 앞뒤가 맞는다
  const names = activeTopicNames();
  let q = sb.from('eng_cards').select('*').neq('status','suspended');
  if (names.length) q = q.in('topic', names);
  const { data, error } = await q.order('next_review').limit(500);
  if (error) { head.innerHTML = '<div class="empty">어휘를 못 불러왔어요.</div>'; list.textContent=''; return; }
  const all = data || [];
  const n = k => all.filter(c => c.status === k).length;
  const due = all.filter(c => c.status !== 'new' && c.next_review <= d);
  head.innerHTML = `
    <div class="tstats">
      <div class="tstat"><div class="v">${n('mature')}</div><div class="l">익힌 표현<br><small>간격 21일↑</small></div></div>
      <div class="tstat"><div class="v">${all.length}</div><div class="l">쌓인 표현</div></div>
      <div class="tstat"><div class="v">${due.length}</div><div class="l">오늘 돌아온 것</div></div>
    </div>
    <div class="srow" style="margin:12px 0 7px">
      ${[['all','전체 층'],['word','단어'],['phrase','표현']]
        .map(([k,l]) => `<button class="tchip${vbKind===k?' on':''}" data-k="${k}">${l}${
          k==='all'?'':` ${all.filter(c => (c.kind||'phrase')===k).length}`}</button>`).join('')}
    </div>
    <div class="srow" style="margin:0 0 12px">
      ${[['all','전체'],['new','신규'],['learning','학습중'],['mature','익힘']]
        .map(([k,l]) => `<button class="tchip${vbFilter===k?' on':''}" data-f="${k}">${l}</button>`).join('')}
    </div>`;
  head.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { vbFilter = b.dataset.f; renderVocab(); });
  head.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { vbKind = b.dataset.k; renderVocab(); });

  let rows = vbFilter === 'all' ? all : all.filter(c => c.status === vbFilter);
  if (vbKind !== 'all') rows = rows.filter(c => (c.kind || 'phrase') === vbKind);
  if (!rows.length) { list.innerHTML = '<div class="empty">아직 없어요. 오늘 판을 한 번 돌리면 쌓입니다.</div>'; return; }
  const badge = c => c.status === 'mature' ? '<span class="ipill done">익힘</span>'
    : c.status === 'new' ? '<span class="ipill wait">신규</span>'
    : `<span class="ipill wait">${c.interval_days}일</span>`;
  // 줄은 **누르면 펼쳐진다.** 발음·뜻·출처·빼기가 그 안에 있다 —
  // ✕ 를 모든 줄에 상시 노출하면 파괴적 동작이 목록의 기본 상태가 되고, 잘못 누르기도 쉽다.
  list.innerHTML = rows.map(c => `<div class="vrow" data-id="${esc(c.id)}">
      <button class="vsum">
        <span class="itx"><span class="ie">${esc(c.answer_en)}
          ${(c.kind||'phrase')==='word' ? '<em class="kdot">단어</em>' : ''}</span>
          <span class="isrc">${esc(c.prompt_ko)}</span></span>
        ${badge(c)}<span class="vchev">›</span>
      </button>
      <div class="vmore" hidden>
        ${c.note ? `<div class="vnote">${esc(c.note)}</div>` : ''}
        <div class="vmeta">${c.next_review ? '다음 복습 ' + esc(c.next_review) : ''}${c.source_ref ? ' · ' + esc(c.source_ref) : ''}</div>
        <div class="srow" style="margin-top:9px">
          <button class="btn sm" data-play="${esc(c.id)}">🔊 들어보기</button>
          <button class="btn sm vkill" data-kill="${esc(c.id)}">다시 안 보기</button>
        </div>
      </div></div>`).join('');

  list.querySelectorAll('.vsum').forEach(b => b.onclick = () => {
    const row = b.closest('.vrow'), more = row.querySelector('.vmore');
    const open = !more.hidden;
    list.querySelectorAll('.vmore').forEach(m => m.hidden = true);
    list.querySelectorAll('.vrow').forEach(r => r.classList.remove('open'));
    if (!open) { more.hidden = false; row.classList.add('open'); }
  });
  const byId = Object.fromEntries(rows.map(c => [c.id, c]));
  list.querySelectorAll('[data-play]').forEach(b => b.onclick = () => {
    tStopAudio(); playCard(byId[b.dataset.play]);
  });
  list.querySelectorAll('[data-kill]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.from('eng_cards').update({ status:'suspended' }).eq('id', b.dataset.kill);
    if (error) { b.disabled = false; return toast('실패 — 네트워크를 확인하세요'); }
    toast('이 표현은 다시 안 나와요'); renderVocab();
  });
}

/* ═══ 보관함 — 지난 장면·기사 다시 하기 ════════════════ */
async function renderArchive(){
  const box = $('av-list');
  const [sc, ar] = await Promise.all([
    sb.from('eng_scenes').select('*').order('created_at',{ascending:false}).limit(40),
    sb.from('eng_articles').select('*').order('created_at',{ascending:false}).limit(40),
  ]);
  if (sc.error || ar.error) { box.innerHTML = '<div class="empty">보관함을 못 불러왔어요.</div>'; return; }
  const scenes = sc.data || [], arts = ar.data || [];
  if (!scenes.length && !arts.length) {
    box.innerHTML = '<div class="empty">아직 비어 있어요 — 밤 보급이 돌면 여기에 쌓입니다.</div>'; return;
  }
  box.innerHTML = `<p class="leg" style="margin:0 0 12px">지난 것을 다시 하고 싶을 때. 주말에 더 하고 싶으면 여기서 고르면 됩니다.</p>
    ${scenes.length ? `<div class="vprog">상황 대화 ${scenes.length}개</div>` + scenes.map(x =>
      `<div class="initem"><div class="itx"><div class="ie">${esc(x.situation_ko)}</div>
        <div class="isrc">${esc((x.created_at||'').slice(0,10))} · ${esc(x.topic)} L${x.level} · ${Math.round(x.ms/1000)}초</div></div>
        <button class="btn sm" data-sc="${x.id}">열기</button></div>`).join('') : ''}
    ${arts.length ? `<div class="vprog" style="margin-top:14px">뉴스 ${arts.length}건</div>` + arts.map(x =>
      `<div class="initem"><div class="itx"><div class="ie">${esc(x.title)}</div>
        <div class="isrc">${esc((x.created_at||'').slice(0,10))} · ${(x.sentences||[]).length}문장 · ${Math.round(x.ms/1000)}초</div></div>
        <button class="btn sm" data-ar="${x.id}">열기</button></div>`).join('') : ''}`;
  box.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => {
    // 보관함에서 고른 장면을 오늘 판의 장면 자리에 끼워 연다 (진행은 안 건드린다)
    const one = scenes.find(x => x.id === b.dataset.sc);
    if (!one) return;
    tScenes = [one]; scIdx = 0; show('today');
    setTimeout(() => openAct('scene'), 30);
  });
  box.querySelectorAll('[data-ar]').forEach(b => b.onclick = () => {
    const one = arts.find(x => x.id === b.dataset.ar);
    if (!one) return;
    tArticle = one; show('today');
    setTimeout(() => openAct('article'), 30);
  });
}

/* 세 칸을 다 채웠으면 완주 보너스. 한 번만 준다 */
async function maybeComplete(){
  if (!tSession || tSession.completed_at) return;
  const p = tSession.progress || {};
  const ok = (p.scenes?.total && p.scenes.done >= p.scenes.total)
          && (p.article?.total ? p.article.sent >= p.article.total : true)
          && (p.vocab?.total ? p.vocab.done >= p.vocab.total : true);
  if (!ok) return;
  try {
    await sb.from('eng_sessions').update({ completed_at: new Date().toISOString() })
      .eq('user_id', currentUser.id).eq('session_date', today());
    tSession.completed_at = new Date().toISOString();
  } catch(_) {}
  await bumpXp(XP.complete, '하루 판 완주 🎉');
}

/* ================= init ================= */
async function init(){
  paintBuild();
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ $('login-view').style.display='block'; $('app-view').style.display='none'; $('tabbar').style.display='none'; return; }
  currentUser = session.user;
  $('login-view').style.display='none'; $('app-view').style.display='block'; $('tabbar').style.display='grid';
  try {
    await flushPending();
    await loadTopics();
    await loadTodayVocab();
  } catch (e) {
    // 오프라인 폴백: 마지막 큐 스냅샷으로 복습은 가능하게
    toast('오프라인 — 채점은 쌓아두고 복귀하면 동기화합니다');
    console.warn(e);
  }
  // 「오늘」이 기본 화면이다. show() 를 안 거치고 뜨므로 여기서 직접 그려야 한다 —
  // 안 부르면 앱을 열었을 때 첫 화면이 그냥 빈 채로 있다.
  // try 밖에 둔다: 오늘 판이 실패했다고 "오프라인 모드" 토스트가 뜨면 원인을 잘못 가리킨다.
  try { await renderToday(); } catch (e) { console.warn('오늘 판', e); }

  if ('speechSynthesis' in window) speechSynthesis.getVoices();

  // 이미 허용해둔 사람은 조용히 재구독한다. 푸시 구독은 브라우저가 주기적으로
  // 만료·교체하므로 갱신 경로가 없으면 어느 날부터 조용히 끊긴다 (버튼은 계속 "켜짐"이고).
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') subscribePush(false);
}

init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
