<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>knowledge.tree — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:       #0a0e13;
  --surface:  #12171e;
  --surface2: #1a2029;
  --surface3: #222a35;
  --border:   rgba(255,255,255,0.06);
  --border2:  rgba(255,255,255,0.12);
  --text:     #e2e8f0;
  --muted:    #64748b;
  --accent:   #22c55e;
  --accent2:  #16a34a;
  --danger:   #ef4444;
  --warn:     #f59e0b;
  --info:     #3b82f6;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  min-height: 100vh;
}

.admin-header {
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.admin-logo {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
}
.admin-logo:hover { transform: scale(1.05); opacity: 0.9; }
.admin-logo-text { display: inline; letter-spacing: -0.3px; }
.admin-logo-text em { color: var(--accent); font-style: normal; }
.admin-badge {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 2px 7px;
  border-radius: 3px;
  background: rgba(34,197,94,0.12);
  color: var(--accent);
  border: 1px solid rgba(34,197,94,0.2);
}
.admin-spacer { flex: 1; }
.admin-status {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--danger);
}
.status-dot.connected { background: var(--accent); }
.source-toggle {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 3px;
  border: 1px solid var(--border2);
  border-radius: 7px;
  margin-right: 8px;
}
.source-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding: 5px 9px;
  border-radius: 5px;
  cursor: pointer;
}
.source-btn.active {
  background: rgba(34,197,94,0.16);
  color: var(--accent);
}
.admin-link {
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
  padding: 5px 10px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  transition: all 0.15s;
}
.admin-link:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

.auth-panel {
  max-width: 380px;
  margin: 120px auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 36px;
}
.auth-panel h2 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 6px;
}
.auth-panel p {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 24px;
  line-height: 1.6;
}
.form-group {
  margin-bottom: 14px;
}
.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--muted);
  margin-bottom: 5px;
}
.form-input {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
.form-input:focus { border-color: rgba(34,197,94,0.4); }
.form-input::placeholder { color: var(--muted); }
.form-textarea {
  min-height: 120px;
  resize: vertical;
  line-height: 1.7;
}

.btn {
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: var(--surface3); border-color: rgba(255,255,255,0.2); }
.btn-primary {
  background: var(--accent2);
  border-color: var(--accent2);
  color: #fff;
}
.btn-primary:hover { background: var(--accent); border-color: var(--accent); }
.btn-danger {
  color: var(--danger);
  border-color: rgba(239,68,68,0.3);
}
.btn-danger:hover { background: rgba(239,68,68,0.1); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-block { width: 100%; justify-content: center; }

.admin-layout {
  display: flex;
  min-height: calc(100vh - 56px);
}
.admin-sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px 0;
  overflow-y: auto;
}
.admin-content {
  flex: 1;
  padding: 28px 36px;
  overflow-y: auto;
}

.sb-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.sb-header-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
}
.tree-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  transition: all 0.1s;
  border-left: 2px solid transparent;
}
.tree-item:hover { color: var(--text); background: rgba(255,255,255,0.02); }
.tree-item.active { color: var(--text); border-left-color: var(--accent); background: rgba(34,197,94,0.04); }
.tree-item.depth-1 { padding-left: 28px; font-size: 12px; }
.tree-item.depth-2 { padding-left: 42px; font-size: 11px; }
.tree-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.tree-icon {
  font-size: 11px;
  opacity: 0.5;
  flex-shrink: 0;
}
.tree-count {
  margin-left: auto;
  font-size: 10px;
  color: var(--muted);
  opacity: 0.5;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 20px;
  overflow: hidden;
}
.panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.panel-title {
  font-size: 13px;
  font-weight: 600;
}
.panel-count {
  font-size: 10px;
  color: var(--muted);
  background: rgba(255,255,255,0.04);
  padding: 2px 8px;
  border-radius: 10px;
}
.panel-actions { margin-left: auto; display: flex; gap: 8px; }
.panel-body { padding: 20px; }
.panel-empty {
  padding: 40px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.form-row-3 {
  grid-template-columns: 1fr 1fr 1fr;
}
.form-full { grid-column: 1 / -1; }
.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 16px;
  margin-top: 16px;
  border-top: 1px solid var(--border);
}

.tags-input-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 6px;
  min-height: 38px;
  align-items: center;
  cursor: text;
}
.tags-input-wrap:focus-within { border-color: rgba(34,197,94,0.4); }
.tag-chip {
  font-size: 11px;
  padding: 2px 8px;
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.2);
  color: var(--accent);
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.tag-chip-x {
  cursor: pointer;
  opacity: 0.6;
  font-size: 13px;
}
.tag-chip-x:hover { opacity: 1; }
.tags-input {
  border: none;
  background: none;
  color: var(--text);
  font-size: 12px;
  outline: none;
  flex: 1;
  min-width: 80px;
  font-family: inherit;
}
.tags-input::placeholder { color: var(--muted); }

.q-list { display: flex; flex-direction: column; gap: 8px; }
.q-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.q-item .form-input { flex: 1; }
.q-remove {
  color: var(--danger);
  cursor: pointer;
  font-size: 14px;
  opacity: 0.5;
  transition: opacity 0.15s;
  flex-shrink: 0;
}
.q-remove:hover { opacity: 1; }

.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  animation: toastIn 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 360px;
}
.toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: var(--accent); }
.toast.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.concept-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
  cursor: pointer;
}
.concept-row:last-child { border-bottom: none; }
.concept-row:hover { background: rgba(255,255,255,0.02); }
.concept-row.active { background: rgba(34,197,94,0.04); }
.concept-title { font-size: 13px; font-weight: 500; flex: 1; }
.concept-level {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 2px 6px;
  border-radius: 3px;
}
.concept-level.basic { background: rgba(34,197,94,0.1); color: var(--accent); }
.concept-level.deep { background: rgba(192,132,252,0.12); color: #c084fc; }
.concept-desc {
  font-size: 11px;
  color: var(--muted);
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dialog {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 24px;
  max-width: 400px;
  width: 90%;
}
.dialog h3 { font-size: 14px; margin-bottom: 8px; }
.dialog p { font-size: 12px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }

.md-editor-wrap {
  border: 1px solid var(--border2);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg);
}
.md-toolbar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px 8px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
.md-tool-btn {
  width: 28px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.1s;
}
.md-tool-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.md-tool-sep {
  width: 1px;
  height: 16px;
  background: var(--border2);
  margin: 0 4px;
}
.md-tab-group {
  margin-left: auto;
  display: flex;
  gap: 0;
  border: 1px solid var(--border2);
  border-radius: 5px;
  overflow: hidden;
}
.md-tab {
  padding: 3px 12px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  transition: all 0.1s;
}
.md-tab.active { background: var(--surface3); color: var(--text); }
.md-tab:not(:last-child) { border-right: 1px solid var(--border2); }
.md-panels {
  display: flex;
  height: calc(100vh - 340px);
  min-height: 360px;
}
.md-panels.mode-write .md-edit-pane { flex: 1; display: block; }
.md-panels.mode-write .md-preview-pane { display: none; }
.md-panels.mode-preview .md-edit-pane { display: none; }
.md-panels.mode-preview .md-preview-pane { flex: 1; display: block; }
.md-panels.mode-split .md-edit-pane { flex: 1; display: block; }
.md-panels.mode-split .md-preview-pane { flex: 1; display: block; border-left: 1px solid var(--border); }
.md-edit-pane textarea {
  width: 100%;
  height: 100%;
  padding: 14px;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  line-height: 1.7;
  resize: none;
  outline: none;
}
.md-edit-pane textarea::placeholder { color: var(--muted); }
.md-preview-pane {
  padding: 14px;
  overflow-y: auto;
  font-size: 13px;
}
.md-preview-pane::-webkit-scrollbar { width: 3px; }
.md-preview-pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); }
.md-preview-pane h2 { font-size: 13px; font-weight: 600; margin: 18px 0 6px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.md-preview-pane h3 { font-size: 11px; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.md-preview-pane p { font-size: 13px; line-height: 1.85; color: #8b949e; margin-bottom: 8px; }
.md-preview-pane code { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
.md-preview-pane pre { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 7px; padding: 14px; margin: 10px 0; overflow-x: auto; }
.md-preview-pane pre code { background: none; padding: 0; font-size: 12px; line-height: 1.6; }
.md-preview-pane ul, .md-preview-pane ol { margin: 4px 0 9px 16px; }
.md-preview-pane li { font-size: 13px; line-height: 1.75; color: #8b949e; margin-bottom: 2px; }
.md-preview-pane blockquote { border-left: 3px solid var(--accent); padding: 7px 13px; margin: 10px 0; background: rgba(34,197,94,0.05); border-radius: 0 5px 5px 0; }
.md-preview-pane table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
.md-preview-pane th { background: rgba(255,255,255,0.04); padding: 6px 9px; text-align: left; border: 1px solid var(--border); font-weight: 500; }
.md-preview-pane td { padding: 6px 9px; border: 1px solid var(--border); color: #8b949e; }
.md-preview-empty { color: var(--muted); font-size: 12px; opacity: 0.5; padding-top: 20px; text-align: center; }

.import-export-group {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-right: 8px;
}
.btn-ie {
  border-color: rgba(59,130,246,0.3);
  color: var(--info);
}
.btn-ie:hover { background: rgba(59,130,246,0.1); }
.btn-ie:disabled { opacity: 0.35; cursor: not-allowed; }

.import-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
}
.import-modal-box {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 12px;
  width: 680px;
  max-width: 95vw;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.import-modal-header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.import-modal-header h3 { font-size: 14px; font-weight: 600; }
.import-modal-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
.import-modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
.import-preview-section { margin-bottom: 14px; }
.import-preview-section h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px; }
.import-topic-title { font-size: 15px; font-weight: 600; color: var(--accent); }
.import-section-row { padding: 6px 0; border-bottom: 1px solid var(--border); }
.import-section-name { font-size: 12px; font-weight: 600; color: var(--text); }
.import-concept-list { margin-top: 4px; padding-left: 12px; }
.import-concept-item { font-size: 11px; color: var(--muted); padding: 2px 0; display: flex; align-items: center; gap: 6px; }
.import-badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; }
.import-badge.basic { background: rgba(34,197,94,0.12); color: var(--accent); border: 1px solid rgba(34,197,94,0.2); }
.import-badge.deep { background: rgba(59,130,246,0.12); color: var(--info); border: 1px solid rgba(59,130,246,0.2); }
.import-badge.child { background: rgba(245,158,11,0.12); color: var(--warn); border: 1px solid rgba(245,158,11,0.2); }
.import-modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }
</style>
</head>
<body>

<div class="admin-header">
  <div class="admin-logo" onclick="goAdminHome()">🌳 <span class="admin-logo-text">knowledge<em>.</em>tree</span> <span class="admin-badge">admin</span></div>
  <div class="admin-spacer"></div>
  <div class="admin-status" id="conn-status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">연결 안 됨</span>
  </div>
  <div class="source-toggle" id="source-toggle">
    <button class="source-btn active" id="source-public" onclick="setDataSource('public')">PUBLIC</button>
    <button class="source-btn" id="source-private" onclick="setDataSource('private')">PRIVATE</button>
  </div>
  <div class="import-export-group" id="import-export-group" style="display:none">
    <button class="btn btn-sm btn-ie" onclick="triggerImport()" title="README 파일로 토픽 가져오기">↑ Import</button>
    <button class="btn btn-sm btn-ie" id="export-btn" onclick="exportTopic()" title="현재 토픽을 README 파일로 내보내기" disabled>↓ Export</button>
    <input type="file" id="import-file-input" accept=".md" style="display:none" onchange="handleImportFile(event)">
  </div>
  <a href="index.html" class="admin-link">← 메인으로</a>
  <button class="btn btn-sm" id="logout-btn" style="display:none" onclick="logout()">로그아웃</button>
</div>

<div id="auth-view">
  <div class="auth-panel">
    <h2>관리자 로그인</h2>
    <p>Supabase 이메일/비밀번호로 로그인하세요.<br>
    계정이 없으면 Supabase Dashboard → Authentication에서 추가하세요.</p>
    <div class="form-group">
      <label class="form-label">이메일</label>
      <input class="form-input" type="email" id="auth-email" placeholder="admin@example.com">
    </div>
    <div class="form-group">
      <label class="form-label">비밀번호</label>
      <input class="form-input" type="password" id="auth-password" placeholder="••••••••">
    </div>
    <div style="margin-top:20px">
      <button class="btn btn-primary btn-block" onclick="login()">로그인</button>
    </div>
    <div id="auth-error" style="margin-top:12px;font-size:12px;color:var(--danger);display:none"></div>
  </div>
</div>

<div id="admin-view" style="display:none">
  <div class="admin-layout">
    <div class="admin-sidebar" id="sidebar"></div>
    <div class="admin-content" id="content">
      <div class="panel-empty">← 사이드바에서 항목을 선택하세요</div>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>
<div id="dialog-root"></div>
<div id="import-modal" style="display:none"></div>

<script>
const SUPABASE_URL = 'https://mfzlrmwjwwpykjbsafud.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_L9tV1otxzn8yoC7fvwD6fw_qqiN5iyp';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let topics = [];
let sections = [];
let concepts = [];
let selectedItem = null;
let dataSource = 'public';

const TABLES = {
  public: { topics: 'topics', sections: 'sections', concepts: 'concepts', revisions: 'concept_revisions' },
  private: { topics: 'topics_private', sections: 'sections_private', concepts: 'concepts_private', revisions: 'concept_revisions_private' }
};

function getTables() {
  return TABLES[dataSource] || TABLES.public;
}

function updateSourceUI() {
  const isPublic = dataSource === 'public';
  const pubBtn = document.getElementById('source-public');
  const prvBtn = document.getElementById('source-private');
  if (pubBtn) pubBtn.classList.toggle('active', isPublic);
  if (prvBtn) prvBtn.classList.toggle('active', !isPublic);
}

async function setDataSource(source) {
  if (!TABLES[source] || source === dataSource) return;
  dataSource = source;
  updateSourceUI();
  selectedItem = null;
  location.hash = '';
  await loadAll();
  document.getElementById('content').innerHTML = '<div class="panel-empty">← 사이드바에서 항목을 선택하세요</div>';
  toast(`데이터 소스 전환: ${source.toUpperCase()}`, 'success');
}

function generateId() {
  return Math.random().toString(36).substring(2, 10);
}

async function login() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    return;
  }
  currentUser = data.user;
  showAdmin();
}

async function logout() {
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById('admin-view').style.display = 'none';
  document.getElementById('auth-view').style.display = 'block';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('source-toggle').style.display = 'none';
  document.getElementById('import-export-group').style.display = 'none';
  updateStatus(false);
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUser = session.user;
    showAdmin();
  }
}

async function showAdmin() {
  document.getElementById('auth-view').style.display = 'none';
  document.getElementById('admin-view').style.display = 'block';
  document.getElementById('logout-btn').style.display = '';
  document.getElementById('source-toggle').style.display = 'flex';
  document.getElementById('import-export-group').style.display = 'flex';
  updateSourceUI();
  updateStatus(true);
  await loadAll();
  restoreFromHash();
}

function restoreFromHash() {
  if (selectedItem) return;
  const hash = location.hash.replace('#', '');
  if (!hash) return;
  const parts = hash.split('/');
  const src = parts[0];
  if (src === 'private' && dataSource !== 'private') return;

  // form 복원: src/form/topic/{id|new}
  if (parts[1] === 'form' && parts[2] === 'topic') {
    const editId = parts[3] !== 'new' ? parts[3] : undefined;
    if (editId) selectedItem = { type: 'topic', id: editId };
    buildSidebar();
    showTopicForm(editId);
    return;
  }
  // src/form/section/{topicId}/{id|new}
  if (parts[1] === 'form' && parts[2] === 'section' && parts[3]) {
    const topicId = parts[3];
    const editId = parts[4] !== 'new' ? parts[4] : undefined;
    selectedItem = { type: editId ? 'section' : 'topic', id: editId || topicId };
    buildSidebar();
    showSectionForm(topicId, editId);
    return;
  }
  // src/form/concept/{topicId}/{sectionId}/{id|new}
  if (parts[1] === 'form' && parts[2] === 'concept' && parts[3] && parts[4]) {
    const topicId = parts[3];
    const sectionId = parts[4];
    const editId = parts[5] !== 'new' ? parts[5] : undefined;
    selectedItem = { type: 'section', id: sectionId };
    buildSidebar();
    _origShowConceptForm(topicId, sectionId, editId);
    setTimeout(updatePreview, 0);
    return;
  }
  // 일반 상세 복원: src/topic/{id} or src/section/{id}
  if (parts.length === 3) {
    const [, type, id] = parts;
    if ((type === 'topic' && topics.find(t => t.id === id)) ||
        (type === 'section' && sections.find(s => s.id === id))) {
      selectedItem = { type, id };
      updateExportBtn();
      if (type === 'topic') renderTopicDetail(id);
      else if (type === 'section') renderSectionDetail(id);
    }
  }
}

function updateStatus(connected) {
  document.getElementById('status-dot').classList.toggle('connected', connected);
  document.getElementById('status-text').textContent = connected ? `Supabase 연결됨 · ${dataSource.toUpperCase()}` : '연결 안 됨';
}

async function loadAll() {
  updateStatus(!!currentUser);
  const tNames = getTables();
  const [t, s, c] = await Promise.all([
    sb.from(tNames.topics).select('*').order('sort_order'),
    sb.from(tNames.sections).select('*').order('sort_order'),
    sb.from(tNames.concepts).select('*').order('sort_order'),
  ]);
  if (t.error || s.error || c.error) { toast('데이터 로딩 실패', 'error'); return; }
  topics = t.data;
  sections = s.data;
  concepts = c.data;
  buildSidebar();
}

function buildSidebar() {
  const el = document.getElementById('sidebar');
  let html = `
    <div class="sb-header">
      <span class="sb-header-title">Topics</span>
      <button class="btn btn-sm btn-primary" onclick="showTopicForm()">+ 주제</button>
    </div>
  `;
  for (const t of topics) {
    const isActive = selectedItem?.type === 'topic' && selectedItem.id === t.id;
    const secs = sections.filter(s => s.topic_id === t.id);
    html += `<div class="tree-item ${isActive ? 'active' : ''}" onclick="selectItem('topic','${t.id}')">
      <div class="tree-dot" style="background:${t.color || '#7c6af7'}"></div>
      ${t.title}
      <span class="tree-count">${secs.length}</span>
    </div>`;
    for (const s of secs) {
      const secActive = selectedItem?.type === 'section' && selectedItem.id === s.id;
      const cpts = concepts.filter(c => c.section_id === s.id);
      html += `<div class="tree-item depth-1 ${secActive ? 'active' : ''}" onclick="selectItem('section','${s.id}')">
        <span class="tree-icon">›</span>
        ${s.title}
        <span class="tree-count">${cpts.length}</span>
      </div>`;
    }
  }
  el.innerHTML = html;
}

function selectItem(type, id) {
  selectedItem = { type, id };
  location.hash = `${dataSource}/${type}/${id}`;
  buildSidebar();
  updateExportBtn();
  if (type === 'topic') renderTopicDetail(id);
  else if (type === 'section') renderSectionDetail(id);
}

function renderTopicDetail(id) {
  const t = topics.find(x => x.id === id);
  if (!t) return;
  const secs = sections.filter(s => s.topic_id === id);

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <div class="tree-dot" style="background:${t.color || '#7c6af7'};width:8px;height:8px"></div>
        <span class="panel-title">${t.title}</span>
        <div class="panel-actions">
          <button class="btn btn-sm" onclick="showTopicForm('${id}')">편집</button>
          <button class="btn btn-sm btn-danger" onclick="confirmDelete('topic','${id}','${t.title}')">삭제</button>
        </div>
      </div>
      <div class="panel-body">
        <div style="font-size:12px;color:var(--muted);line-height:1.8">
          ${t.description ? `<p>${t.description}</p>` : '<p style="opacity:.4">설명 없음</p>'}
          <p style="margin-top:8px"><strong>Tags:</strong> ${(t.tags||[]).join(', ') || '없음'} · <strong>Author:</strong> ${t.author || '미지정'}</p>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">섹션</span>
        <span class="panel-count">${secs.length}</span>
        <div class="panel-actions">
          <button class="btn btn-sm btn-primary" onclick="showSectionForm('${id}')">+ 섹션</button>
        </div>
      </div>
      ${secs.length === 0 ? '<div class="panel-empty">섹션이 없습니다</div>' :
        secs.map(s => {
          const cnt = concepts.filter(c => c.section_id === s.id).length;
          return `<div class="concept-row" onclick="selectItem('section','${s.id}')">
            <span class="concept-title">${s.title}</span>
            <span class="concept-desc">${s.description || ''}</span>
            <span style="font-size:10px;color:var(--muted)">${cnt} concepts</span>
          </div>`;
        }).join('')}
    </div>
  `;
}

function renderSectionDetail(sectionId) {
  const s = sections.find(x => x.id === sectionId);
  if (!s) return;
  const t = topics.find(x => x.id === s.topic_id);
  const cpts = concepts.filter(c => c.section_id === sectionId && !c.parent_concept_id).sort((a,b) => a.sort_order - b.sort_order);

  const cardsHtml = cpts.length === 0 ? '<div class="panel-empty" style="padding:12px 14px">개념이 없습니다</div>' :
    cpts.map(c => {
      const kids = concepts.filter(ch => ch.parent_concept_id === c.id);
      return `<div class="concept-row" style="padding:8px 12px" onclick="showConceptForm('${s.topic_id}','${sectionId}','${c.id}')">
        <span class="concept-title" style="font-size:12px">${c.title}</span>
        ${c.level ? `<span class="concept-level ${c.level}">${c.level === 'basic' ? '기본' : '심화'}</span>` : ''}
        ${kids.length > 0 ? `<div style="font-size:10px;color:var(--muted)">+${kids.length} sub</div>` : ''}
      </div>`;
    }).join('');

  const mdContent = cpts.map(c => {
    let block = `### ${c.title}\n`;
    if (c.level) block += `> level: ${c.level}\n`;
    if (c.questions && c.questions.length) block += `> questions: ${c.questions.join(' | ')}\n`;
    if (c.level || (c.questions && c.questions.length)) block += `\n`;
    block += (c.content || '') + '\n';
    const kids = concepts.filter(ch => ch.parent_concept_id === c.id).sort((a,b) => a.sort_order - b.sort_order);
    for (const k of kids) {
      block += `\n#### ${k.title}\n`;
      if (k.level) block += `> level: ${k.level}\n`;
      block += (k.content || '') + '\n';
    }
    return block;
  }).join('\n');

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <span style="font-size:11px;color:var(--muted);cursor:pointer" onclick="selectItem('topic','${s.topic_id}')">← ${t?.title || ''}</span>
        <span class="panel-title" style="margin-left:8px">${s.title}</span>
        <div class="panel-actions">
          <button class="btn btn-sm" onclick="showSectionForm('${s.topic_id}','${sectionId}')">편집</button>
          <button class="btn btn-sm btn-danger" onclick="confirmDelete('section','${sectionId}','${s.title}')">삭제</button>
        </div>
      </div>
      <div class="panel-body">
        <p style="font-size:12px;color:var(--muted)">${s.description || '설명 없음'}</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">개념</span>
        <span class="panel-count">${cpts.length}</span>
        <div class="panel-actions" style="display:flex;align-items:center;gap:6px">
          <button class="btn btn-sm" id="sec-md-write-tab" onclick="setSecEditorMode('write')">Write</button>
          <button class="btn btn-sm" id="sec-md-preview-tab" onclick="setSecEditorMode('preview')">Preview</button>
          <button class="btn btn-sm btn-primary" id="sec-md-split-tab" onclick="setSecEditorMode('split')">Split</button>
          <div style="width:1px;height:16px;background:var(--border2)"></div>
          <button class="btn btn-sm btn-primary" onclick="showConceptForm('${s.topic_id}','${sectionId}')">+ 개념</button>
        </div>
      </div>
      <div style="display:flex;height:calc(100vh - 220px);min-height:520px">
        <div style="flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)">
          <div class="md-toolbar" style="border-top:1px solid var(--border);border-bottom:1px solid var(--border2)">
            <button class="md-tool-btn" title="Bold" onclick="mdInsertSec('**','**')"><b>B</b></button>
            <button class="md-tool-btn" title="Italic" onclick="mdInsertSec('*','*')"><i>I</i></button>
            <button class="md-tool-btn" title="Code" onclick="mdInsertSec('\`','\`')">&#96;&#96;</button>
            <button class="md-tool-btn" title="H3" onclick="mdInsertLineSec('### ')">H3</button>
          </div>
          <div class="md-panels mode-split" id="sec-md-panels" style="flex:1;height:auto">
            <div class="md-edit-pane">
              <textarea id="sec-md-content" oninput="updateSecPreview()">${escapeHtml(mdContent)}</textarea>
            </div>
            <div class="md-preview-pane" id="sec-md-preview"></div>
          </div>
          <div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0">
            <button class="btn btn-primary" onclick="saveSectionMd('${s.topic_id}','${sectionId}')">저장</button>
          </div>
        </div>
        <div style="width:220px;overflow-y:auto;flex-shrink:0">
          ${cardsHtml}
        </div>
      </div>
    </div>
  `;
  updateSecPreview();
}

function showTopicForm(editId) {
  location.hash = `${dataSource}/form/topic/${editId || 'new'}`;
  const t = editId ? topics.find(x => x.id === editId) : null;
  const isEdit = !!t;
  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">${isEdit ? '주제 편집' : '새 주제 추가'}</span>
      </div>
      <div class="panel-body">
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label">제목</label>
          <input class="form-input" id="f-title" value="${t?.title || ''}" placeholder="주제 이름">
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label">설명</label>
          <input class="form-input" id="f-desc" value="${t?.description || ''}" placeholder="한 줄 설명">
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label">색상</label>
          <input class="form-input" id="f-color" value="${t?.color || '#3498db'}" type="color" style="height:38px;padding:4px">
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label">Tags (Enter로 추가)</label>
          <div class="tags-input-wrap" id="tags-wrap" onclick="document.getElementById('tags-input').focus()">
            ${(t?.tags||[]).map(tag => `<span class="tag-chip">${tag}<span class="tag-chip-x" onclick="removeTag(this,'${tag}')">&times;</span></span>`).join('')}
            <input class="tags-input" id="tags-input" placeholder="태그 입력...">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" onclick="cancelForm()">취소</button>
          <button class="btn btn-primary" onclick="saveTopic('${editId || ''}')">${isEdit ? '저장' : '추가'}</button>
        </div>
      </div>
    </div>
  `;
  setupTagsInput();
}

function showSectionForm(topicId, editId) {
  location.hash = `${dataSource}/form/section/${topicId}/${editId || 'new'}`;
  const s = editId ? sections.find(x => x.id === editId) : null;
  const isEdit = !!s;
  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">${isEdit ? '섹션 편집' : '새 섹션 추가'}</span>
      </div>
      <div class="panel-body">
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label">제목</label>
          <input class="form-input" id="f-title" value="${s?.title || ''}" placeholder="섹션 이름">
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label">설명</label>
          <input class="form-input" id="f-desc" value="${s?.description || ''}" placeholder="섹션 설명">
        </div>
        <div class="form-actions">
          <button class="btn" onclick="cancelForm()">취소</button>
          <button class="btn btn-primary" onclick="saveSection('${topicId}','${editId || ''}')">${isEdit ? '저장' : '추가'}</button>
        </div>
      </div>
    </div>
  `;
}

function showConceptForm(topicId, sectionId, editId) {
  location.hash = `${dataSource}/form/concept/${topicId}/${sectionId}/${editId || 'new'}`;
  const c = editId ? concepts.find(x => x.id === editId) : null;
  const isEdit = !!c;
  const qs = c?.questions || [];

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">${isEdit ? '개념 편집' : '새 개념 추가'}</span>
      </div>
      <div class="panel-body">
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label">제목</label>
          <input class="form-input" id="f-title" value="${c?.title || ''}" placeholder="개념 이름">
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label">설명</label>
          <input class="form-input" id="f-desc" value="${c?.description || ''}" placeholder="카드에 표시되는 한 줄 설명">
        </div>
        <div class="form-row" style="margin-bottom:14px">
          <div class="form-group">
            <label class="form-label">레벨</label>
            <select class="form-input" id="f-level">
              <option value="">미지정</option>
              <option value="basic" ${c?.level === 'basic' ? 'selected' : ''}>기본 (basic)</option>
              <option value="deep" ${c?.level === 'deep' ? 'selected' : ''}>심화 (deep)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">정렬 순서</label>
            <input class="form-input" id="f-sort" type="number" value="${c?.sort_order ?? concepts.filter(x=>x.section_id===sectionId).length}" placeholder="0">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label">검색 질문 (벡터 검색 인덱스)</label>
          <div class="q-list" id="q-list">
            ${qs.map((q, i) => `
              <div class="q-item">
                <input class="form-input q-input" value="${escapeHtml(q)}" placeholder="질문 ${i+1}">
                <span class="q-remove" onclick="this.parentElement.remove()">&times;</span>
              </div>
            `).join('')}
          </div>
          <button class="btn btn-sm" style="margin-top:8px" onclick="addQuestion()">+ 질문 추가</button>
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label">Content (마크다운)</label>
          <div class="md-editor-wrap">
            <div class="md-toolbar">
              <button class="md-tool-btn" title="Bold" onclick="mdInsert('**','**')"><b>B</b></button>
              <button class="md-tool-btn" title="Italic" onclick="mdInsert('*','*')"><i>I</i></button>
              <button class="md-tool-btn" title="Code" onclick="mdInsert('\`','\`')">‹›</button>
              <button class="md-tool-btn" title="Code Block" onclick="mdInsert('\\n\`\`\`\\n','\\n\`\`\`\\n')">{ }</button>
              <span class="md-tool-sep"></span>
              <button class="md-tool-btn" title="Heading 2" onclick="mdInsertLine('## ')">H2</button>
              <button class="md-tool-btn" title="Heading 3" onclick="mdInsertLine('### ')">H3</button>
              <span class="md-tool-sep"></span>
              <button class="md-tool-btn" title="List" onclick="mdInsertLine('- ')">•</button>
              <button class="md-tool-btn" title="Blockquote" onclick="mdInsertLine('> ')">❝</button>
              <button class="md-tool-btn" title="Table" onclick="mdInsertTable()">⊞</button>
              <div class="md-tab-group">
                <button class="md-tab active" data-mode="split" onclick="setEditorMode('split')">Split</button>
                <button class="md-tab" data-mode="write" onclick="setEditorMode('write')">Write</button>
                <button class="md-tab" data-mode="preview" onclick="setEditorMode('preview')">Preview</button>
              </div>
            </div>
            <div class="md-panels mode-split" id="md-panels">
              <div class="md-edit-pane">
                <textarea id="f-content" placeholder="마크다운을 입력하세요..." oninput="updatePreview()">${escapeHtml(c?.content || '')}</textarea>
              </div>
              <div class="md-preview-pane" id="md-preview"></div>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" onclick="cancelForm()">취소</button>
          ${isEdit ? `<button class="btn btn-danger" onclick="confirmDelete('concept','${editId}','${escapeHtml(c.title)}')">삭제</button>` : ''}
          <button class="btn btn-primary" onclick="saveConcept('${topicId}','${sectionId}','${editId || ''}')">${isEdit ? '저장' : '추가'}</button>
        </div>
      </div>
    </div>
  `;
}

function addQuestion() {
  const list = document.getElementById('q-list');
  const div = document.createElement('div');
  div.className = 'q-item';
  div.innerHTML = `<input class="form-input q-input" placeholder="질문"><span class="q-remove" onclick="this.parentElement.remove()">&times;</span>`;
  list.appendChild(div);
  div.querySelector('input').focus();
}

function getQuestions() {
  return Array.from(document.querySelectorAll('.q-input')).map(el => el.value.trim()).filter(Boolean);
}

function cancelForm() {
  if (selectedItem) {
    location.hash = `${dataSource}/${selectedItem.type}/${selectedItem.id}`;
    if (selectedItem.type === 'topic') renderTopicDetail(selectedItem.id);

let tagValues = [];
function setupTagsInput() {
  const existing = topics.find(t => t.id === (selectedItem?.id));
  tagValues = existing?.tags ? [...existing.tags] : [];
  const input = document.getElementById('tags-input');
  if (!input) return;
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && input.value.trim()) {
      e.preventDefault();
      const val = input.value.trim().toLowerCase();
      if (!tagValues.includes(val)) {
        tagValues.push(val);
        renderTags();
      }
      input.value = '';
    }
    if (e.key === 'Backspace' && !input.value && tagValues.length > 0) {
      tagValues.pop();
      renderTags();
    }
  });
}

function renderTags() {
  const wrap = document.getElementById('tags-wrap');
  const input = document.getElementById('tags-input');
  wrap.querySelectorAll('.tag-chip').forEach(el => el.remove());
  tagValues.forEach(tag => {
    const span = document.createElement('span');
    span.className = 'tag-chip';
    span.innerHTML = `${tag}<span class="tag-chip-x" onclick="removeTag(this,'${tag}')">&times;</span>`;
    wrap.insertBefore(span, input);
  });
}

function removeTag(el, tag) {
  tagValues = tagValues.filter(t => t !== tag);
  el.parentElement.remove();
}

async function saveSectionMd(topicId, sectionId) {
  const ta = document.getElementById('sec-md-content');
  if (!ta) return;
  const raw = ta.value;
  const tNames = getTables();

  // ### 헤딩 기준으로 파싱
  const blocks = [];
  const lines = raw.split('\n');
  let cur = null;
  for (const line of lines) {
    if (line.startsWith('### ') && !line.startsWith('#### ')) {
      if (cur) blocks.push(cur);
      cur = { title: line.slice(4).trim(), metaLines: [], contentLines: [], children: [] };
    } else if (line.startsWith('#### ') && cur) {
      cur.children.push({ title: line.slice(5).trim(), contentLines: [] });
    } else if (cur) {
      const lastChild = cur.children[cur.children.length - 1];
      if (lastChild) lastChild.contentLines.push(line);
      else if (line.startsWith('> ')) cur.metaLines.push(line.slice(2).trim());
      else cur.contentLines.push(line);
    }
  }
  if (cur) blocks.push(cur);

  if (blocks.length === 0) { toast('### 헤딩이 없습니다', 'error'); return; }

  toast('저장 중...', 'success');

  for (const block of blocks) {
    const content = block.contentLines.join('\n').trim() || null;
    let level = null, questions = [];
    for (const m of block.metaLines) {
      if (m.startsWith('level:')) level = m.slice(6).trim();
      if (m.startsWith('questions:')) questions = m.slice(10).split('|').map(q => q.trim()).filter(Boolean);
    }
    const existCpt = concepts.find(c => c.section_id === sectionId && c.title === block.title);
    if (!existCpt) { toast(`"${block.title}" 개념이 없습니다. 먼저 카드 뷰에서 추가하세요.`, 'error'); continue; }

    const row = { id: existCpt.id, section_id: sectionId, topic_id: topicId, title: existCpt.title,
      description: existCpt.description, sort_order: existCpt.sort_order,
      level: level || existCpt.level, questions: questions.length ? questions : existCpt.questions,
      content };
    const { error } = await sb.from(tNames.concepts).upsert(row);
    if (error) { toast(`저장 실패 (${block.title}): ${error.message}`, 'error'); continue; }

    // revision
    await sb.from(tNames.revisions).insert({
      id: generateId(), concept_id: existCpt.id, topic_id: topicId, section_id: sectionId,
      change_type: 'update', title: existCpt.title, content, level: row.level,
      questions: row.questions, changed_by: currentUser?.email || null,
    });

    // 자식 개념 content 업데이트
    for (const child of block.children) {
      const existKid = concepts.find(c => c.parent_concept_id === existCpt.id && c.title === child.title);
      if (!existKid) continue;
      const kidContent = child.contentLines.join('\n').trim() || null;
      await sb.from(tNames.concepts).upsert({ ...existKid, content: kidContent });
    }
  }

  toast('저장 완료', 'success');
  await loadAll();
  renderSectionDetail(sectionId, 'md');
}

function handleImportFile(event) {

function parseReadme(text) {
  const lines = text.split('\n');
  let topic = null;
  let currentSection = null;
  let currentConcept = null;
  let bodyLines = [];

  function flushConcept() {
    if (!currentConcept || !currentSection) return;
    const body = bodyLines.join('\n').trim();
    const paras = body.split(/\n\n+/);
    currentConcept.description = paras[0] || null;
    currentConcept.content = paras.slice(1).join('\n\n') || null;
    bodyLines = [];
  }

  function flushSection() {
    flushConcept();
    currentConcept = null;
  }

  for (const raw of lines) {
    const line = raw;
    if (/^# /.test(line)) {
      topic = { title: line.replace(/^# /, '').trim(), description: null, sections: [] };
      currentSection = null;
      currentConcept = null;
      bodyLines = [];
    } else if (/^## /.test(line)) {
      if (!topic) continue;
      flushSection();
      currentSection = { title: line.replace(/^## /, '').trim(), description: null, concepts: [] };
      topic.sections.push(currentSection);
      currentConcept = null;
      bodyLines = [];
    } else if (/^### /.test(line)) {
      if (!currentSection) continue;
      flushSection();
      currentConcept = { title: line.replace(/^### /, '').trim(), level: null, questions: [], description: null, content: null, parent: null };
      currentSection.concepts.push(currentConcept);
      bodyLines = [];
    } else if (/^#### /.test(line)) {
      if (!currentSection) continue;
      flushConcept();
      const parent = currentConcept;
      currentConcept = { title: line.replace(/^#### /, '').trim(), level: null, questions: [], description: null, content: null, parent: parent ? parent.title : null };
      currentSection.concepts.push(currentConcept);
      bodyLines = [];
    } else if (/^> level:/.test(line) && currentConcept) {
      const val = line.replace(/^> level:/, '').trim().toLowerCase();
      currentConcept.level = (val === 'basic' || val === 'deep') ? val : null;
    } else if (/^> questions:/.test(line) && currentConcept) {
      const val = line.replace(/^> questions:/, '').trim();
      currentConcept.questions = val.split('|').map(q => q.trim()).filter(Boolean);
    } else if (/^> /.test(line)) {
      // ignore other blockquotes
    } else {
      if (currentConcept) {
        bodyLines.push(line);
      } else if (currentSection && !currentConcept) {
        if (line.trim()) currentSection.description = (currentSection.description ? currentSection.description + '\n' : '') + line.trim();
      } else if (topic && !currentSection) {
        if (line.trim()) topic.description = (topic.description ? topic.description + '\n' : '') + line.trim();
      }
    }
  }
  flushSection();
  if (!topic) return null;
  return topic;
}

async function doImport(parsed) {
  closeImportModal();
  toast('가져오는 중...', 'success');
  const tNames = getTables();
  await loadAll();

  // 1. Topic upsert (title 기준)
  let topic = topics.find(t => t.title === parsed.title);
  const topicId = topic ? topic.id : generateId();
  const topicRow = {
    id: topicId,
    title: parsed.title,
    description: parsed.description || null,
    sort_order: topic ? topic.sort_order : topics.length,
    tags: topic ? topic.tags : [],
    ...(topic?.color ? { color: topic.color } : {}),
  };
  const { error: tErr } = await sb.from(tNames.topics).upsert(topicRow);
  if (tErr) { toast(`토픽 저장 실패: ${tErr.message}`, 'error'); return; }

  let sectionOrder = sections.filter(s => s.topic_id === topicId).length;

  for (const sec of parsed.sections) {
    // 2. Section upsert (topic_id + title 기준)
    let existSec = sections.find(s => s.topic_id === topicId && s.title === sec.title);
    const sectionId = existSec ? existSec.id : generateId();
    const secRow = {
      id: sectionId,
      topic_id: topicId,
      title: sec.title,
      description: sec.description || null,
      sort_order: existSec ? existSec.sort_order : sectionOrder++,
    };
    const { error: sErr } = await sb.from(tNames.sections).upsert(secRow);
    if (sErr) { toast(`섹션 저장 실패 (${sec.title}): ${sErr.message}`, 'error'); return; }

    let conceptOrder = concepts.filter(c => c.section_id === sectionId).length;
    const titleToId = {};

    for (const cpt of sec.concepts) {
      // 3. Concept upsert (section_id + title 기준)
      let existCpt = concepts.find(c => c.section_id === sectionId && c.title === cpt.title);
      const conceptId = existCpt ? existCpt.id : generateId();
      const parentId = cpt.parent ? (titleToId[cpt.parent] || null) : null;
      const cptRow = {
        id: conceptId,
        section_id: sectionId,
        topic_id: topicId,
        parent_concept_id: parentId,
        title: cpt.title,
        description: cpt.description || null,
        level: cpt.level || null,
        questions: cpt.questions.length ? cpt.questions : [],
        content: cpt.content || null,
        sort_order: existCpt ? existCpt.sort_order : conceptOrder++,
      };
      const { error: cErr } = await sb.from(tNames.concepts).upsert(cptRow);
      if (cErr) { toast(`개념 저장 실패 (${cpt.title}): ${cErr.message}`, 'error'); return; }
      titleToId[cpt.title] = conceptId;

      // 4. revision 백필
      const changeType = existCpt ? 'update' : 'create';
      const revRow = {
        id: generateId(),
        concept_id: conceptId,
        topic_id: topicId,
        section_id: sectionId,
        change_type: changeType,
        title: cpt.title,
        description: cpt.description || null,
        level: cpt.level || null,
        questions: cpt.questions.length ? cpt.questions : null,
        content: cpt.content || null,
        changed_fields: changeType === 'create' ? null : { imported: true },
        changed_by: currentUser?.email || null,
      };
      await sb.from(tNames.revisions).insert(revRow);
    }
  }

  toast(`'${parsed.title}' 가져오기 완료`, 'success');
  selectedItem = { type: 'topic', id: topicId };
  await loadAll();
  renderTopicDetail(topicId);
}

async function exportTopic() {
  if (!selectedItem) return;
  const topicId = selectedItem.type === 'topic' ? selectedItem.id
    : selectedItem.type === 'section' ? sections.find(s => s.id === selectedItem.id)?.topic_id
    : concepts.find(c => c.id === selectedItem.id)?.topic_id;
  if (!topicId) return;

  const topic = topics.find(t => t.id === topicId);
  if (!topic) return;

  const topicSections = sections.filter(s => s.topic_id === topicId).sort((a, b) => a.sort_order - b.sort_order);
  let md = `# ${topic.title}\n`;
  if (topic.description) md += `\n${topic.description}\n`;

  for (const sec of topicSections) {
    md += `\n## ${sec.title}\n`;
    if (sec.description) md += `\n${sec.description}\n`;

    const rootCpts = concepts.filter(c => c.section_id === sec.id && !c.parent_concept_id).sort((a, b) => a.sort_order - b.sort_order);
    const childCpts = concepts.filter(c => c.section_id === sec.id && c.parent_concept_id).sort((a, b) => a.sort_order - b.sort_order);

    function writeConcept(c, level) {
      const prefix = level === 3 ? '###' : '####';
      md += `\n${prefix} ${c.title}\n`;
      if (c.level) md += `\n> level: ${c.level}\n`;
      if (c.questions && c.questions.length) md += `> questions: ${c.questions.join(' | ')}\n`;
      if (c.description) md += `\n${c.description}\n`;
      if (c.content) md += `\n${c.content}\n`;
      childCpts.filter(ch => ch.parent_concept_id === c.id).forEach(ch => writeConcept(ch, 4));
    }

    rootCpts.forEach(c => writeConcept(c, 3));
  }

  const slug = topic.title.toLowerCase().replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-|-$/g, '');
  const filename = `${slug}.md`;
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  toast(`${filename} 다운로드됨`, 'success');
}
</script>
