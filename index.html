<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knowledge">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>knowledge.tree</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>mermaid.initialize({ startOnLoad: false, theme: 'neutral' });</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --surface2: #1c2128;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.12);
  --text:     #e6edf3;
  --muted:    #7d8590;
  --accent:   #3fb950;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  max-width: 100vw;
}

#header {
  height: 48px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
  z-index: 200;
}
#logo { 
  font-size: 15px; font-weight: 600; letter-spacing: -0.3px; white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s ease;
}
#logo:hover {
  transform: scale(1.05);
  opacity: 0.9;
}
#logo em { color: var(--accent); font-style: normal; }
#node-count {
  font-size: 11px; color: var(--muted);
  background: rgba(255,255,255,0.04);
  padding: 2px 8px; border-radius: 20px;
  white-space: nowrap;
}

#search-wrap {
  flex: 1; max-width: 400px;
  position: relative;
}
#search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted); font-size: 13px;
  pointer-events: none;
}
#search-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 6px 10px 6px 32px;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
#search-input::placeholder { color: var(--muted); }
#search-input:focus { border-color: rgba(63,185,80,0.4); background: rgba(255,255,255,0.07); }
#search-input:disabled { opacity: 0.4; cursor: not-allowed; }
#search-spinner {
  position: absolute; right: 10px; top: 50%;
  transform: translateY(-50%);
  width: 13px; height: 13px;
  border: 2px solid rgba(255,255,255,0.08);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
#search-spinner.show { display: block; }
@keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

#search-results {
  position: absolute;
  top: calc(100% + 5px); left: 0; right: 0;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  display: none; z-index: 500;
}
#search-results.show { display: block; }
.sr-item {
  padding: 10px 14px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.sr-item:last-child { border-bottom: none; }
.sr-item:hover { background: rgba(255,255,255,0.04); }
.sr-item.focused { background: rgba(255,255,255,0.06); outline: none; }
.sr-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.sr-crumb { font-size: 11px; color: var(--muted); }
.sr-crumb span { color: var(--accent); opacity: 0.8; }
.sr-empty { padding: 14px; font-size: 13px; color: var(--muted); text-align: center; }

#model-status { font-size: 11px; color: var(--muted); white-space: nowrap; opacity: 0.6; }
.mode-toggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px;
  border: 1px solid var(--border2);
  border-radius: 7px;
}
.mode-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3px;
  padding: 4px 8px;
  border-radius: 5px;
  cursor: pointer;
}
.mode-btn.active {
  background: rgba(255,255,255,0.12);
  color: var(--text);
}
#private-logout-btn {
  display: none;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
}
#private-logout-btn:hover {
  color: var(--text);
  border-color: rgba(255,255,255,0.2);
}
#admin-btn {
  display: none;
  border: 1px solid rgba(34,197,94,0.25);
  background: transparent;
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  letter-spacing: 0.2px;
}
#admin-btn:hover {
  background: rgba(34,197,94,0.08);
  border-color: rgba(34,197,94,0.4);
}
#kb-help-btn {
  background: none; border: none; cursor: pointer;
  font-size: 14px; color: var(--muted); opacity: 0.4;
  padding: 4px; transition: opacity 0.15s, color 0.15s;
}
#kb-help-btn:hover { opacity: 1; color: var(--text); }

#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

#sidebar {
  width: 216px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 6px 0 24px;
}
#sidebar::-webkit-scrollbar { width: 2px; }
#sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

.sb-label {
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--muted); opacity: 0.45;
  padding: 14px 16px 6px;
}
.sb-topic {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 12px 7px 16px;
  cursor: pointer; user-select: none;
  font-size: 12.5px; font-weight: 500; color: var(--muted);
  border-left: 2px solid transparent;
  border-radius: 0 6px 6px 0;
  margin: 1px 6px 1px 0;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.sb-topic:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.sb-topic.active { color: var(--text); background: rgba(63,185,80,0.07); border-left-color: var(--topic-color, var(--accent)); }
.sb-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; transition: box-shadow 0.2s, transform 0.2s; }
.sb-topic.active .sb-dot { box-shadow: 0 0 7px var(--topic-color, var(--accent)); transform: scale(1.2); }
.sb-topic-count {
  margin-left: auto;
  font-size: 9.5px; color: var(--muted); opacity: 0.4;
  font-weight: 400;
  min-width: 16px; text-align: right;
}
.sb-topic-desc {
  font-size: 10px; color: var(--muted); opacity: 0.5;
  padding: 0 12px 7px 33px;
  line-height: 1.45;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.sb-sections {
  overflow: hidden;
  transition: max-height 0.28s cubic-bezier(0.4,0,0.2,1);
}
.sb-section {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px 5px 32px;
  font-size: 11.5px; color: var(--muted);
  cursor: pointer;
  transition: color 0.1s, background 0.1s;
  border-left: 2px solid transparent;
  border-radius: 0 5px 5px 0;
  margin-right: 6px;
}
.sb-section:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.sb-section.active { color: var(--text); background: rgba(255,255,255,0.04); }
.sb-section::before { content: '–'; opacity: 0.3; font-size: 10px; margin-right: 1px; }
.sb-section-count {
  margin-left: auto;
  font-size: 9px; opacity: 0.35;
}

#content {
  flex: 1;
  overflow-y: auto;
  padding: 36px 44px 80px;
  outline: none;
}
#content::-webkit-scrollbar { width: 5px; }
#content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

#content-inner {
  max-width: 900px;
  margin: 0 auto;
}
#content-inner.wide {
  max-width: 1100px;
}
/* --- Tech Notes (iframe-rendered self-contained HTML) --- */
#content-inner.note-mode { max-width: 1100px; }
.note-toolbar { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.note-back {
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  background:var(--surface); border:1px solid var(--border); border-radius:7px;
  padding:6px 11px; font-size:13px; color:var(--text); transition:border-color .15s;
}
.note-back:hover { border-color:var(--accent); color:var(--accent); }
.note-toolbar-title { font-size:15px; font-weight:650; }
.note-toolbar-date { font-size:12px; color:var(--muted); font-family:monospace; }
.note-toolbar-ext { margin-left:auto; font-size:12px; color:var(--muted); text-decoration:none; }
.note-toolbar-ext:hover { color:var(--accent); }
.note-frame {
  display:block; width:100%; border:1px solid var(--border); border-radius:10px;
  background:#0d1117; box-shadow:0 2px 12px rgba(0,0,0,.18);
}

.section-detail-layout {
  display: flex;
  gap: 0;
  align-items: flex-start;
}
.section-detail-main {
  flex: 1;
  min-width: 0;
  padding-right: 64px;
}
.section-detail-toc {
  width: 210px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  margin-top: 56px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
}
.section-detail-toc::-webkit-scrollbar { width: 2px; }
.section-detail-toc::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); }

#empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%;
  font-size: 13px; color: var(--muted);
}

.landing {
  display: flex; flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 70vh;
  padding: 40px 20px;
  text-align: center;
}
.landing-hero {
  margin-bottom: 48px;
}
.landing-logo {
  font-size: 32px; font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: 8px;
}
.landing-logo em { color: var(--accent); font-style: normal; }
.landing-tagline {
  font-size: 14px; color: var(--muted);
  line-height: 1.7;
  max-width: 420px;
}
.landing-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
  width: 100%;
  max-width: 800px;
}
.landing-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
  width: 260px;
  flex-shrink: 0;
}
.landing-card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.landing-card.kb-focus {
  border-color: rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.02);
}
.landing-card-title {
  font-size: 15px; font-weight: 600;
  margin-bottom: 4px;
}
.landing-card-desc {
  font-size: 12px; color: var(--muted);
  line-height: 1.6;
  margin-bottom: 12px;
}
.landing-card-meta {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--muted);
}
.landing-card-count {
  background: rgba(255,255,255,0.05);
  padding: 2px 8px;
  border-radius: 10px;
}
.landing-card-tags {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 10px;
}
.landing-card-tag {
  font-size: 10px; color: var(--muted);
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  padding: 1px 7px;
  border-radius: 4px;
}
.landing-anim {
  opacity: 0;
  transform: translateY(12px);
  animation: landingIn 0.5s ease forwards;
}
@keyframes landingIn {
  to { opacity: 1; transform: translateY(0); }
}

.topic-header {
  margin-bottom: 40px;
}
.topic-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.topic-header h1 {
  font-size: 22px; font-weight: 700;
  letter-spacing: -0.5px;
}
.topic-header p {
  font-size: 13px; color: var(--muted); line-height: 1.6;
}
.view-toggle {
  display: flex;
  gap: 4px;
  background: var(--surface2);
  padding: 4px;
  border-radius: 8px;
}
.view-toggle-btn {
  background: none;
  border: none;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.2s;
}
.view-toggle-btn:hover {
  color: var(--text);
}
.view-toggle-btn.active {
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
}

.section-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.section-block {
  margin-bottom: 32px;
}

.section-header h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 6px;
}

.section-header p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 12px;
}

.concepts-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.concept-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}

.concept-item:hover {
  border-color: var(--border2);
  background: var(--surface2);
}

.concept-title {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 4px;
}

.concept-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

.sc-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.12s;
  display: flex; flex-direction: column; gap: 10px;
}
.sc-card:hover { border-color: var(--border2); background: var(--surface2); }
.sc-card.kb-focus {
  border-color: rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.02);
}
.sc-card-header {
  display: flex; align-items: center; gap: 8px;
}
.sc-title {
  font-size: 14px; font-weight: 600; color: var(--text); flex: 1;
}
.sc-count {
  font-size: 10px; color: var(--muted);
  background: rgba(255,255,255,0.05);
  padding: 2px 8px; border-radius: 10px; flex-shrink: 0;
}
.sc-desc {
  font-size: 12px; color: var(--muted); line-height: 1.55;
}
.sc-tags {
  display: flex; flex-wrap: wrap; gap: 5px;
  margin-top: auto;
}
.sc-tag {
  font-size: 11px; color: var(--muted);
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 4px;
  white-space: nowrap;
}
.sc-tag-more { font-size: 11px; color: var(--muted); padding: 2px 0; }
.sc-arrow {
  font-size: 14px; color: var(--muted); margin-left: auto; opacity: 0.4;
  transition: opacity 0.15s, transform 0.15s;
}
.sc-card:hover .sc-arrow { opacity: 1; transform: translateX(3px); }

.section-detail-nav {
  margin-bottom: 20px;
}
.back-btn {
  background: none; border: none; padding: 0;
  color: var(--muted); font-size: 12px;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: color 0.15s;
}
.back-btn:hover { color: var(--text); }
.section-detail-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px;
}
.section-detail-header h2 {
  font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
}
.section-detail-desc {
  font-size: 13px; color: var(--muted); line-height: 1.7;
  margin-bottom: 28px;
}

.sb-back {
  padding: 8px 16px 4px;
  font-size: 10.5px; color: var(--muted); opacity: 0.6;
  cursor: pointer; transition: color 0.1s, opacity 0.1s;
  display: flex; align-items: center; gap: 4px;
}
.sb-back:hover { color: var(--text); opacity: 1; }
.sb-concept {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px 4px 32px;
  font-size: 11px; color: var(--muted);
  cursor: pointer; transition: color 0.1s;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border-radius: 0 4px 4px 0;
  margin-right: 6px;
}
.sb-concept:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.sb-concept-level {
  font-size: 7.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.4px;
  padding: 1px 4px; border-radius: 3px;
  flex-shrink: 0; line-height: 1.6;
}
.sb-concept-level.basic { background: rgba(63,185,80,0.1); color: #3fb950; }
.sb-concept-level.deep { background: rgba(155,89,182,0.12); color: #c084fc; }

.sb-section-item {
  display: flex;
  flex-direction: column;
}

.sb-section-header {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 12px 6px 32px;
  font-size: 11.5px; font-weight: 500; color: var(--muted);
  cursor: pointer;
  transition: color 0.1s, background 0.1s;
  border-left: 2px solid transparent;
  border-radius: 0 5px 5px 0;
  margin-right: 6px;
}
.sb-section-header:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.sb-section-header.active { color: var(--text); background: rgba(255,255,255,0.04); border-left-color: rgba(255,255,255,0.12); }

.sb-section-title {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sb-section-arrow {
  opacity: 0.35;
  transition: transform 0.2s ease;
  flex-shrink: 0;
}
.sb-section-arrow.expanded {
  transform: rotate(90deg);
  opacity: 0.6;
}

.concepts-list {
  display: flex;
  flex-direction: column;
  background: transparent;
  border-left: 1px solid rgba(255,255,255,0.06);
  margin: 2px 6px 2px 32px;
  border-radius: 0 4px 4px 0;
  padding: 3px 0;
}

.concepts-list .sb-concept {
  padding-left: 12px;
  margin-right: 0;
  border-radius: 3px;
}

.toc-label {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.7px;
  color: var(--muted); margin-bottom: 10px;
}
.toc-list {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column;
}
.toc-list li {
  display: flex; align-items: baseline; gap: 6px;
  padding: 3px 0;
  border-bottom: 1px solid var(--border);
}
.toc-list li:last-child { border-bottom: none; }
.toc-num {
  font-size: 9px; color: var(--muted); opacity: 0.35;
  flex-shrink: 0; min-width: 14px; text-align: right;
}
.toc-link {
  font-size: 11px; color: var(--muted);
  cursor: pointer; flex: 1; line-height: 1.45;
  transition: color 0.1s;
}
.toc-link:hover { color: var(--text); }
.toc-link.active { color: var(--text); font-weight: 500; }

.concept-section.kb-focus {
  background: rgba(255,255,255,0.04);
  border-radius: 8px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
}
.concept-section {
  padding: 22px 0;
  scroll-margin-top: 16px;
}
.concept-section:last-child { padding-bottom: 0; }
.concept-section-header {
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 12px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.concept-section-title {
  font-size: 16px; font-weight: 600; color: var(--text);
  letter-spacing: -0.2px;
}
.concept-section-title-wrap {
  display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
}
.concept-section-desc {
  font-size: 12px; color: var(--muted); line-height: 1.6;
  margin-bottom: 14px;
}
.concept-section-meta {
  font-size: 11px; color: var(--muted); opacity: 0.7;
  margin-left: auto;
  white-space: nowrap;
}
.concept-details-btn {

<script>
const TOPIC_COLORS = ['#f0932b','#e55039','#3498db','#2ecc71','#9b59b6','#1abc9c','#e74c3c'];

function toggleDrawer() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('drawer-overlay');
  const open = sb.classList.toggle('drawer-open');
  ov.classList.toggle('drawer-open', open);
}
function closeDrawer() {
  document.getElementById('sidebar').classList.remove('drawer-open');
  document.getElementById('drawer-overlay').classList.remove('drawer-open');
}
function toggleMobileSearch() {
  const wrap = document.getElementById('search-wrap');
  const open = wrap.classList.toggle('mobile-open');
  if (open) {
    setTimeout(() => document.getElementById('search-input').focus(), 50);
  }
}

const SUPABASE_URL = 'https://mfzlrmwjwwpykjbsafud.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_L9tV1otxzn8yoC7fvwD6fw_qqiN5iyp';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const APP_MODE = new URLSearchParams(window.location.search).get('mode') || 'public';

const TABLE_SUFFIX = {
  public: '',
  private: '_private'
};

function makeTables(suffix) {
  return {
    topics: `topics${suffix}`,
    sections: `sections${suffix}`,
    concepts: `concepts${suffix}`,
    revisions: `concept_revisions${suffix}`
  };
}

let VIEW_TABLES = {
  public: makeTables('')
};

let userAccessTypes = [];

async function loadUserAccess() {
  if (!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data } = await sb.from('user_access').select('access_type');
  userAccessTypes = (data || []).map(r => r.access_type);

  VIEW_TABLES = { public: makeTables('') };
  userAccessTypes.forEach(type => {
    if (type === 'admin') return;
    const suffix = type === 'private' ? '_private' : `_${type}`;
    VIEW_TABLES[type] = makeTables(suffix);
  });

  const adminBtn = document.getElementById('admin-btn');
  if (adminBtn) adminBtn.style.display = userAccessTypes.includes('admin') ? 'inline-block' : 'none';

  buildModeUI();
}

function buildModeUI() {
  const container = document.getElementById('mode-switcher');
  if (!container) return;

  const modes = ['public', ...userAccessTypes.filter(t => t !== 'admin')];
  container.innerHTML = modes.map(mode => {
    const label = mode === 'public' ? 'PUBLIC' : mode.toUpperCase();
    const isActive = APP_MODE === mode;
    return `<button class="mode-btn${isActive ? ' active' : ''}" onclick="switchAppMode('${mode}')">${label}</button>`;
  }).join('');
}

function getViewTables() {
  return VIEW_TABLES[APP_MODE] || VIEW_TABLES.public;
}

function switchAppMode(mode) {
  if (mode === APP_MODE) return;
  const url = new URL(window.location.href);
  if (mode === 'public') url.searchParams.delete('mode');
  else url.searchParams.set('mode', mode);
  window.location.href = url.toString();

function formatDate(dateStr) {

}

function formatDateTime(dateStr) {

  return date.toLocaleString('ko-KR', {
    year: 'numeric', month: '2-digit', day: '2-digit',

  });
}

function escapeHtml(str) {
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function formatFieldValue(v) {
  if (v === null || v === undefined || v === '') return '';
  if (Array.isArray(v)) return v.length ? v.join('\n') : '[]';
  if (typeof v === 'object') return JSON.stringify(v, null, 2);
  return String(v);
}

function normalizeDiffText(text) {
  const lines = String(text).replace(/\r\n/g, '\n').split('\n');
  while (lines.length > 0) {
    const head = (lines[0] || '').replace(/\u200B/g, '').trim();
    if (head !== '') break;
    lines.shift();
  }
  return lines.join('\n');
}

function buildLineDiffHtml(beforeRaw, afterRaw) {
  const before = normalizeDiffText(formatFieldValue(beforeRaw));
  const after = normalizeDiffText(formatFieldValue(afterRaw));
  if (!before && !after) {
    return {
      beforeHtml: `<span class="diff-line diff-line-empty">∅</span>`,
      afterHtml: `<span class="diff-line diff-line-empty">∅</span>`
    };
  }
  if (!before && after) {
    const afterLines = after.split('\n').map(line => `<span class="diff-line diff-line-add">${escapeHtml(line || ' ')}</span>`).join('');
    return {
      beforeHtml: `<span class="diff-line diff-line-empty">∅</span>`,
      afterHtml: afterLines
    };
  }
  if (before && !after) {
    const beforeLines = before.split('\n').map(line => `<span class="diff-line diff-line-del">${escapeHtml(line || ' ')}</span>`).join('');
    return {
      beforeHtml: beforeLines,
      afterHtml: `<span class="diff-line diff-line-empty">∅</span>`
    };
  }
  if (before === after) {
    const same = escapeHtml(before);
    return {
      beforeHtml: `<span class="diff-line">${same}</span>`,
      afterHtml: `<span class="diff-line">${same}</span>`
    };
  }

  const a = before.split('\n');
  const b = after.split('\n');
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      if (a[i - 1] === b[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
      else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
  }

  const ops = [];
  let i = a.length;
  let j = b.length;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
      ops.unshift({ type: 'same', value: a[i - 1] });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
      ops.unshift({ type: 'add', value: b[j - 1] });
      j--;
    } else {
      ops.unshift({ type: 'del', value: a[i - 1] });
      i--;
    }
  }

  const beforeLines = [];
  const afterLines = [];
  for (let idx = 0; idx < ops.length; idx++) {
    const op = ops[idx];
    const next = ops[idx + 1];

    if (next && ((op.type === 'del' && next.type === 'add') || (op.type === 'add' && next.type === 'del'))) {
      const delVal = op.type === 'del' ? op.value : next.value;
      const addVal = op.type === 'add' ? op.value : next.value;
      beforeLines.push(`<span class="diff-line diff-line-del">${escapeHtml(delVal || ' ')}</span>`);
      afterLines.push(`<span class="diff-line diff-line-add">${escapeHtml(addVal || ' ')}</span>`);
      idx++;
      continue;
    }

    if (op.type === 'same') {
      const line = escapeHtml(op.value || ' ');
      beforeLines.push(`<span class="diff-line">${line}</span>`);
      afterLines.push(`<span class="diff-line">${line}</span>`);
    } else if (op.type === 'del') {
      const line = escapeHtml(op.value || ' ');
      beforeLines.push(`<span class="diff-line diff-line-del">${line}</span>`);
      afterLines.push(`<span class="diff-line diff-line-empty">&nbsp;</span>`);
    } else {
      const line = escapeHtml(op.value || ' ');
      beforeLines.push(`<span class="diff-line diff-line-empty">&nbsp;</span>`);
      afterLines.push(`<span class="diff-line diff-line-add">${line}</span>`);
    }
  }

  return { beforeHtml: beforeLines.join(''), afterHtml: afterLines.join('') };
}

function renderRevisionModal() {
  const root = document.getElementById('revision-modal-root');

  const revisions = revisionsByConcept.get(activeRevisionConceptId) || [];
  const selected = revisions[activeRevisionIndex] || null;
  const prev = revisions[activeRevisionIndex + 1] || null;
  const fields = ['title', 'description', 'level', 'questions', 'content'];
  const changed = selected?.changed_fields && typeof selected.changed_fields === 'object'
    ? fields.filter(f => selected.changed_fields[f])
    : [];
  const showFields = changed.length ? changed : (selected ? fields : []);

  const listHtml = revisions.length
    ? revisions.slice(0, 30).map((r, i) => {
        const typeLabel = r.change_type === 'create' ? '생성' : r.change_type === 'update' ? '수정' : '변경';
        const count = r.changed_fields && typeof r.changed_fields === 'object'
          ? Object.values(r.changed_fields).filter(Boolean).length
          : 0;
        return `<button class="revision-item ${i === activeRevisionIndex ? 'active' : ''}" onclick="selectRevision(${i})"><div class="revision-item-time">${formatDateTime(r.created_at)}</div><div class="revision-item-type">${typeLabel}${count ? ` · ${count}개` : ''}</div></button>`;
      }).join('')
    : '<div class="revision-empty">변경 이력이 없습니다.</div>';

  const diffHtml = selected
    ? showFields.map(field => {
        const beforeVal = prev ? prev[field] : null;
        const afterVal = selected[field];
        const lineDiff = buildLineDiffHtml(beforeVal, afterVal);
        return `<div class="diff-field"><div class="diff-field-name">${field}</div><div class="diff-grid"><div class="diff-col diff-before"><div class="diff-col-label">AS-IS</div><div class="diff-value">${lineDiff.beforeHtml}</div></div><div class="diff-col diff-after"><div class="diff-col-label">TO-BE</div><div class="diff-value">${lineDiff.afterHtml}</div></div></div></div>`;
      }).join('')
    : '<div class="revision-empty">표시할 변경이 없습니다.</div>';

  root.innerHTML = `
    <div class="revision-modal-overlay" onclick="if(event.target===this)closeRevisionModal()">
      <div class="revision-modal">
        <div class="revision-modal-header">
          <div class="revision-modal-title">변경 이력 · ${escapeHtml(activeRevisionConceptId)}</div>
          <button class="revision-modal-close" onclick="closeRevisionModal()">닫기</button>
        </div>
        <div class="revision-modal-body">
          <div class="revision-list">${listHtml}</div>
          <div class="revision-diff">
            <div class="revision-diff-head"><span>선택 시점: ${selected ? formatDateTime(selected.created_at) : '-'}</span><span>${selected?.changed_by ? `by ${escapeHtml(selected.changed_by)}` : ''}</span></div>
            ${diffHtml}
          </div>
        </div>
      </div>
    </div>
  `;
}

function openRevisionModal(conceptId) {
  activeRevisionConceptId = conceptId;
  activeRevisionIndex = 0;
  renderRevisionModal();
}

function selectRevision(index) {
  activeRevisionIndex = index;
  renderRevisionModal();
}

function renderConceptSection(concept, color) {
  const raw = contentCache.get(concept.id) ?? concept.content ?? '';
  const strippedContent = raw ? raw.replace(/^#{1,3}\s+[^\n]*\n+/, '') : '';
  const md = strippedContent ? marked.parse(strippedContent) : '';
  const level = concept.level || null;

  const levelBadge = level
    ? `<span class="level-badge ${level}">${level === 'basic' ? '기본' : '심화'}</span>`
    : '';

  const questionsHtml = (concept.questions && concept.questions.length > 0)
    ? `<div class="card-questions">
        <div class="card-questions-label">관련 질문</div>
        <ul class="card-questions-list">
          ${concept.questions.map(q => `<li>${q}</li>`).join('')}
        </ul>
      </div>`
    : '';

  const createdAtHtml = concept.created_at
    ? `<div class="concept-section-meta"><button class="concept-details-btn" onclick="openRevisionModal('${concept.id}')">details</button></div>`
    : '';

  return `
    <div class="concept-section" id="row-${concept.id}">
      <div class="concept-section-header">
        ${levelBadge}
        <div class="concept-section-title-wrap">
          <span class="concept-section-title">${concept.title}</span>
          ${createdAtHtml}
        </div>
      </div>
      ${concept.description ? `<p class="concept-section-desc">${concept.description}</p>` : ''}
      ${raw ? `<div class="md">${md}</div>` : ''}
      ${questionsHtml}
    </div>
  `;
}

function openConcept(topicId, sectionId, conceptId) {
  S.selectedTopicId = topicId;
  S.selectedSectionId = sectionId;
  S.selectedConceptId = conceptId;
  renderSectionDetail(topicId, sectionId);
  location.hash = `topic/${topicId}/section/${sectionId}/concept/${conceptId}`;
}

async function renderSectionDetail(topicId, sectionId) {
  const topic = S.topics.find(t => t.id === topicId);
  const section = (topic?.children || []).find(s => s.id === sectionId);
  if (!topic || !section) return;
  const color = topicColor(topicId);

  const concepts = section.children || [];
  const hasLevels = concepts.some(c => c.level);
  const deepCount = concepts.filter(c => c.level === 'deep').length;
  const basicCount = concepts.filter(c => c.level === 'basic' || !c.level).length;
  const filtered = concepts.filter(c => matchesFilter(c));

  await fetchSectionContent(filtered);

  const filterBar = hasLevels ? `
    <div class="filter-bar">
      <button class="filter-btn ${activeFilter === 'all' ? 'active' : ''}"
        onclick="setFilter('all','${topicId}','${sectionId}')">전체 <span style="opacity:.5">${concepts.length}</span></button>
      <button class="filter-btn ${activeFilter === 'basic' ? 'active' : ''}"
        onclick="setFilter('basic','${topicId}','${sectionId}')">기본 <span style="opacity:.5">${basicCount}</span></button>
      <button class="filter-btn ${activeFilter === 'deep' ? 'active' : ''}"
        onclick="setFilter('deep','${topicId}','${sectionId}')">심화 <span style="opacity:.5">${deepCount}</span></button>
    </div>
  ` : '';

  const tocItems = filtered.map((c, i) => `
    <li>
      <span class="toc-num">${i + 1}</span>
      <span class="toc-link" id="toc-${c.id}" onclick="scrollToConcept('${c.id}')">${c.title}</span>
    </li>
  `).join('');

  const html = `
    <div class="section-detail-layout">
      <div class="section-detail-main">
        <div class="section-detail-nav">
          <button class="back-btn" onclick="backToTopic()">← ${topic.title}</button>
        </div>
        <div class="section-detail-header">
          <h2>${section.title}</h2>
          <span class="section-box-count">${filtered.length}</span>
        </div>
        ${section.description ? `<p class="section-detail-desc">${section.description}</p>` : ''}
        ${filterBar}
        ${filtered.map(c => renderConceptSection(c, color)).join('')}
        ${renderSectionRelated(filtered, sectionId, topicId)}
      </div>
      <div class="section-detail-toc">
        <div class="toc-label">목차</div>
        <ol class="toc-list">${tocItems}</ol>
      </div>
    </div>
  `;

  const inner = document.getElementById('content-inner');
  inner.classList.add('wide');
  inner.innerHTML = html;
  const content = document.getElementById('content');
  content.scrollTop = 0;
  content.focus({ preventScroll: true });
  mermaid.run({ nodes: inner.querySelectorAll('.language-mermaid') });

  initTocObserver(filtered, content);
}

let tocObserver = null;
let tocScrollHandler = null;

function scrollToConcept(conceptId) {
  const row = document.getElementById(`row-${conceptId}`);
  if (!row) return;
  tocLockUntil = performance.now() + 400;
  document.querySelectorAll('.toc-link.active').forEach(el => el.classList.remove('active'));
  const link = document.getElementById(`toc-${conceptId}`);
  if (link) link.classList.add('active');
  row.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function initTocObserver(concepts, scroller) {
  if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }
  if (tocScrollHandler) {
    scroller.removeEventListener('scroll', tocScrollHandler);
    tocScrollHandler = null;
  }

  const sections = concepts
    .map(c => ({ id: c.id, el: document.getElementById(`row-${c.id}`) }))
    .filter(x => x.el);

  const syncActiveToc = () => {
    if (sections.length === 0) return;
    if (performance.now() < tocLockUntil) return;

    const y = scroller.scrollTop + 120;
    let bestId = sections[0].id;
    for (const s of sections) {
      if (s.el.offsetTop <= y) bestId = s.id;
      else break;
    }

    document.querySelectorAll('.toc-link.active').forEach(el => el.classList.remove('active'));
    const active = document.getElementById(`toc-${bestId}`);
    if (active) active.classList.add('active');
  };

  tocScrollHandler = () => requestAnimationFrame(syncActiveToc);
  scroller.addEventListener('scroll', tocScrollHandler, { passive: true });
  syncActiveToc();
}

function matchesFilter(concept) {
  if (activeFilter === 'all') return true;
  if (activeFilter === 'deep') return concept.level === 'deep';
  if (activeFilter === 'basic') return concept.level === 'basic' || !concept.level;
  return true;
}

async function setFilter(filter, topicId, sectionId) {
  activeFilter = filter;
  if (sectionId) await renderSectionDetail(topicId, sectionId);
  else renderTopicOverview(topicId);
}

let embedder = null;
let corpus = [];
let searchDebounce = null;
let currentResults = [];
let activeResultIdx = -1;
let isSearching = false;
let pendingQuery = null;
let pendingResolve = null;
let relatedMap = new Map();
const contentCache = new Map();

function buildCorpus() {
  corpus = [];
  S.topics.forEach(topic => {
    (topic.children || []).forEach(section => {
      (section.children || []).forEach(concept => {
        const base = {
          title: concept.title,
          topicId: topic.id,
          topicTitle: topic.title,
          sectionId: section.id,
          sectionTitle: section.title,
          conceptId: concept.id,
          embedding: null,
        };
        if (concept.questions && concept.questions.length > 0) {
                  concept.questions.forEach(q => {
            corpus.push({ ...base, matchedQuestion: q, text: q });
          });
        } else {
          const text = [concept.title, concept.description || ''].join(' ').trim();
          corpus.push({ ...base, matchedQuestion: null, text });
        }
      });
    });
  });
}

async function embedCorpus() {
  for (const item of corpus) {
    const out = await embedder(item.text, { pooling: 'mean', normalize: true });
    item.embedding = Array.from(out.data);
  }
}

async function fetchSectionContent(concepts) {
  await Promise.all(concepts.map(async c => {
    if (contentCache.has(c.id)) return;
    if (c.contentFile) {
      try {
        const text = await fetch(c.contentFile).then(r => {
          if (!r.ok) throw new Error(r.status);
          return r.text();
        });
        contentCache.set(c.id, text);
      } catch (e) {
        console.warn(`Failed to load ${c.contentFile}`, e);
        contentCache.set(c.id, c.content || '');
      }
    } else {
      contentCache.set(c.id, c.content || '');
    }
  }));
}

function renderSectionRelated(concepts, currentSectionId, topicId) {
  const seen = new Map();
  for (const c of concepts) {
    const related = (relatedMap.get(c.id) || []).filter(r => r.sectionId !== currentSectionId);
    for (const r of related) {
      if (!seen.has(r.sectionId) || seen.get(r.sectionId).score < r.score) {
        seen.set(r.sectionId, r);
      }
    }
  }
  const sections = Array.from(seen.values())
    .sort((a, b) => b.score - a.score)
    .slice(0, 4);

  if (sections.length === 0) return '';
  return `
    <div class="related-concepts">
      <div class="related-label">연관 섹션</div>
      <div class="related-list">
        ${sections.map(r => `
          <div class="related-item" onclick="openSection('${topicId}', '${r.sectionId}')">
            <span class="related-title">${r.sectionTitle}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function buildRelatedMap() {
  const repMap = new Map();
  for (const item of corpus) {
    if (!repMap.has(item.conceptId) && item.embedding) {
      repMap.set(item.conceptId, item);
    }
  }
  const reps = Array.from(repMap.values());

  relatedMap = new Map();
  for (const rep of reps) {
    const scored = reps
      .filter(r => r.conceptId !== rep.conceptId && r.topicId === rep.topicId)
      .map(r => ({ ...r, score: cosineSim(rep.embedding, r.embedding) }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 3)
      .filter(r => r.score > 0.4);
    relatedMap.set(rep.conceptId, scored);
  }
}

function cosineSim(a, b) {
  let dot = 0;
  for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
  return dot;
}

async function runSearch(query) {
  if (!embedder || !query.trim()) { hideResults(); return; }

  if (isSearching) { pendingQuery = query; return new Promise(r => { pendingResolve = r; }); }

  isSearching = true;
  document.getElementById('search-spinner').classList.add('show');
  try {
    const out = await embedder(query.trim(), { pooling: 'mean', normalize: true });
    const qVec = Array.from(out.data);

    const scored = corpus
      .filter(i => i.embedding)
      .map(i => ({ ...i, score: cosineSim(qVec, i.embedding) }))
      .sort((a, b) => b.score - a.score);

    const seen = new Set();
    const results = [];
    for (const item of scored) {
      if (!seen.has(item.conceptId)) {
        seen.add(item.conceptId);
        results.push(item);
      }
      if (results.length >= 6) break;
    }

    showResults(results.filter(i => i.score > 0.15));
  } finally {
    document.getElementById('search-spinner').classList.remove('show');
    isSearching = false;
    if (pendingQuery) {
      const q = pendingQuery;
      pendingQuery = null;
      runSearch(q);
    } else if (pendingResolve) {
      pendingResolve();
      pendingResolve = null;
    }
  }
}

function showResults(results) {
  currentResults = results;
  activeResultIdx = -1;
  const box = document.getElementById('search-results');
  if (results.length === 0) {
    box.innerHTML = `<div class="sr-empty">관련 개념을 찾지 못했습니다</div>`;
  } else {
    box.innerHTML = results.map((r, i) => `
      <div class="sr-item" data-idx="${i}">
        <div class="sr-title">${r.matchedQuestion || r.title}</div>
        <div class="sr-crumb">
          ${r.matchedQuestion ? `${r.title} · ` : ''}<span>${r.topicTitle}</span> › ${r.sectionTitle}
        </div>
      </div>
    `).join('');
    box.querySelectorAll('.sr-item').forEach(el => {
      const idx = parseInt(el.dataset.idx);
      el.addEventListener('click', () => navigateTo(results[idx]));
    });
  }
  box.classList.add('show');
}

function hideResults() {
  currentResults = [];
  activeResultIdx = -1;
  document.getElementById('search-results').classList.remove('show');
}

function updateResultHighlight() {
  document.querySelectorAll('.sr-item').forEach((el, i) => {
    el.classList.toggle('focused', i === activeResultIdx);
    if (i === activeResultIdx) el.scrollIntoView({ block: 'nearest' });
  });
}

function navigateTo(item) {
  hideResults();
  document.getElementById('search-input').value = '';

  const topicChanged = S.selectedTopicId !== item.topicId;
  const sectionChanged = S.selectedSectionId !== item.sectionId;

  if (topicChanged) {
    selectTopic(item.topicId);
    setTimeout(() => {
      openSection(item.topicId, item.sectionId);
      setTimeout(() => scrollToCard(item.conceptId), 100);
    }, 50);
  } else if (sectionChanged) {
    openSection(item.topicId, item.sectionId);
    setTimeout(() => scrollToCard(item.conceptId), 100);
  } else {
    scrollToCard(item.conceptId);
  }
}

function scrollToCard(conceptId) {
  const el = document.getElementById(`row-${conceptId}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderSearchPage(query, results) {
  kbClearFocus();
  const inner = document.getElementById('content-inner');
  inner.classList.remove('wide');
  if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }

  const color = topicColor(S.selectedTopicId || S.metas[0]?.id);

  if (results.length === 0) {
    inner.innerHTML = `
      <div class="search-page">
        <div class="search-page-header">"<strong>${query}</strong>" 검색 결과</div>
        <div class="search-page-empty">관련 개념을 찾지 못했습니다</div>
      </div>`;
  } else {
    inner.innerHTML = `
      <div class="search-page">
        <div class="search-page-header">"<strong>${query}</strong>" — ${results.length}개 결과</div>
        ${results.map(r => `
          <div class="search-page-item" data-cid="${r.conceptId}" data-tid="${r.topicId}" data-sid="${r.sectionId}">
            <div class="search-page-title">${r.title}</div>
            ${r.matchedQuestion ? `<div class="search-page-question">Q. ${r.matchedQuestion}</div>` : ''}
            <div class="search-page-crumb"><span class="sp-topic">${r.topicTitle}</span> › ${r.sectionTitle}</div>
          </div>
        `).join('')}
      </div>`;
    inner.querySelectorAll('.search-page-item').forEach(el => {
      el.addEventListener('click', () => {
        navigateTo({
          conceptId: el.dataset.cid,
          topicId: el.dataset.tid,
          sectionId: el.dataset.sid,
          title: el.querySelector('.search-page-title').textContent,
          topicTitle: el.querySelector('.sp-topic').textContent,
          sectionTitle: el.querySelector('.search-page-crumb').textContent.split('› ').pop()
        });
      });
    });
  }
  document.getElementById('content').scrollTop = 0;
}

async function initEmbedder() {
  try {
    const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
    env.allowLocalModels = false;
    embedder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', { quantized: true });
    buildCorpus();
    await embedCorpus();
    buildRelatedMap();
    document.getElementById('search-input').disabled = false;
    document.getElementById('search-input').placeholder = '개념 검색…';
    document.getElementById('model-status').textContent = '';
  } catch (e) {
    document.getElementById('model-status').textContent = '검색 불가';
    console.warn('Embedder failed:', e);
  }
}

let isComposing = false;
const searchInput = document.getElementById('search-input');

searchInput.addEventListener('compositionstart', () => { isComposing = true; });
searchInput.addEventListener('compositionend', e => {
  isComposing = false;
  const q = e.target.value;
  clearTimeout(searchDebounce);
  if (!q.trim()) { hideResults(); return; }
  searchDebounce = setTimeout(() => runSearch(q), 30);
});
searchInput.addEventListener('input', e => {
  const q = e.target.value;
  clearTimeout(searchDebounce);
  if (!q.trim()) { hideResults(); return; }
  searchDebounce = setTimeout(() => runSearch(q), 30);
});
searchInput.addEventListener('keydown', e => {
  if (isComposing || e.keyCode === 229) return;
  if (e.key === 'Escape') { hideResults(); e.target.blur(); return; }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    clearTimeout(searchDebounce);
    if (currentResults.length === 0) return;
    activeResultIdx = Math.min(activeResultIdx + 1, currentResults.length - 1);
    updateResultHighlight();
    return;
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    clearTimeout(searchDebounce);
    if (currentResults.length === 0) return;
    activeResultIdx = Math.max(activeResultIdx - 1, 0);
    updateResultHighlight();
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    const q = e.target.value.trim();
    if (!q) return;
    if (activeResultIdx >= 0 && currentResults[activeResultIdx]) {
      navigateTo(currentResults[activeResultIdx]);
    } else {
      const savedResults = [...currentResults];
      hideResults();
      document.getElementById('search-results').classList.remove('show');
      e.target.blur();
      if (savedResults.length > 0) {
        renderSearchPage(q, savedResults);
      } else {
        runSearch(q).then(() => {
          document.getElementById('search-results').classList.remove('show');
          renderSearchPage(q, currentResults);
        });
      }
    }
  }
});
document.addEventListener('click', e => {
  if (!document.getElementById('search-wrap').contains(e.target)) hideResults();
});

async function initFromSupabase() {
  const { data: { session } } = await sb.auth.getSession();
  if (APP_MODE !== 'public') {
    if (!session) {
      setPrivateAuthUI(false);
      renderPrivateLogin();
      return false;
    }
    await loadUserAccess();
    if (!VIEW_TABLES[APP_MODE]) {
      setPrivateAuthUI(true);
      renderAccessDenied(APP_MODE);
      return false;
    }
    setPrivateAuthUI(true);
  } else {
    setPrivateAuthUI(!!session);
  }

  const tNames = getViewTables();
  const { data: topics, error: tErr } = await sb.from(tNames.topics).select('*').order('sort_order');
  if (tErr) throw tErr;

  const { data: sections, error: sErr } = await sb.from(tNames.sections).select('*').order('sort_order');
  if (sErr) throw sErr;

  const { data: concepts, error: cErr } = await sb.from(tNames.concepts).select('*').order('sort_order');
  if (cErr) throw cErr;

  revisionsByConcept.clear();
  if (tNames.revisions) {
    const { data: revisions, error: rErr } = await sb
      .from(tNames.revisions)
      .select('concept_id, change_type, created_at, changed_fields, changed_by, title, description, level, questions, content')
      .order('created_at', { ascending: false })
      .limit(300);
    if (!rErr && revisions) {
      revisions.forEach(r => {
        if (!r.concept_id) return;
        const list = revisionsByConcept.get(r.concept_id) || [];
        list.push(r);
        revisionsByConcept.set(r.concept_id, list);
      });
    }
  }

  for (const t of topics) {
    S.topicColors[t.id] = t.color || TOPIC_COLORS[topics.indexOf(t) % TOPIC_COLORS.length];
    S.metas.push({ id: t.id, title: t.title, description: t.description, tags: t.tags, nodeCount: t.node_count, author: t.author });

    const topicSections = sections.filter(s => s.topic_id === t.id);
    const topicObj = { id: t.id, title: t.title, question: t.question, description: t.description, children: [] };

    for (const s of topicSections) {
      const sectionConcepts = concepts.filter(c => c.section_id === s.id);
      const rootConcepts = sectionConcepts.filter(c => !c.parent_concept_id);
      const buildTree = (list) => list.map(c => {
        const kids = sectionConcepts.filter(ch => ch.parent_concept_id === c.id);
        const node = { id: c.id, title: c.title, question: c.question, description: c.description, level: c.level, questions: c.questions || [], content: c.content, created_at: c.created_at, updated_at: c.updated_at };
        if (kids.length > 0) node.children = buildTree(kids);
        return node;
      });
      topicObj.children.push({ id: s.id, title: s.title, description: s.description, children: buildTree(rootConcepts) });
    }
    S.topics.push(topicObj);
  }

  return true;
}

function renderSetupNotice(message) {
  const inner = document.getElementById('content-inner');
  if (!inner) return;
  inner.classList.remove('wide');
  inner.innerHTML = `
    <div style="max-width:520px;margin:72px auto;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:10px;">
      <h3 style="margin:0 0 10px;font-size:16px;">Supabase 설정이 필요합니다</h3>
      <p style="margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.7;">${message || '<code>index.html</code>과 <code>admin.html</code> 상단의 <code>SUPABASE_URL</code>, <code>SUPABASE_ANON_KEY</code>를 본인 프로젝트 값으로 교체하세요.'}</p>
      <p style="margin:0;font-size:12px;color:var(--muted);">상세 안내: <a href="docs/SETUP.md" target="_blank" style="color:var(--accent);">docs/SETUP.md</a></p>
    </div>`;
}

let kbFocusIdx = -1;

function getFocusableItems() {
  const sp = document.querySelector('.search-page');
  if (sp) return sp.querySelectorAll('.search-page-item');
  if (!S.selectedTopicId && !S.selectedSectionId) {
    return document.querySelectorAll('.landing-card');
  }
  if (S.selectedTopicId && !S.selectedSectionId) {
    return document.querySelectorAll('.sc-card');
  }
  return document.querySelectorAll('.concept-section');
}

function kbClearFocus() {
  kbFocusIdx = -1;
  document.querySelectorAll('.kb-focus').forEach(el => {
    el.classList.remove('kb-focus');
  });
}

function kbSetFocus(idx) {
  const items = getFocusableItems();
  if (items.length === 0) return;
  kbClearFocus();
  kbFocusIdx = Math.max(0, Math.min(idx, items.length - 1));
  const el = items[kbFocusIdx];
  el.classList.add('kb-focus');
  if (el.classList.contains('concept-section')) {
    scrollToConcept(el.id.replace('row-', ''));
  } else {
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function kbOpenFocused() {
  const items = getFocusableItems();
  if (kbFocusIdx < 0 || kbFocusIdx >= items.length) return;
  items[kbFocusIdx].click();
  kbClearFocus();
}

function kbGoBack() {
  if (document.getElementById('search-results').classList.contains('show')) {
    hideResults();
    document.getElementById('search-input').blur();
    return;
  }
  if (document.activeElement === searchInput) {
    searchInput.blur();
    return;
  }
  if (S.selectedSectionId) {
    backToTopic();
  } else if (S.selectedTopicId) {
    S.selectedTopicId = null;
    document.querySelectorAll('.sb-topic').forEach(el => {
      el.classList.remove('active');
      el.style.borderLeftColor = 'transparent';
    });
    S.metas.forEach(m => {
      const secs = document.getElementById(`secs-${m.id}`);
      const desc = document.getElementById(`desc-${m.id}`);
      if (secs) secs.style.maxHeight = '0';
      if (desc) desc.style.display = '';
    });
    renderLanding();
  }
}

function getGridCols() {
  const items = getFocusableItems();
  if (items.length === 0) return 1;
  const first = items[0].getBoundingClientRect();
  const second = items.length > 1 ? items[1].getBoundingClientRect() : null;
  if (second && Math.abs(first.top - second.top) < 5) return 2;
  const third = items.length > 2 ? items[2].getBoundingClientRect() : null;
  if (third && Math.abs(first.top - third.top) < 5) return 3;
  const fourth = items.length > 3 ? items[3].getBoundingClientRect() : null;
  if (fourth && Math.abs(first.top - fourth.top) < 5) return 4;
  return Math.abs(first.top - (second || first).top) < 5 ? 2 : 1;
}

function toggleKbHelp() {
  const existing = document.getElementById('kb-help');
  if (existing) { existing.remove(); return; }
  const overlay = document.createElement('div');
  overlay.id = 'kb-help';
  overlay.className = 'kb-help-overlay';
  overlay.innerHTML = `
    <div class="kb-help-panel">
      <div class="kb-help-title">
        키보드 단축키
        <button class="kb-help-close" onclick="document.getElementById('kb-help').remove()">Esc</button>
      </div>
      <ul class="kb-help-list">
        <li><span class="kb-help-key">s</span><span class="kb-help-desc">개념 검색</span></li>
        <li><span class="kb-help-key">j</span> <span class="kb-help-key">↓</span><span class="kb-help-desc">다음 항목</span></li>
        <li><span class="kb-help-key">k</span> <span class="kb-help-key">↑</span><span class="kb-help-desc">이전 항목</span></li>
        <li><span class="kb-help-key">h</span> <span class="kb-help-key">←</span><span class="kb-help-desc">왼쪽 / 뒤로가기</span></li>
        <li><span class="kb-help-key">l</span> <span class="kb-help-key">→</span><span class="kb-help-desc">오른쪽 / 열기</span></li>
        <li><span class="kb-help-key">Enter</span><span class="kb-help-desc">항목 열기</span></li>
        <li><span class="kb-help-key">g</span><span class="kb-help-desc">목차 번호로 이동</span></li>
        <li><span class="kb-help-key">Esc</span><span class="kb-help-desc">닫기 / 뒤로가기</span></li>
      </ul>
    </div>
  `;
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.remove();
  });
  document.body.appendChild(overlay);
}

function showTocGoto() {
  const existing = document.getElementById('toc-goto');
  if (existing) { existing.remove(); return; }
  const links = document.querySelectorAll('.toc-link');
  if (!links.length) return;
  const overlay = document.createElement('div');
  overlay.id = 'toc-goto';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-start;justify-content:center;padding-top:20vh;';
  overlay.innerHTML = `
    <div style="background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;padding:16px 20px;box-shadow:0 8px 32px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px;min-width:200px;">
      <div style="font-size:12px;color:var(--muted);">목차 번호로 이동 (1~${links.length})</div>
      <input id="toc-goto-input" type="number" min="1" max="${links.length}"
        style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:14px;outline:none;width:100%;-moz-appearance:textfield;"
        autocomplete="off" />
    </div>
  `;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  const input = document.getElementById('toc-goto-input');
  input.focus();
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') {
      e.preventDefault();
      const n = parseInt(input.value, 10);
      if (n >= 1 && n <= links.length) links[n - 1].click();
      overlay.remove();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      overlay.remove();
    }
  });
  input.addEventListener('keyup', e => {
    e.stopPropagation();
    if (e.key === 'Escape') {
      e.preventDefault();
      overlay.remove();
    }
  });
  input.addEventListener('blur', () => {
    overlay.remove();
  });
}

document.addEventListener('keydown', e => {
  const code = e.code;
  const revisionModalOpen = !!document.querySelector('#revision-modal-root .revision-modal-overlay');

  if (revisionModalOpen) {
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      closeRevisionModal();
    }
    return;
  }

  if (S.selectedSectionId && code === 'KeyG' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const inInput = document.activeElement === searchInput || document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA';
    if (!inInput) { e.preventDefault(); showTocGoto(); return; }
  }

  if (isComposing || e.keyCode === 229) return;
  const inInput = document.activeElement === searchInput || document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA';

  if (e.key === 'Escape') {
    if (document.getElementById('toc-goto')) {
      document.getElementById('toc-goto').remove();
      return;
    }
    if (document.getElementById('kb-help')) {
      document.getElementById('kb-help').remove();
      return;
    }
    kbGoBack();
    return;
  }
  if (code === 'KeyS' && !inInput) {
    e.preventDefault();
    searchInput.value = '';
    searchInput.focus();
    return;
  }
  if (inInput) return;

  if (S.selectedSectionId && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    return;
  }

  const isGrid = !S.selectedSectionId;
  const cols = isGrid ? getGridCols() : 1;

  if (code === 'KeyJ' || e.key === 'ArrowDown') {
    e.preventDefault();
    kbSetFocus(kbFocusIdx < 0 ? 0 : kbFocusIdx + 1);
    return;
  }
  if (code === 'KeyK' || e.key === 'ArrowUp') {
    e.preventDefault();
    kbSetFocus(kbFocusIdx < 0 ? 0 : kbFocusIdx - 1);
    return;
  }
  if (code === 'KeyH' || e.key === 'ArrowLeft') {
    if (isGrid && kbFocusIdx > 0) {
      e.preventDefault();
      kbSetFocus(kbFocusIdx - 1);
    } else {
      kbGoBack();
    }
    return;
  }
  if (code === 'KeyL') {
    if (isGrid) {
      const items = getFocusableItems();
      if (kbFocusIdx < 0) {
        e.preventDefault();
        kbSetFocus(0);
      } else if (kbFocusIdx < items.length - 1) {
        e.preventDefault();
        kbSetFocus(kbFocusIdx + 1);
      } else {
        kbOpenFocused();
      }
    } else {
      kbOpenFocused();
    }
    return;
  }
  if (e.key === 'ArrowRight') {
    if (isGrid) {
      e.preventDefault();
      if (kbFocusIdx < 0) kbSetFocus(0);
      else kbSetFocus(kbFocusIdx + 1);
    } else {
      kbOpenFocused();
    }
    return;
  }
  if (e.key === 'Enter') {
    if (kbFocusIdx >= 0) kbOpenFocused();
    return;
  }
});

async function init() {
  try {
    if (sb && !SUPABASE_URL.includes('YOUR_PROJECT')) {
      const loaded = await initFromSupabase();
      if (!loaded) return;
    } else {
      renderSetupNotice();
      return;
    }
  } catch (e) {
    if (APP_MODE !== 'public') {
      setPrivateAuthUI(true);
      renderPrivateLogin(`${APP_MODE} 데이터 로딩에 실패했습니다. 권한 또는 정책(RLS)을 확인하세요.`);
      return;
    }
    console.error('Supabase load failed:', e);
    renderSetupNotice('Supabase 로딩에 실패했습니다. 키와 RLS 정책을 확인하세요.');
    return;
  }

  let total = 0;
  S.topics.forEach(t => {
    total += 1;
    (t.children || []).forEach(s => { total += 1 + (s.children || []).length; });
  });
  document.getElementById('node-count').textContent = `${total} nodes`;

  await loadNotes();
  buildSidebar();
  if (!restoreFromHash() && S.metas.length > 0) renderLanding();
  initEmbedder();
}

// --- Tech Notes: self-contained HTML notes rendered in an isolated iframe ---
async function loadNotes() {
  try {
    const res = await fetch('tech-notes/notes.json', { cache: 'no-cache' });
    if (!res.ok) return;
    const list = await res.json();
    if (Array.isArray(list)) {
      // 최신순 정렬 (date 내림차순)
      S.notes = list.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    }
  } catch (_) { /* 매니페스트 없거나 로컬 file:// 제약 → Tech Notes 섹션 숨김 */ }
}

function notesTabActive() {
  document.querySelectorAll('.sb-topic').forEach(el => {
    el.classList.remove('active');
    el.style.borderLeftColor = 'transparent';
  });
  const tab = document.getElementById(`tab-${NOTES_TID}`);
  if (tab) { tab.classList.add('active'); tab.style.borderLeftColor = NOTES_COLOR; }
}

function updateNotesSidebar(activeSlug) {
  // 다른 토픽 섹션 접기
  S.metas.forEach(m => {
    const s = document.getElementById(`secs-${m.id}`);
    const d = document.getElementById(`desc-${m.id}`);
    if (s) s.style.maxHeight = '0';
    if (d) d.style.display = '';
  });
  const desc = document.getElementById(`desc-${NOTES_TID}`);
  if (desc) desc.style.display = 'none';
  const c = document.getElementById(`secs-${NOTES_TID}`);
  if (!c) return;
  c.innerHTML = S.notes.map(n =>
    `<div class="sb-section${n.slug === activeSlug ? ' active' : ''}" data-slug="${n.slug}">${n.title}<span class="sb-section-count">${n.date || ''}</span></div>`
  ).join('');
  c.style.maxHeight = c.scrollHeight + 200 + 'px';
  c.querySelectorAll('.sb-section').forEach(el =>
    el.addEventListener('click', () => openNote(el.dataset.slug)));
}

// Tech Notes 개요 — 일반 토픽 오버뷰와 같은 톤(topic-header + landing-grid)
function openNotesTopic() {
  kbClearFocus();
  S.selectedTopicId = NOTES_TID;
  S.selectedSectionId = null;
  location.hash = 'notes';
  notesTabActive();
  updateNotesSidebar();
  closeDrawer();

  const inner = document.getElementById('content-inner');
  inner.classList.remove('wide', 'note-mode');
  if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }
  const cards = S.notes.map(n => `
    <div class="landing-card" onclick="openNote('${n.slug}')">
      <div class="landing-card-title">${n.title}</div>
      <div class="landing-card-desc">${n.summary || ''}</div>
      <div class="landing-card-meta"><span class="landing-card-count">${n.date || ''}</span></div>
    </div>`).join('');
  inner.innerHTML = `
    <div class="topic-header">
      <div class="topic-header-top"><h1>Tech Notes</h1></div>
      <p>세션에서 회사·도메인을 걷어내고 증류한 순수 기술 학습노트. 각 노트는 self-contained 문서로 열립니다.</p>
    </div>
    <div class="landing-grid">${cards}</div>`;
  document.getElementById('content').scrollTop = 0;
  requestAnimationFrame(() => kbSetFocus(0));
}

function openNote(slug) {
  const note = S.notes.find(n => n.slug === slug);
  if (!note) return;
  kbClearFocus();
  S.selectedTopicId = NOTES_TID;
  S.selectedSectionId = null;
  location.hash = `note/${slug}`;
  notesTabActive();
  updateNotesSidebar(slug);
  closeDrawer();

  const inner = document.getElementById('content-inner');
  inner.classList.remove('wide');
  inner.classList.add('note-mode');
  if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }
  inner.innerHTML = `
    <div class="note-toolbar">
      <div class="note-back" onclick="openNotesTopic()"><span>←</span> Tech Notes</div>
      <span class="note-toolbar-title">${note.title}</span>
      <span class="note-toolbar-date">${note.date || ''}</span>
      <a class="note-toolbar-ext" href="tech-notes/notes/${slug}.html" target="_blank" rel="noopener">새 탭 ↗</a>
    </div>
    <iframe id="note-frame" class="note-frame" src="tech-notes/notes/${slug}.html"
      title="${note.title}" loading="lazy"></iframe>
  `;
  // 같은 오리진 → 로드 후 노트에 ktree 다크 팔레트+폰트 주입해 톤 통일
  const frame = document.getElementById('note-frame');
  frame.addEventListener('load', () => {
    try {
      const doc = frame.contentDocument;
      doc.documentElement.setAttribute('data-theme', 'dark');
      const st = doc.createElement('style');
      st.textContent = `
        :root[data-theme="dark"]{
          --bg:#0d1117; --surface:#161b22; --ink:#e6edf3; --muted:#7d8590; --faint:#6b727c;
          --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.05);
          --accent:#3fb950; --accent-soft:#3fb95022; --code-bg:#161b22;
        }
        :root{ --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif; }`;
      doc.head.appendChild(st);
    } catch (_) { /* cross-origin 등 → 노트 자체 테마 유지 */ }
  });
  document.getElementById('content').scrollTop = 0;
  fitNoteFrame();
}

function fitNoteFrame() {
  const c = document.getElementById('content');
  const f = document.getElementById('note-frame');
  if (!c || !f) return;
  const tb = document.querySelector('.note-toolbar');
  const avail = c.clientHeight - (tb ? tb.offsetHeight : 0) - 22;
  f.style.height = Math.max(420, avail) + 'px';
}
window.addEventListener('resize', fitNoteFrame);

function restoreFromHash() {
  const hash = location.hash.replace('#', '');
  if (!hash) return false;
  const parts = hash.split('/');
  if (parts[0] === 'notes') {
    if (S.notes.length) { openNotesTopic(); return true; }
  }
  if (parts[0] === 'note' && parts[1]) {
    if (S.notes.find(n => n.slug === parts[1])) { openNote(parts[1]); return true; }
  }
  if (parts[0] === 'topic' && parts[1]) {
    const topic = S.topics.find(t => t.id === parts[1]);
    if (topic) { selectTopic(parts[1]); return true; }
  }
  if (parts[0] === 'section' && parts[1] && parts[2]) {
    const topic = S.topics.find(t => t.id === parts[1]);
    const section = (topic?.children || []).find(s => s.id === parts[2]);
    if (topic && section) { selectTopic(parts[1]); openSection(parts[1], parts[2]); return true; }
  }
  return false;
}

init().catch(console.error);
</script>
